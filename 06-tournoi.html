<!DOCTYPE html>
<!-- Écran 06 — Page d'un tournoi (06-tournoi.html?id=t01).
     US : S05-03 (jeu, format, dates, dotations, règlement, partenaires, participants ; consultable par tous),
     S03-03 (règlement modifié : nouvelle acceptation requise), S03-04 (condition d'accès),
     S03-06 (dotations versées sur le numéro Max it), S03-07 (pays d'un tournoi MEA),
     S04-01 / S04-02 (inscription, liste d'attente, désinscription avant le début).
     Bouton principal : S'inscrire · S'abonner pour s'inscrire · Rejoindre la liste d'attente ·
     Inscrit / Se désinscrire · Inscriptions closes (calculé par Esport.etatBouton). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournoi</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Visuel du jeu en haut, boutons ronds posés dessus (comme le Game corner) */
    .hero { position: relative; height: 180px; flex-shrink: 0; }
    .hero .boutons-hero {
      position: absolute;
      top: var(--space-2);
      left: var(--space-3);
      right: var(--space-3);
      display: flex;
      justify-content: space-between;
    }
    .bouton-verre-rond { background: var(--color-glass-dark); }

    .tete { padding: var(--space-4) var(--page-gutter) 0; }
    .tete .carte-badges { margin: 0 0 var(--space-2); }
    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }
    .lien-jeu { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--touch-target); color: var(--color-primary); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); }
    .lien-jeu svg { width: 16px; height: 16px; }

    .bandeau-reglement { margin-top: var(--space-2); }

    /* Grille d'informations */
    .infos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); padding: var(--space-4) var(--page-gutter) 0; }
    .info { background: var(--color-surface-warm); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--font-size-sm); }
    .info small { display: block; color: var(--color-text-secondary); font-size: var(--font-size-xs); }
    .info b { display: block; font-size: var(--font-size-md); line-height: var(--line-height-tight); margin-top: 2px; }
    .info.large { grid-column: 1 / -1; }
    .jauge { height: 6px; border-radius: var(--radius-pill); background: var(--color-border); margin-top: var(--space-2); overflow: hidden; }
    .jauge span { display: block; height: 100%; background: var(--color-primary); border-radius: var(--radius-pill); }

    /* Dotations */
    .dotations { list-style: none; margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
    .dotations li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); font-weight: var(--font-weight-bold); }
    .dotations li:last-child { border-bottom: 0; }
    .medaille { width: 28px; height: 28px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-xs); color: var(--color-text); background: var(--illu-gray-light); flex-shrink: 0; }
    .medaille.or { background: var(--illu-gold-light); }
    .medaille.bronze { background: var(--illu-sand); }
    .note { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }

    .bloc-liens { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
    .bloc-liens .ligne { padding-left: var(--space-4); padding-right: var(--space-3); }
    .icone-ligne { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--color-primary-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icone-ligne svg { width: 22px; height: 22px; }

    /* Barre d'action : statut du joueur au-dessus du bouton */
    .statut { display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-weight: var(--font-weight-bold); margin-bottom: var(--space-2); }
    .statut svg { width: 20px; height: 20px; }
    .actions-duo { display: flex; gap: var(--space-2); }
    .actions-duo .bouton { flex: 1; padding: 0 var(--space-3); }
  </style>
</head>
<body data-zone="esport">
<div class="cadre">
  <div class="telephone">
    <div class="barre-etat" data-heure="21:10"></div>

    <main class="contenu" id="page"></main>

    <!-- Bouton principal selon l'état d'inscription -->
    <div class="barre-action" id="action"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/esport.js"></script>
<script src="js/demo.js"></script>
<script>
  const t = Esport.tournoi(Nav.param("id")) || Esport.tournoi("t01");
  const jeu = Esport.jeu(t.jeu);
  document.title = t.nom;

  /* Le tournoi a-t-il un arbre, des poules ou un classement à suivre ? (écran 12) */
  const suivable = !!(DONNEES.arbres[t.id] || DONNEES.poules[t.id]);

  /* ---- Participants : pseudos publics seulement (S05-03) ---- */
  function participants() {
    const moi = Esport.inscription(t.id);
    const liste = [];

    if (DONNEES.arbres[t.id]) {
      // Joueurs du premier tour de l'arbre
      DONNEES.arbres[t.id].matchs[0].forEach((m) => { liste.push({ nom: m[0] }); liste.push({ nom: m[1] }); });
    } else if (DONNEES.poules[t.id]) {
      DONNEES.poules[t.id].forEach((p) => p.joueurs.forEach((j) => liste.push({ nom: j.pseudo })));
    } else if (t.mode === "equipe") {
      // Équipes : nom et capitaine
      const equipes = ["Atlas Squad", "Casa Legends", "Team Sahara", "Rabat Wolves", "Marrakech Fire", "Tanger Storm"];
      equipes.forEach((e, i) => liste.push({ nom: e, capitaine: DONNEES.pseudosClassement[i * 3] }));
    } else {
      DONNEES.pseudosClassement.slice(0, 6).forEach((p) => liste.push({ nom: p }));
    }
    // Le joueur inscrit apparaît en tête, avec son pseudo courant (il a pu en changer en 02)
    const autres = liste.filter((p) => p.nom !== DONNEES.joueur.pseudo && p.nom !== Esport.pseudo());
    return (moi && moi.etat === "inscrit" ? [{ nom: Esport.pseudo(), moi: true }] : []).concat(autres);
  }

  function rendrePage() {
    const ins = Esport.inscription(t.id);
    const restantes = Math.max(t.places - t.inscrits, 0);
    const pourcentage = Math.min(100, Math.round(t.inscrits / t.places * 100));
    let html = "";

    // Visuel du jeu, retour et notifications
    html += '<div class="hero">' + Esport.visuelJeu(t.jeu, "grand") +
      '<div class="boutons-hero">' +
      '<button class="bouton-icone bouton-verre-rond" data-action="retour" data-repli="04" aria-label="Retour">' + Esport.icone("retour", "f-white") + "</button>" +
      '<button class="bouton-icone bouton-verre-rond" data-ecran="25" aria-label="Notifications">' + Esport.icone("cloche", "f-white") + "</button>" +
      "</div></div>";

    // Titre, badges, lien vers le jeu
    html += '<div class="tete"><div class="carte-badges">' + Esport.badges(t) + "</div>" +
      "<h1>" + t.nom + "</h1>" +
      '<a href="#" class="lien-jeu" data-ecran="13" data-id="' + jeu.id + '">' + jeu.nom + Esport.icone("chevron", "f-primary") + "</a></div>";

    // Règlement modifié après inscription : nouvelle acceptation requise (S03-03)
    if (Esport.reglementAAccepter(t) && t.etat === "ouvert") {
      html += '<div class="encart encart-alerte bandeau-reglement" role="alert">' + Esport.icone("alerte", "f-primary") +
        "<div><strong>Règlement modifié</strong><p>La version " + t.reglement.version +
        " remplace celle que tu as acceptée. Accepte-la pour garder ta place.</p>" +
        '<a href="#" class="lien-encart" data-ecran="07" data-id="' + t.id + '">Lire et accepter</a></div></div>';
    }

    // Informations principales
    html += '<div class="infos">' +
      '<div class="info"><small>Début</small><b>' + Esport.jourLong(t.debut) + "</b>" + Esport.heure(t.debut) + "</div>" +
      '<div class="info"><small>Inscriptions</small><b>' + Esport.jourCourt(t.ouverture) + " → " + Esport.jourCourt(t.cloture) + "</b>" +
      (Esport.inscriptionsCloses(t) ? "Closes" : "Ouvertes") + "</div>" +
      '<div class="info"><small>Format</small><b>' + Esport.libelleFormat(t) + "</b></div>" +
      '<div class="info"><small>Mode</small><b>' + Esport.libelleMode(t) + "</b></div>" +
      '<div class="info"><small>Accès</small><b>' + (t.acces === "abonnes" ? "Réservé aux abonnés" : "Ouvert à tous") + "</b></div>" +
      '<div class="info"><small>' + (t.mode === "equipe" ? "Équipes" : "Joueurs") + "</small><b>" + t.inscrits + " / " + t.places + "</b>" +
      '<div class="jauge" aria-hidden="true"><span style="width:' + pourcentage + '%"></span></div></div>';
    if (t.portee === "MEA") {
      html += '<div class="info large"><small>Tournoi MEA · pays participants</small><b>' +
        t.pays.map((p) => DONNEES.pays[p].nom).join(", ") + "</b>Arbre et classement communs à tous les pays</div>";
    }
    html += "</div>";
    if (t.etat === "ouvert" && restantes > 0) {
      html += '<p class="note">' + restantes + " places restantes · l'arbre sera généré à la clôture des inscriptions.</p>";
    }

    // Dotations (S03-06)
    html += '<h2 class="titre-section">Dotations</h2><ul class="dotations">' +
      t.dotations.map((d, i) =>
        '<li><span class="medaille ' + ["or", "", "bronze"][i] + '">' + (i + 1) + (i ? "e" : "er") + "</span>" + d + "</li>"
      ).join("") + "</ul>" +
      '<p class="note">Les dotations en argent et en data sont versées sur ton numéro Max it.</p>';

    // Suivre le tournoi, règlement, partenaires
    html += '<h2 class="titre-section">Le tournoi</h2><div class="bloc-liens">';
    if (suivable) {
      const libelle = DONNEES.poules[t.id] ? "Poules et classement" : "Arbre et classement";
      html += '<a href="#" class="ligne" data-ecran="12" data-id="' + t.id + '"><span class="icone-ligne">' + Esport.icone("trophee", "f-primary") + "</span>" +
        '<span class="ligne-corps"><span class="ligne-titre">' + libelle + '</span><span class="ligne-sous-titre">' +
        (t.etat === "termine" ? "Classement final" : "Mis à jour en direct") + "</span></span>" + Esport.icone("chevron", "f-muted") + "</a>";
    }
    const monEquipe = t.mode === "equipe" ? Esport.equipe(t.id) : null;
    if (monEquipe) {
      html += '<a href="#" class="ligne" data-ecran="10" data-id="' + t.id + '"><span class="icone-ligne">' + Esport.icone("groupe", "f-primary") + "</span>" +
        '<span class="ligne-corps"><span class="ligne-titre">Mon équipe · ' + monEquipe.nom + '</span><span class="ligne-sous-titre">' +
        monEquipe.membres.length + " / " + Esport.tailleEquipe(t) + " joueurs" + (monEquipe.capitaine === DONNEES.joueur.pseudo ? " · tu es capitaine" : "") +
        "</span></span>" + Esport.icone("chevron", "f-muted") + "</a>";
    }
    html += '<a href="#" class="ligne" data-ecran="07" data-id="' + t.id + '"><span class="icone-ligne">' + Esport.icone("article", "f-primary") + "</span>" +
      '<span class="ligne-corps"><span class="ligne-titre">Règlement</span><span class="ligne-sous-titre">Version ' + t.reglement.version +
      (t.reglement.modifie ? " · modifié le 8 oct." : "") + "</span></span>" + Esport.icone("chevron", "f-muted") + "</a>" +
      '<div class="ligne"><span class="icone-ligne">' + Esport.icone("boutique", "f-primary") + "</span>" +
      '<span class="ligne-corps"><span class="ligne-titre">Partenaires</span><span class="ligne-sous-titre">Max it · Orange Money</span></span></div>' +
      "</div>";

    // Participants
    const liste = participants();
    html += '<h2 class="titre-section">' + (t.mode === "equipe" ? "Équipes inscrites" : "Participants") +
      ' <span class="ligne-sous-titre">' + t.inscrits + "</span></h2><div>";
    liste.slice(0, 6).forEach((p) => {
      const pseudoProfil = p.capitaine || p.nom;
      html += '<a href="#" class="ligne" data-ecran="17" data-pseudo="' + pseudoProfil + '">' +
        '<span class="avatar' + (p.moi ? " avatar-moi" : "") + '">' + p.nom[0] + "</span>" +
        '<span class="ligne-corps"><span class="ligne-titre">' + p.nom + (p.moi ? " (toi)" : "") + "</span>" +
        (p.capitaine ? '<span class="ligne-sous-titre">Capitaine : ' + p.capitaine + "</span>" : "") +
        "</span>" + Esport.icone("chevron", "f-muted") + "</a>";
    });
    const affiches = Math.min(liste.length, 6);
    if (t.inscrits > affiches) html += '<p class="note">… et ' + (t.inscrits - affiches) + " autres</p>";
    html += '</div><div class="fin-contenu"></div>';

    document.getElementById("page").innerHTML = html;
  }

  /* ---- Barre d'action : un état parmi ceux calculés par Esport.etatBouton ---- */
  function rendreAction() {
    const etat = Esport.etatBouton(t);
    const ins = Esport.inscription(t.id);
    const zone = document.getElementById("action");
    const coche = Esport.icone("coche", "f-success-dark");
    let html = "";

    switch (etat) {
      case "inscrire":
        html = '<a href="#" class="bouton bouton-primaire bouton-pleine-largeur" data-ecran="07" data-id="' + t.id + '">S\'inscrire</a>' +
          '<p class="aide-action">Inscriptions jusqu\'au ' + Esport.jourCourt(t.cloture) + " · après lecture du règlement</p>";
        break;
      case "abonner":
        // Joueur gratuit sur un tournoi réservé : la page d'offre s'ouvre, retour ici ensuite (S05-02)
        html = '<a href="#" class="bouton bouton-primaire bouton-pleine-largeur" data-ecran="21" data-origine>' +
          Esport.icone("cadenas", "f-white") + "S'abonner pour s'inscrire</a>" +
          '<p class="aide-action">Tournoi réservé aux abonnés. Tu reviendras ici après l\'abonnement.</p>';
        break;
      case "complet":
        html = '<a href="#" class="bouton bouton-primaire bouton-pleine-largeur" data-ecran="07" data-id="' + t.id + '">Rejoindre la liste d\'attente</a>' +
          '<p class="aide-action">Tournoi complet · la première place libérée revient au premier de la liste</p>';
        break;
      case "attente":
        html = '<p class="statut">' + Esport.icone("groupe", "f-text") + "Liste d'attente · tu es " + ins.rang + "e</p>" +
          '<button class="bouton bouton-secondaire bouton-pleine-largeur" id="quitter">Quitter la liste d\'attente</button>';
        break;
      case "equipe-incomplete": {
        // Équipe pas encore complète : elle sera inscrite automatiquement une fois complète (S04-03)
        const eq = Esport.equipe(t.id);
        html = '<p class="statut">' + Esport.icone("groupe", "f-text") + "Équipe " + eq.nom + " · " + eq.membres.length + "/" + Esport.tailleEquipe(t) + "</p>" +
          '<a href="#" class="bouton bouton-primaire bouton-pleine-largeur" data-ecran="10" data-id="' + t.id + '">Compléter mon équipe</a>' +
          '<p class="aide-action">Inscription automatique dès que l\'équipe est complète, avant le ' + Esport.jourCourt(t.cloture) + "</p>";
        break;
      }
      case "inscrit":
        if (Esport.reglementAAccepter(t)) {
          html = '<p class="statut">' + coche + "Inscrit · règlement à réaccepter</p>" +
            '<div class="actions-duo"><button class="bouton bouton-secondaire" id="quitter">Se désinscrire</button>' +
            '<a href="#" class="bouton bouton-primaire" data-ecran="07" data-id="' + t.id + '">Accepter le règlement</a></div>';
        } else {
          html = '<p class="statut">' + coche + "Inscrit</p>" +
            '<button class="bouton bouton-secondaire bouton-pleine-largeur" id="quitter">Se désinscrire</button>' +
            '<p class="aide-action">Désinscription possible jusqu\'au début du tournoi</p>';
        }
        break;
      case "inscrit-en-cours":
        html = '<p class="statut">' + coche + "Inscrit · tournoi en cours</p>" +
          '<a href="#" class="bouton bouton-primaire bouton-pleine-largeur" data-ecran="12" data-id="' + t.id + '">Voir mon prochain match</a>';
        break;
      case "closes":
        html = '<button class="bouton bouton-pleine-largeur" disabled>Inscriptions closes</button>' +
          (suivable ? '<a href="#" class="bouton bouton-lien bouton-pleine-largeur" data-ecran="12" data-id="' + t.id + '">Suivre le tournoi</a>' : "");
        break;
      case "termine":
        html = '<button class="bouton bouton-pleine-largeur" disabled>Tournoi terminé</button>' +
          (suivable ? '<a href="#" class="bouton bouton-lien bouton-pleine-largeur" data-ecran="12" data-id="' + t.id + '">Voir le classement final</a>' : "");
        break;
    }
    zone.innerHTML = html;

    // Désinscription ou sortie de la liste d'attente, avec confirmation (S04-02)
    const quitter = document.getElementById("quitter");
    if (quitter) {
      quitter.addEventListener("click", () => {
        const attente = ins.etat === "attente";
        Nav.dialogue({
          titre: attente ? "Quitter la liste d'attente ?" : "Te désinscrire ?",
          texte: attente
            ? "Tu perdras ton rang. Tu pourras t'y remettre tant que les inscriptions sont ouvertes."
            : t.mode === "equipe"
              ? "Tu quittes aussi ton équipe. Ta place sera proposée au premier joueur de la liste d'attente."
              : "Ta place sera proposée au premier joueur de la liste d'attente.",
          boutons: [
            { libelle: attente ? "Quitter la liste" : "Me désinscrire", primaire: true, action: () => {
              Esport.changerInscription(t.id, null);
              if (t.mode === "equipe") Esport.changerEquipe(t.id, null);
              Nav.toast(attente ? "Tu as quitté la liste d'attente" : "Tu es désinscrit de " + t.nom);
            } },
            { libelle: "Annuler" }
          ]
        });
      });
    }
  }

  function rendre() {
    rendrePage();
    rendreAction();
  }
  Esport.monter(rendre);

  // Retour depuis le règlement (07) ou l'équipe (10)
  document.addEventListener("DOMContentLoaded", () => {
    const message = { accepte: "Nouveau règlement accepté : ta place est conservée",
      desinscrit: "Tu es désinscrit de " + t.nom, "equipe-quittee": "Tu as quitté ton équipe" }[Nav.param("message")];
    if (message) Nav.toast(message);
  });
</script>
</body>
</html>
