<!DOCTYPE html>
<!-- Écran p05 — Jeu simulé (p05-partie.html?jeu=rallye-dunes&depuis=… ; « retour=v2 » : lancé depuis l'écran V2 pv3).
     Pas d'écran Figma. Les jeux ne sont pas jouables : chargement, puis illustration « partie en cours ».
     « Jouer » ouvre toujours le jeu directement, sans écran intermédiaire (S08-01) :
     - mini app d'un seul jeu (modèle A) : la mini app s'ouvre, fermée par sa capsule « Quitter » ;
     - hub partenaire (modèle B) : le hub s'ouvre directement sur le jeu (lien direct), et Max it affiche
       son propre bouton de sortie au-dessus de la mini app du partenaire (S08-02).
     Dans les deux cas, quitter ramène à la fiche du jeu (S08-02) ; le lancement est enregistré (S08-01). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partie</title>
  <link rel="stylesheet" href="css/tokens.css?v=f8ec85a1">
  <link rel="stylesheet" href="css/style.css?v=f8ec85a1">
</head>
<body data-zone="play">
<div class="cadre">
  <div class="telephone play">
    <div class="barre-etat" data-heure="9:30"></div>
    <div id="barre-hub"></div>
    <main class="ecran-jeu" id="ecran"></main>
  </div>
</div>

<script src="js/data-play.js?v=f8ec85a1"></script>
<script src="js/textes-play.js?v=f8ec85a1"></script>
<script src="js/nav.js?v=f8ec85a1"></script>
<script src="js/play.js?v=f8ec85a1"></script>
<script src="js/demo.js?v=f8ec85a1"></script>
<script>
  const jeu = Play.jeuDeLaPage();
  const ecran = document.getElementById("ecran");

  /* Fiche du jeu, où l'on revient en quittant (S08-02) */
  function fiche() {
    return Nav.param("retour") === "v2"
      ? "pv3-fiche-badges.html?jeu=" + jeu.id
      : Play.url("p03-jeu.html", { jeu: jeu.id, depuis: Play.depuis() });
  }

  /* Partie en cours (simulée) ; le lancement est enregistré (S08-01) */
  function jouer() {
    const t = Play.t;
    Play.enregistrerLancement(jeu.id);
    ecran.insertAdjacentHTML("beforeend", '<div class="partie-jeu">' + Play.visuel(jeu, 390, 760, "partie") +
      '<div class="hud-jeu"><span>' + t("partie.score") + " 1 240</span><span>" + t("partie.niveau") + " 3</span></div>" +
      '<p class="etiquette-simulee"><b>' + t("partie.enCours") + "</b>" + t("partie.simulee") + "</p>" +
      "</div>");
    ecran.querySelector(".chargement-jeu").remove();
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!jeu) return;
    Play.appliquerLangue();
    const t = Play.t;
    const partenaire = Play.partenaire(jeu);
    document.title = jeu.nom;

    if (partenaire.modele === "B") {
      // Hub partenaire ouvert directement sur le jeu : barre du hub, et bouton de sortie de Max it au-dessus
      document.getElementById("barre-hub").innerHTML = '<div class="barre-hub">' +
        '<span class="logo-hub">' + Play.icone("hub", "f-primary") + "</span><span>" + partenaire.nom + "</span>" +
        '<span class="menu-hub" aria-label="' + t("partie.menuHub") + '" role="img">' + Play.icone("hub", "f-play-muted") + "</span></div>";
      document.querySelector(".telephone").insertAdjacentHTML("beforeend",
        '<a class="sortie-maxit" id="quitter" href="' + fiche() + '" title="' + t("partie.sortieHubAide") + '">' +
        '<span class="rond">' + Play.icone("retour", "f-primary") + "</span>" + t("partie.sortieHub") + "</a>");
    } else {
      // Mini app du jeu : capsule de fermeture de la mini app
      ecran.insertAdjacentHTML("beforeend", '<div class="capsule-miniapp"><a id="quitter" href="' + fiche() + '" aria-label="' + t("partie.quitterJeu") + '">' +
        Play.icone("fermer") + t("partie.quitter") + "</a></div>");
    }

    // Chargement, puis partie : le joueur ne voit aucune différence entre mini app et hub (S08-01)
    ecran.insertAdjacentHTML("afterbegin", '<div class="chargement-jeu"><span class="vignette-cible">' + Play.visuel(jeu, 120, 120, "tuile") + "</span>" +
      "<strong>" + jeu.nom + "</strong><small>" + t("partie.chargement") + "</small>" +
      '<span class="points-chargement" aria-hidden="true"><i></i><i></i><i></i></span></div>');
    setTimeout(jouer, 1600);
  });
</script>
</body>
</html>
