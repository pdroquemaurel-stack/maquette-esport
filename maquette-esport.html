ction) html += '\u003cdiv class=\"encart\">' + Esport.icone(\"alerte\", \"f-primary\") + \"\u003cdiv>\u003cp>Tu peux corriger tant que \" + c.adversaire + \" n'a pas déclaré.\u003c/p>\u003c/div>\u003c/div>\";\n      html += '\u003cdiv class=\"saisie\">' +\n        '\u003cdiv class=\"compteur\">\u003cspan class=\"nom\">' + Esport.pseudo() + \" (toi)\u003c/span>\u003cspan class=\\\"valeur\\\">\" + saisie.moi + \"\u003c/span>\" +\n        '\u003cspan class=\"boutons\">\u003cbutton data-score=\"moi\" data-pas=\"-1\" aria-label=\"Retirer un but\">−\u003c/button>\u003cbutton data-score=\"moi\" data-pas=\"1\" aria-label=\"Ajouter un but\">+\u003c/button>\u003c/span>\u003c/div>' +\n        '\u003cspan class=\"tiret\">–\u003c/span>' +\n        '\u003cdiv class=\"compteur\">\u003cspan class=\"nom\">' + c.adversaire + \"\u003c/span>\u003cspan class=\\\"valeur\\\">\" + saisie.adv + \"\u003c/span>\" +\n        '\u003cspan class=\"boutons\">\u003cbutton data-score=\"adv\" data-pas=\"-1\" aria-label=\"Retirer un but\">−\u003c/button>\u003cbutton data-score=\"adv\" data-pas=\"1\" aria-label=\"Ajouter un but\">+\u003c/button>\u003c/span>\u003c/div>' +\n        \"\u003c/div>\" + (erreur ? '\u003cp class=\"erreur-saisie\" role=\"alert\">' + erreur + \"\u003c/p>\" : \"\");\n      action = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"envoyer\">' + (mm.correction ? \"Enregistrer la correction\" : \"Envoyer ma déclaration\") + \"\u003c/button>\";\n    } else if (mm.statut === \"attente-adv\") {\n      html += '\u003cdiv class=\"issue\">\u003cspan class=\"pictogramme\">' + Esport.icone(\"calendrier\", \"f-primary\") + \"\u003c/span>\" +\n        \"\u003ch2>Déclaration envoyée\u003c/h2>\u003cp>En attente de la déclaration de \" + c.adversaire + \".\u003c/p>\u003c/div>\" + score(mm.declMoi) +\n        '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\">' + Esport.rebours(limite) + '\u003c/div>\u003cp class=\"rebours-legende\">avant la clôture des déclarations (' + Esport.hhmm(limite) + \")\u003c/p>\u003c/div>\";\n      action = '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"corriger\">Corriger ma déclaration\u003c/button>';\n    } else if (mm.statut === \"clos\" || mm.statut === \"definitif\") {\n      const d = mm.statut === \"clos\" ? mm.declMoi : mm.declAdv;\n      html += '\u003cdiv class=\"issue\">\u003cspan class=\"pictogramme' + (gagne(d) ? \" succes\" : \"\") + '\">' + Esport.icone(gagne(d) ? \"coche\" : \"alerte\", gagne(d) ? \"f-white\" : \"f-primary\") + \"\u003c/span>\" +\n        \"\u003ch2>\" + (mm.statut === \"clos\" ? \"Match clos\" : \"Résultat définitif\") + \"\u003c/h2>\u003cp>\" +\n        (mm.statut === \"clos\" ? \"Vos deux déclarations concordent. \" : \"Pas de contestation dans le délai : la déclaration de \" + c.adversaire + \" est définitive. \") +\n        (nul(d) ? \"Match nul : un point chacun.\" : t.format !== \"elimination\" ? (gagne(d) ? \"Victoire : 3 points.\" : \"Défaite.\") :\n          gagne(d) ? \"Tu passes au tour suivant.\" : \"Tu es éliminé du tournoi.\") + \"\u003c/p>\u003c/div>\" + score(d);\n      action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir l\\'arbre\u003c/a>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"05\">Mes matchs\u003c/a>';\n    } else if (mm.statut === \"litige\" || mm.statut === \"arbitre\") {\n      html += '\u003cdiv class=\"issue\">\u003cspan class=\"pictogramme\">' + Esport.icone(\"alerte\", \"f-primary\") + \"\u003c/span>\" +\n        \"\u003ch2>Déclarations divergentes\u003c/h2>\u003cp>Un litige est ouvert. Joins tes captures d'écran pour appuyer ta déclaration.\u003c/p>\u003c/div>\";\n      action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"15\">Voir le litige\u003c/a>' + arbre;\n    } else if (mm.statut === \"sans-declaration\") {\n      if (mm.refusMoi) {\n        html += '\u003cdiv class=\"encart encart-alerte\" role=\"alert\" style=\"margin-top:var(--space-3)\">' + Esport.icone(\"alerte\", \"f-primary\") +\n          \"\u003cdiv>\u003cstrong>Déclaration refusée : délai dépassé\u003c/strong>\u003cp>Ta tentative de \" + mm.refusMoi + \" arrive après la clôture.\u003c/p>\u003c/div>\u003c/div>\";\n      }\n      html += '\u003cdiv class=\"issue\">\u003cspan class=\"pictogramme\">' + Esport.icone(\"alerte\", \"f-primary\") + \"\u003c/span>\" +\n        \"\u003ch2>Aucun résultat déclaré\u003c/h2>\u003cp>Ni toi ni \" + c.adversaire + \" n'avez déclaré de score avant \" + Esport.hhmm(limite) +\n        \". Vous êtes tous les deux éliminés ; ton adversaire prévu au tour suivant est qualifié d'office.\u003c/p>\u003c/div>\";\n      action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"04\">Trouver un autre tournoi\u003c/a>' + arbre;\n    } else if (mm.statut === \"retenu-adverse\") {\n      // Une seule déclaration à l'échéance : celle de l'adversaire est retenue (S07-02)\n      const limiteC = limiteContestation();\n      if (mm.refusMoi) {\n        html += '\u003cdiv class=\"encart encart-alerte\" role=\"alert\" style=\"margin-top:var(--space-3)\">' + Esport.icone(\"alerte\", \"f-primary\") +\n          \"\u003cdiv>\u003cstrong>Déclaration refusée : délai dépassé\u003c/strong>\u003cp>Les déclarations étaient ouvertes jusqu'à \" + Esport.hhmm(limite) +\n          \". Ta tentative de \" + mm.refusMoi + \" n'a pas été enregistrée.\u003c/p>\u003c/div>\u003c/div>\";\n      }\n      html += '\u003cdiv class=\"issue\">\u003ch2>Déclaration de ' + c.adversaire + \" retenue\u003c/h2>\u003cp>Tu n'as pas déclaré de score avant \" + Esport.hhmm(limite) +\n        \". Seule la déclaration de \" + c.adversaire + \" (à \" + mm.declAdv.heure + \") a été enregistrée.\u003c/p>\u003c/div>\" + score(mm.declAdv) +\n        '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\">' + Esport.rebours(limiteC) + '\u003c/div>\u003cp class=\"rebours-legende\">pour contester, jusqu\\'à ' + Esport.hhmm(limiteC) + \"\u003c/p>\u003c/div>\";\n      action = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"contester\">Contester\u003c/button>' + arbre;\n    }\n    page.innerHTML = html + '\u003cp class=\"rebours-legende\" style=\"text-align:center;font-size:var(--font-size-xs)\">Démo : il est ' + Esport.hhmm(maintenant) +\n      \", le temps défile 30 fois plus vite.\u003c/p>\u003cdiv class=\\\"fin-contenu\\\">\u003c/div>\";\n    zone.innerHTML = action;\n  }\n\n  /* ---- Actions ---- */\n  document.querySelector(\".telephone\").addEventListener(\"click\", (e) => {\n    const pas = e.target.closest(\"[data-score]\");\n    if (pas) {\n      const cle = pas.dataset.score;\n      saisie[cle] = Math.min(20, Math.max(0, saisie[cle] + Number(pas.dataset.pas)));\n      erreur = \"\";\n      return rendre();\n    }\n    const mm = Esport.monMatch();\n    const maintenant = Esport.horloge();\n\n    if (e.target.closest(\"#envoyer\")) {\n      if (maintenant > Esport.limiteDeclaration()) {\n        // Délai écoulé : la déclaration est refusée (S07-01)\n        if (mm.declAdv) Esport.majMonMatch({ refusMoi: Esport.hhmm(maintenant), correction: false, statut: \"retenu-adverse\" });\n        else eliminerSansDeclaration(Esport.hhmm(maintenant));\n        return;\n      }\n      if (saisie.moi === saisie.adv && !nulAutorise) {\n        erreur = \"Un match à élimination ne peut pas finir sur un nul : indique le score après prolongation ou tirs au but.\";\n        return rendre();\n      }\n      const decl = { moi: saisie.moi, adv: saisie.adv, heureIso: (mm.declMoi && mm.correction ? mm.declMoi.heureIso : maintenant.toISOString()) };\n      Esport.majMonMatch({ declMoi: decl, statut: \"attente-adv\", correction: false });\n      Nav.toast(mm.correction ? \"Déclaration corrigée\" : \"Déclaration envoyée\");\n    }\n    if (e.target.closest(\"#corriger\")) {\n      saisie = { moi: mm.declMoi.moi, adv: mm.declMoi.adv };\n      Esport.majMonMatch({ correction: true });\n    }\n    if (e.target.closest(\"#contester\")) {\n      // La contestation ouvre un litige (S07-02)\n      Esport.majMonMatch({ statut: \"litige\", litige: { ouverture: maintenant.toISOString(), pieces: 0, contestation: true } });\n      Nav.aller(\"15\");\n    }\n  });\n\n  Esport.monter(rendre);\n  setInterval(rendre, 1000);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","15-litige.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 15 — Litige et preuves.\n     US : S07-03 (litige ouvert sur déclarations divergentes ; jusqu'à 3 captures d'écran, jointes dans\n     les 30 min ; sans pièce, tranché sur les seules déclarations), S07-02 (litige ouvert par une contestation),\n     S05-04 (classement recalculé après la décision d'arbitrage).\n     Les captures choisies restent sur l'appareil : seule leur présence est simulée. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Litige\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { padding: 0 var(--page-gutter) var(--space-4); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }\n\n    /* Les deux déclarations côte à côte */\n    .declarations { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); padding: 0 var(--page-gutter); }\n    .declaration { background: var(--color-surface-warm); border-radius: var(--radius-md); padding: var(--space-3); text-align: center; min-width: 0; }\n    .declaration small { display: block; font-size: var(--font-size-xs); color: var(--color-text-secondary); overflow-wrap: anywhere; }\n    .declaration b { display: block; font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1.2; margin: var(--space-1) 0; }\n    .declaration span { font-size: var(--font-size-xs); color: var(--color-text-secondary); }\n    .declaration.moi { background: var(--color-primary-soft); }\n\n    .bloc-rebours { text-align: center; padding: var(--space-5) var(--page-gutter) var(--space-2); }\n\n    /* Captures d'écran (3 au plus) */\n    .captures { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); padding: 0 var(--page-gutter); }\n    .capture { position: relative; aspect-ratio: 3 / 4; border-radius: var(--radius-sm); overflow: hidden; background: var(--color-bg-muted); }\n    .capture img { width: 100%; height: 100%; object-fit: cover; display: block; }\n    .capture .retirer { position: absolute; top: var(--space-1); right: var(--space-1); width: 28px; height: 28px; border-radius: var(--radius-round); background: var(--color-glass-dark); color: var(--color-text-on-dark); font-weight: var(--font-weight-bold); }\n    .ajout { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); aspect-ratio: 3 / 4; border-radius: var(--radius-sm); border: 2px dashed var(--color-border-strong); color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); cursor: pointer; text-align: center; padding: var(--space-1); }\n    .ajout svg { width: 24px; height: 24px; }\n    .note-section { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }\n\n    .decision { margin: var(--space-4) var(--page-gutter) 0; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-card); }\n    .decision h2 { font-size: var(--font-size-lg); margin-bottom: var(--space-2); }\n    .decision .verdict { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--color-primary); margin-bottom: var(--space-2); }\n    .decision p { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n    .attente { margin-top: var(--space-4); }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Litige\" data-repli=\"14\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n    \u003c!-- Champ de fichiers hors de la zone redessinée chaque seconde -->\n    \u003cinput type=\"file\" accept=\"image/*\" multiple class=\"cache-visuel\" id=\"fichiers\" tabindex=\"-1\">\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const c = DONNEES.monMatch;\n  const t = Esport.tournoi(c.tournoi);\n  const tour = DONNEES.arbres[c.tournoi].tours[c.tour];\n  const moi = DONNEES.joueur.pseudo;\n  const MAX_CAPTURES = 3;\n  const DELAI_DECISION = 8000;   // la décision arrive 8 s (réelles) après le passage en arbitrage\n\n  /* ---- États de démo ---- */\n  const scenario = Esport.lireScenario();\n  const divergence = { declMoi: { moi: 2, adv: 1, heure: \"21:43\" }, declAdv: { moi: 1, adv: 2, heure: \"21:47\" }, statut: \"litige\" };\n  if (scenario === \"litige-ouvert\") {\n    Esport.preparerMatchDemo(Object.assign({ litige: { ouverture: \"2026-10-09T21:47\", pieces: 0 } }, divergence), \"2026-10-09T21:48\");\n  }\n  if (scenario === \"decision-rendue\") {\n    Esport.preparerMatchDemo(Object.assign({}, divergence, { statut: \"arbitre\",\n      litige: { ouverture: \"2026-10-09T21:47\", pieces: 2, envoye: true, envoi: \"21:55\", decision: \"moi\", heureDecision: \"22:20\" } }), \"2026-10-09T22:20\");\n    Esport.enregistrerMonResultat(2, 1, \"Arbitrage\");\n  }\n  Esport.demarrerHorloge();\n\n  // Captures choisies (aperçus locaux, rien n'est envoyé)\n  let captures = [];\n  let minuteurDecision = null;\n\n  function limitePieces(mm) { return Esport.plus(mm.litige.ouverture, c.delaiPieces); }\n\n  /* Envoi des pièces (ou expiration du délai) : passage en arbitrage */\n  function passerEnArbitrage(nbPieces) {\n    const mm = Esport.monMatch();\n    Esport.majMonMatch({ litige: Object.assign({}, mm.litige, { pieces: nbPieces, envoye: true, envoi: Esport.hhmm(Esport.horloge()) }) });\n  }\n\n  /* Décision du responsable local : avec au moins une capture, ma déclaration l'emporte */\n  function rendreDecision() {\n    const mm = Esport.monMatch();\n    const gagnant = mm.litige.pieces > 0 ? \"moi\" : \"adversaire\";\n    const d = gagnant === \"moi\" ? (mm.declMoi || { moi: 2, adv: 1 }) : mm.declAdv;\n    Esport.majMonMatch({ statut: \"arbitre\", litige: Object.assign({}, mm.litige, { decision: gagnant, heureDecision: Esport.hhmm(Esport.horloge()) }) });\n    Esport.enregistrerMonResultat(d.moi, d.adv, \"Arbitrage\");\n    Esport.notifier({ famille: \"match\", ecran: \"15\", titre: \"Décision d'arbitrage\",\n      texte: \"Litige tranché : \" + (gagnant === \"moi\" ? \"victoire de \" + Esport.pseudo() : \"victoire de \" + c.adversaire) + \" \" + d.moi + \"–\" + d.adv + \".\" });\n    Nav.toast(\"Décision d'arbitrage rendue\");\n  }\n\n  function evaluer() {\n    const mm = Esport.monMatch();\n    if (!mm.litige || mm.litige.decision) return;\n    // Délai de 30 min écoulé : le litige part à l'arbitrage avec les pièces déjà jointes\n    if (!mm.litige.envoye && Esport.horloge() >= limitePieces(mm)) {\n      passerEnArbitrage(captures.length);\n      return;\n    }\n    if (mm.litige.envoye && !minuteurDecision) minuteurDecision = setTimeout(rendreDecision, DELAI_DECISION);\n  }\n\n  function carteDeclaration(titre, d, classe) {\n    return '\u003cdiv class=\"declaration ' + (classe || \"\") + '\">\u003csmall>' + titre + \"\u003c/small>\" +\n      (d ? \"\u003cb>\" + d.moi + \" – \" + d.adv + \"\u003c/b>\u003cspan>\" + Esport.pseudo() + \" – \" + c.adversaire + (d.heure ? \" · \" + d.heure : \"\") + \"\u003c/span>\"\n         : \"\u003cb>—\u003c/b>\u003cspan>Contestation, sans déclaration\u003c/span>\") + \"\u003c/div>\";\n  }\n\n  function rendre() {\n    evaluer();\n    const mm = Esport.monMatch();\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    let html = '\u003cdiv class=\"tete\">\u003ch1>Litige\u003c/h1>\u003cp>' + tour + \" · \" + t.nom + \" · contre \" + c.adversaire + \"\u003c/p>\u003c/div>\";\n    let action = \"\";\n\n    if (!mm.litige) {\n      page.innerHTML = html + '\u003cdiv class=\"vide\">\u003cstrong>Aucun litige en cours\u003c/strong>Un litige s\\'ouvre quand les déclarations divergent ou qu\\'une déclaration est contestée.\u003cbr>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"05\">Mes matchs\u003c/a>\u003c/div>';\n      zone.innerHTML = \"\";\n      return;\n    }\n\n    html += '\u003cdiv class=\"declarations\">' + carteDeclaration(\"Ta déclaration\", mm.declMoi, \"moi\") + carteDeclaration(\"Déclaration de \" + c.adversaire, mm.declAdv) + \"\u003c/div>\";\n\n    if (mm.litige.decision) {\n      // Décision rendue, avec son motif\n      const gagnantMoi = mm.litige.decision === \"moi\";\n      const d = gagnantMoi ? (mm.declMoi || { moi: 2, adv: 1 }) : mm.declAdv;\n      html += '\u003csection class=\"decision\">\u003ch2>Décision du responsable local\u003c/h2>' +\n        '\u003cp class=\"verdict\">' + (gagnantMoi ? \"Victoire de \" + Esport.pseudo() : \"Victoire de \" + c.adversaire) + \" · \" + d.moi + \" – \" + d.adv + \"\u003c/p>\" +\n        \"\u003cp>\u003cb>Motif :\u003c/b> \" + (mm.litige.pieces > 0 ? c.decision.avecPieces : c.decision.sansPieces) + \"\u003c/p>\" +\n        \"\u003cp>Rendue à \" + mm.litige.heureDecision + \". \" + (gagnantMoi ? \"Tu passes au tour suivant.\" : \"Tu es éliminé du tournoi.\") +\n        \" L'arbre et le classement du tournoi ont été recalculés.\u003c/p>\u003c/section>\";\n      action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir l\\'arbre et le classement\u003c/a>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"05\">Mes matchs\u003c/a>';\n    } else if (mm.litige.envoye) {\n      // En attente d'arbitrage\n      html += '\u003cdiv class=\"encart attente\">' + Esport.icone(\"calendrier\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>En attente d'arbitrage\u003c/strong>\u003cp>\" +\n        (mm.litige.pieces ? mm.litige.pieces + (mm.litige.pieces > 1 ? \" captures envoyées\" : \" capture envoyée\") + \" à \" + mm.litige.envoi + \".\"\n                          : \"Aucune capture jointe : le litige sera tranché sur les seules déclarations.\") +\n        \" Le responsable local du Maroc examine le litige ; tu seras prévenu de sa décision.\u003c/p>\u003c/div>\u003c/div>\";\n      action = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"05\">Mes matchs\u003c/a>';\n    } else {\n      // Pièces à joindre dans les 30 minutes\n      const limite = limitePieces(mm);\n      html += '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\">' + Esport.rebours(limite) + '\u003c/div>\u003cp class=\"rebours-legende\">pour joindre tes preuves, jusqu\\'à ' + Esport.hhmm(limite) + \"\u003c/p>\u003c/div>\";\n      html += '\u003ch2 class=\"titre-section\">Captures d\\'écran \u003cspan class=\"ligne-sous-titre\">' + captures.length + \" / \" + MAX_CAPTURES + \"\u003c/span>\u003c/h2>\";\n      html += '\u003cdiv class=\"captures\">' + captures.map((cap, i) =>\n        '\u003cdiv class=\"capture\">\u003cimg src=\"' + cap.url + '\" alt=\"Capture ' + (i + 1) + '\">\u003cbutton class=\"retirer\" data-retirer=\"' + i + '\" aria-label=\"Retirer la capture\">×\u003c/button>\u003c/div>'\n      ).join(\"\") +\n        (captures.length \u003c MAX_CAPTURES\n          ? '\u003clabel class=\"ajout\" for=\"fichiers\" tabindex=\"0\">' + Esport.icone(\"article\", \"f-muted\") + \"Ajouter une capture\u003c/label>\"\n          : \"\") + \"\u003c/div>\";\n      html += '\u003cp class=\"note-section\">Montre l\\'écran de fin de match avec le score. Les pièces sont conservées 90 jours après la clôture du litige.\u003c/p>';\n      action = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"envoyer\"' + (captures.length ? \"\" : \" disabled\") + \">Envoyer \" +\n        (captures.length > 1 ? \"les \" + captures.length + \" captures\" : \"la capture\") + \"\u003c/button>\" +\n        '\u003cbutton class=\"bouton bouton-lien bouton-pleine-largeur\" id=\"sans-piece\">Laisser trancher sans capture\u003c/button>';\n    }\n    page.innerHTML = html + '\u003cp class=\"note-section\" style=\"text-align:center\">Démo : il est ' + Esport.hhmm(Esport.horloge()) + \", le temps défile 30 fois plus vite.\u003c/p>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    zone.innerHTML = action;\n  }\n\n  /* ---- Actions ---- */\n  document.getElementById(\"fichiers\").addEventListener(\"change\", (e) => {\n    const fichiers = [...e.target.files].slice(0, MAX_CAPTURES - captures.length);\n    fichiers.forEach((f) => captures.push({ url: URL.createObjectURL(f), nom: f.name }));\n    if (e.target.files.length > fichiers.length) Nav.toast(\"3 captures au maximum\");\n    e.target.value = \"\";\n    rendre();\n  });\n  document.querySelector(\".telephone\").addEventListener(\"click\", (e) => {\n    const retirer = e.target.closest(\"[data-retirer]\");\n    if (retirer) { captures.splice(Number(retirer.dataset.retirer), 1); return rendre(); }\n    if (e.target.closest(\"#envoyer\") && captures.length) { passerEnArbitrage(captures.length); Nav.toast(\"Captures envoyées\"); }\n    if (e.target.closest(\"#sans-piece\")) passerEnArbitrage(0);\n  });\n\n  Esport.monter(rendre);\n  setInterval(rendre, 1000);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","17-profil-public.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 17 — Profil public d'un joueur (17-profil-public.html?pseudo=Rachid_GOAT).\n     US : S01-02 (pseudo, tournois joués, classements), S05-03 (aucune donnée personnelle :\n     seulement le pseudo et le profil public). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Profil public\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .identite { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-4) var(--page-gutter) 0; }\n    .identite .avatar { width: 88px; height: 88px; font-size: var(--font-size-display); margin-bottom: var(--space-3); }\n    .identite h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); word-break: break-all; }\n    .identite .jeux { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-1); margin-top: var(--space-2); }\n\n    .chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); padding: var(--space-5) var(--page-gutter) 0; }\n    .chiffre { background: var(--color-surface-warm); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2); text-align: center; font-size: var(--font-size-xs); color: var(--color-text-secondary); }\n    .chiffre b { display: block; font-size: var(--font-size-xl); color: var(--color-text); }\n\n    .mon-profil { margin-top: var(--space-4); }\n    .resultat { font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); white-space: nowrap; }\n    .resultat.victoire { color: var(--color-success-dark); }\n    .resultat.en-lice { color: var(--color-primary); }\n    .confidentialite { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--font-size-xs); color: var(--color-text-muted); padding: var(--space-4) var(--page-gutter) 0; }\n    .confidentialite svg { width: 16px; height: 16px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Profil du joueur\" data-repli=\"03\">\u003c/header>\n\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* Pseudo consulté ; mon pseudo courant correspond au pseudo de data.js */\n  const demande = Nav.param(\"pseudo\") || \"Rachid_GOAT\";\n  const estMoi = demande === Esport.pseudo() || demande === DONNEES.joueur.pseudo;\n  const pseudoDonnees = estMoi ? DONNEES.joueur.pseudo : demande;\n\n  /* Vainqueur d'un match d'arbre (forfaits et arbitrages compris), voir esport.js */\n  const vainqueur = Esport.vainqueur;\n\n  /* Résultats du joueur, retrouvés dans les arbres, les poules et le classement de t10 */\n  function resultats() {\n    const liste = [];\n\n    Object.keys(DONNEES.arbres).forEach((id) => {\n      const arbre = Esport.arbre(id);\n      if (!arbre.matchs[0].some((m) => m[0] === pseudoDonnees || m[1] === pseudoDonnees)) return;\n      let texte = \"En lice\";\n      let classe = \"en-lice\";\n      arbre.matchs.forEach((tourMatchs, r) => tourMatchs.forEach((m) => {\n        const g = vainqueur(m);\n        if (m[0] !== pseudoDonnees && m[1] !== pseudoDonnees) return;\n        if (Esport.doubleElimination(m)) { texte = \"Éliminé en \" + arbre.tours[r].toLowerCase(); classe = \"\"; return; }\n        if (!g) return;\n        if (g !== pseudoDonnees) { texte = \"Éliminé en \" + arbre.tours[r].toLowerCase(); classe = \"\"; }\n        else if (r === arbre.matchs.length - 1) { texte = \"Vainqueur\"; classe = \"victoire\"; }\n      }));\n      liste.push({ tournoi: Esport.tournoi(id), texte, classe });\n    });\n\n    Object.keys(DONNEES.poules).forEach((id) => {\n      DONNEES.poules[id].forEach((p) => {\n        const rang = p.joueurs.findIndex((j) => j.pseudo === pseudoDonnees);\n        if (rang >= 0) liste.push({ tournoi: Esport.tournoi(id), texte: p.nom + \" · \" + (rang + 1) + (rang ? \"e\" : \"er\"), classe: rang \u003c 2 ? \"en-lice\" : \"\" });\n      });\n    });\n\n    // Free Fire Rentrée Cup (t10) : même classement que l'écran 12\n    if (!liste.some((r) => r.tournoi.id === \"t10\")) {\n      const index = DONNEES.pseudosClassement.indexOf(pseudoDonnees);\n      if (estMoi) liste.push({ tournoi: Esport.tournoi(\"t10\"), texte: \"117e sur 128\", classe: \"\" });\n      else if (index >= 0) liste.push({ tournoi: Esport.tournoi(\"t10\"), texte: index + 1 + (index ? \"e\" : \"er\") + \" sur 128\", classe: index === 0 ? \"victoire\" : \"\" });\n    }\n    return liste;\n  }\n\n  function rendre() {\n    const pseudo = estMoi ? Esport.pseudo() : demande;\n    const liste = resultats();\n    // Historique repris de l'ancienne plateforme (S01-05), sauf refus du joueur\n    const repris = estMoi && !Etat.get(\"historiqueNonRepris\") ? DONNEES.joueur.historiqueRepris : { tournois: 0, victoires: 0 };\n    const victoires = liste.filter((r) => r.classe === \"victoire\").length + repris.victoires;\n    const jeux = [...new Set(liste.map((r) => r.tournoi.jeu))].map((id) => Esport.jeu(id).nom);\n    let html = \"\";\n\n    html += '\u003cdiv class=\"identite\">\u003cspan class=\"avatar' + (estMoi ? \" avatar-moi\" : \"\") + '\">' + pseudo[0] + \"\u003c/span>\" +\n      \"\u003ch1>\" + pseudo + \"\u003c/h1>\" +\n      '\u003cdiv class=\"jeux\">' + jeux.map((j) => '\u003cspan class=\"puce-etat puce-mea\">' + j + \"\u003c/span>\").join(\"\") + \"\u003c/div>\u003c/div>\";\n\n    html += '\u003cdiv class=\"chiffres\">' +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + (liste.length + repris.tournois) + \"\u003c/b>Tournois joués\u003c/div>\" +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + victoires + \"\u003c/b>Victoires\u003c/div>\" +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + liste.filter((r) => r.classe === \"en-lice\").length + \"\u003c/b>En cours\u003c/div>\u003c/div>\";\n\n    if (estMoi) {\n      html += '\u003ca href=\"#\" class=\"encart mon-profil\" data-ecran=\"23\">' + Esport.icone(\"profil\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>C'est ton profil public\u003c/strong>\u003cp>Voici ce que voient les autres joueurs.\u003c/p>\" +\n        '\u003cspan class=\"lien-encart\">Modifier mon profil\u003c/span>\u003c/div>\u003c/a>';\n    }\n\n    html += '\u003ch2 class=\"titre-section\">Tournois joués\u003c/h2>';\n    html += liste.map((r) =>\n      '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"06\" data-id=\"' + r.tournoi.id + '\">' + Esport.visuelJeu(r.tournoi.jeu, \"petit\") +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + r.tournoi.nom + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">' +\n      Esport.jeu(r.tournoi.jeu).nom + \" · \" + Esport.jourCourt(r.tournoi.debut) + \"\u003c/span>\u003c/span>\" +\n      '\u003cspan class=\"resultat ' + r.classe + '\">' + r.texte + \"\u003c/span>\u003c/a>\"\n    ).join(\"\");\n    if (repris.tournois) {\n      html += '\u003cdiv class=\"ligne\">' + Esport.icone(\"calendrier\", \"f-muted\") +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + repris.tournois + \" tournois sur l'ancienne plateforme\u003c/span>\" +\n        '\u003cspan class=\"ligne-sous-titre\">Historique repris · ' + repris.victoires + \" victoires\u003c/span>\u003c/span>\u003c/div>\";\n    }\n    if (!liste.length && !repris.tournois) html += '\u003cp class=\"vide\">Aucun tournoi joué pour l\\'instant.\u003c/p>';\n\n    html += '\u003cp class=\"confidentialite\">' + Esport.icone(\"cadenas\", \"f-muted\") +\n      \"\u003cspan>Seuls le pseudo et les résultats sont publics. Aucune donnée personnelle n'est affichée.\u003c/span>\u003c/p>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","18-video.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 18 — Lecteur vidéo (18-video.html?id=c02).\n     US : S10-01 (lecture dans l'application, sous-titres activables, mode « économie de données »,\n     reprise à l'endroit interrompu), S10-02 (vidéo réservée : refus de lecture, condition d'accès et offre ;\n     aucun téléchargement ni lien externe), S11-01 (bande-annonce lisible par un joueur gratuit).\n     Lecteur simulé : aucune ressource en ligne, l'image est le visuel du jeu. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Vidéo\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    /* ---- Lecteur ---- */\n    .lecteur { background: var(--color-bg-dark); color: var(--color-text-on-dark); }\n    .ecran-video { position: relative; height: 210px; overflow: hidden; }\n    .ecran-video .visuel-jeu { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; opacity: .85; }\n    .ecran-video .visuel-jeu svg { width: 80px; height: 80px; opacity: .35; }\n    .ecran-video.eco .visuel-jeu { filter: blur(1.5px); }\n    .haut-video { position: absolute; top: var(--space-2); left: var(--space-3); right: var(--space-3); display: flex; justify-content: space-between; gap: var(--space-2); }\n    .etiquette-video { font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); background: var(--color-glass-dark); border-radius: var(--radius-pill); padding: 2px var(--space-2); }\n    .etiquette-video.orange { background: var(--color-primary); }\n    .bouton-lecture { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: var(--radius-round); background: var(--color-glass-dark); display: flex; align-items: center; justify-content: center; }\n    .bouton-lecture svg { width: 32px; height: 32px; }\n    .sous-titre { position: absolute; left: var(--space-4); right: var(--space-4); bottom: var(--space-3); text-align: center; }\n    .sous-titre span { background: var(--color-overlay); padding: 2px var(--space-2); border-radius: var(--radius-xs); font-size: var(--font-size-sm); line-height: 1.6; box-decoration-break: clone; -webkit-box-decoration-break: clone; }\n\n    /* Calque par-dessus l'image : verrou ou reprise */\n    .calque { position: absolute; inset: 0; background: var(--color-overlay); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--space-2); padding: var(--space-4); }\n    .calque.opaque { background: var(--color-bg-dark); }\n    .calque svg { width: 28px; height: 28px; }\n    .calque strong { font-size: var(--font-size-lg); }\n    .calque p { font-size: var(--font-size-sm); color: var(--illu-gray-light); }\n    .calque .actions-calque { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; }\n    .calque .bouton { min-height: 40px; }\n    .bouton-verre { background: var(--color-glass-dark); color: var(--color-text-on-dark); }\n\n    .controles { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); }\n    .controles input[type=\"range\"] { flex: 1; min-width: 0; accent-color: var(--color-primary); height: var(--touch-target); }\n    .controles .temps { font-size: var(--font-size-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }\n    .bascule-lecteur { min-width: var(--touch-target); height: 32px; padding: 0 var(--space-2); border-radius: var(--radius-pill); border: 1px solid var(--color-border-dark); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-text-on-dark); }\n    .bascule-lecteur[aria-pressed=\"true\"] { background: var(--color-primary); border-color: var(--color-primary); }\n\n    /* ---- Informations ---- */\n    .infos { padding: var(--space-4) var(--page-gutter) 0; }\n    .infos h1 { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }\n    .infos .meta { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: var(--space-1) 0 var(--space-2); }\n    .infos .carte-badges { margin-bottom: var(--space-2); }\n    .infos .description { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n    .condition { margin-top: var(--space-4); }\n    .reglages { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-3) var(--page-gutter) 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Vidéo\" data-repli=\"20\">\u003c/header>\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"lecteur\" id=\"lecteur\">\u003c/div>\n      \u003cdiv id=\"infos\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"20\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const c = Esport.contenu(Nav.param(\"id\")) || Esport.contenu(\"c02\");\n  const jeu = Esport.jeu(c.jeu);\n  document.title = c.titre;\n\n  let lecture = false;          // en cours de lecture\n  let position = 0;             // seconde courante\n  let bandeAnnonceFinie = false;\n  let repriseProposee = false;  // « Reprendre à … » déjà répondu\n\n  /* Mode de lecture : complet (accès ouvert), bande-annonce (gratuit, extrait libre) ou verrou */\n  function mode() {\n    if (Esport.contenuAccessible(c)) return \"complet\";\n    return c.bandeAnnonce ? \"bande-annonce\" : \"verrou\";\n  }\n  function dureeLue() { return mode() === \"bande-annonce\" ? c.bandeAnnonce : c.duree; }\n  function positionMemorisee() { return (Etat.get(\"positions\") || {})[c.id] || 0; }\n  function memoriserPosition(p) {\n    const positions = Object.assign({}, Etat.get(\"positions\") || {});\n    positions[c.id] = p;\n    Etat.set(\"positions\", positions);\n  }\n\n  /* Sous-titre affiché à la seconde courante (répété en boucle) */\n  function sousTitre() {\n    if (!c.sousTitres || !c.sousTitres.length) return \"\";\n    const cycle = c.sousTitres[c.sousTitres.length - 1][0] + 6;\n    const s = position % cycle;\n    let texte = \"\";\n    c.sousTitres.forEach(([debut, t]) => { if (s >= debut) texte = t; });\n    return texte;\n  }\n\n  const ICONE_LECTURE = '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-white\" d=\"M8 5v14l11-7z\"/>\u003c/svg>';\n  const ICONE_PAUSE = '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-white\" d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/>\u003c/svg>';\n\n  /* ---- Lecteur (reconstruit à chaque changement d'état, pas à chaque seconde) ---- */\n  function rendreLecteur() {\n    const m = mode();\n    const eco = !!Etat.get(\"economieDonnees\");\n    const st = !!Etat.get(\"sousTitres\");\n    const verrouAffiche = m === \"verrou\" || bandeAnnonceFinie;\n    const reprise = m === \"complet\" && !repriseProposee && positionMemorisee() > 0 && !lecture;\n    let ecran = '\u003cdiv class=\"ecran-video' + (eco ? \" eco\" : \"\") + '\">' + Esport.visuelJeu(c.jeu, \"grand\") +\n      '\u003cdiv class=\"haut-video\">\u003cspan class=\"etiquette-video' + (m === \"bande-annonce\" ? \" orange\" : \"\") + '\">' +\n      (m === \"bande-annonce\" ? \"Bande-annonce\" : jeu.nom) + \"\u003c/span>\" +\n      '\u003cspan class=\"etiquette-video\">' + (eco ? \"Économie · 240p\" : \"Auto · 720p\") + \"\u003c/span>\u003c/div>\";\n\n    if (verrouAffiche) {\n      // Lecture refusée : condition d'accès et offre (S10-02)\n      ecran += '\u003cdiv class=\"calque opaque\">' + Esport.icone(\"cadenas\", \"f-primary\") +\n        \"\u003cstrong>Vidéo réservée aux abonnés\u003c/strong>\u003cp>Abonne-toi pour voir la vidéo complète (\" + Esport.duree(c.duree) + \").\u003c/p>\" +\n        '\u003cdiv class=\"actions-calque\">\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"21\" data-origine>S\\'abonner\u003c/a>' +\n        (bandeAnnonceFinie ? '\u003cbutton class=\"bouton bouton-verre\" id=\"revoir\">Revoir la bande-annonce\u003c/button>' : \"\") + \"\u003c/div>\u003c/div>\";\n    } else if (reprise) {\n      // Reprise à l'endroit interrompu (S10-01)\n      ecran += '\u003cdiv class=\"calque\">\u003cstrong>Reprendre à ' + Esport.duree(positionMemorisee()) + \" ?\u003c/strong>\" +\n        '\u003cdiv class=\"actions-calque\">\u003cbutton class=\"bouton bouton-primaire\" id=\"reprendre\">Reprendre\u003c/button>' +\n        '\u003cbutton class=\"bouton bouton-verre\" id=\"debut\">Depuis le début\u003c/button>\u003c/div>\u003c/div>';\n    } else {\n      ecran += '\u003cbutton class=\"bouton-lecture\" id=\"lire\" aria-label=\"' + (lecture ? \"Pause\" : \"Lecture\") + '\">' + (lecture ? ICONE_PAUSE : ICONE_LECTURE) + \"\u003c/button>\" +\n        '\u003cdiv class=\"sous-titre\" id=\"sous-titre\"' + (st ? \"\" : \" hidden\") + \">\u003cspan>\" + sousTitre() + \"\u003c/span>\u003c/div>\";\n    }\n    ecran += \"\u003c/div>\";\n\n    const controles = '\u003cdiv class=\"controles\">' +\n      '\u003cinput type=\"range\" id=\"barre\" min=\"0\" max=\"' + dureeLue() + '\" value=\"' + position + '\" aria-label=\"Position de lecture\"' + (verrouAffiche ? \" disabled\" : \"\") + \">\" +\n      '\u003cspan class=\"temps\" id=\"temps\">' + Esport.duree(position) + \" / \" + Esport.duree(dureeLue()) + \"\u003c/span>\" +\n      '\u003cbutton class=\"bascule-lecteur\" id=\"st\" aria-pressed=\"' + st + '\" aria-label=\"Sous-titres\"' + (c.sousTitres ? \"\" : \" disabled\") + \">CC\u003c/button>\" +\n      '\u003cbutton class=\"bascule-lecteur\" id=\"eco\" aria-pressed=\"' + eco + '\" aria-label=\"Économie de données\">Éco\u003c/button>\u003c/div>';\n    document.getElementById(\"lecteur\").innerHTML = ecran + controles;\n  }\n\n  /* Mise à jour légère, chaque seconde pendant la lecture */\n  function majProgression() {\n    const barre = document.getElementById(\"barre\");\n    if (barre) barre.value = position;\n    const temps = document.getElementById(\"temps\");\n    if (temps) temps.textContent = Esport.duree(position) + \" / \" + Esport.duree(dureeLue());\n    const st = document.getElementById(\"sous-titre\");\n    if (st) st.firstChild.textContent = sousTitre();\n  }\n\n  /* ---- Informations sous le lecteur ---- */\n  function rendreInfos() {\n    const m = mode();\n    let html = '\u003cdiv class=\"infos\">\u003ch1>' + c.titre + \"\u003c/h1>\" +\n      '\u003cp class=\"meta\">' + jeu.nom + \" · \" + Esport.jourCourt(c.date) + \" · \" + Esport.duree(c.duree) + \"\u003c/p>\";\n    if (m !== \"complet\") {\n      html += '\u003cdiv class=\"carte-badges\">\u003cspan class=\"puce-etat puce-reserve\">' + Esport.icone(\"cadenas\", \"f-primary\") + \"Réservé aux abonnés\u003c/span>\" +\n        (c.bandeAnnonce ? '\u003cspan class=\"puce-etat puce-abonnes\">Bande-annonce libre\u003c/span>' : \"\") + \"\u003c/div>\";\n    }\n    html += '\u003cp class=\"description\">' + c.description + \"\u003c/p>\u003c/div>\";\n    if (m !== \"complet\") {\n      html += '\u003cdiv class=\"encart condition\">' + Esport.icone(\"cadenas\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Condition d'accès : abonnement\u003c/strong>\u003cp>\" +\n        (c.bandeAnnonce ? \"La bande-annonce (\" + Esport.duree(c.bandeAnnonce) + \") est libre. \" : \"\") +\n        \"La vidéo complète est réservée aux abonnés, dès \" + Esport.prix(DONNEES.offres[DONNEES.joueur.pays][0].prix) + \" par jour.\u003c/p>\" +\n        '\u003ca href=\"#\" class=\"lien-encart\" data-ecran=\"21\" data-origine>Voir les offres\u003c/a>\u003c/div>\u003c/div>';\n    }\n    html += '\u003cp class=\"reglages\">Lecture dans l\\'application uniquement. ' +\n      (Etat.get(\"economieDonnees\") ? \"Économie de données activée : qualité réduite.\" : \"Qualité adaptée automatiquement à ta connexion.\") + \"\u003c/p>\";\n\n    const autres = Esport.contenusVisibles().filter((x) => x.type === \"video\" && x.id !== c.id).slice(0, 3);\n    html += '\u003ch2 class=\"titre-section\">À voir aussi\u003c/h2>' + autres.map(Esport.ligneContenu).join(\"\");\n    document.getElementById(\"infos\").innerHTML = html;\n  }\n\n  function rendre() {\n    if (!Esport.fonction(\"video\")) {\n      // Vidéos désactivées dans le pays (S08-02)\n      document.getElementById(\"lecteur\").innerHTML = \"\";\n      document.getElementById(\"infos\").innerHTML = '\u003cdiv class=\"vide\">\u003cstrong>Vidéos indisponibles\u003c/strong>Les vidéos ne sont pas proposées dans ton pays.\u003c/div>';\n      return;\n    }\n    rendreLecteur();\n    rendreInfos();\n  }\n\n  /* ---- Lecture simulée : une seconde de vidéo par seconde ---- */\n  setInterval(() => {\n    if (!lecture) return;\n    position += 1;\n    if (mode() === \"complet\") memoriserPosition(position);\n    if (position >= dureeLue()) {\n      lecture = false;\n      if (mode() === \"bande-annonce\") bandeAnnonceFinie = true;\n      else { position = 0; memoriserPosition(0); Nav.toast(\"Lecture terminée\"); }\n      rendreLecteur();\n      return;\n    }\n    majProgression();\n  }, 1000);\n\n  /* ---- Commandes ---- */\n  document.getElementById(\"lecteur\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#lire\")) { lecture = !lecture; repriseProposee = true; rendreLecteur(); }\n    if (e.target.closest(\"#reprendre\")) { position = positionMemorisee(); repriseProposee = true; lecture = true; rendreLecteur(); }\n    if (e.target.closest(\"#debut\")) { position = 0; repriseProposee = true; lecture = true; rendreLecteur(); }\n    if (e.target.closest(\"#revoir\")) { bandeAnnonceFinie = false; position = 0; lecture = true; rendreLecteur(); }\n    if (e.target.closest(\"#st\")) Etat.set(\"sousTitres\", !Etat.get(\"sousTitres\"));\n    if (e.target.closest(\"#eco\")) {\n      Etat.set(\"economieDonnees\", !Etat.get(\"economieDonnees\"));\n      Nav.toast(Etat.get(\"economieDonnees\") ? \"Économie de données : qualité réduite\" : \"Qualité automatique\");\n    }\n  });\n  document.getElementById(\"lecteur\").addEventListener(\"input\", (e) => {\n    if (e.target.id !== \"barre\") return;\n    position = Number(e.target.value);\n    repriseProposee = true;\n    if (mode() === \"complet\") memoriserPosition(position);\n    majProgression();\n  });\n\n  // La position mémorisée ne redessine pas la page ; les autres changements (abonnement, réglages) oui\n  document.addEventListener(\"DOMContentLoaded\", rendre);\n  document.addEventListener(\"etat-change\", (e) => {\n    if (e.detail && e.detail.cle === \"positions\") return;\n    rendre();\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","19-article.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 19 — Article (19-article.html?id=c04).\n     US : S11-01 (article réservé : un joueur gratuit voit le titre, le visuel, le résumé et la condition\n     d'accès ; le corps n'est pas inséré dans la page), S09-02 (signalement : 3 signalements retirent\n     le contenu en attente de revue). Limite de maquette : le corps reste présent dans js/data.js. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Article\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .visuel-article { position: relative; height: 180px; }\n    .visuel-article .visuel-jeu { width: 100%; height: 100%; border-radius: 0; }\n    .visuel-article .visuel-jeu svg { width: 64px; height: 64px; }\n    .article { padding: var(--space-4) var(--page-gutter) 0; }\n    .article .carte-badges { margin: 0 0 var(--space-2); }\n    .article h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .article .meta { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: var(--space-2) 0 var(--space-4); }\n    .article .chapeau { font-size: var(--font-size-lg); font-weight: var(--font-weight-medium); line-height: var(--line-height-base); margin-bottom: var(--space-4); }\n    .article .corps p { margin-bottom: var(--space-4); line-height: 1.6; }\n\n    /* Article réservé : invitation à s'abonner à la place du corps */\n    .verrou-article { margin: 0 var(--page-gutter); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface-warm); text-align: center; }\n    .verrou-article .cercle { width: 56px; height: 56px; border-radius: var(--radius-round); background: var(--color-primary-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-3); }\n    .verrou-article .cercle svg { width: 28px; height: 28px; }\n    .verrou-article strong { display: block; font-size: var(--font-size-lg); margin-bottom: var(--space-1); }\n    .verrou-article p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--space-4); }\n\n    .signaler { display: flex; justify-content: center; padding: var(--space-4) var(--page-gutter) 0; }\n    .signaler .bouton-lien { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); font-size: var(--font-size-sm); }\n    .signaler svg { width: 18px; height: 18px; }\n\n    /* Feuille de signalement */\n    .feuille h2 { font-size: var(--font-size-xl); margin-bottom: var(--space-1); }\n    .feuille .aide { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-3); }\n    .motif { display: flex; align-items: center; gap: var(--space-3); min-height: var(--touch-target); border-bottom: 1px solid var(--color-border); cursor: pointer; }\n    .motif input { width: 20px; height: 20px; accent-color: var(--color-primary); }\n    .feuille .bouton { margin-top: var(--space-4); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Article\" data-repli=\"20\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"20\">\u003c/nav>\n\n    \u003c!-- Feuille « Signaler » -->\n    \u003cdiv class=\"voile\" id=\"voile-signaler\">\n      \u003cdiv class=\"feuille\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"titre-signaler\">\n        \u003cdiv class=\"poignee\">\u003c/div>\n        \u003ch2 id=\"titre-signaler\">Signaler cet article\u003c/h2>\n        \u003cp class=\"aide\">Le responsable local examinera ton signalement.\u003c/p>\n        \u003cdiv id=\"motifs\">\u003c/div>\n        \u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"envoyer-signalement\" disabled>Envoyer le signalement\u003c/button>\n        \u003cbutton class=\"bouton bouton-lien bouton-pleine-largeur\" id=\"annuler-signalement\">Annuler\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const c = Esport.contenu(Nav.param(\"id\")) || Esport.contenu(\"c04\");\n  const jeu = Esport.jeu(c.jeu);\n  document.title = c.titre;\n\n  function signale() { return (Etat.get(\"signalements\") || {})[c.id]; }\n\n  function rendre() {\n    const accessible = Esport.contenuAccessible(c);\n    let html = '\u003cdiv class=\"visuel-article\">' + Esport.visuelJeu(c.jeu, \"grand\") + \"\u003c/div>\" +\n      '\u003carticle class=\"article\">' +\n      (accessible ? \"\" : '\u003cdiv class=\"carte-badges\">\u003cspan class=\"puce-etat puce-reserve\">' + Esport.icone(\"cadenas\", \"f-primary\") + \"Réservé aux abonnés\u003c/span>\u003c/div>\") +\n      \"\u003ch1>\" + c.titre + \"\u003c/h1>\" +\n      '\u003cp class=\"meta\">' + jeu.nom + \" · \" + Esport.jourLong(c.date) + \" · \" + c.lecture + \" min de lecture\u003c/p>\" +\n      '\u003cp class=\"chapeau\">' + c.resume + \"\u003c/p>\";\n    // Joueur gratuit sur un article réservé : le corps n'est pas inséré dans la page (S11-01)\n    if (accessible) html += '\u003cdiv class=\"corps\">' + c.corps.map((p) => \"\u003cp>\" + p + \"\u003c/p>\").join(\"\") + \"\u003c/div>\";\n    html += \"\u003c/article>\";\n\n    if (!accessible) {\n      html += '\u003cdiv class=\"verrou-article\">\u003cspan class=\"cercle\">' + Esport.icone(\"cadenas\", \"f-primary\") + \"\u003c/span>\" +\n        \"\u003cstrong>La suite est réservée aux abonnés\u003c/strong>\" +\n        \"\u003cp>Abonne-toi pour lire l'article en entier, ainsi que toutes les analyses et vidéos exclusives.\u003c/p>\" +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"21\" data-origine>S\\'abonner\u003c/a>\u003c/div>';\n    }\n\n    html += '\u003cdiv class=\"signaler\">' + (signale()\n      ? '\u003cspan class=\"bouton-lien\">' + Esport.icone(\"coche\", \"f-muted\") + \"Signalé : \" + signale().toLowerCase() + \"\u003c/span>\"\n      : '\u003cbutton class=\"bouton-lien\" id=\"signaler\">' + Esport.icone(\"alerte\", \"f-muted\") + \"Signaler\u003c/button>\") + \"\u003c/div>\";\n\n    const autres = Esport.contenusVisibles().filter((x) => x.type === \"article\" && x.id !== c.id).slice(0, 3);\n    html += '\u003ch2 class=\"titre-section\">À lire aussi\u003c/h2>' + autres.map(Esport.ligneContenu).join(\"\") + '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  /* ---- Signalement (S09-02) ---- */\n  const voile = document.getElementById(\"voile-signaler\");\n  document.getElementById(\"motifs\").innerHTML = DONNEES.motifsSignalement.map((m) =>\n    '\u003clabel class=\"motif\">\u003cinput type=\"radio\" name=\"motif\" value=\"' + m + '\">' + m + \"\u003c/label>\").join(\"\");\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#signaler\")) voile.classList.add(\"ouvert\");\n  });\n  voile.addEventListener(\"change\", () => { document.getElementById(\"envoyer-signalement\").disabled = false; });\n  voile.addEventListener(\"click\", (e) => {\n    if (e.target === voile || e.target.closest(\"#annuler-signalement\")) voile.classList.remove(\"ouvert\");\n  });\n  document.getElementById(\"envoyer-signalement\").addEventListener(\"click\", () => {\n    const choix = voile.querySelector('input[name=\"motif\"]:checked');\n    if (!choix) return;\n    const liste = Object.assign({}, Etat.get(\"signalements\") || {});\n    liste[c.id] = choix.value;\n    voile.classList.remove(\"ouvert\");\n    Etat.set(\"signalements\", liste);\n    Nav.toast(\"Signalement envoyé. Merci !\");\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","20-contenus.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 20 — Contenus (onglet « Contenus »).\n     US : S10-01 / S10-02 (vidéos, verrou sur les vidéos réservées), S11-01 (contenus réservés visibles\n     avec leur condition d'accès ; bandes-annonces libres), S08-02 (vidéos masquées si la fonction\n     est désactivée dans le pays). Mène à 18 (vidéo) et 19 (article). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Contenus\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .filtres { display: flex; flex-direction: column; gap: var(--space-3); padding-bottom: var(--space-2); }\n    .resume { font-size: var(--font-size-sm); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Contenus\">\u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"filtres\">\n        \u003cdiv class=\"onglets\" role=\"group\" aria-label=\"Type de contenu\" id=\"types\">\u003c/div>\n        \u003cdiv class=\"puces\" role=\"group\" aria-label=\"Filtrer par jeu\" id=\"jeux\">\u003c/div>\n      \u003c/div>\n      \u003cp class=\"resume\" id=\"resume\" aria-live=\"polite\">\u003c/p>\n      \u003cdiv id=\"liste\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"20\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  let type = \"tous\";\n  let jeu = Nav.param(\"jeu\") || \"tous\";\n\n  function rendre() {\n    const videos = Esport.fonction(\"video\");\n    // Vidéos désactivées dans le pays : le choix « Vidéos » disparaît (S08-02)\n    const types = [[\"tous\", \"Tout\"], [\"video\", \"Vidéos\"], [\"article\", \"Articles\"]].filter(([v]) => v !== \"video\" || videos);\n    if (!videos && type === \"video\") type = \"tous\";\n    document.getElementById(\"types\").innerHTML = types.map(([v, l]) =>\n      '\u003cbutton data-type=\"' + v + '\" class=\"' + (type === v ? \"actif\" : \"\") + '\" aria-pressed=\"' + (type === v) + '\">' + l + \"\u003c/button>\").join(\"\");\n    document.getElementById(\"jeux\").innerHTML = [[\"tous\", \"Tous les jeux\"]].concat(DONNEES.jeux.map((j) => [j.id, j.nom])).map(([v, l]) =>\n      '\u003cbutton class=\"puce' + (jeu === v ? \" actif\" : \"\") + '\" data-jeu=\"' + v + '\" aria-pressed=\"' + (jeu === v) + '\">' + l + \"\u003c/button>\").join(\"\");\n\n    const liste = Esport.contenusVisibles()\n      .filter((c) => (type === \"tous\" || c.type === type) && (jeu === \"tous\" || c.jeu === jeu))\n      .sort((a, b) => b.date.localeCompare(a.date));\n    const verrouilles = liste.filter((c) => !Esport.contenuAccessible(c)).length;\n    document.getElementById(\"resume\").textContent = liste.length\n      ? liste.length + (liste.length > 1 ? \" contenus\" : \" contenu\") + (verrouilles ? \" · \" + verrouilles + \" réservés aux abonnés\" : \"\")\n      : \"\";\n    document.getElementById(\"liste\").innerHTML = liste.length\n      ? liste.map(Esport.ligneContenu).join(\"\")\n      : '\u003cdiv class=\"vide\">\u003cstrong>Aucun contenu\u003c/strong>Rien pour ce jeu pour l\\'instant.\u003c/div>';\n  }\n\n  document.querySelector(\".filtres\").addEventListener(\"click\", (e) => {\n    const bType = e.target.closest(\"[data-type]\");\n    const bJeu = e.target.closest(\"[data-jeu]\");\n    if (bType) type = bType.dataset.type;\n    if (bJeu) jeu = bJeu.dataset.jeu;\n    if (bType || bJeu) rendre();\n  });\n\n  // Les verrous suivent l'interrupteur gratuit / abonné\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","21-offre.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 21 — Offre d'abonnement.\n     US : S11-01 (ce que débloque l'abonnement ; ouverte seulement par un geste du joueur, jamais à\n     l'ouverture de l'application), S11-02 (offres quotidienne, hebdomadaire, mensuelle aux tarifs du pays,\n     période d'essai si elle est activée ; le choix ouvre la brique de paiement Max it, écran 22). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Offre d'abonnement\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .bandeau-offre { position: relative; overflow: hidden; margin: 0 var(--page-gutter); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--color-bg-dark); color: var(--color-text-on-dark); }\n    .bandeau-offre .flamme { position: absolute; right: -40px; top: -40px; width: 140px; height: 210px; transform: rotate(28deg); background: linear-gradient(180deg, var(--color-gaming-flame-dark), var(--color-primary)); opacity: .75; }\n    .bandeau-offre > * { position: relative; }\n    .bandeau-offre h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); margin-bottom: var(--space-3); max-width: 75%; }\n    .bandeau-offre ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--font-size-sm); }\n    .bandeau-offre li { display: flex; gap: var(--space-2); align-items: flex-start; }\n    .bandeau-offre li svg { width: 18px; height: 18px; margin-top: 1px; }\n    .pour-acceder { margin-bottom: var(--space-3); }\n\n    /* Cartes d'offre */\n    .offres { display: flex; flex-direction: column; gap: var(--space-2); padding: 0 var(--page-gutter); }\n    .offre { position: relative; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border: 2px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; background: var(--color-surface); }\n    .offre:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-soft); }\n    .offre input { width: 22px; height: 22px; accent-color: var(--color-primary); flex-shrink: 0; }\n    .offre .nom { flex: 1; min-width: 0; }\n    .offre .nom strong { display: block; font-size: var(--font-size-lg); }\n    .offre .nom small { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n    .offre .prix-offre { text-align: right; font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); white-space: nowrap; }\n    .offre .prix-offre small { display: block; font-size: var(--font-size-xs); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); }\n    .offre .etiquette-essai { position: absolute; top: -10px; right: var(--space-4); }\n    .mentions { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-3) var(--page-gutter) 0; }\n    .deja { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Abonnement\" data-repli=\"03\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const offres = DONNEES.offres[DONNEES.joueur.pays];\n  let choix = \"mensuelle\";\n\n  /* Ce qui a mené ici : contenu ou tournoi d'origine (S11-03) */\n  function contexte() {\n    const origine = Etat.get(\"origine\") || \"\";\n    const id = new URLSearchParams(origine.split(\"?\")[1] || \"\").get(\"id\");\n    if (origine.startsWith(\"06-\") && Esport.tournoi(id)) return { quoi: \"au tournoi\", titre: Esport.tournoi(id).nom };\n    if ((origine.startsWith(\"18-\") || origine.startsWith(\"19-\")) && Esport.contenu(id)) return { quoi: origine.startsWith(\"18-\") ? \"à la vidéo\" : \"à l'article\", titre: Esport.contenu(id).titre };\n    return null;\n  }\n\n  function rendre() {\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    const etat = Esport.etatAbonnement();\n    const coche = Esport.icone(\"coche\", \"f-primary\");\n    const ctx = contexte();\n    let html = \"\";\n\n    // Déjà abonné : pas d'offre à vendre\n    if (etat.statut === \"actif\" || etat.statut === \"resilie\") {\n      page.innerHTML = '\u003cdiv class=\"vide\">\u003cstrong>Tu es déjà abonné\u003c/strong>Tous les tournois et contenus réservés te sont ouverts.\u003cbr>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"24\">Mon abonnement\u003c/a>\u003c/div>';\n      zone.innerHTML = '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-action=\"retour\" data-repli=\"03\">Retour\u003c/button>';\n      return;\n    }\n\n    if (ctx) {\n      html += '\u003cdiv class=\"encart pour-acceder\" style=\"margin-bottom:var(--space-3)\">' + Esport.icone(\"cadenas\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Pour accéder \" + ctx.quoi + \"\u003c/strong>\u003cp>\" + ctx.titre + \"\u003c/p>\u003c/div>\u003c/div>\";\n    }\n    if (etat.statut === \"expire\") {\n      html += '\u003cdiv class=\"encart encart-alerte\" style=\"margin-bottom:var(--space-3)\">' + Esport.icone(\"alerte\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Ton abonnement a expiré le \" + Esport.jourCourt(etat.echeance) + \"\u003c/strong>\u003cp>Réabonne-toi pour retrouver l'accès. Ton historique est conservé.\u003c/p>\u003c/div>\u003c/div>\";\n    }\n    html += '\u003csection class=\"bandeau-offre\">\u003cspan class=\"flamme\">\u003c/span>\u003ch1>Passe en mode abonné\u003c/h1>\u003cul>' +\n      \"\u003cli>\" + coche + \"Tous les tournois réservés aux abonnés, dont les tournois MEA\u003c/li>\" +\n      \"\u003cli>\" + coche + \"Les vidéos complètes, analyses et articles exclusifs\u003c/li>\" +\n      \"\u003cli>\" + coche + \"Les dotations des tournois abonnés\u003c/li>\" +\n      \"\u003cli>\" + coche + \"Sans engagement : tu arrêtes quand tu veux\u003c/li>\u003c/ul>\u003c/section>\";\n\n    html += '\u003ch2 class=\"titre-section\">Choisis ta formule\u003c/h2>\u003cdiv class=\"offres\" role=\"radiogroup\">' + offres.map((o) =>\n      '\u003clabel class=\"offre\">' + (o.essai ? '\u003cspan class=\"puce-etat puce-inscrit etiquette-essai\">' + o.essai + \"\u003c/span>\" : \"\") +\n      '\u003cinput type=\"radio\" name=\"offre\" value=\"' + o.id + '\"' + (o.id === choix ? \" checked\" : \"\") + \">\" +\n      '\u003cspan class=\"nom\">\u003cstrong>' + o.libelle + \"\u003c/strong>\u003csmall>\" + Esport.nomOffre(o.id).replace(/^a/, \"A\") + \"\u003c/small>\u003c/span>\" +\n      '\u003cspan class=\"prix-offre\">' + Esport.prix(o.prix) + \"\u003csmall>par \" + o.libelle.toLowerCase() + \"\u003c/small>\u003c/span>\u003c/label>\"\n    ).join(\"\") + \"\u003c/div>\";\n\n    const o = Esport.offre(choix);\n    html += '\u003cp class=\"mentions\">Tarifs du ' + Esport.pays().nom + \". \" +\n      (o.essai ? o.essai + \", puis \" + Esport.prix(o.prix) + \" par \" + o.libelle.toLowerCase() + \". \" : \"\") +\n      \"Reconduction automatique, résiliable à tout moment depuis ton profil. Paiement sécurisé par Max it.\u003c/p>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    page.innerHTML = html;\n    zone.innerHTML = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"payer\">' +\n      (o.essai ? \"Commencer l'essai avec Max it\" : \"Payer \" + Esport.prix(o.prix) + \" avec Max it\") + \"\u003c/button>\";\n  }\n\n  document.getElementById(\"page\").addEventListener(\"change\", (e) => {\n    if (e.target.name !== \"offre\") return;\n    choix = e.target.value;\n    rendre();\n  });\n  // Le choix ouvre la brique de paiement Max it, offre et montant déjà renseignés (S11-02)\n  document.getElementById(\"action\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#payer\")) Nav.aller(\"22\", null, { offre: choix });\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","22-paiement-maxit.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 22 — Brique de paiement Max it (simulée) (22-paiement-maxit.html?offre=mensuelle).\n     US : S11-02 (offre et montant déjà renseignés ; la plateforme ne traite aucun paiement, elle reçoit\n     le résultat : confirmé, refusé ou abandonné), S11-03 (retour exact sur l'écran d'origine :\n     déverrouillé si confirmé, toujours verrouillé sinon). Aucun vrai paiement : le code n'est pas vérifié. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Paiement Max it\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    /* La brique Max it : feuille blanche sur fond gris, comme les écrans Max it */\n    .telephone { background: var(--color-bg-muted); }\n    .entete-maxit { height: var(--top-bar-height); flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2) 0 var(--space-4); }\n    .entete-maxit .marque { display: flex; align-items: center; gap: var(--space-2); flex: 1; font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); }\n    .entete-maxit .logo { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-on-primary); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-sm); }\n    .fermer { width: var(--touch-target); height: var(--touch-target); border-radius: var(--radius-round); background: var(--color-surface); box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center; }\n    .fermer svg { width: 20px; height: 20px; }\n\n    .feuille-paiement { flex: 1; overflow-y: auto; background: var(--color-surface); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: var(--space-6) var(--page-gutter) var(--space-4); }\n    .marchand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }\n    .marchand .icone-marchand { width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-surface-warm); display: flex; align-items: center; justify-content: center; }\n    .marchand .icone-marchand svg { width: 26px; height: 26px; }\n    .marchand small { display: block; color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n    .montant { text-align: center; padding: var(--space-4) 0 var(--space-5); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-4); }\n    .montant small { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .montant b { display: block; font-size: var(--font-size-display); line-height: 1.2; }\n    .montant .essai { color: var(--color-success-dark); font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); }\n    .lignes { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); font-size: var(--font-size-sm); margin-bottom: var(--space-5); }\n    .lignes dt { color: var(--color-text-secondary); }\n    .lignes dd { text-align: right; font-weight: var(--font-weight-medium); }\n    .code label { display: block; font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); margin-bottom: var(--space-2); }\n    .code input { width: 100%; height: 56px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); text-align: center; font: inherit; font-size: var(--font-size-xxl); letter-spacing: .6em; }\n    .code input:focus { outline: 0; border-color: var(--color-primary); }\n    .code small { display: block; font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-2); }\n\n    .resultat { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: var(--space-8); }\n    .resultat .pictogramme { width: 80px; height: 80px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; background: var(--color-bg-muted); margin-bottom: var(--space-4); }\n    .resultat .pictogramme svg { width: 40px; height: 40px; }\n    .resultat .pictogramme.succes { background: var(--color-success-dark); }\n    .resultat h1 { font-size: var(--font-size-xxl); margin-bottom: var(--space-2); }\n    .resultat p { color: var(--color-text-secondary); }\n    .resultat .recu { font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-3); }\n    .chargement { width: 48px; height: 48px; border-radius: var(--radius-round); border: 4px solid var(--color-primary-soft); border-top-color: var(--color-primary); animation: tourne 1s linear infinite; margin: var(--space-10) auto var(--space-4); }\n    @keyframes tourne { to { transform: rotate(360deg); } }\n    .demo-note { font-size: var(--font-size-xs); color: var(--color-text-muted); text-align: center; margin-top: var(--space-4); }\n    .pied-paiement { flex-shrink: 0; background: var(--color-surface); padding: var(--space-3) var(--page-gutter) var(--space-5); }\n    .pied-paiement .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-maxit\">\n      \u003cspan class=\"marque\">\u003cspan class=\"logo\" aria-hidden=\"true\">M\u003c/span>Paiement Max it\u003c/span>\n      \u003cbutton class=\"fermer\" id=\"fermer\" data-sortie aria-label=\"Fermer et abandonner le paiement\">\n        \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z\"/>\u003c/svg>\n      \u003c/button>\n    \u003c/header>\n    \u003cmain class=\"feuille-paiement\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"pied-paiement\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const scenario = Esport.lireScenario();\n  const refusForce = scenario === \"paiement-refuse\";\n  const abandonDemo = scenario === \"paiement-abandonne\";\n  const o = Esport.offre(Nav.param(\"offre\")) || Esport.offre(\"mensuelle\");\n  // Solde affiché : insuffisant dans l'état de démo « paiement refusé »\n  const solde = refusForce ? 12 : DONNEES.soldeOrangeMoney;\n  const numero = DONNEES.joueur.numero.replace(/(\\d\\d) (\\d\\d)$/, \"•• ••\");\n  let etape = \"saisie\";   // saisie, traitement, confirme, refuse\n\n  function rendre() {\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    if (etape === \"saisie\") {\n      const premier = Esport.jourCourt(new Date(Esport.maintenant().getTime() + (o.essai ? parseInt(o.essai, 10) : 0) * 86400000).toISOString().slice(0, 10));\n      page.innerHTML =\n        '\u003cdiv class=\"marchand\">\u003cspan class=\"icone-marchand\">' + Esport.icone(\"manette\", \"f-primary\") + \"\u003c/span>\" +\n        \"\u003cspan>\u003cstrong>Max it E-sport\u003c/strong>\u003csmall>\" + Esport.nomOffre(o.id).replace(/^a/, \"A\") + \"\u003c/small>\u003c/span>\u003c/div>\" +\n        '\u003cdiv class=\"montant\">\u003csmall>Montant\u003c/small>\u003cb>' + Esport.prix(o.prix) + \"\u003c/b>\" +\n        (o.essai ? '\u003cspan class=\"essai\">' + o.essai + \" · premier prélèvement le \" + premier + \"\u003c/span>\" : \"\u003csmall>par \" + o.libelle.toLowerCase() + \", reconduit automatiquement\u003c/small>\") + \"\u003c/div>\" +\n        '\u003cdl class=\"lignes\">\u003cdt>Payer avec\u003c/dt>\u003cdd>Orange Money\u003c/dd>\u003cdt>Compte\u003c/dt>\u003cdd>' + numero + \"\u003c/dd>\" +\n        \"\u003cdt>Solde disponible\u003c/dt>\u003cdd>\" + solde.toLocaleString(\"fr-FR\", { minimumFractionDigits: 2 }) + \" \" + Esport.pays().monnaie + \"\u003c/dd>\u003c/dl>\" +\n        '\u003cdiv class=\"code\">\u003clabel for=\"code\">Code secret Orange Money\u003c/label>' +\n        '\u003cinput id=\"code\" type=\"password\" inputmode=\"numeric\" maxlength=\"4\" autocomplete=\"off\" aria-describedby=\"aide-code\">' +\n        '\u003csmall id=\"aide-code\">Maquette : saisis 4 chiffres au choix, aucun paiement n\\'est effectué.\u003c/small>\u003c/div>' +\n        (abandonDemo ? '\u003cp class=\"demo-note\">Démo « paiement abandonné » : la brique va se fermer comme si tu la quittais.\u003c/p>' : \"\");\n      zone.innerHTML = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"confirmer\" disabled>Confirmer le paiement\u003c/button>' +\n        '\u003cbutton class=\"bouton bouton-lien bouton-pleine-largeur\" id=\"annuler\" data-sortie>Annuler\u003c/button>';\n      const code = document.getElementById(\"code\");\n      code.addEventListener(\"input\", () => {\n        code.value = code.value.replace(/\\D/g, \"\").slice(0, 4);\n        document.getElementById(\"confirmer\").disabled = code.value.length !== 4;\n      });\n    } else if (etape === \"traitement\") {\n      page.innerHTML = '\u003cdiv class=\"chargement\" aria-hidden=\"true\">\u003c/div>\u003cp style=\"text-align:center\" role=\"status\">Paiement en cours…\u003c/p>';\n      zone.innerHTML = \"\";\n    } else if (etape === \"confirme\") {\n      page.innerHTML = '\u003cdiv class=\"resultat\">\u003cspan class=\"pictogramme succes\">' + Esport.icone(\"coche\", \"f-white\") + \"\u003c/span>\" +\n        \"\u003ch1>Paiement confirmé\u003c/h1>\u003cp>Ton \" + Esport.nomOffre(o.id) + \" est actif. Tu retournes là où tu étais.\u003c/p>\" +\n        '\u003cp class=\"recu\">Reçu n° MX-' + Date.now().toString().slice(-8) + \" · envoyé par SMS\u003c/p>\u003c/div>\";\n      zone.innerHTML = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"continuer\" data-sortie>Continuer\u003c/button>';\n    } else {\n      page.innerHTML = '\u003cdiv class=\"resultat\">\u003cspan class=\"pictogramme\">' + Esport.icone(\"alerte\", \"f-alert\") + \"\u003c/span>\" +\n        \"\u003ch1>Paiement refusé\u003c/h1>\u003cp>Solde Orange Money insuffisant. Aucun montant n'a été débité.\u003c/p>\u003c/div>\";\n      zone.innerHTML = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"retour\" data-sortie>Retour\u003c/button>';\n    }\n  }\n\n  /* ---- Issues du paiement (S11-02, S11-03) ---- */\n  function abandonner() {\n    Nav.retourOrigine(\"Paiement abandonné : aucun montant débité\");\n  }\n  function confirmer() {\n    etape = \"traitement\";\n    rendre();\n    setTimeout(() => {\n      if (refusForce || solde \u003c o.prix) { etape = \"refuse\"; rendre(); return; }\n      // Paiement confirmé : l'accès s'ouvre tout de suite, le mode abonné est activé\n      Esport.souscrire(o.id);\n      etape = \"confirme\";\n      rendre();\n      setTimeout(continuer, 2000);\n    }, 1500);\n  }\n  let parti = false;   // évite un double retour (bouton « Continuer » et retour automatique)\n  function continuer() {\n    if (parti) return;\n    parti = true;\n    Nav.retourOrigine(\"Abonnement activé : accès débloqué\");\n  }\n\n  document.querySelector(\".telephone\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#confirmer\") && !e.target.closest(\"#confirmer\").disabled) confirmer();\n    if (e.target.closest(\"#annuler\") || e.target.closest(\"#fermer\")) {\n      if (etape === \"confirme\") continuer();\n      else if (etape !== \"traitement\") abandonner();\n    }\n    if (e.target.closest(\"#continuer\")) continuer();\n    if (e.target.closest(\"#retour\")) Nav.retourOrigine(\"Paiement refusé : ton accès reste verrouillé\");\n  });\n\n  rendre();\n  if (abandonDemo) setTimeout(abandonner, 3000);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","23-profil.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 23 — Mon profil (onglet « Profil »).\n     US : S01-02 (pseudo unique, modifiable une fois tous les 30 jours ; identifiant de jeu par jeu, refusé\n     s'il est déjà rattaché à un autre profil ; pseudo jugé offensant remplacé par un pseudo neutre),\n     S01-05 (historique repris compris), S11-04 (résumé de l'abonnement, ou « S'abonner »).\n     Liens : 17 (profil public), 05, 21, 24, 27, 28. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mon profil\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .identite { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--page-gutter) var(--space-4); }\n    .identite .avatar { width: 72px; height: 72px; font-size: var(--font-size-xxl); }\n    .identite h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); overflow-wrap: anywhere; }\n    .identite .lien-public { display: inline-flex; align-items: center; min-height: 32px; color: var(--color-primary); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); }\n    .chiffres { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); padding: 0 var(--page-gutter); }\n    .chiffre { background: var(--color-surface-warm); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2); text-align: center; font-size: var(--font-size-xs); color: var(--color-text-secondary); }\n    .chiffre b { display: block; font-size: var(--font-size-xl); color: var(--color-text); }\n    .bloc { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .bloc .ligne { padding-left: var(--space-4); padding-right: var(--space-3); }\n    .bloc .puce { flex-shrink: 0; }\n    .bloc .puce:disabled { color: var(--color-text-muted); border-color: var(--color-border); cursor: default; }\n    .encart { margin-bottom: var(--space-3); }\n\n    /* Feuille de modification (pseudo ou identifiant de jeu) */\n    .feuille h2 { font-size: var(--font-size-xl); margin-bottom: var(--space-1); }\n    .feuille .aide { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-4); }\n    .feuille .erreur-champ { color: var(--color-alert); font-size: var(--font-size-sm); margin-top: var(--space-2); }\n    .feuille .puces { margin-top: var(--space-2); }\n    .feuille .
