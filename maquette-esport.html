 () => setTimeout(majCloches, 0));\n\n  return {\n    icone, visuelJeu, jeu, tournoi, maintenant, abonne, pseudo, pays, fonction, tournoisDuPays,\n    inscription, changerInscription, inscriptionsCloses, etatBouton,\n    equipe, changerEquipe, tailleEquipe, reglementAAccepter, accepterReglement, lireScenario,\n    jourLong, jourCourt, heure, blocDate, prix,\n    badges, libelleFormat, libelleMode, carteTournoi, carteUne, contenusVisibles, ligneContenu, monter,\n    duree, contenu, contenuAccessible, offre, nomOffre, etatAbonnement,\n    familleActive, notifications, notificationsVisibles, nonLues, marquerLue, toutMarquerLu, notifier, majCloches, souscrire, resilier, expirer, gamertags,\n    horloge, regleHorloge, demarrerHorloge, plus, hhmm, rebours,\n    monMatch, majMonMatch, cleMonMatch, preparerMatchDemo, finPrevue, limiteDeclaration, resultatsMatchs, enregistrerResultat, enregistrerMonResultat,\n    vainqueur, doubleElimination, propager, arbre, recalculeApresArbitrage, prochainMatch, carteProchainMatch\n  };\n})();\n","demo":"/* Menu de démonstration : icône discrète en haut à droite, sur tous les écrans.\n   Il ne fait pas partie du produit. Il sert à basculer entre joueur gratuit et abonné,\n   et à forcer les états alternatifs difficiles à atteindre en cliquant. */\n\nconst Demo = (function () {\n\n  /* Bascules : états qui restent actifs jusqu'à ce qu'on les coupe */\n  const BASCULES = [\n    { cle: \"suspendu\", libelle: \"Compte Max it suspendu\", aide: \"Bloque l'entrée par « E-sport »\" },\n    { cle: \"sessionExpiree\", libelle: \"Session Max it expirée\", aide: \"Reconnexion à la prochaine page e-sport\" },\n    { cle: \"premierAcces\", libelle: \"Premier accès\", aide: \"« E-sport » ouvre le choix du pseudo\" }\n  ];\n\n  /* Raccourcis : forcent un état puis ouvrent l'écran concerné */\n  const RACCOURCIS = [\n    { libelle: \"Forfait adverse\", ecran: \"11\", scenario: \"forfait-adverse\" },\n    { libelle: \"Mon forfait\", ecran: \"11\", scenario: \"mon-forfait\" },\n    { libelle: \"Double absence\", ecran: \"11\", scenario: \"double-absence\" },\n    { libelle: \"Résultat divergent\", ecran: \"14\", scenario: \"resultat-divergent\" },\n    { libelle: \"Déclaration adverse à contester\", ecran: \"14\", scenario: \"declaration-adverse\" },\n    { libelle: \"Délai de déclaration dépassé\", ecran: \"14\", scenario: \"delai-depasse\" },\n    { libelle: \"Aucune déclaration dans le délai\", ecran: \"14\", scenario: \"sans-declaration\" },\n    { libelle: \"Litige ouvert\", ecran: \"15\", scenario: \"litige-ouvert\" },\n    { libelle: \"Décision d'arbitrage rendue\", ecran: \"15\", scenario: \"decision-rendue\" },\n    { libelle: \"Exclusion d'un tournoi (contestation)\", ecran: \"26\", scenario: \"exclusion\" },\n    { libelle: \"Refus : identifiant de jeu déjà inscrit\", ecran: \"08\", scenario: \"refus-doublon\" },\n    { libelle: \"Refus : compte déjà inscrit\", ecran: \"08\", scenario: \"refus-compte\" },\n    { libelle: \"Refus : pays non éligible\", ecran: \"08\", scenario: \"refus-pays\" },\n    { libelle: \"Liste d'attente\", ecran: \"08\", scenario: \"liste-attente\" },\n    { libelle: \"Suspension après 3 forfaits\", ecran: \"08\", scenario: \"suspension\" },\n    { libelle: \"Inscription annulée (abonnement expiré)\", ecran: \"08\", scenario: \"abonnement-expire\" },\n    { libelle: \"Équipe incomplète à la clôture\", ecran: \"10\", scenario: \"equipe-incomplete\" },\n    { libelle: \"Paiement refusé\", ecran: \"22\", scenario: \"paiement-refuse\" },\n    { libelle: \"Paiement abandonné\", ecran: \"22\", scenario: \"paiement-abandonne\" },\n    { libelle: \"Abonnement résilié\", ecran: \"24\", scenario: \"resilie\" },\n    { libelle: \"Abonnement expiré\", ecran: \"24\", scenario: \"expire\" },\n    { libelle: \"Pseudo jugé offensant\", ecran: \"23\", scenario: \"pseudo-offensant\" },\n    { libelle: \"Compte supprimé (30 jours après)\", ecran: \"28\", scenario: \"compte-supprime\" },\n    // Sans changer d'écran : une notification arrive en moins de 5 secondes (S12-01)\n    { libelle: \"Nouvelle notification\", action: \"notification\", aide: \"Arrive sur l'écran affiché en moins de 5 s\" }\n  ];\n\n  const ICONE_REGLAGES =\n    '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M4 6h10.2a3 3 0 0 1 5.6 0H20v2h-.2a3 3 0 0 1-5.6 0H4zm13 1a1 1 0 1 0 0 .01zM4 16h.2a3 3 0 0 1 5.6 0H20v2H9.8a3 3 0 0 1-5.6 0H4zm3 1a1 1 0 1 0 0 .01z\"/>\u003c/svg>';\n  const ICONE_FLECHE =\n    '\u003csvg class=\"fleche\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-muted\" d=\"M9.3 5.3 15.9 12l-6.6 6.7-1.4-1.4 5.2-5.3-5.2-5.3z\"/>\u003c/svg>';\n\n  let voile;\n\n  /* Construit le contenu de la feuille à partir de l'état courant */\n  function construire() {\n    const abonne = Etat.get(\"abonne\");\n    let html =\n      '\u003cdiv class=\"feuille\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Menu de démonstration\">' +\n      '\u003cdiv class=\"poignee\">\u003c/div>' +\n      '\u003cp class=\"demo-titre\">Menu de démonstration\u003c/p>' +\n      '\u003cp class=\"demo-aide\">Hors produit : sert à présenter la maquette.\u003c/p>' +\n\n      '\u003cp class=\"demo-groupe\">Profil du joueur\u003c/p>' +\n      '\u003cdiv class=\"segment\" role=\"radiogroup\">' +\n      '\u003cbutton role=\"radio\" data-abonne=\"non\" aria-checked=\"' + !abonne + '\" class=\"' + (abonne ? \"\" : \"actif\") + '\">Joueur gratuit\u003c/button>' +\n      '\u003cbutton role=\"radio\" data-abonne=\"oui\" aria-checked=\"' + abonne + '\" class=\"' + (abonne ? \"actif\" : \"\") + '\">Joueur abonné\u003c/button>' +\n      \"\u003c/div>\" +\n\n      '\u003cp class=\"demo-groupe\">Compte Max it\u003c/p>';\n\n    BASCULES.forEach((b) => {\n      const actif = Etat.get(b.cle);\n      html +=\n        '\u003cbutton class=\"demo-ligne\" role=\"switch\" aria-checked=\"' + !!actif + '\" data-bascule=\"' + b.cle + '\">' +\n        \"\u003cspan>\" + b.libelle + \"\u003csmall>\" + b.aide + \"\u003c/small>\u003c/span>\" +\n        '\u003cspan class=\"inter' + (actif ? \" on\" : \"\") + '\">\u003c/span>\u003c/button>';\n    });\n\n    html += '\u003cp class=\"demo-groupe\">États alternatifs\u003c/p>';\n    RACCOURCIS.forEach((r, i) => {\n      if (r.action) {\n        html += '\u003cbutton class=\"demo-ligne\" data-raccourci=\"' + i + '\">\u003cspan>' + r.libelle + \"\u003csmall>\" + r.aide + \"\u003c/small>\u003c/span>\" + ICONE_FLECHE + \"\u003c/button>\";\n        return;\n      }\n      const ecran = ECRANS[r.ecran];\n      html +=\n        '\u003cbutton class=\"demo-ligne\" data-raccourci=\"' + i + '\"' + (ecran.pret ? \"\" : \" disabled\") + \">\" +\n        \"\u003cspan>\" + r.libelle + \"\u003csmall>Écran \" + r.ecran + \" · \" + ecran.titre + \"\u003c/small>\u003c/span>\" +\n        (ecran.pret ? ICONE_FLECHE : '\u003cspan class=\"lot\">à venir\u003c/span>') +\n        \"\u003c/button>\";\n    });\n\n    html +=\n      '\u003cbutton class=\"demo-reinit\" data-reinit>Réinitialiser la démo\u003c/button>' +\n      '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-fermer>Fermer\u003c/button>' +\n      \"\u003c/div>\";\n    return html;\n  }\n\n  function ouvrir() {\n    voile.innerHTML = construire();\n    voile.classList.add(\"ouvert\");\n  }\n\n  function fermer() {\n    voile.classList.remove(\"ouvert\");\n  }\n\n  function gererClic(evenement) {\n    const cible = evenement.target;\n    if (cible === voile || cible.closest(\"[data-fermer]\")) return fermer();\n\n    const segment = cible.closest(\"[data-abonne]\");\n    if (segment) {\n      const abonne = segment.dataset.abonne === \"oui\";\n      Etat.set(\"abonne\", abonne);\n      Nav.toast(abonne ? \"Mode joueur abonné\" : \"Mode joueur gratuit\");\n      return ouvrir();\n    }\n\n    const bascule = cible.closest(\"[data-bascule]\");\n    if (bascule) {\n      const cle = bascule.dataset.bascule;\n      Etat.set(cle, !Etat.get(cle));\n      return ouvrir();\n    }\n\n    const raccourci = cible.closest(\"[data-raccourci]\");\n    if (raccourci && !raccourci.disabled) {\n      const r = RACCOURCIS[Number(raccourci.dataset.raccourci)];\n      if (r.action === \"notification\") {\n        fermer();\n        setTimeout(() => {\n          const notif = { famille: \"tournoi\", ecran: \"06\", params: { id: \"t04\" }, titre: \"Nouveau tournoi sur un jeu suivi\",\n            texte: \"MEA Free Fire Championship : les inscriptions sont ouvertes.\" };\n          if (typeof Esport !== \"undefined\") Esport.notifier(notif);\n          Nav.toast(\"Notification : \" + notif.titre);\n        }, 2000);\n        return;\n      }\n      // Un abonnement expiré ramène le joueur au niveau gratuit (S11-04)\n      if (r.scenario === \"expire\" || r.scenario === \"abonnement-expire\") Etat.set(\"abonne\", false);\n      fermer();\n      // Paiement : on revient ensuite sur l'écran affiché (S11-03)\n      if (r.ecran === \"22\") Nav.memoriserOrigine();\n      return Nav.aller(r.ecran, r.scenario);\n    }\n\n    if (cible.closest(\"[data-reinit]\")) {\n      Etat.reinitialiser();\n      Nav.toast(\"Démo réinitialisée\");\n      return ouvrir();\n    }\n  }\n\n  function installer() {\n    const telephone = document.querySelector(\".telephone\");\n    const icones = document.querySelector(\".barre-etat .icones-systeme\");\n    if (!telephone || !icones) return;\n\n    const bouton = document.createElement(\"button\");\n    bouton.className = \"demo-bouton\";\n    bouton.setAttribute(\"aria-label\", \"Menu de démonstration\");\n    bouton.innerHTML = ICONE_REGLAGES;\n    bouton.addEventListener(\"click\", ouvrir);\n    icones.prepend(bouton);\n\n    voile = document.createElement(\"div\");\n    voile.className = \"voile\";\n    voile.addEventListener(\"click\", gererClic);\n    telephone.appendChild(voile);\n  }\n\n  document.addEventListener(\"DOMContentLoaded\", installer);\n  return { ouvrir };\n})();\n"},"PAGES":{"10-equipe.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 10 — Mon équipe (10-equipe.html?id=t01).\n     US : S04-03 (effectif et taille exigée, inscription automatique une fois complète,\n     invitation par pseudo ou par lien, transmission du rôle de capitaine, équipe incomplète à la clôture),\n     S04-04 (le capitaine accepte ou refuse les demandes ; le joueur peut quitter l'équipe). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mon équipe\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--page-gutter) var(--space-4); }\n    .blason { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-on-primary); font-size: var(--font-size-xxl); font-weight: var(--font-weight-bold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete a { color: var(--color-primary); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n\n    .encart-succes > svg { background: var(--color-success-dark); border-radius: var(--radius-round); padding: 2px; }\n\n    /* Effectif : une pastille par place */\n    .places { display: flex; gap: var(--space-1); margin-left: auto; }\n    .places i { width: 18px; height: 8px; border-radius: var(--radius-pill); background: var(--color-border); }\n    .places i.prise { background: var(--color-primary); }\n    .bloc { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .bloc .ligne { padding-left: var(--space-4); padding-right: var(--space-3); }\n    .place-libre .avatar { background: var(--color-bg-muted); color: var(--color-text-muted); }\n    .place-libre .ligne-titre { color: var(--color-text-muted); font-weight: var(--font-weight-medium); }\n    .boutons-ligne { display: flex; gap: var(--space-2); }\n    .boutons-ligne .puce { min-height: 36px; }\n    .puce-primaire { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-bold); }\n\n    .inviter { display: flex; gap: var(--space-2); padding: 0 var(--page-gutter); }\n    .inviter .champ { flex: 1; }\n    .erreur-champ { color: var(--color-alert); font-size: var(--font-size-sm); padding: var(--space-2) var(--page-gutter) 0; }\n    .lien-equipe { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-3) var(--page-gutter) 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-surface-warm); font-size: var(--font-size-sm); }\n    .lien-equipe span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n    .note-section { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }\n\n    .actions-equipe { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-6) var(--page-gutter) 0; }\n    .bouton-danger { color: var(--color-alert); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Mon équipe\" data-repli=\"06\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const scenario = Esport.lireScenario();\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(\"t01\");\n  const taille = Esport.tailleEquipe(t);\n  const moi = DONNEES.joueur.pseudo;\n  // Démo « Équipe incomplète à la clôture » : l'équipe de t01 avec 3 joueurs sur 4, inscriptions closes\n  const incompleteCloture = scenario === \"equipe-incomplete\";\n\n  /* Pseudos connus de la plateforme (pour les invitations) */\n  function pseudosConnus() {\n    const tous = new Set(DONNEES.pseudosClassement.concat(DONNEES.pseudosPris, DONNEES.demandesSimulees));\n    Object.values(DONNEES.equipesOuvertes).forEach((liste) => liste.forEach((e) => e.membres.forEach((p) => tous.add(p))));\n    Object.values(DONNEES.poules).forEach((p) => p.forEach((g) => g.joueurs.forEach((j) => tous.add(j.pseudo))));\n    return tous;\n  }\n\n  /* Équipe affichée : la mienne, ou la version « incomplète à la clôture » de la démo */\n  function equipeAffichee() {\n    const eq = Esport.equipe(t.id) || (incompleteCloture ? DONNEES.mesEquipes.t01 : null);\n    if (!eq) return null;\n    if (incompleteCloture) return Object.assign({}, eq, { membres: eq.membres.slice(0, taille - 1), demandes: [], invitations: [] });\n    return eq;\n  }\n\n  /* Enregistre une modification de l'équipe ; une équipe complète est inscrite d'office (S04-03) */\n  function enregistrer(eq) {\n    const etaitComplete = (Esport.equipe(t.id) || { membres: [] }).membres.length >= taille;\n    if (eq.membres.length >= taille) eq.demandes = [];\n    Esport.changerEquipe(t.id, eq);\n    if (eq.membres.length >= taille && !etaitComplete) {\n      Esport.changerInscription(t.id, { etat: \"inscrit\" });\n      Esport.notifier({ famille: \"equipe\", ecran: \"10\", params: { id: t.id }, titre: \"Équipe inscrite\",\n        texte: eq.nom + \" est complète : elle est inscrite à \" + t.nom + \". Tous les membres sont prévenus.\" });\n      Nav.toast(\"Équipe complète : inscrite au tournoi. Tous les membres sont prévenus.\");\n    }\n  }\n\n  function nom(pseudo) { return pseudo === moi ? Esport.pseudo() : pseudo; }\n\n  function rendre() {\n    const eq = equipeAffichee();\n    const page = document.getElementById(\"page\");\n    if (!eq) {\n      page.innerHTML = '\u003cdiv class=\"vide\">\u003cstrong>Pas d\\'équipe dans ce tournoi\u003c/strong>Crée ton équipe ou rejoins-en une pour t\\'inscrire à ' + t.nom + \".\u003cbr>\" +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"06\" data-id=\"' + t.id + '\">Voir le tournoi\u003c/a>\u003c/div>';\n      return;\n    }\n    const capitaine = eq.capitaine === moi;\n    const complete = eq.membres.length >= taille;\n    const manque = taille - eq.membres.length;\n    let html = \"\";\n\n    // En-tête de l'équipe\n    html += '\u003cdiv class=\"tete\">\u003cspan class=\"blason\">' + eq.nom[0] + \"\u003c/span>\u003cdiv>\u003ch1>\" + eq.nom + \"\u003c/h1>\" +\n      \"\u003cp>\" + (eq.ouverte ? \"Équipe ouverte\" : \"Équipe fermée\") + \" · \" +\n      '\u003ca href=\"#\" data-ecran=\"06\" data-id=\"' + t.id + '\">' + t.nom + \"\u003c/a>\u003c/p>\u003c/div>\u003c/div>\";\n\n    // État de l'inscription\n    if (incompleteCloture) {\n      html += '\u003cdiv class=\"encart encart-alerte\">' + Esport.icone(\"alerte\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Équipe non inscrite\u003c/strong>\u003cp>Les inscriptions ont été closes le \" + Esport.jourCourt(t.cloture) +\n        \" avec \" + eq.membres.length + \" joueurs sur \" + taille + \". Tous les membres ont été prévenus.\u003c/p>\u003c/div>\u003c/div>\";\n    } else if (complete) {\n      html += '\u003cdiv class=\"encart encart-succes\">' + Esport.icone(\"coche\", \"f-white\") +\n        \"\u003cdiv>\u003cstrong>Équipe complète et inscrite\u003c/strong>\u003cp>Elle a été inscrite automatiquement au tournoi. Début le \" +\n        Esport.jourLong(t.debut) + \" à \" + Esport.heure(t.debut) + \".\u003c/p>\u003c/div>\u003c/div>\";\n    } else {\n      html += '\u003cdiv class=\"encart\">' + Esport.icone(\"groupe\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Il manque \" + manque + (manque > 1 ? \" joueurs\" : \" joueur\") + \"\u003c/strong>\u003cp>L'équipe sera inscrite automatiquement dès qu'elle sera complète. \" +\n        \"Une équipe incomplète le \" + Esport.jourCourt(t.cloture) + \" ne sera pas inscrite.\u003c/p>\u003c/div>\u003c/div>\";\n    }\n\n    // Effectif\n    html += '\u003ch2 class=\"titre-section\">Effectif ' + eq.membres.length + \"/\" + taille +\n      '\u003cspan class=\"places\" aria-hidden=\"true\">' + Array.from({ length: taille }, (_, i) => '\u003ci class=\"' + (i \u003c eq.membres.length ? \"prise\" : \"\") + '\">\u003c/i>').join(\"\") + \"\u003c/span>\u003c/h2>\";\n    html += '\u003cdiv class=\"bloc\">' + eq.membres.map((p) =>\n      '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"17\" data-pseudo=\"' + nom(p) + '\">\u003cspan class=\"avatar' + (p === moi ? \" avatar-moi\" : \"\") + '\">' + nom(p)[0] + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + nom(p) + (p === moi ? \" (toi)\" : \"\") + \"\u003c/span>\u003c/span>\" +\n      (p === eq.capitaine ? '\u003cspan class=\"puce-etat puce-mea\">Capitaine\u003c/span>' : \"\") + \"\u003c/a>\"\n    ).join(\"\") +\n    Array.from({ length: Math.max(manque, 0) }, () =>\n      '\u003cdiv class=\"ligne place-libre\">\u003cspan class=\"avatar\">+\u003c/span>\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Place libre\u003c/span>\u003c/span>\u003c/div>'\n    ).join(\"\") + \"\u003c/div>\";\n\n    // Demandes en attente : le capitaine accepte ou refuse (S04-04)\n    if (!incompleteCloture && capitaine && eq.demandes.length) {\n      html += '\u003ch2 class=\"titre-section\">Demandes en attente\u003c/h2>\u003cdiv class=\"bloc\">' + eq.demandes.map((p) =>\n        '\u003cdiv class=\"ligne\">\u003cspan class=\"avatar\">' + p[0] + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-corps\">\u003ca href=\"#\" class=\"ligne-titre\" data-ecran=\"17\" data-pseudo=\"' + p + '\">' + p + '\u003c/a>\u003cspan class=\"ligne-sous-titre\">Veut rejoindre l\\'équipe\u003c/span>\u003c/span>' +\n        '\u003cspan class=\"boutons-ligne\">\u003cbutton class=\"puce\" data-refuser=\"' + p + '\">Refuser\u003c/button>' +\n        '\u003cbutton class=\"puce puce-primaire\" data-accepter=\"' + p + '\">Accepter\u003c/button>\u003c/span>\u003c/div>'\n      ).join(\"\") + \"\u003c/div>\";\n    }\n\n    // Inviter par pseudo ou par lien : capitaine, équipe incomplète\n    if (!incompleteCloture && capitaine && !complete) {\n      html += '\u003ch2 class=\"titre-section\">Inviter des joueurs\u003c/h2>' +\n        '\u003cdiv class=\"inviter\">\u003clabel class=\"champ\" id=\"champ-invite\">\u003cspan class=\"cache-visuel\">Pseudo du joueur\u003c/span>' +\n        '\u003cinput id=\"pseudo-invite\" placeholder=\"Pseudo du joueur\" autocomplete=\"off\">\u003c/label>' +\n        '\u003cbutton class=\"bouton bouton-primaire\" id=\"inviter\">Inviter\u003c/button>\u003c/div>' +\n        '\u003cp class=\"erreur-champ\" id=\"erreur-invite\" role=\"alert\">\u003c/p>' +\n        '\u003cdiv class=\"lien-equipe\">' + Esport.icone(\"groupe\", \"f-text\") + \"\u003cspan>\" + eq.lien + \"\u003c/span>\" +\n        '\u003cbutton class=\"bouton-lien\" id=\"copier\">Copier le lien\u003c/button>\u003c/div>' +\n        '\u003cp class=\"note-section\">Toute personne qui ouvre ce lien peut rejoindre l\\'équipe.\u003c/p>';\n      if (eq.invitations.length) {\n        html += '\u003cdiv class=\"bloc\" style=\"margin-top: var(--space-3)\">' + eq.invitations.map((p) =>\n          '\u003cdiv class=\"ligne\">\u003cspan class=\"avatar\">' + p[0] + '\u003c/span>\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + p +\n          '\u003c/span>\u003cspan class=\"ligne-sous-titre\">Invitation envoyée · en attente de réponse\u003c/span>\u003c/span>\u003c/div>'\n        ).join(\"\") + \"\u003c/div>\";\n      }\n    } else if (!incompleteCloture && !capitaine && !complete) {\n      html += '\u003cp class=\"note-section\" style=\"padding-top: var(--space-4)\">Seul le capitaine, ' + eq.capitaine + \", peut inviter des joueurs et accepter les demandes.\u003c/p>\";\n    }\n\n    // Actions sur l'équipe\n    html += '\u003cdiv class=\"actions-equipe\">';\n    if (incompleteCloture) {\n      html += '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"04\">Voir d\\'autres tournois\u003c/a>';\n    } else {\n      if (capitaine && eq.membres.length > 1) html += '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"transmettre\">Transmettre le rôle de capitaine\u003c/button>';\n      html += '\u003cbutton class=\"bouton bouton-lien bouton-danger bouton-pleine-largeur\" id=\"quitter\">Quitter l\\'équipe\u003c/button>';\n    }\n    html += '\u003c/div>\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    page.innerHTML = html;\n  }\n\n  /* ---------- Actions ---------- */\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    const eq = Esport.equipe(t.id);\n    if (!eq) return;\n\n    const accepter = e.target.closest(\"[data-accepter]\");\n    if (accepter) {\n      const p = accepter.dataset.accepter;\n      Nav.toast(p + \" a rejoint l'équipe\");\n      enregistrer(Object.assign({}, eq, { membres: eq.membres.concat([p]), demandes: eq.demandes.filter((d) => d !== p) }));\n      return;\n    }\n    const refuser = e.target.closest(\"[data-refuser]\");\n    if (refuser) {\n      const p = refuser.dataset.refuser;\n      enregistrer(Object.assign({}, eq, { demandes: eq.demandes.filter((d) => d !== p) }));\n      Nav.toast(\"Demande refusée : \" + p + \" est prévenu\");\n      return;\n    }\n\n    if (e.target.closest(\"#inviter\")) inviter(eq);\n    if (e.target.closest(\"#copier\")) {\n      try { navigator.clipboard.writeText(\"https://\" + eq.lien); } catch (erreur) { /* presse-papiers indisponible */ }\n      Nav.toast(\"Lien de l'équipe copié\");\n    }\n    if (e.target.closest(\"#transmettre\")) transmettre(eq);\n    if (e.target.closest(\"#quitter\")) quitter(eq);\n  });\n\n  /* Invitation par pseudo : le joueur invité accepte quelques secondes plus tard (simulé) */\n  function inviter(eq) {\n    const saisie = document.getElementById(\"pseudo-invite\").value.trim();\n    const erreur = document.getElementById(\"erreur-invite\");\n    const connu = [...pseudosConnus()].find((p) => p.toLowerCase() === saisie.toLowerCase());\n    let message = \"\";\n    if (!saisie) message = \"Saisis le pseudo du joueur à inviter.\";\n    else if (!connu || connu === moi) message = \"Aucun autre joueur ne porte le pseudo « \" + saisie + \" ».\";\n    else if (eq.membres.includes(connu) || eq.invitations.includes(connu)) message = connu + \" est déjà dans l'équipe ou déjà invité.\";\n    erreur.textContent = message;\n    document.getElementById(\"champ-invite\").classList.toggle(\"erreur\", !!message);\n    if (message) return;\n\n    enregistrer(Object.assign({}, eq, { invitations: eq.invitations.concat([connu]) }));\n    Nav.toast(\"Invitation envoyée à \" + connu);\n    setTimeout(() => {\n      const actuelle = Esport.equipe(t.id);\n      if (!actuelle || !actuelle.invitations.includes(connu) || actuelle.membres.length >= taille) return;\n      Nav.toast(connu + \" a accepté ton invitation\");\n      enregistrer(Object.assign({}, actuelle, {\n        membres: actuelle.membres.concat([connu]),\n        invitations: actuelle.invitations.filter((p) => p !== connu)\n      }));\n    }, 3500);\n  }\n\n  /* Transmettre le rôle de capitaine à un autre membre (S04-03) */\n  function transmettre(eq) {\n    const autres = eq.membres.filter((p) => p !== moi);\n    Nav.dialogue({\n      titre: \"Nouveau capitaine\",\n      texte: \"Il pourra inviter des joueurs et accepter les demandes. Tu restes membre de l'équipe.\",\n      boutons: autres.map((p) => ({\n        libelle: p,\n        action: () => {\n          enregistrer(Object.assign({}, eq, { capitaine: p }));\n          Nav.toast(p + \" est maintenant capitaine\");\n        }\n      })).concat([{ libelle: \"Annuler\", primaire: true }])\n    });\n  }\n\n  /* Quitter l'équipe ; un capitaine qui part sans transmettre laisse le rôle au plus ancien membre */\n  function quitter(eq) {\n    const restants = eq.membres.filter((p) => p !== moi);\n    const successeur = eq.capitaine === moi && restants.length ? restants[0] : null;\n    const inscrite = eq.membres.length >= taille;\n    Nav.dialogue({\n      titre: \"Quitter \" + eq.nom + \" ?\",\n      texte: (successeur ? \"Le rôle de capitaine passera à \" + successeur + \", le membre le plus ancien. \" : \"\") +\n        (inscrite ? \"L'équipe ne sera plus complète et perdra sa place si elle n'est pas complétée avant la clôture.\" : \"Tu ne seras plus inscrit à ce tournoi.\"),\n      boutons: [\n        { libelle: \"Quitter l'équipe\", primaire: true, action: () => {\n          Esport.changerEquipe(t.id, null);\n          Esport.changerInscription(t.id, null);\n          Nav.aller(\"06\", null, { id: t.id, message: \"equipe-quittee\" });\n        } },\n        { libelle: \"Annuler\" }\n      ]\n    });\n  }\n\n  Esport.monter(rendre);\n\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    if (Nav.param(\"message\") === \"creee\") Nav.toast(\"Équipe créée : tu en es le capitaine\");\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","11-match.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 11 — Salle de match (quart de finale du Défi eFootball, t05).\n     US : S06-02 (convocation, compte à rebours, « Je suis présent » de -10 min au début, rappel à -5 min,\n     le match démarre dès que les deux joueurs sont présents), S06-03 (forfait : motif et heure ;\n     double absence : les deux éliminés, adversaire suivant qualifié d'office), S06-01 (progression automatique).\n     Démo : le temps défile 30 fois plus vite (voir Esport.horloge). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Salle de match\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .salle { margin-top: 0; }\n    .salle h2 { margin-bottom: var(--space-4); }\n    .presence { display: block; margin-top: var(--space-1); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); color: var(--color-text-muted); }\n    .presence.ok { color: var(--color-success); font-weight: var(--font-weight-bold); }\n    .bloc-rebours { text-align: center; padding: var(--space-6) var(--page-gutter) var(--space-4); }\n    .horloge-demo { font-size: var(--font-size-xs); color: var(--color-text-muted); text-align: center; padding: 0 var(--page-gutter); }\n    .issue { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-6) var(--page-gutter) var(--space-4); }\n    .issue .pictogramme { width: 72px; height: 72px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; background: var(--color-primary-soft); margin-bottom: var(--space-4); }\n    .issue .pictogramme svg { width: 36px; height: 36px; }\n    .issue .pictogramme.succes { background: var(--color-success-dark); }\n    .issue h3 { font-size: var(--font-size-xl); margin-bottom: var(--space-2); }\n    .issue p { color: var(--color-text-secondary); }\n    .details { margin: 0 var(--page-gutter) var(--space-4); }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Salle de match\" data-repli=\"05\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const c = DONNEES.monMatch;\n  const t = Esport.tournoi(c.tournoi);\n  const moi = DONNEES.joueur.pseudo;\n  const tour = DONNEES.arbres[c.tournoi].tours[c.tour];\n  const debut = new Date(c.debut);\n  const convocation = Esport.plus(c.debut, -c.convocation);\n  const ouverture = Esport.plus(c.debut, -c.ouverturePresence);\n  const rappel = Esport.plus(c.debut, -c.rappel);\n  const presenceAdversaire = new Date(c.presenceAdversaire);\n\n  /* ---- États de démo : on repart d'un match neuf puis on force l'issue ---- */\n  function matchNeuf() {\n    Etat.set(\"monMatch\", {});\n    const resultats = Object.assign({}, Esport.resultatsMatchs());\n    delete resultats[Esport.cleMonMatch()];\n    Etat.set(\"matchs\", resultats);\n  }\n  const scenario = Esport.lireScenario();\n  if ([\"forfait-adverse\", \"mon-forfait\", \"double-absence\"].includes(scenario)) {\n    matchNeuf();\n    Esport.regleHorloge(\"2026-10-09T21:25\");\n    // Présences de la démo : l'issue tombe à 21:30, dans une dizaine de secondes\n    Esport.majMonMatch({\n      presenceMoi: scenario === \"forfait-adverse\" ? \"21:21\" : null,\n      adversaireAbsent: scenario !== \"mon-forfait\",\n      adversaireVu: true,\n      rappelVu: true\n    });\n  } else {\n    Esport.demarrerHorloge();\n  }\n\n  /* L'adversaire a-t-il confirmé ? (par défaut à 21:23) */\n  function adversairePresent(mm, maintenant) {\n    return !mm.adversaireAbsent && maintenant >= presenceAdversaire;\n  }\n\n  /* ---- Évolution du match avec l'heure (appelée chaque seconde) ---- */\n  function evaluer() {\n    const mm = Esport.monMatch();\n    const maintenant = Esport.horloge();\n    if (mm.issue) return;\n\n    // L'adversaire confirme : on le signale une fois\n    if (adversairePresent(mm, maintenant) && !mm.adversaireVu) {\n      Esport.majMonMatch({ adversaireVu: true });\n      Nav.toast(c.adversaire + \" a confirmé sa présence\");\n      return;\n    }\n    // Les deux sont présents : le match démarre sans attendre l'heure (S06-02)\n    if (mm.presenceMoi && adversairePresent(mm, maintenant)) {\n      Esport.majMonMatch({ issue: \"demarre\", demarrage: Esport.hhmm(maintenant), demarrageIso: maintenant.toISOString() });\n      Nav.toast(\"Le match démarre !\");\n      return;\n    }\n    // Rappel 5 minutes avant le début si je n'ai pas confirmé\n    if (!mm.presenceMoi && maintenant >= rappel && maintenant \u003c debut && !mm.rappelVu) {\n      Esport.majMonMatch({ rappelVu: true });\n      Esport.notifier({ famille: \"match-en-cours\", ecran: \"11\", titre: \"Rappel : ton match commence dans 5 min\",\n        texte: \"Confirme ta présence avant \" + Esport.hhmm(debut) + \", sinon tu seras déclaré forfait.\" });\n      Nav.toast(\"Rappel : confirme ta présence, le match commence dans 5 min\");\n      return;\n    }\n    // Heure du début : forfait ou double absence (S06-03)\n    if (maintenant >= debut) {\n      const moiPresent = !!mm.presenceMoi;\n      const advPresent = adversairePresent(mm, maintenant);\n      const issue = moiPresent && !advPresent ? \"forfait-adverse\" : !moiPresent && advPresent ? \"mon-forfait\" : \"double-absence\";\n      // L'issue d'abord (chaque enregistrement relance l'affichage), puis le résultat dans l'arbre\n      Esport.majMonMatch({ issue });\n      const avis = {\n        \"forfait-adverse\": [\"Qualifié : forfait de \" + c.adversaire, c.adversaire + \" n'a pas confirmé sa présence. Tu passes au tour suivant.\"],\n        \"mon-forfait\": [\"Tu es déclaré forfait\", \"Présence non confirmée avant \" + Esport.hhmm(debut) + \". \" + c.adversaire + \" passe au tour suivant.\"],\n        \"double-absence\": [\"Éliminé : double absence\", \"Ni toi ni \" + c.adversaire + \" n'avez confirmé votre présence.\"]\n      }[issue];\n      Esport.notifier({ famille: \"match\", ecran: \"12\", params: { id: t.id }, titre: avis[0], texte: avis[1] });\n      if (issue === \"forfait-adverse\") Esport.enregistrerMonResultat(null, null, \"Forfait\", moi);\n      else if (issue === \"mon-forfait\") Esport.enregistrerMonResultat(null, null, \"Forfait\", c.adversaire);\n      else Esport.enregistrerResultat(Esport.cleMonMatch(), { a: null, b: null, vainqueur: null, mention: \"Double absence\" });\n    }\n  }\n\n  /* ---- Affichage ---- */\n  function duel(mm, maintenant) {\n    const moiAffiche = Esport.pseudo();\n    const statut = (ok, texte) => '\u003cspan class=\"presence' + (ok ? \" ok\" : \"\") + '\">' + texte + \"\u003c/span>\";\n    return '\u003cdiv class=\"carte-match salle\">\u003cspan class=\"flamme\">\u003c/span>' +\n      '\u003cp class=\"surtitre\">' + tour + \" · aujourd'hui à \" + Esport.hhmm(debut) + \"\u003c/p>\u003ch2>\" + t.nom + \"\u003c/h2>\" +\n      '\u003cdiv class=\"duel\">' +\n      '\u003cspan class=\"joueur\">\u003cspan class=\"avatar avatar-moi\">' + moiAffiche[0] + \"\u003c/span>\" + moiAffiche +\n      statut(!!mm.presenceMoi, mm.presenceMoi ? \"Présent à \" + mm.presenceMoi : \"Pas encore confirmé\") + \"\u003c/span>\" +\n      '\u003cspan class=\"vs\">VS\u003c/span>' +\n      '\u003ca href=\"#\" class=\"joueur\" data-ecran=\"17\" data-pseudo=\"' + c.adversaire + '\">\u003cspan class=\"avatar\">' + c.adversaire[0] + \"\u003c/span>\" + c.adversaire +\n      statut(adversairePresent(mm, maintenant), adversairePresent(mm, maintenant) ? \"Présent à \" + Esport.hhmm(presenceAdversaire) : \"Pas encore confirmé\") + \"\u003c/a>\" +\n      \"\u003c/div>\u003c/div>\";\n  }\n\n  function issueHtml(picto, succes, titre, texte) {\n    return '\u003cdiv class=\"issue\">\u003cspan class=\"pictogramme' + (succes ? \" succes\" : \"\") + '\">' + picto + \"\u003c/span>\u003ch3>\" + titre + \"\u003c/h3>\u003cp>\" + texte + \"\u003c/p>\u003c/div>\";\n  }\n\n  function rendre() {\n    evaluer();\n    const mm = Esport.monMatch();\n    const maintenant = Esport.horloge();\n    const zone = document.getElementById(\"action\");\n    const voirArbre = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir l\\'arbre\u003c/a>';\n    let html = duel(mm, maintenant);\n    let action = \"\";\n\n    switch (mm.issue) {\n      case \"demarre\": {\n        const fin = Esport.plus(mm.demarrageIso, c.duree);\n        html += issueHtml(Esport.icone(\"manette\", \"f-white\"), true, \"Le match a démarré à \" + mm.demarrage,\n          \"Lance la partie dans eFootball avec \" + c.adversaire + \". À la fin, déclarez tous les deux le score.\");\n        html += '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\" data-rebours=\"' + fin.toISOString() + '\">' + Esport.rebours(fin) + \"\u003c/div>\" +\n          '\u003cp class=\"rebours-legende\">avant la fin prévue (' + Esport.hhmm(fin) + \")\u003c/p>\u003c/div>\";\n        if (mm.statut === \"litige\") action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"15\">Voir le litige\u003c/a>';\n        else if (mm.statut) action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"14\">Voir le résultat\u003c/a>';\n        else action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"14\">Déclarer le résultat\u003c/a>';\n        action += voirArbre;\n        break;\n      }\n      case \"forfait-adverse\":\n        html += issueHtml(Esport.icone(\"coche\", \"f-white\"), true, \"Victoire par forfait\",\n          c.adversaire + \" n'a pas confirmé sa présence avant \" + Esport.hhmm(debut) + \". Tu passes au tour suivant.\");\n        action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir l\\'arbre\u003c/a>' +\n          '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"05\">Mes matchs\u003c/a>';\n        break;\n      case \"mon-forfait\":\n        html += issueHtml(Esport.icone(\"alerte\", \"f-primary\"), false, \"Tu es déclaré forfait\",\n          \"Motif : présence non confirmée avant le début du match. Heure : \" + Esport.hhmm(debut) + \". \" + c.adversaire + \" passe au tour suivant.\");\n        html += '\u003cdiv class=\"encart details\">' + Esport.icone(\"calendrier\", \"f-text\") +\n          \"\u003cdiv>\u003cstrong>1 forfait sur les 30 derniers jours\u003c/strong>\u003cp>Au 3e forfait en 30 jours, tes inscriptions seront bloquées pendant 7 jours.\u003c/p>\u003c/div>\u003c/div>\";\n        action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"04\">Trouver un autre tournoi\u003c/a>' + voirArbre;\n        break;\n      case \"double-absence\":\n        html += issueHtml(Esport.icone(\"alerte\", \"f-primary\"), false, \"Match annulé : double absence\",\n          \"Ni toi ni \" + c.adversaire + \" n'avez confirmé votre présence avant \" + Esport.hhmm(debut) +\n          \". Vous êtes tous les deux éliminés ; ton adversaire prévu au tour suivant est qualifié d'office.\");\n        action = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"04\">Trouver un autre tournoi\u003c/a>' + voirArbre;\n        break;\n      default: {\n        // Avant le début : compte à rebours et confirmation de présence\n        const ouverte = maintenant >= ouverture;\n        html += '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\" data-rebours=\"' + debut.toISOString() + '\">' + Esport.rebours(debut) + \"\u003c/div>\" +\n          '\u003cp class=\"rebours-legende\">avant le début du match · convoqué à ' + Esport.hhmm(convocation) + \"\u003c/p>\u003c/div>\";\n        if (!mm.presenceMoi && maintenant >= rappel) {\n          html += '\u003cdiv class=\"encart encart-alerte details\" role=\"alert\">' + Esport.icone(\"alerte\", \"f-primary\") +\n            \"\u003cdiv>\u003cstrong>Confirme ta présence\u003c/strong>\u003cp>Sans confirmation avant \" + Esport.hhmm(debut) + \", tu seras déclaré forfait.\u003c/p>\u003c/div>\u003c/div>\";\n        }\n        if (mm.presenceMoi) {\n          html += '\u003cdiv class=\"encart details\">' + Esport.icone(\"coche\", \"f-success-dark\") +\n            \"\u003cdiv>\u003cstrong>Présence confirmée à \" + mm.presenceMoi + \"\u003c/strong>\u003cp>Le match démarre dès que \" + c.adversaire + \" confirme à son tour.\u003c/p>\u003c/div>\u003c/div>\";\n          action = voirArbre;\n        } else {\n          action = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"present\"' + (ouverte ? \"\" : \" disabled\") + \">Je suis présent\u003c/button>\" +\n            '\u003cp class=\"aide-action\">' + (ouverte ? \"Ouvert jusqu'à \" + Esport.hhmm(debut) : \"Disponible de \" + Esport.hhmm(ouverture) + \" à \" + Esport.hhmm(debut)) + \"\u003c/p>\";\n        }\n      }\n    }\n    html += '\u003cp class=\"horloge-demo\">Démo : il est ' + Esport.hhmm(maintenant) + \", le temps défile 30 fois plus vite.\u003c/p>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n    if (zone.innerHTML !== action) zone.innerHTML = action;\n  }\n\n  /* « Je suis présent » : actif de -10 min au début */\n  document.getElementById(\"action\").addEventListener(\"click\", (e) => {\n    if (!e.target.closest(\"#present\")) return;\n    const maintenant = Esport.horloge();\n    if (maintenant \u003c ouverture || maintenant >= debut) return;\n    Esport.majMonMatch({ presenceMoi: Esport.hhmm(maintenant) });\n    Nav.toast(\"Présence confirmée\");\n  });\n\n  Esport.monter(rendre);\n  setInterval(rendre, 1000);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","12-arbre.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 12 — Arbre, poules et classement d'un tournoi (12-arbre.html?id=t05).\n     US : S05-03 (consultable par tous, mise à jour sans rechargement), S02-02 (élimination simple),\n     S02-03 (poules, barème, qualifiés), S06-01 (le vainqueur passe seul au tour suivant),\n     S06-04 (critère de départage affiché), S05-04 (classement : 100 premiers puis ma position,\n     mis à jour en direct, recalculé après arbitrage).\n     Exemples : t05 élimination à 16 en cours · t03 poules en cours · t10 terminé (128 joueurs). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Arbre du tournoi\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .sous-entete { padding: 0 var(--page-gutter) var(--space-3); display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .sous-entete .lien-tournoi { margin-left: auto; color: var(--color-primary); font-weight: var(--font-weight-bold); min-height: var(--touch-target); display: inline-flex; align-items: center; }\n    .maj { display: inline-flex; align-items: center; gap: var(--space-1); }\n    .maj i { width: 8px; height: 8px; border-radius: var(--radius-round); background: var(--color-success); }\n    .maj.flash i { background: var(--color-primary); }\n    .encart-recalcul { margin-top: var(--space-3); }\n    .panneau { padding-top: var(--space-4); }\n\n    /* ---- Arbre à élimination : une colonne par tour, défilement horizontal ---- */\n    .arbre { display: flex; gap: var(--space-3); overflow-x: auto; padding: 0 var(--page-gutter) var(--space-4); scrollbar-width: none; }\n    .arbre::-webkit-scrollbar { display: none; }\n    .tour { width: 168px; flex-shrink: 0; display: flex; flex-direction: column; }\n    .tour h3 { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); margin-bottom: var(--space-2); }\n    .tour .matchs { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: var(--space-2); }\n    .match { background: var(--color-surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-card); overflow: hidden; font-size: var(--font-size-sm); transition: box-shadow .3s; }\n    .match .j { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: 32px; padding: 0 var(--space-3); }\n    .match .j + .j { border-top: 1px solid var(--color-border); }\n    .match .j .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n    .match .j.gagnant { font-weight: var(--font-weight-bold); }\n    .match .j.perdant { color: var(--color-text-muted); }\n    .match .j.a-venir { color: var(--color-text-muted); font-style: italic; }\n    .match .j.moi .nom { color: var(--color-primary); }\n    .match .score { font-weight: var(--font-weight-bold); }\n    .match .etiquette-match { display: flex; align-items: center; justify-content: space-between; padding: var(--space-1) var(--space-3); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); background: var(--color-primary-soft); color: var(--color-primary); }\n    .match .etiquette-direct { background: var(--color-surface); color: var(--color-alert); }\n    .match.mien { box-shadow: 0 0 0 2px var(--color-primary); }\n    .match.vient-de-finir { box-shadow: 0 0 0 2px var(--color-success); }\n    .match .mention-match { padding: var(--space-1) var(--space-3); font-size: var(--font-size-xs); color: var(--color-text-secondary); border-top: 1px solid var(--color-border); }\n    .legende { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: 0 var(--page-gutter); }\n\n    /* ---- Poules ---- */\n    .bareme { margin-bottom: var(--space-4); }\n    .poule { margin: 0 var(--page-gutter) var(--space-4); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-3) 0 var(--space-1); }\n    .poule h3 { font-size: var(--font-size-md); padding: 0 var(--space-4) var(--space-2); }\n\n    /* ---- Tableaux (poules et classement) ---- */\n    .tableau { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }\n    .tableau th { font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); color: var(--color-text-muted); text-align: right; padding: var(--space-1) var(--space-2); }\n    .tableau td { text-align: right; padding: var(--space-2); border-top: 1px solid var(--color-border); }\n    .tableau th:first-child, .tableau td:first-child { padding-left: var(--space-4); width: 40px; text-align: left; }\n    .tableau th:nth-child(2), .tableau td:nth-child(2) { text-align: left; }\n    .tableau th:last-child, .tableau td:last-child { padding-right: var(--space-4); }\n    .tableau td.joueur a { font-weight: var(--font-weight-bold); }\n    .tableau td.joueur small { display: block; font-size: var(--font-size-xs); color: var(--color-primary); font-weight: var(--font-weight-medium); }\n    .tableau tr.qualifie td:first-child { box-shadow: inset 3px 0 0 var(--color-success); }\n    .tableau tr.moi td { background: var(--color-primary-soft); }\n    .tableau tr.moi td.joueur a { color: var(--color-primary); }\n    .tableau tr.coupure td { text-align: center; color: var(--color-text-muted); border-top: 0; padding: var(--space-1); }\n    .tableau .pts { font-weight: var(--font-weight-bold); }\n    .puce-qualifie { color: var(--color-success-dark); font-weight: var(--font-weight-bold); font-size: var(--font-size-xs); }\n    .classement-carte { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-1) 0; }\n    /* Ma position épinglée sous le top 100 (S05-04) */\n    .ma-position { position: sticky; bottom: 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Arbre\" data-repli=\"06\">\u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"sous-entete\" id=\"sous-entete\">\u003c/div>\n      \u003cdiv class=\"onglets\" role=\"tablist\" id=\"onglets\">\u003c/div>\n      \u003cdiv class=\"panneau\" id=\"panneau\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"04\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(\"t05\");\n\n  const poules = DONNEES.poules[t.id];\n  document.querySelector(\".entete-esport\").dataset.titre = t.nom;\n  document.title = t.nom;\n\n  // Arbre avec les résultats de la démo (mon match, forfaits, arbitrage) ;\n  // le résultat « en direct » y est ajouté pendant la consultation\n  let arbre = Esport.arbre(t.id);\n  let derniereMaj = \"il y a quelques secondes\";\n  let matchQuiVientDeFinir = null;\n\n  /* Pseudo affiché : mon ancien pseudo est remplacé par le pseudo courant (S01-02) */\n  function nomAffiche(pseudo) {\n    return pseudo === DONNEES.joueur.pseudo ? Esport.pseudo() : pseudo;\n  }\n  function estMoi(pseudo) { return pseudo === DONNEES.joueur.pseudo; }\n\n  /* ---------- Élimination : vainqueurs et progression automatique (S06-01), voir esport.js ---------- */\n  const vainqueur = Esport.vainqueur;\n  function propager() { Esport.propager(arbre); }\n\n  function ligneJoueur(m, cote) {\n    const pseudo = m[cote];\n    const score = m[2 + cote];\n    const gagnant = vainqueur(m);\n    if (!pseudo) return '\u003cdiv class=\"j a-venir\">\u003cspan class=\"nom\">À déterminer\u003c/span>\u003c/div>';\n    const classe = gagnant ? (gagnant === pseudo ? \"gagnant\" : \"perdant\") : \"\";\n    return '\u003cdiv class=\"j ' + classe + (estMoi(pseudo) ? \" moi\" : \"\") + '\">' +\n      '\u003ca href=\"#\" class=\"nom\" data-ecran=\"17\" data-pseudo=\"' + nomAffiche(pseudo) + '\">' + nomAffiche(pseudo) + \"\u003c/a>\" +\n      '\u003cspan class=\"score\">' + (score === null ? \"\" : score) + \"\u003c/span>\u003c/div>\";\n  }\n\n  function libelleMention(m) {\n    if (m[6] === \"Forfait\") return \"Forfait de \" + nomAffiche(m[0] === m[4] ? m[1] : m[0]) + \" : \" + nomAffiche(m[4]) + \" qualifié\";\n    if (m[6] === \"Double absence\") return \"Double absence : les deux joueurs sont éliminés\";\n    if (m[6] === \"Aucune déclaration\") return \"Aucun résultat déclaré : les deux joueurs sont éliminés\";\n    if (m[6] === \"Qualifié d'office\") return nomAffiche(m[4]) + \" qualifié d'office\";\n    if (m[6] === \"Arbitrage\") return \"Résultat fixé par arbitrage\";\n    return m[6];\n  }\n\n  function rendreArbre() {\n    propager();\n    // Hauteur commune : celle du premier tour, pour aligner les tours suivants\n    const hauteur = arbre.matchs[0].length * 76;\n    let html = '\u003cdiv class=\"arbre\">';\n    arbre.matchs.forEach((tourMatchs, r) => {\n      html += '\u003cdiv class=\"tour\">\u003ch3>' + arbre.tours[r] + '\u003c/h3>\u003cdiv class=\"matchs\" style=\"height:' + hauteur + 'px\">';\n      tourMatchs.forEach((m, i) => {\n        // Mon match : celui où je joue et qui n'a pas encore de vainqueur\n        const mien = (estMoi(m[0]) || estMoi(m[1])) && !vainqueur(m) && !Esport.doubleElimination(m);\n        const direct = m[5] === \"en-direct\";\n        const finit = matchQuiVientDeFinir === r + \"-\" + i;\n        html += '\u003cdiv class=\"match' + (mien ? \" mien\" : \"\") + (finit ? \" vient-de-finir\" : \"\") + '\">';\n        if (mien && m[5] === \"a-jouer\") {\n          html += '\u003ca href=\"#\" class=\"etiquette-match\" data-ecran=\"11\">Ton match · ' + arbre.monMatch + \" \u003cspan>Salle de match ›\u003c/span>\u003c/a>\";\n        } else if (mien) {\n          html += '\u003cdiv class=\"etiquette-match\">Ton prochain match · horaire à venir\u003c/div>';\n        } else if (direct) {\n          html += '\u003cdiv class=\"etiquette-match etiquette-direct\">\u003cspan class=\"puce-direct puce-etat\">\u003ci>\u003c/i>En direct\u003c/span>\u003c/div>';\n        }\n        html += ligneJoueur(m, 0) + ligneJoueur(m, 1);\n        // Forfait, double absence, qualification d'office, arbitrage (S06-03, S07-03)\n        if (m[6]) html += '\u003cdiv class=\"mention-match\">' + libelleMention(m) + \"\u003c/div>\";\n        html += \"\u003c/div>\";\n      });\n      html += \"\u003c/div>\u003c/div>\";\n    });\n    html += \"\u003c/div>\";\n    html += '\u003cp class=\"legende\">Touchez un pseudo pour voir le profil public du joueur. Le vainqueur de chaque match passe automatiquement au tour suivant.\u003c/p>';\n    return html;\n  }\n\n  /* ---------- Poules (S02-03, S06-04) ---------- */\n  function rendrePoules() {\n    let html = '\u003cdiv class=\"encart bareme\">' + Esport.icone(\"trophee\", \"f-primary\") +\n      \"\u003cdiv>\u003cstrong>Barème et qualification\u003c/strong>\" +\n      \"\u003cp>Victoire 3 pts · nul 1 · défaite 0. Les 2 premiers de chaque poule vont en phase finale.\u003c/p>\" +\n      \"\u003cp>Égalité : confrontation directe, puis différence de buts, puis nombre de victoires, puis tirage au sort.\u003c/p>\u003c/div>\u003c/div>\";\n    poules.forEach((p) => {\n      html += '\u003csection class=\"poule\">\u003ch3>' + p.nom + \"\u003c/h3>\" +\n        '\u003ctable class=\"tableau\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Joueur\u003c/th>\u003cth>J\u003c/th>\u003cth>Diff.\u003c/th>\u003cth>Pts\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n      p.joueurs.forEach((j, i) => {\n        html += '\u003ctr class=\"' + (i \u003c 2 ? \"qualifie\" : \"\") + '\">' +\n          \"\u003ctd>\" + (i + 1) + \"\u003c/td>\" +\n          '\u003ctd class=\"joueur\">\u003ca href=\"#\" data-ecran=\"17\" data-pseudo=\"' + j.pseudo + '\">' + j.pseudo + \"\u003c/a>\" +\n          (j.critere ? \"\u003csmall>Départagé : \" + j.critere.toLowerCase() + \"\u003c/small>\" : \"\") + \"\u003c/td>\" +\n          \"\u003ctd>\" + j.j + \"\u003c/td>\u003ctd>\" + (j.diff > 0 ? \"+\" : \"\") + j.diff + '\u003c/td>\u003ctd class=\"pts\">' + j.pts + \"\u003c/td>\u003c/tr>\";\n      });\n      html += \"\u003c/tbody>\u003c/table>\u003c/section>\";\n    });\n    html += '\u003cp class=\"legende\">\u003cspan class=\"puce-qualifie\">▌\u003c/span> Qualifié pour la phase finale à élimination directe.\u003c/p>';\n    return html;\n  }\n\n  /* ---------- Classement du tournoi (S05-04) ---------- */\n\n  /* Élimination en cours : place selon le tour d'élimination, « En lice » sinon */\n  function classementElimination() {\n    const nbTours = arbre.matchs.length;\n    const lignes = [];\n    arbre.matchs[0].forEach((m) => { lignes.push({ pseudo: m[0] }); lignes.push({ pseudo: m[1] }); });\n    lignes.forEach((l) => {\n      l.place = null;\n      arbre.matchs.forEach((tourMatchs, r) => {\n        tourMatchs.forEach((m) => {\n          const g = vainqueur(m);\n          const joue = m[0] === l.pseudo || m[1] === l.pseudo;\n          if (joue && ((g && g !== l.pseudo) || Esport.doubleElimination(m))) l.place = Math.pow(2, nbTours - 1 - r) + 1;\n          if (g === l.pseudo && r === nbTours - 1) l.place = 1;\n        });\n      });\n    });\n    lignes.sort((a, b) => (a.place || 0) - (b.place || 0) || a.pseudo.localeCompare(b.pseudo));\n    return lignes.map((l) => ({\n      rang: l.place ? l.place + (l.place === 1 ? \"er\" : \"e\") : \"—\",\n      pseudo: l.pseudo,\n      valeur: l.place ? \"Éliminé\" : \"En lice\"\n    }));\n  }\n\n  /* Tournoi terminé à 128 joueurs : points cumulés, rang unique ; je suis 117e */\n  function classementTermine() {\n    const noms = [];\n    const suffixes = [\"\", \"_2\", \"7\", \".MA\", \"_212\", \"X\"];\n    for (let i = 0; noms.length \u003c 127; i++) {\n      noms.push(DONNEES.pseudosClassement[i % DONNEES.pseudosClassement.length] + suffixes[Math.floor(i / DONNEES.pseudosClassement.length)]);\n    }\n    noms.splice(116, 0, DONNEES.joueur.pseudo);\n    return noms.map((pseudo, i) => ({ rang: i + 1 + (i ? \"e\" : \"er\"), pseudo, valeur: (2480 - i * 17 - (i % 3) * 3) + \" pts\" }));\n  }\n\n  /* Poules : tous les joueurs, aux points puis à la différence */\n  function classementPoules() {\n    const tous = [];\n    poules.forEach((p) => p.joueurs.forEach((j) => tous.push(j)));\n    tous.sort((a, b) => b.pts - a.pts || b.diff - a.diff);\n    return tous.map((j, i) => ({ rang: i + 1 + (i ? \"e\" : \"er\"), pseudo: j.pseudo, valeur: j.pts + \" pts\" }));\n  }\n\n  function rendreClassement() {\n    const lignes = poules ? classementPoules() : (t.etat === \"termine\" ? classementTermine() : classementElimination());\n    const LIMITE = 100;\n    let html = \"\";\n    const recalcul = t.recalcul || (Esport.recalculeApresArbitrage(t.id) ? \"Classement recalculé après la décision d'arbitrage du quart de finale.\" : \"\");\n    if (recalcul) html += '\u003cdiv class=\"encart encart-recalcul\" style=\"margin-bottom:var(--space-4)\">' + Esport.icone(\"alerte\", \"f-primary\") + \"\u003cdiv>\u003cp>\" + recalcul + \"\u003c/p>\u003c/div>\u003c/div>\";\n    html += '\u003cdiv class=\"classement-carte\">\u003ctable class=\"tableau\">\u003cthead>\u003ctr>\u003cth>Rang\u003c/th>\u003cth>Joueur\u003c/th>\u003cth>' +\n      (poules || t.etat === \"termine\" ? \"Points\" : \"Statut\") + \"\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\";\n    const ligneHtml = (l, classe) =>\n      '\u003ctr class=\"' + (estMoi(l.pseudo) ? \"moi \" : \"\") + (classe || \"\") + '\">\u003ctd>' + l.rang + \"\u003c/td>\" +\n      '\u003ctd class=\"joueur\">\u003ca href=\"#\" data-ecran=\"17\" data-pseudo=\"' + nomAffiche(l.pseudo) + '\">' + nomAffiche(l.pseudo) + (estMoi(l.pseudo) ? \" (toi)\" : \"\") + \"\u003c/a>\u003c/td>\" +\n      '\u003ctd class=\"pts\">' + l.valeur + \"\u003c/td>\u003c/tr>\";\n    lignes.slice(0, LIMITE).forEach((l) => { html += ligneHtml(l); });\n    // Au-delà du top 100 : seule ma position est affichée, épinglée\n    const maLigne = lignes.findIndex((l) => estMoi(l.pseudo));\n    if (maLigne >= LIMITE) {\n      html += '\u003ctr class=\"coupure\">\u003ctd colspan=\"3\">· · ·\u003c/td>\u003c/tr>' + ligneHtml(lignes[maLigne], \"ma-position\");\n    }\n    html += \"\u003c/tbody>\u003c/table>\u003c/div>\";\n    html += '\u003cp class=\"legende\" style=\"margin-top:var(--space-3)\">' + (lignes.length > LIMITE\n      ? \"Les 100 premiers sur \" + lignes.length + \" joueurs, puis ta position.\"\n      : lignes.length + \" joueurs.\") + \" Recalculé après chaque décision d'arbitrage.\u003c/p>\";\n    return html;\n  }\n\n  /* ---------- Onglets ---------- */\n  const ONGLETS = [];\n  if (poules) ONGLETS.push({ id: \"poules\", libelle: \"Poules\", rendre: rendrePoules });\n  if (arbre) ONGLETS.push({ id: \"arbre\", libelle: t.etat === \"termine\" ? \"Phase finale\" : \"Arbre\", rendre: rendreArbre });\n  if (poules || arbre) ONGLETS.push({ id: \"classement\", libelle: \"Classement\", rendre: rendreClassement });\n  let ongletActif = ONGLETS.length ? ONGLETS[0].id : null;\n\n  function rendreSousEntete() {\n    const statut = t.etat === \"termine\"\n      ? \"Tournoi terminé · classement final\"\n      : '\u003cspan class=\"maj\" id=\"maj\">\u003ci>\u003c/i>Mis à jour ' + derniereMaj + \"\u003c/span>\";\n    document.getElementById(\"sous-entete\").innerHTML = statut +\n      '\u003ca href=\"#\" class=\"lien-tournoi\" data-ecran=\"06\" data-id=\"' + t.id + '\">Fiche\u003c/a>';\n  }\n\n  function rendre() {\n    rendreSousEntete();\n    if (!ONGLETS.length) {\n      // Tournoi sans arbre : il est généré à la clôture des inscriptions (S02-02)\n      document.getElementById(\"onglets\").style.display = \"none\";\n      document.getElementById(\"panneau\").innerHTML = '\u003cdiv class=\"vide\">\u003cstrong>Arbre pas encore généré\u003c/strong>' +\n        \"Il sera publié à la clôture des inscriptions, le \" + Esport.jourCourt(t.cloture) + \".\u003cbr>\" +\n        '\u003ca href=\"#\" class=\"bouton bouton-secondaire\" data-ecran=\"06\" data-id=\"' + t.id + '\">Retour au tournoi\u003c/a>\u003c/div>';\n      return;\n    }\n    document.getElementById(\"onglets\").innerHTML = ONGLETS.map((o) =>\n      '\u003cbutton role=\"tab\" data-onglet=\"' + o.id + '\" aria-selected=\"' + (o.id === ongletActif) + '\" class=\"' + (o.id === ongletActif ? \"actif\" : \"\") + '\">' + o.libelle + \"\u003c/button>\"\n    ).join(\"\");\n    document.getElementById(\"panneau\").innerHTML = ONGLETS.find((o) => o.id === ongletActif).rendre();\n  }\n\n  document.getElementById(\"onglets\").addEventListener(\"click\", (e) => {\n    const bouton = e.target.closest(\"[data-onglet]\");\n    if (!bouton) return;\n    ongletActif = bouton.dataset.onglet;\n    rendre();\n  });\n\n  // L'arbre suit l'état mémorisé (résultats de la démo) à chaque changement\n  Esport.monter(() => { arbre = Esport.arbre(t.id); rendre(); });\n\n  /* ---------- Résultat qui arrive pendant la démo (S05-03, S06-01) ----------\n     Après quelques secondes, le quart « en direct » se termine : l'arbre et le classement\n     se mettent à jour sans rechargement, le vainqueur passe au tour suivant. */\n  const live = arbre && arbre.resultatLive;\n  const cleLive = live ? t.id + \"-\" + live.tour + \"-\" + live.match : null;\n  if (live && t.etat === \"en-cours\" && !Esport.resultatsMatchs()[cleLive]) {\n    setTimeout(() => {\n      // Le résultat est enregistré : il reste visible ensuite sur tous les écrans\n      matchQuiVientDeFinir = live.tour + \"-\" + live.match;\n      derniereMaj = \"à l'instant\";\n      Esport.enregistrerResultat(cleLive, { a: live.scoreA, b: live.scoreB, vainqueur: null, mention: null });\n      const m = arbre.matchs[live.tour][live.match];\n      const r = live;\n      document.getElementById(\"maj\").classList.add(\"flash\");\n      Nav.toast(\"Résultat : \" + m[0] + \" \" + r.scoreA + \"–\" + r.scoreB + \" \" + m[1] + \". \" + vainqueur(m) + \" passe en demi-finale.\");\n      setTimeout(() => { derniereMaj = \"il y a quelques secondes\"; matchQuiVientDeFinir = null; rendre(); }, 8000);\n    }, 4000);\n  }\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","13-jeu.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 13 — Page d'un jeu (13-jeu.html?id=freefire).\n     US : S05-05 (tournois à venir et en cours, classement, articles, vidéos, directs ;\n     lien vers la boutique Max it avec les offres du pays en monnaie locale, absent si le jeu n'a pas d'offre). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Jeu\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .hero { position: relative; height: 160px; flex-shrink: 0; }\n    .hero .boutons-hero { position: absolute; top: var(--space-2); left: var(--space-3); right: var(--space-3); display: flex; justify-content: space-between; }\n    .bouton-verre-rond { background: var(--color-glass-dark); }\n\n    .tete { padding: var(--space-4) var(--page-gutter) 0; }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n\n    /* Boutique Max it (S05-05) */\n    .boutique { margin: var(--space-4) var(--page-gutter) 0; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface-warm); }\n    .boutique .titre-boutique { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }\n    .boutique .titre-boutique strong { display: block; }\n    .boutique .titre-boutique small { color: var(--color-text-secondary); font-size: var(--font-size-xs); }\n    .boutique .icone-boutique { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--color-primary); display: flex; align-items: center; justify-content: center; }\n    .boutique .icone-boutique svg { width: 22px; height: 22px; }\n    .offres-jeu { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; margin-bottom: var(--space-4); }\n    .offre-jeu { flex-shrink: 0; background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font-size: var(--font-size-sm); }\n    .offre-jeu b { display: block; color: var(--color-primary); }\n\n    .bloc-liens { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .vide-section { padding: 0 var(--page-gutter); color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"03\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const jeu = Esport.jeu(Nav.param(\"id\")) || Esport.jeu(\"freefire\");\n  document.title = jeu.nom;\n\n  function rendre() {\n    const tournois = Esport.tournoisDuPays().filter((t) => t.jeu === jeu.id);\n    const enCours = tournois.filter((t) => t.etat === \"en-cours\");\n    const aVenir = tournois.filter((t) => t.etat === \"ouvert\" || t.etat === \"complet\").sort((a, b) => a.debut.localeCompare(b.debut));\n    const suivis = tournois.filter((t) => DONNEES.arbres[t.id] || DONNEES.poules[t.id]);\n    const contenus = Esport.contenusVisibles().filter((c) => c.jeu === jeu.id);\n    const offres = jeu.boutique && jeu.boutique[DONNEES.joueur.pays];\n    let html = \"\";\n\n    // Visuel, retour, notifications\n    html += '\u003cdiv class=\"hero\">' + Esport.visuelJeu(jeu.id, \"grand\") +\n      '\u003cdiv class=\"boutons-hero\">' +\n      '\u003cbutton class=\"bouton-icone bouton-verre-rond\" data-action=\"retour\" data-repli=\"03\" aria-label=\"Retour\">' + Esport.icone(\"retour\", \"f-white\") + \"\u003c/button>\" +\n      '\u003cbutton class=\"bouton-icone bouton-verre-rond\" data-ecran=\"25\" aria-label=\"Notifications\">' + Esport.icone(\"cloche\", \"f-white\") + \"\u003c/button>\" +\n      \"\u003c/div>\u003c/div>\";\n    html += '\u003cdiv class=\"tete\">\u003ch1>' + jeu.nom + \"\u003c/h1>\u003cp>\" + jeu.genre + \" · \" +\n      (jeu.equipe > 1 ? \"équipes de \" + jeu.equipe : \"un contre un\") + \"\u003c/p>\u003c/div>\";\n\n    // Boutique Max it : seulement si le jeu a des offres activées dans le pays\n    if (offres && offres.length) {\n      html += '\u003csection class=\"boutique\" aria-label=\"Boutique Max it\">' +\n        '\u003cdiv class=\"titre-boutique\">\u003cspan class=\"icone-boutique\">' + Esport.icone(\"boutique\", \"f-white\") + \"\u003c/span>\" +\n        \"\u003cspan>\u003cstrong>Boutique Max it\u003c/strong>\u003csmall>Achats intégrés \" + jeu.nom + \", payés avec Max it\u003c/small>\u003c/span>\u003c/div>\" +\n        '\u003cdiv class=\"offres-jeu\">' + offres.map((o) => '\u003cspan class=\"offre-jeu\">' + o.libelle + \"\u003cb>\" + Esport.prix(o.prix) + \"\u003c/b>\u003c/span>\").join(\"\") + \"\u003c/div>\" +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-hors=\"La boutique Max it (offres ' + jeu.nom + ')\">Ouvrir la boutique Max it\u003c/a>' +\n        \"\u003c/section>\";\n    }\n\n    // Directs : tournois en cours\n    if (enCours.length) {\n      html += '\u003ch2 class=\"titre-section\">En direct \u003cspan class=\"puce-etat puce-direct\">\u003ci>\u003c/i>' + enCours.length + \"\u003c/span>\u003c/h2>\" +\n        enCours.map(Esport.carteTournoi).join(\"\");\n    }\n\n    // Tournois à venir\n    html += '\u003ch2 class=\"titre-section\">Tournois à venir \u003ca href=\"#\" class=\"voir-tout\" data-ecran=\"04\">Calendrier\u003c/a>\u003c/h2>';\n    html += aVenir.length ? aVenir.map(Esport.carteTournoi).join(\"\") : '\u003cp class=\"vide-section\">Aucun tournoi prévu pour l\\'instant.\u003c/p>';\n\n    // Classements des tournois du jeu\n    if (suivis.length) {\n      html += '\u003ch2 class=\"titre-section\">Classements\u003c/h2>\u003cdiv class=\"bloc-liens\">' + suivis.map((t) =>\n        '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"12\" data-id=\"' + t.id + '\">' + Esport.icone(\"trophee\", \"f-primary\") +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + t.nom + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">' +\n        (t.etat === \"termine\" ? \"Classement final\" : \"En cours · mis à jour en direct\") + \"\u003c/span>\u003c/span>\" +\n        Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\"\n      ).join(\"\") + \"\u003c/div>\";\n    }\n\n    // Articles et vidéos du jeu\n    html += '\u003ch2 class=\"titre-section\">Articles et vidéos \u003ca href=\"#\" class=\"voir-tout\" data-ecran=\"20\">Tout voir\u003c/a>\u003c/h2>';\n    html += contenus.length ? contenus.map(Esport.ligneContenu).join(\"\") : '\u003cp class=\"vide-section\">Pas encore de contenu pour ce jeu.\u003c/p>';\n    html += '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n\n    document.getElementById(\"page\").innerHTML = html;\n  }\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","14-resultat.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 14 — Déclarer le résultat de mon match.\n     US : S07-01 (chaque joueur déclare ; concordance = match clos, le vainqueur progresse ;\n     déclaration ouverte 30 min après la fin prévue ; correction tant que l'adversaire n'a pas déclaré),\n     S07-02 (une seule déclaration à l'échéance : elle est retenue, l'autre joueur a 30 min pour contester),\n     S07-03 (déclarations divergentes : litige ouvert automatiquement, écran 15).\n     Aucune déclaration dans le délai : les deux joueurs sont éliminés, comme en double absence (décision du 2026-10-07).\n     Match nul : refusé en élimination, accepté en poules et en championnat. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Déclarer le résultat\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { padding: 0 var(--page-gutter) var(--space-2); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }\n    .bloc-rebours { text-align: center; padding: var(--space-4) var(--page-gutter); }\n\n    /* Saisie du score : un compteur par joueur */\n    .saisie { display: flex; align-items: center; justify-content: center; gap: var(--space-4); padding: var(--space-4) var(--page-gutter); }\n    .compteur { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); min-width: 0; }\n    .compteur .nom { font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); text-align: center; overflow-wrap: anywhere; }\n    .compteur .valeur { font-size: 48px; font-weight: var(--font-weight-bold); line-height: 1; font-variant-numeric: tabular-nums; }\n    .compteur .boutons { display: flex; gap: var(--space-2); }\n    .compteur button { width: var(--touch-target); height: var(--touch-target); border-radius: var(--radius-round); border: 1px solid var(--color-border-strong); font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); }\n    .tiret { font-size: var(--font-size-xxl); color: var(--color-text-muted); }\n\n    /* Score affiché */\n    .score { display: flex; align-items: center; justify-content: center; gap: var(--space-3); padding: var(--space-4) var(--page-gutter); font-weight: var(--font-weight-bold); }\n    .score .chiffres { font-size: 40px; font-variant-numeric: tabular-nums; }\n    .score .nom { font-size: var(--font-size-sm); flex: 1; min-width: 0; overflow-wrap: anywhere; }\n    .score .nom:first-child { text-align: right; }\n    .issue { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-4) var(--page-gutter) 0; }\n    .issue .pictogramme { width: 72px; height: 72px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; background: var(--color-primary-soft); margin-bottom: var(--space-4); }\n    .issue .pictogramme svg { width: 36px; height: 36px; }\n    .issue .pictogramme.succes { background: var(--color-success-dark); }\n    .issue h2 { font-size: var(--font-size-xl); margin-bottom: var(--space-2); }\n    .issue p { color: var(--color-text-secondary); }\n    .encart { margin-bottom: var(--space-3); }\n    .erreur-saisie { color: var(--color-alert); font-size: var(--font-size-sm); text-align: center; padding: 0 var(--page-gutter); }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Résultat du match\" data-repli=\"11\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const c = DONNEES.monMatch;\n  const t = Esport.tournoi(c.tournoi);\n  const tour = DONNEES.arbres[c.tournoi].tours[c.tour];\n  const moi = DONNEES.joueur.pseudo;\n\n  /* ---- États de démo ---- */\n  const scenario = Esport.lireScenario();\n  // Déclaration de l'adversaire à 21:45 ; délai de déclaration écoulé à 22:08\n  const declAdverse = { moi: 1, adv: 2, heure: \"21:45\" };\n  if (scenario === \"resultat-divergent\") Esport.preparerMatchDemo({ adversaireDiverge: true }, \"2026-10-09T21:40\");\n  if (scenario === \"declaration-adverse\") Esport.preparerMatchDemo({ declAdv: declAdverse, statut: \"retenu-adverse\" }, \"2026-10-09T22:09\");\n  if (scenario === \"sans-declaration\") Esport.preparerMatchDemo({}, \"2026-10-09T22:07\");\n  if (scenario === \"delai-depasse\") Esport.preparerMatchDemo({ declAdv: declAdverse, statut: \"retenu-adverse\", refusMoi: \"22:09\" }, \"2026-10-09T22:09\");\n  Esport.demarrerHorloge();\n\n  // Score en cours de saisie (conservé entre deux affichages)\n  let saisie = { moi: 0, adv: 0 };\n  let erreur = \"\";\n  // Le match nul n'est possible qu'en poules ou en championnat\n  const nulAutorise = [\"poules\", \"championnat\"].includes(t.format);\n\n  function limiteContestation() { return Esport.plus(Esport.limiteDeclaration().toISOString(), c.delaiContestation); }\n\n  /* Score lisible : « Youss_KZ 2 – 1 Rachid_GOAT » */\n  function score(d) {\n    return '\u003cdiv class=\"score\">\u003cspan class=\"nom\">' + Esport.pseudo() + '\u003c/span>\u003cspan class=\"chiffres\">' + d.moi + \" – \" + d.adv +\n      '\u003c/span>\u003cspan class=\"nom\">' + c.adversaire + \"\u003c/span>\u003c/div>\";\n  }\n\n  /* ---- Évolution avec l'heure (chaque seconde) ---- */\n  function evaluer() {\n    const mm = Esport.monMatch();\n    const maintenant = Esport.horloge();\n    if (mm.issue !== \"demarre\") return;\n\n    // Aucune déclaration à l'échéance : les deux joueurs sont éliminés\n    if (!mm.statut && !mm.declMoi && maintenant > Esport.limiteDeclaration()) {\n      eliminerSansDeclaration();\n      return;\n    }\n    // L'adversaire déclare 5 minutes après moi (au plus tard juste avant la clôture)\n    const reponse = new Date(Math.min(Esport.plus(mm.declMoi ? mm.declMoi.heureIso : 0, c.reponseAdversaire).getTime(),\n      Esport.limiteDeclaration().getTime() - 60000));\n    if (mm.statut === \"attente-adv\" && maintenant >= reponse) {\n      if (mm.adversaireDiverge) {\n        // Déclarations divergentes : litige ouvert automatiquement (S07-03)\n        const divergente = mm.declMoi.moi > mm.declMoi.adv ? { moi: mm.declMoi.adv, adv: mm.declMoi.moi } : { moi: mm.declMoi.moi, adv: mm.declMoi.adv + 1 };\n        Esport.majMonMatch({ declAdv: divergente, statut: \"litige\", correction: false, litige: { ouverture: maintenant.toISOString(), pieces: 0 } });\n        Esport.notifier({ famille: \"match\", ecran: \"15\", titre: \"Litige ouvert\", texte: \"Vos déclarations divergent : joins tes captures dans les 30 minutes.\" });\n        Nav.toast(\"Déclarations divergentes : un litige est ouvert\");\n      } else {\n        // Déclarations identiques : match clos, le vainqueur progresse (S07-01)\n        Esport.majMonMatch({ declAdv: { moi: mm.declMoi.moi, adv: mm.declMoi.adv }, statut: \"clos\", correction: false });\n        Esport.enregistrerMonResultat(mm.declMoi.moi, mm.declMoi.adv);\n        notifierResultat(mm.declMoi, \"Résultat enregistré\");\n        Nav.toast(c.adversaire + \" a confirmé le score : match clos\");\n      }\n      return;\n    }\n    // Déclaration adverse retenue, pas de contestation dans les 30 min : résultat définitif (S07-02)\n    if (mm.statut === \"retenu-adverse\" && maintenant >= limiteContestation()) {\n      Esport.majMonMatch({ statut: \"definitif\" });\n      Esport.enregistrerMonResultat(mm.declAdv.moi, mm.declAdv.adv);\n      notifierResultat(mm.declAdv, \"Résultat définitif\");\n    }\n  }\n\n  /* Aucune déclaration dans le délai : élimination des deux joueurs, adversaire suivant qualifié d'office */\n  function eliminerSansDeclaration(refusMoi) {\n    Esport.majMonMatch({ statut: \"sans-declaration\", correction: false, refusMoi: refusMoi || null });\n    Esport.enregistrerResultat(Esport.cleMonMatch(), { a: null, b: null, vainqueur: null, mention: \"Aucune déclaration\" });\n    Esport.notifier({ famille: \"match\", ecran: \"12\", params: { id: t.id }, titre: \"Éliminé : aucun résultat déclaré\",\n      texte: \"Ni toi ni \" + c.adversaire + \" n'avez déclaré de score dans le délai.\" });\n  }\n\n  /* Notification de résultat : qualification ou élimination */\n  function notifierResultat(d, titre) {\n    const gagne = d.moi > d.adv;\n    Esport.notifier({ famille: \"match\", ecran: \"12\", params: { id: t.id },\n      titre: titre + \" : \" + (gagne ? \"qualifié\" : \"éliminé\"),\n      texte: Esport.pseudo() + \" \" + d.moi + \"–\" + d.adv + \" \" + c.adversaire + (gagne ? \". Tu passes au tour suivant.\" : \". Fin du tournoi pour toi.\") });\n  }\n\n  function rendre() {\n    evaluer();\n    const mm = Esport.monMatch();\n    const maintenant = Esport.horloge();\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    const arbre = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir l\\'arbre\u003c/a>';\n    let html = '\u003cdiv class=\"tete\">\u003ch1>' + tour + \"\u003c/h1>\u003cp>\" + t.nom + \" · contre \" + c.adversaire + \"\u003c/p>\u003c/div>\";\n    let action = \"\";\n\n    if (mm.issue !== \"demarre\") {\n      page.innerHTML = html + '\u003cdiv class=\"vide\">\u003cstrong>Aucun résultat à déclarer\u003c/strong>Le match n\\'a pas encore démarré.\u003cbr>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"11\">Salle de match\u003c/a>\u003c/div>';\n      zone.innerHTML = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"05\">Mes matchs\u003c/a>';\n      return;\n    }\n    const limite = Esport.limiteDeclaration();\n    const gagne = (d) => d.moi > d.adv;\n    const nul = (d) => d.moi === d.adv;\n\n    if (!mm.statut || mm.correction) {\n      // Saisie (ou correction) de ma déclaration\n      html += '\u003cdiv class=\"bloc-rebours\">\u003cdiv class=\"rebours\">' + Esport.rebours(limite) + \"\u003c/div>\" +\n        '\u003cp class=\"rebours-legende\">pour déclarer, jusqu\\'à ' + Esport.hhmm(limite) + \" (fin prévue \" + Esport.hhmm(Esport.finPrevue()) + \")\u003c/p>\u003c/div>\";\n      if (mm.corre
