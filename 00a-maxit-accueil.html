<!DOCTYPE html>

     Hors backlog : point d'entrée du parcours. Le bouton central ouvre 00b. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil Max it</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- En-tête : avatar, salutation, numéro, icônes ---- */
    .entete {
      height: var(--top-bar-height);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-2) 0 var(--page-gutter);
    }
    .avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: var(--radius-round);
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar svg { width: 100%; height: 100%; }
    .salutation { flex: 1; min-width: 0; line-height: var(--line-height-tight); white-space: nowrap; }
    .salutation small { display: block; font-size: var(--font-size-sm); }
    .salutation strong {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-md);
    }
    .salutation strong svg { width: 14px; height: 14px; }

    /* ---- Carrousel de bannières ---- */
    .bannieres { margin-top: var(--space-2); }
    .banniere {
      width: 252px;
      height: 334px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }
    .banniere > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .banniere .badge { position: absolute; top: var(--space-3); left: var(--space-3); }
    .banniere .logo-partenaire {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--illu-car-red);
      color: var(--color-on-primary);
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .banniere .accroche {
      position: absolute;
      left: var(--space-3);
      right: var(--space-3);
      top: 130px;
      color: var(--color-on-primary);
      font-size: var(--font-size-xl);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -.01em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    }

    /* Carte compte (deuxième carte du carrousel) */
    .carte-compte {
      width: 252px;
      height: 334px;
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4);
    }
    .carte-compte .arcs { position: absolute; top: 34px; left: 0; width: 80px; height: 48px; }
    .carte-compte .qr {
      width: 92px;
      height: 92px;
      margin: 18px 0 0 var(--space-2);
      align-self: flex-start;
      background: var(--color-surface);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-card);
      padding: var(--space-2);
      position: relative;
    }
    .carte-compte .qr svg { width: 100%; height: 100%; }
    .carte-compte .nom-compte {
      margin-top: var(--space-8);
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-weight: var(--font-weight-bold);
    }
    .carte-compte .nom-compte svg { width: 18px; height: 18px; }
    .carte-compte .solde {
      font-size: var(--font-size-xxl);
      font-weight: var(--font-weight-bold);
      letter-spacing: .1em;
      margin: var(--space-3) 0;
    }

    /* ---- Raccourcis ---- */
    .raccourcis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-2);
      padding: 0 var(--page-gutter);
      margin-top: var(--space-4);
    }
    .raccourci {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-sm);
      text-align: center;
      line-height: var(--line-height-tight);
    }
    .raccourci .tuile {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      background: var(--color-surface-warm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .raccourci .tuile svg { width: 64px; height: 64px; }

    /* ---- Tendances ---- */
    .tendances .titre-section svg { width: 20px; height: 20px; }
    .carte-tendance {
      width: 300px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: var(--space-2) var(--space-3) var(--space-2) var(--space-2);
      margin: var(--space-1) 0 var(--space-6);
    }
    .carte-tendance .vignette {
      width: 96px;
      height: 80px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
    }
    .carte-tendance .vignette svg { width: 100%; height: 100%; }
    .carte-tendance .textes { flex: 1; }
    .carte-tendance strong { display: block; font-size: var(--font-size-lg); line-height: var(--line-height-tight); }
    .carte-tendance small { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
  </style>
</head>
