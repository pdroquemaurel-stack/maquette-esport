bouton { margin-top: var(--space-4); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Mon profil\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"23\">\u003c/nav>\n\n    \u003cdiv class=\"voile\" id=\"voile\">\n      \u003cdiv class=\"feuille\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"titre-feuille\">\n        \u003cdiv class=\"poignee\">\u003c/div>\n        \u003ch2 id=\"titre-feuille\">\u003c/h2>\n        \u003cp class=\"aide\" id=\"aide-feuille\">\u003c/p>\n        \u003clabel class=\"champ\" id=\"champ-feuille\">\u003cspan class=\"cache-visuel\" id=\"libelle-feuille\">\u003c/span>\u003cinput id=\"saisie\" autocomplete=\"off\" spellcheck=\"false\" maxlength=\"24\">\u003c/label>\n        \u003cp class=\"erreur-champ\" id=\"erreur-feuille\" role=\"alert\">\u003c/p>\n        \u003cdiv class=\"puces puces-retour\" id=\"suggestions\">\u003c/div>\n        \u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"enregistrer\">Enregistrer\u003c/button>\n        \u003cbutton class=\"bouton bouton-lien bouton-pleine-largeur\" id=\"annuler\">Annuler\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- État de démo : pseudo jugé offensant, remplacé par un pseudo neutre (S01-02) ---- */\n  if (Esport.lireScenario() === \"pseudo-offensant\") {\n    Etat.set(\"pseudoOffensant\", Esport.pseudo());\n    Etat.set(\"pseudo\", \"Joueur_48213\");\n  }\n\n  /* Prochaine date à laquelle le pseudo peut changer (30 jours après le dernier changement) */\n  function prochainChangement() {\n    const dernier = Etat.get(\"pseudoModifieLe\") || DONNEES.joueur.pseudoModifieLe;\n    return new Date(new Date(dernier + \"T12:00\").getTime() + 30 * 86400000);\n  }\n  function pseudoModifiable() { return !!Etat.get(\"pseudoOffensant\") || Esport.maintenant() >= prochainChangement(); }\n\n  function rendre() {\n    const pseudo = Esport.pseudo();\n    const a = Esport.etatAbonnement();\n    const tags = Esport.gamertags();\n    const repris = Etat.get(\"historiqueNonRepris\") ? { tournois: 0, victoires: 0 } : DONNEES.joueur.historiqueRepris;\n    const inscrits = DONNEES.tournois.filter((t) => { const i = Esport.inscription(t.id); return i && i.etat === \"inscrit\"; }).length;\n    const offensant = Etat.get(\"pseudoOffensant\");\n    let html = \"\";\n\n    html += '\u003cdiv class=\"identite\">\u003cspan class=\"avatar avatar-moi\">' + pseudo[0] + \"\u003c/span>\u003cdiv>\" +\n      \"\u003ch1>\" + pseudo + \"\u003c/h1>\" +\n      '\u003cspan class=\"puce-etat ' + (Esport.abonne() ? \"puce-inscrit\" : \"puce-clos\") + '\">' + (Esport.abonne() ? \"Joueur abonné\" : \"Joueur gratuit\") + \"\u003c/span>\u003cbr>\" +\n      '\u003ca href=\"#\" class=\"lien-public\" data-ecran=\"17\" data-pseudo=\"' + pseudo + '\">Voir mon profil public\u003c/a>\u003c/div>\u003c/div>';\n\n    if (offensant) {\n      html += '\u003cdiv class=\"encart encart-alerte\">' + Esport.icone(\"alerte\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Pseudo remplacé\u003c/strong>\u003cp>Ton pseudo « \" + offensant + \" » a été jugé offensant par le responsable local. Il est remplacé par « \" + pseudo +\n        \" ». Choisis-en un nouveau : la limite de 30 jours ne s'applique pas.\u003c/p>\u003c/div>\u003c/div>\";\n    }\n\n    html += '\u003cdiv class=\"chiffres\">' +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + (DONNEES.joueur.historique.length + inscrits + repris.tournois) + \"\u003c/b>Tournois joués\u003c/div>\" +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + repris.victoires + \"\u003c/b>Victoires\u003c/div>\" +\n      '\u003cdiv class=\"chiffre\">\u003cb>' + inscrits + \"\u003c/b>En cours\u003c/div>\u003c/div>\";\n\n    // Pseudo\n    html += '\u003ch2 class=\"titre-section\">Mon pseudo\u003c/h2>\u003cdiv class=\"bloc\">\u003cdiv class=\"ligne\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + pseudo + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-sous-titre\">' + (pseudoModifiable() ? \"Modifiable maintenant, puis une fois tous les 30 jours\" : \"Modifiable à partir du \" + Esport.jourCourt(prochainChangement().toISOString().slice(0, 10))) + \"\u003c/span>\u003c/span>\" +\n      '\u003cbutton class=\"puce\" data-modifier=\"pseudo\"' + (pseudoModifiable() ? \"\" : \" disabled\") + \">Modifier\u003c/button>\u003c/div>\u003c/div>\";\n\n    // Identifiants de jeu\n    html += '\u003ch2 class=\"titre-section\">Mes identifiants de jeu\u003c/h2>\u003cdiv class=\"bloc\">' + DONNEES.jeux.map((j) =>\n      '\u003cdiv class=\"ligne\">' + Esport.visuelJeu(j.id, \"petit\") + '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + j.nom + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-sous-titre\">' + (tags[j.id] || \"Non renseigné\") + \"\u003c/span>\u003c/span>\" +\n      '\u003cbutton class=\"puce\" data-modifier=\"' + j.id + '\">' + (tags[j.id] ? \"Modifier\" : \"Ajouter\") + \"\u003c/button>\u003c/div>\"\n    ).join(\"\") + \"\u003c/div>\";\n\n    // Abonnement (S11-04)\n    html += '\u003ch2 class=\"titre-section\">Mon abonnement\u003c/h2>\u003cdiv class=\"bloc\">';\n    if (a.statut === \"actif\" || a.statut === \"resilie\") {\n      html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"24\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + Esport.nomOffre(a.offre).replace(/^a/, \"A\") + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-sous-titre\">' + (a.statut === \"actif\" ? \"Échéance le \" + Esport.jourCourt(a.echeance) : \"Résilié · accès jusqu'au \" + Esport.jourCourt(a.echeance)) + \"\u003c/span>\u003c/span>\" +\n        Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n    } else {\n      html += '\u003cdiv class=\"ligne\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + (a.statut === \"expire\" ? \"Abonnement expiré\" : \"Joueur gratuit\") + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-sous-titre\">' + (a.statut === \"expire\" ? \"Depuis le \" + Esport.jourCourt(a.echeance) : \"Tournois et contenus réservés verrouillés\") + \"\u003c/span>\u003c/span>\" +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" style=\"min-height:36px;padding:0 var(--space-4)\" data-ecran=\"21\" data-origine>' + (a.statut === \"expire\" ? \"Se réabonner\" : \"S'abonner\") + \"\u003c/a>\u003c/div>\";\n      if (a.statut === \"expire\") html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"24\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Détail de l\\'abonnement\u003c/span>\u003c/span>' + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n    }\n    html += \"\u003c/div>\";\n\n    // Mes tournois et réglages\n    html += '\u003ch2 class=\"titre-section\">Paramètres\u003c/h2>\u003cdiv class=\"bloc\">' +\n      '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"05\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Mes tournois et mon historique\u003c/span>' +\n      (repris.tournois ? '\u003cspan class=\"ligne-sous-titre\">Dont ' + repris.tournois + \" tournois repris de l'ancienne plateforme\u003c/span>\" : \"\") + \"\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\" +\n      '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"27\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Préférences de notification\u003c/span>\u003c/span>' + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\" +\n      '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"28\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Mes données\u003c/span>\u003cspan class=\"ligne-sous-titre\">Télécharger, supprimer mon profil\u003c/span>\u003c/span>' + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\" +\n      \"\u003c/div>\" + '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  /* ---------- Modification du pseudo ou d'un identifiant de jeu ---------- */\n  const voile = document.getElementById(\"voile\");\n  let edition = null;   // \"pseudo\" ou identifiant du jeu\n\n  function ouvrir(cible) {\n    edition = cible;\n    const jeu = Esport.jeu(cible);\n    document.getElementById(\"titre-feuille\").textContent = cible === \"pseudo\" ? \"Modifier mon pseudo\" : \"Identifiant \" + jeu.nom;\n    document.getElementById(\"libelle-feuille\").textContent = cible === \"pseudo\" ? \"Nouveau pseudo\" : \"Identifiant de jeu\";\n    document.getElementById(\"aide-feuille\").textContent = cible === \"pseudo\"\n      ? \"3 à 16 caractères : lettres, chiffres, « _ » et « . ». Unique dans tous les pays. Ensuite, plus de changement pendant 30 jours.\"\n      : \"Ton identifiant dans \" + jeu.nom + \". Un identifiant ne peut être rattaché qu'à un seul profil.\";\n    const saisie = document.getElementById(\"saisie\");\n    saisie.value = cible === \"pseudo\" ? \"\" : (Esport.gamertags()[cible] || \"\");\n    saisie.placeholder = cible === \"pseudo\" ? \"Ex. : Atlas_Gamer\" : \"Ex. : \" + (cible === \"freefire\" ? \"Pseudo#1234\" : \"MonPseudo\");\n    document.getElementById(\"erreur-feuille\").textContent = \"\";\n    document.getElementById(\"suggestions\").innerHTML = \"\";\n    document.getElementById(\"champ-feuille\").classList.remove(\"erreur\");\n    voile.classList.add(\"ouvert\");\n  }\n  function erreur(message, suggestions) {\n    document.getElementById(\"erreur-feuille\").textContent = message;\n    document.getElementById(\"champ-feuille\").classList.add(\"erreur\");\n    document.getElementById(\"suggestions\").innerHTML = (suggestions || []).map((s) => '\u003cbutton class=\"puce\" data-suggestion=\"' + s + '\">' + s + \"\u003c/button>\").join(\"\");\n  }\n\n  function enregistrer() {\n    const valeur = document.getElementById(\"saisie\").value.trim();\n    if (edition === \"pseudo\") {\n      const pris = (p) => DONNEES.pseudosPris.some((x) => x.toLowerCase() === p.toLowerCase()) && p !== Esport.pseudo();\n      if (!/^[A-Za-z0-9_.]{3,16}$/.test(valeur)) return erreur(\"De 3 à 16 caractères : lettres, chiffres, « _ » ou « . ».\");\n      if (valeur === Esport.pseudo()) return erreur(\"C'est déjà ton pseudo.\");\n      if (pris(valeur)) return erreur(\"« \" + valeur + \" » est déjà pris.\", [valeur + \"_212\", valeur + \".MA\"].filter((s) => !pris(s) && s.length \u003c= 16));\n      Etat.set(\"pseudo\", valeur);\n      Etat.set(\"pseudoModifieLe\", DONNEES.maintenant.slice(0, 10));\n      Etat.set(\"pseudoOffensant\", null);\n      Nav.toast(\"Pseudo modifié : il apparaît partout, y compris dans les arbres\");\n    } else {\n      if (valeur.length \u003c 3) return erreur(\"Saisis ton identifiant de jeu.\");\n      // Identifiant déjà rattaché à un autre profil : refusé avec le motif (S01-02)\n      if ((DONNEES.gamertagsPris[edition] || []).some((x) => x.toLowerCase() === valeur.toLowerCase())) {\n        return erreur(\"Cet identifiant est déjà rattaché à un autre profil. S'il est à toi, contacte le service client Max it.\");\n      }\n      const tags = Object.assign({}, Etat.get(\"gamertags\") || {});\n      tags[edition] = valeur;\n      Etat.set(\"gamertags\", tags);\n      Nav.toast(\"Identifiant enregistré\");\n    }\n    voile.classList.remove(\"ouvert\");\n  }\n\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    const b = e.target.closest(\"[data-modifier]\");\n    if (b && !b.disabled) ouvrir(b.dataset.modifier);\n  });\n  voile.addEventListener(\"click\", (e) => {\n    if (e.target === voile || e.target.closest(\"#annuler\")) voile.classList.remove(\"ouvert\");\n    if (e.target.closest(\"#enregistrer\")) enregistrer();\n    const s = e.target.closest(\"[data-suggestion]\");\n    if (s) { document.getElementById(\"saisie\").value = s.dataset.suggestion; document.getElementById(\"erreur-feuille\").textContent = \"\"; }\n  });\n  document.getElementById(\"saisie\").addEventListener(\"keydown\", (e) => { if (e.key === \"Enter\") enregistrer(); });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","24-abonnement.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 24 — Mon abonnement.\n     US : S11-04 (offre et échéance ; avis avant reconduction : 3 jours avant en mensuel, la veille en\n     hebdomadaire, sans préavis en quotidien ; fin à tout moment avec accès conservé jusqu'à l'échéance ;\n     expiration ou échec de reconduction : retour au niveau gratuit sans effacer l'historique ;\n     un tournoi commencé n'est pas interrompu).\n     États : actif, résilié, expiré, aucun abonnement. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mon abonnement\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .carte-abonnement { position: relative; overflow: hidden; margin: 0 var(--page-gutter); padding: var(--space-5) var(--space-4); border-radius: var(--radius-lg); background: var(--color-bg-dark); color: var(--color-text-on-dark); }\n    .carte-abonnement .flamme { position: absolute; right: -40px; top: -40px; width: 140px; height: 210px; transform: rotate(28deg); background: linear-gradient(180deg, var(--color-gaming-flame-dark), var(--color-primary)); opacity: .75; }\n    .carte-abonnement > * { position: relative; }\n    .carte-abonnement .surtitre { font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: .05em; color: var(--color-primary); }\n    .carte-abonnement h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); margin: var(--space-1) 0; }\n    .carte-abonnement p { color: var(--illu-gray-light); font-size: var(--font-size-sm); }\n    .carte-abonnement .carte-badges { margin-top: var(--space-3); }\n    .details { margin: var(--space-4) var(--page-gutter) 0; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .details .ligne { padding-left: var(--space-4); padding-right: var(--space-4); }\n    .details .valeur { font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); text-align: right; }\n    .encart { margin-top: var(--space-4); }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n    .bouton-danger { color: var(--color-alert); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Mon abonnement\" data-repli=\"23\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- États de démo ---- */\n  const scenario = Esport.lireScenario();\n  if (scenario === \"expire\") Esport.expirer();\n  if (scenario === \"resilie\") { Etat.set(\"abonne\", true); Esport.resilier(); }\n\n  /* Avis avant reconduction selon la périodicité (S11-04) */\n  const PREAVIS = { mensuelle: 3, hebdomadaire: 1, quotidienne: 0 };\n  function avisReconduction(a) {\n    const jours = PREAVIS[a.offre];\n    if (!jours) return \"Reconduite chaque jour, sans préavis.\";\n    const avis = new Date(new Date(a.echeance + \"T12:00\").getTime() - jours * 86400000).toISOString().slice(0, 10);\n    return \"Tu seras prévenu le \" + Esport.jourCourt(avis) + (jours === 1 ? \", la veille.\" : \", \" + jours + \" jours avant.\");\n  }\n\n  function ligne(libelle, valeur) {\n    return '\u003cdiv class=\"ligne\">\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-sous-titre\">' + libelle + '\u003c/span>\u003c/span>\u003cspan class=\"valeur\">' + valeur + \"\u003c/span>\u003c/div>\";\n  }\n\n  function rendre() {\n    const a = Esport.etatAbonnement();\n    const o = Esport.offre(a.offre) || Esport.offre(\"mensuelle\");\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    const offres = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"21\" data-origine>';\n    let html = \"\";\n    let action = \"\";\n\n    if (a.statut === \"aucun\") {\n      html = '\u003cdiv class=\"vide\">\u003cstrong>Pas d\\'abonnement\u003c/strong>Abonne-toi pour accéder aux tournois et contenus réservés.\u003c/div>';\n      action = offres + \"Voir les offres\u003c/a>\";\n    } else {\n      const titres = { actif: \"Actif\", resilie: \"Résilié\", expire: \"Expiré\" };\n      html += '\u003csection class=\"carte-abonnement\">\u003cspan class=\"flamme\">\u003c/span>\u003cp class=\"surtitre\">' + titres[a.statut] + \"\u003c/p>\" +\n        \"\u003ch1>\" + Esport.nomOffre(a.offre).replace(/^a/, \"A\") + \"\u003c/h1>\u003cp>\" + Esport.prix(o.prix) + \" par \" + o.libelle.toLowerCase() + \" · payé avec Max it\u003c/p>\" +\n        '\u003cdiv class=\"carte-badges\">' + (a.statut === \"expire\"\n          ? '\u003cspan class=\"puce-etat puce-clos\">Niveau gratuit\u003c/span>'\n          : '\u003cspan class=\"puce-etat puce-inscrit\">' + Esport.icone(\"coche\", \"f-white\") + \"Accès abonné ouvert\u003c/span>\") + \"\u003c/div>\u003c/section>\";\n\n      html += '\u003cdiv class=\"details\">';\n      if (a.statut === \"actif\") {\n        html += ligne(\"Échéance\", Esport.jourLong(a.echeance)) + ligne(\"Prochaine reconduction\", Esport.jourCourt(a.echeance)) + ligne(\"Avis de reconduction\", avisReconduction(a));\n      } else if (a.statut === \"resilie\") {\n        html += ligne(\"Accès conservé jusqu'au\", Esport.jourLong(a.echeance)) + ligne(\"Reconduction\", \"Aucune\");\n      } else {\n        html += ligne(\"Expiré le\", Esport.jourLong(a.echeance)) + ligne(\"Accès\", \"Niveau gratuit\");\n      }\n      html += \"\u003c/div>\";\n\n      if (a.statut === \"resilie\") {\n        html += '\u003cdiv class=\"encart\">' + Esport.icone(\"calendrier\", \"f-primary\") +\n          \"\u003cdiv>\u003cstrong>Ton abonnement ne sera pas reconduit\u003c/strong>\u003cp>Tu gardes l'accès aux tournois et contenus réservés jusqu'au \" + Esport.jourCourt(a.echeance) + \".\u003c/p>\u003c/div>\u003c/div>\";\n      }\n      if (a.statut === \"expire\") {\n        html += '\u003cdiv class=\"encart encart-alerte\">' + Esport.icone(\"alerte\", \"f-primary\") +\n          \"\u003cdiv>\u003cstrong>Tu es revenu au niveau gratuit\u003c/strong>\u003cp>Ton historique est conservé. Un tournoi déjà commencé n'est pas interrompu.\u003c/p>\u003c/div>\u003c/div>\";\n        action = offres + \"Se réabonner\u003c/a>\";\n      }\n      if (a.statut === \"actif\") {\n        html += '\u003cp class=\"ligne-sous-titre\" style=\"padding: var(--space-3) var(--page-gutter) 0\">La fin de l\\'abonnement n\\'interrompt pas un tournoi commencé.\u003c/p>';\n        action = '\u003cbutton class=\"bouton bouton-lien bouton-danger bouton-pleine-largeur\" id=\"mettre-fin\">Mettre fin à mon abonnement\u003c/button>';\n      }\n      if (a.statut === \"resilie\") action = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"03\">Retour à l\\'accueil\u003c/a>';\n    }\n    page.innerHTML = html + '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    zone.innerHTML = action;\n  }\n\n  document.getElementById(\"action\").addEventListener(\"click\", (e) => {\n    if (!e.target.closest(\"#mettre-fin\")) return;\n    const a = Esport.etatAbonnement();\n    Nav.dialogue({\n      titre: \"Mettre fin à ton abonnement ?\",\n      texte: \"Il ne sera pas reconduit. Tu gardes l'accès jusqu'au \" + Esport.jourCourt(a.echeance) + \".\",\n      boutons: [\n        { libelle: \"Mettre fin\", primaire: true, action: () => { Esport.resilier(); Nav.toast(\"Abonnement résilié\"); } },\n        { libelle: \"Garder mon abonnement\" }\n      ]\n    });\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","25-notifications.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 25 — Centre de notifications (cloche de l'en-tête).\n     US : S12-01 (événements notifiés par famille ; une famille désactivée n'est plus affichée,\n     sauf « match en cours » ; chaque notification ouvre l'écran concerné), S03-06 (dotation versée),\n     S08-04 (exclusion), S03-04 / S11-04 (abonnement). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Notifications\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .outils-notif { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 0 var(--page-gutter) var(--space-2); font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .outils-notif .bouton-lien { font-size: var(--font-size-sm); }\n    .outils-notif .bouton-lien:disabled { color: var(--color-text-muted); cursor: default; }\n    .groupe-notif { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .notif { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); width: 100%; text-align: left; }\n    .notif:last-child { border-bottom: 0; }\n    .notif .icone-notif { width: 36px; height: 36px; border-radius: var(--radius-round); background: var(--color-surface-warm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n    .notif .icone-notif svg { width: 18px; height: 18px; }\n    .notif.non-lue .icone-notif { background: var(--color-primary-soft); }\n    .notif .corps-notif { flex: 1; min-width: 0; }\n    .notif .titre-notif { display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }\n    .notif.non-lue .titre-notif { font-weight: var(--font-weight-bold); }\n    .notif .texte-notif { display: block; font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 2px; }\n    .notif .heure { font-size: var(--font-size-xs); color: var(--color-text-muted); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }\n    .notif .point { width: 8px; height: 8px; border-radius: var(--radius-round); background: var(--color-primary); }\n    .desactivees { margin: var(--space-4) var(--page-gutter) 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Notifications\" data-repli=\"03\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* Pictogramme de chaque famille */\n  const ICONES_FAMILLES = {\n    \"match-en-cours\": \"manette\", match: \"trophee\", inscription: \"article\", tournoi: \"calendrier\",\n    equipe: \"groupe\", abonnement: \"cadenas\", dotation: \"boutique\", exclusion: \"alerte\"\n  };\n\n  /* « 21:10 » aujourd'hui, sinon « 8 oct. » */\n  function quand(iso) {\n    return iso.slice(0, 10) === DONNEES.maintenant.slice(0, 10) ? iso.slice(11, 16) : Esport.jourCourt(iso.slice(0, 10));\n  }\n\n  function rendre() {\n    const visibles = Esport.notificationsVisibles();\n    const nonLues = Esport.nonLues();\n    const desactivees = DONNEES.famillesNotif.filter((f) => !Esport.familleActive(f.id));\n    let html = '\u003cdiv class=\"outils-notif\">\u003cspan>' + (nonLues ? nonLues + (nonLues > 1 ? \" non lues\" : \" non lue\") : \"Tout est lu\") + \"\u003c/span>\" +\n      '\u003cbutton class=\"bouton-lien\" id=\"tout-lu\"' + (nonLues ? \"\" : \" disabled\") + \">Tout marquer comme lu\u003c/button>\u003c/div>\";\n\n    // Liste groupée par famille, dans l'ordre des préférences\n    DONNEES.famillesNotif.forEach((f) => {\n      const liste = visibles.filter((n) => n.famille === f.id);\n      if (!liste.length) return;\n      html += '\u003ch2 class=\"titre-section\">' + f.libelle + \"\u003c/h2>\u003cdiv class=\\\"groupe-notif\\\">\" + liste.map((n) =>\n        '\u003cbutton class=\"notif' + (n.lue ? \"\" : \" non-lue\") + '\" data-notif=\"' + n.id + '\">' +\n        '\u003cspan class=\"icone-notif\">' + Esport.icone(ICONES_FAMILLES[n.famille], n.lue ? \"f-text\" : \"f-primary\") + \"\u003c/span>\" +\n        '\u003cspan class=\"corps-notif\">\u003cspan class=\"titre-notif\">' + n.titre + '\u003c/span>\u003cspan class=\"texte-notif\">' + n.texte + \"\u003c/span>\u003c/span>\" +\n        '\u003cspan class=\"heure\">' + quand(n.date) + (n.lue ? \"\" : '\u003cspan class=\"point\" aria-label=\"non lue\">\u003c/span>') + \"\u003c/span>\u003c/button>\"\n      ).join(\"\") + \"\u003c/div>\";\n    });\n    if (!visibles.length) html += '\u003cdiv class=\"vide\">\u003cstrong>Aucune notification\u003c/strong>Tu seras prévenu ici de tout ce qui te concerne.\u003c/div>';\n\n    html += '\u003ca href=\"#\" class=\"encart desactivees\" data-ecran=\"27\">' + Esport.icone(\"cloche\", \"f-primary\") + \"\u003cdiv>\u003cstrong>Préférences de notification\u003c/strong>\u003cp>\" +\n      (desactivees.length ? desactivees.length + (desactivees.length > 1 ? \" familles désactivées : \" : \" famille désactivée : \") + desactivees.map((f) => f.libelle.toLowerCase()).join(\", \") + \".\"\n                          : \"Choisis ce dont tu veux être averti.\") + \"\u003c/p>\u003c/div>\u003c/a>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  /* Ouvrir une notification : elle devient lue et mène à l'écran concerné */\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#tout-lu\")) { Esport.toutMarquerLu(); Nav.toast(\"Toutes les notifications sont lues\"); return; }\n    const b = e.target.closest(\"[data-notif]\");\n    if (!b) return;\n    const n = Esport.notifications().find((x) => x.id === b.dataset.notif);\n    Esport.marquerLue(n.id);\n    Nav.aller(n.ecran, n.scenario || null, n.params || null);\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","26-contestation.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 26 — Contester une décision (26-contestation.html?decision=exclusion&id=t01).\n     US : S08-04 (exclusion d'un tournoi : motif et durée ; contestation transmise avec le dossier complet\n     au responsable local du pays du joueur), S04-05 (refus pour doublon contestable).\n     Décisions possibles : voir DONNEES.decisions. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Contester une décision\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { padding: 0 var(--page-gutter) var(--space-4); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }\n\n    .fiche { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); }\n    .fiche h2 { font-size: var(--font-size-lg); line-height: var(--line-height-tight); margin-bottom: var(--space-3); }\n    .fiche dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-3); font-size: var(--font-size-sm); }\n    .fiche dt { color: var(--color-text-secondary); }\n    .fiche dd { font-weight: var(--font-weight-medium); }\n    .fiche .consequence { margin-top: var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n\n    .formulaire { padding: 0 var(--page-gutter); }\n    .formulaire label { display: block; font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); margin-bottom: var(--space-2); }\n    .formulaire textarea {\n      width: 100%;\n      min-height: 140px;\n      resize: vertical;\n      padding: var(--space-3) var(--space-4);\n      border: 1px solid var(--color-border-strong);\n      border-radius: var(--radius-md);\n      font: inherit;\n      color: var(--color-text);\n      background: var(--color-surface);\n    }\n    .formulaire textarea:focus { outline: 0; border-color: var(--color-primary); }\n    .compteur { display: flex; justify-content: space-between; font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-1); }\n    .compteur .erreur { color: var(--color-alert); }\n    .note { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-3) var(--page-gutter) 0; }\n\n    .envoyee { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-6) var(--page-gutter) var(--space-4); }\n    .envoyee .pictogramme { width: 72px; height: 72px; border-radius: var(--radius-round); background: var(--color-success-dark); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); }\n    .envoyee .pictogramme svg { width: 36px; height: 36px; }\n    .envoyee h2 { font-size: var(--font-size-xl); margin-bottom: var(--space-2); }\n    .envoyee p { color: var(--color-text-secondary); }\n    .citation { margin: 0 var(--page-gutter); padding: var(--space-3) var(--space-4); border-left: 3px solid var(--color-primary); background: var(--color-surface-warm); border-radius: var(--radius-xs); font-size: var(--font-size-sm); white-space: pre-wrap; overflow-wrap: anywhere; }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Contestation\" data-repli=\"03\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const MIN = 20, MAX = 500;\n  const scenario = Esport.lireScenario();\n  // Décision contestée : paramètre d'URL, ou exclusion pour le raccourci de démo\n  const cle = DONNEES.decisions[Nav.param(\"decision\")] ? Nav.param(\"decision\") : \"exclusion\";\n  const decision = DONNEES.decisions[cle];\n  const t = Esport.tournoi(Nav.param(\"id\") || decision.tournoi || \"t09\");\n  const cleContestation = cle + \"-\" + t.id;\n  let texte = \"\";\n\n  function contestation() { return (Etat.get(\"contestations\") || {})[cleContestation]; }\n\n  function fiche() {\n    return '\u003csection class=\"fiche\">\u003ch2>' + decision.titre + \"\u003c/h2>\u003cdl>\" +\n      \"\u003cdt>Tournoi\u003c/dt>\u003cdd>\" + t.nom + \"\u003c/dd>\" +\n      \"\u003cdt>Motif\u003c/dt>\u003cdd>\" + decision.motif + \"\u003c/dd>\" +\n      \"\u003cdt>Durée\u003c/dt>\u003cdd>\" + decision.duree + \"\u003c/dd>\" +\n      \"\u003c/dl>\" + (decision.consequence ? '\u003cp class=\"consequence\">' + decision.consequence + \"\u003c/p>\" : \"\") + \"\u003c/section>\";\n  }\n\n  function rendre() {\n    const page = document.getElementById(\"page\");\n    const zone = document.getElementById(\"action\");\n    const deja = contestation();\n    const pays = Esport.pays().nom;\n\n    if (deja) {\n      // Contestation envoyée\n      page.innerHTML = '\u003cdiv class=\"envoyee\">\u003cspan class=\"pictogramme\">' + Esport.icone(\"coche\", \"f-white\") + \"\u003c/span>\" +\n        \"\u003ch2>Contestation envoyée\u003c/h2>\u003cp>Le \" + deja.date + \", ta contestation et le dossier complet ont été transmis au responsable local du \" + pays +\n        \". Tu recevras sa réponse par notification.\u003c/p>\u003c/div>\" +\n        '\u003cdiv class=\"citation\">' + deja.texte.replace(/\u003c/g, \"&lt;\") + \"\u003c/div>\" +\n        '\u003ch2 class=\"titre-section\">Décision contestée\u003c/h2>' + fiche() + '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n      zone.innerHTML = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"03\">Retour à l\\'accueil\u003c/a>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"06\" data-id=\"' + t.id + '\">Voir le tournoi\u003c/a>';\n      return;\n    }\n\n    page.innerHTML = '\u003cdiv class=\"tete\">\u003ch1>Contester une décision\u003c/h1>\u003cp>Ta contestation sera examinée par le responsable local du ' + pays + \".\u003c/p>\u003c/div>\" +\n      fiche() +\n      '\u003ch2 class=\"titre-section\">Ta contestation\u003c/h2>' +\n      '\u003cdiv class=\"formulaire\">\u003clabel for=\"texte\">Explique pourquoi cette décision te semble injustifiée\u003c/label>' +\n      '\u003ctextarea id=\"texte\" maxlength=\"' + MAX + '\" placeholder=\"Ex. : je n\\'ai jamais utilisé cet identifiant sur un autre compte…\">\u003c/textarea>' +\n      '\u003cdiv class=\"compteur\">\u003cspan id=\"aide-texte\">' + MIN + \" caractères au minimum\u003c/span>\u003cspan id=\\\"nb\\\">0 / \" + MAX + \"\u003c/span>\u003c/div>\u003c/div>\" +\n      '\u003cp class=\"note\">Le dossier complet (décision, motif, historique de tes matchs) est joint automatiquement.\u003c/p>' +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    zone.innerHTML = '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"envoyer\" disabled>Envoyer au responsable local\u003c/button>';\n\n    const champ = document.getElementById(\"texte\");\n    champ.value = texte;\n    const maj = () => {\n      texte = champ.value;\n      const n = texte.trim().length;\n      document.getElementById(\"nb\").textContent = texte.length + \" / \" + MAX;\n      document.getElementById(\"envoyer\").disabled = n \u003c MIN;\n    };\n    champ.addEventListener(\"input\", maj);\n    maj();\n  }\n\n  document.getElementById(\"action\").addEventListener(\"click\", (e) => {\n    if (!e.target.closest(\"#envoyer\") || texte.trim().length \u003c MIN) return;\n    const liste = Object.assign({}, Etat.get(\"contestations\") || {});\n    liste[cleContestation] = { texte: texte.trim(), date: \"9 oct. à \" + Esport.hhmm(Esport.horloge()) };\n    Etat.set(\"contestations\", liste);\n    Nav.toast(\"Contestation envoyée\");\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","27-preferences-notif.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 27 — Préférences de notification.\n     US : S12-01 (un choix par famille ; les notifications d'un match en cours ne se désactivent pas),\n     S12-02 (refus des SMS sans perdre les notifications dans l'application, si le pays a activé les SMS ;\n     messages promotionnels seulement avec consentement). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Préférences de notification\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .bloc { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 0 var(--space-4); }\n    .bloc .demo-ligne:last-child { border-bottom: 0; }\n    .demo-ligne:disabled { cursor: default; }\n    .demo-ligne:disabled .inter { opacity: .45; }\n    .toujours { font-size: var(--font-size-xs); color: var(--color-text-muted); white-space: nowrap; }\n    .note { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }\n    .case { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) 0; cursor: pointer; font-size: var(--font-size-sm); }\n    .case input { width: 22px; height: 22px; accent-color: var(--color-primary); flex-shrink: 0; margin-top: 1px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Notifications\" data-repli=\"23\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"23\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* Interrupteur, avec le style de ceux du menu de démo */\n  function interrupteur(attribut, valeur, actif, libelle, aide, verrouille) {\n    return '\u003cbutton class=\"demo-ligne\" role=\"switch\" ' + attribut + '=\"' + valeur + '\" aria-checked=\"' + actif + '\"' + (verrouille ? \" disabled\" : \"\") + \">\" +\n      \"\u003cspan>\" + libelle + \"\u003csmall>\" + aide + \"\u003c/small>\u003c/span>\" +\n      (verrouille ? '\u003cspan class=\"toujours\">Toujours actif\u003c/span>' : \"\") +\n      '\u003cspan class=\"inter' + (actif ? \" on\" : \"\") + '\">\u003c/span>\u003c/button>';\n  }\n\n  function rendre() {\n    let html = '\u003ch2 class=\"titre-section\">Dans l\\'application\u003c/h2>\u003cdiv class=\"bloc\">' +\n      DONNEES.famillesNotif.map((f) => interrupteur(\"data-famille\", f.id, Esport.familleActive(f.id), f.libelle, f.aide, f.verrouillee)).join(\"\") + \"\u003c/div>\" +\n      '\u003cp class=\"note\">Les notifications d\\'un match en cours (convocation, rappel 5 minutes avant) ne peuvent pas être désactivées.\u003c/p>';\n\n    // SMS : seulement si le pays les a activés (S12-02)\n    html += '\u003ch2 class=\"titre-section\">SMS\u003c/h2>';\n    if (Esport.fonction(\"sms\")) {\n      html += '\u003cdiv class=\"bloc\">' + interrupteur(\"data-sms\", \"1\", !Etat.get(\"refusSms\"), \"Recevoir aussi par SMS\",\n        \"Si tu refuses, tu gardes toutes les notifications dans l'application.\") + \"\u003c/div>\" +\n        '\u003cp class=\"note\">Envoyés par « MAXIT ESPORT » sur le ' + DONNEES.joueur.numero + \".\u003c/p>\";\n    } else {\n      html += '\u003cp class=\"note\">Les SMS ne sont pas proposés dans ton pays.\u003c/p>';\n    }\n\n    // Messages promotionnels : consentement explicite\n    html += '\u003ch2 class=\"titre-section\">Offres et actualités\u003c/h2>\u003cdiv class=\"bloc\">' +\n      '\u003clabel class=\"case\">\u003cinput type=\"checkbox\" id=\"promo\"' + (Etat.get(\"promo\") ? \" checked\" : \"\") + \">\" +\n      \"\u003cspan>J'accepte de recevoir les offres et actualités de Max it E-sport (nouveaux tournois, promotions). Je peux retirer mon accord à tout moment.\u003c/span>\u003c/label>\u003c/div>\" +\n      '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    const f = e.target.closest(\"[data-famille]\");\n    if (f && !f.disabled) {\n      const prefs = Object.assign({}, Etat.get(\"prefsNotif\") || {});\n      prefs[f.dataset.famille] = Esport.familleActive(f.dataset.famille);   // true = désactivée\n      Etat.set(\"prefsNotif\", prefs);\n      Nav.toast(prefs[f.dataset.famille] ? \"Famille désactivée\" : \"Famille activée\");\n    }\n    if (e.target.closest(\"[data-sms]\")) {\n      Etat.set(\"refusSms\", !Etat.get(\"refusSms\"));\n      Nav.toast(Etat.get(\"refusSms\") ? \"SMS refusés : notifications dans l'application seulement\" : \"SMS activés\");\n    }\n  });\n  document.getElementById(\"page\").addEventListener(\"change\", (e) => {\n    if (e.target.id !== \"promo\") return;\n    Etat.set(\"promo\", e.target.checked);\n    Nav.toast(e.target.checked ? \"Consentement enregistré\" : \"Consentement retiré\");\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","28-mes-donnees.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 28 — Mes données.\n     US : S01-04 (téléchargement des données dans un format lisible ; suppression du profil e-sport sous\n     30 jours, résultats passés conservés sous un pseudonyme anonyme), S01-05 (ne pas reprendre l'historique\n     de l'ancienne plateforme). Pas de consentement parental : S01-03 est en suspens. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mes données\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .carte { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-4); }\n    .carte h3 { font-size: var(--font-size-md); margin-bottom: var(--space-1); }\n    .carte p { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-3); }\n    .carte .demo-ligne { border-bottom: 0; padding: 0; }\n    .carte .etat { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--font-size-sm); background: var(--color-surface-warm); border-radius: var(--radius-sm); padding: var(--space-3); margin-bottom: var(--space-3); }\n    .carte .etat svg { width: 18px; height: 18px; margin-top: 1px; }\n    .bouton-danger { color: var(--color-alert); border-color: var(--color-alert); }\n    .note { font-size: var(--font-size-xs); color: var(--color-text-muted); padding: var(--space-4) var(--page-gutter) 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Mes données\" data-repli=\"23\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"23\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- État de démo : suppression effective, 30 jours après la demande ---- */\n  if (Esport.lireScenario() === \"compte-supprime\") {\n    Etat.set(\"suppression\", Etat.get(\"suppression\") || DONNEES.maintenant.slice(0, 10));\n    Etat.set(\"compteSupprime\", true);\n  }\n\n  const aujourdhui = DONNEES.maintenant.slice(0, 10);\n  function plusJours(iso, n) { return new Date(new Date(iso + \"T12:00\").getTime() + n * 86400000).toISOString().slice(0, 10); }\n\n  function rendre() {\n    const repris = DONNEES.joueur.historiqueRepris;\n    const telechargement = Etat.get(\"telechargement\");\n    const suppression = Etat.get(\"suppression\");\n    let html = \"\";\n\n    // Télécharger mes données (S01-04)\n    html += '\u003ch2 class=\"titre-section\">Télécharger mes données\u003c/h2>\u003cdiv class=\"carte\">' +\n      \"\u003cp>Profil, identifiants de jeu, tournois, résultats et abonnement, dans un fichier lisible.\u003c/p>\" +\n      (telechargement\n        ? '\u003cdiv class=\"etat\">' + Esport.icone(\"coche\", \"f-success-dark\") + \"\u003cspan>Demande enregistrée le \" + Esport.jourCourt(telechargement) +\n          \". Un lien vers ton fichier t'est envoyé par SMS sous 48 heures.\u003c/span>\u003c/div>\"\n        : '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"telecharger\">Télécharger mes données\u003c/button>') + \"\u003c/div>\";\n\n    // Historique de l'ancienne plateforme (S01-05)\n    html += '\u003ch2 class=\"titre-section\">Ancienne plateforme\u003c/h2>\u003cdiv class=\"carte\">' +\n      \"\u003cp>\" + repris.tournois + \" tournois et \" + repris.victoires + \" victoires ont été repris de l'ancienne plateforme.\u003c/p>\" +\n      '\u003cbutton class=\"demo-ligne\" role=\"switch\" id=\"historique\" aria-checked=\"' + !!Etat.get(\"historiqueNonRepris\") + '\">' +\n      \"\u003cspan>Ne pas reprendre mon historique\u003csmall>Il disparaît de ton profil et de tes statistiques.\u003c/small>\u003c/span>\" +\n      '\u003cspan class=\"inter' + (Etat.get(\"historiqueNonRepris\") ? \" on\" : \"\") + '\">\u003c/span>\u003c/button>\u003c/div>';\n\n    // Supprimer mon compte (S01-04)\n    html += '\u003ch2 class=\"titre-section\">Supprimer mon compte\u003c/h2>\u003cdiv class=\"carte\">';\n    if (Etat.get(\"compteSupprime\")) {\n      html += '\u003cdiv class=\"etat\">' + Esport.icone(\"alerte\", \"f-primary\") + \"\u003cspan>Profil effacé. Tes résultats passés restent affichés sous le pseudonyme « \" +\n        DONNEES.pseudoAnonyme + \" ». (Démo : utilise « Réinitialiser la démo » pour revenir en arrière.)\u003c/span>\u003c/div>\";\n    } else if (suppression) {\n      html += '\u003cdiv class=\"etat\">' + Esport.icone(\"calendrier\", \"f-primary\") + \"\u003cspan>Suppression demandée le \" + Esport.jourCourt(suppression) +\n        \". Ton profil e-sport sera effacé le \" + Esport.jourCourt(plusJours(suppression, 30)) + \".\u003c/span>\u003c/div>\" +\n        '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"annuler-suppression\">Annuler la demande\u003c/button>';\n    } else {\n      html += \"\u003cp>Ton profil e-sport est effacé sous 30 jours. Tes résultats passés restent visibles sous un pseudonyme anonyme. Ton compte Max it n'est pas supprimé.\u003c/p>\" +\n        '\u003cbutton class=\"bouton bouton-secondaire bouton-danger bouton-pleine-largeur\" id=\"supprimer\">Supprimer mon compte\u003c/button>';\n    }\n    html += \"\u003c/div>\" +\n      '\u003cp class=\"note\">Les règles locales plus strictes de ton pays s\\'appliquent en plus de celles-ci.\u003c/p>\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  document.getElementById(\"page\").addEventListener(\"click\", (e) => {\n    if (e.target.closest(\"#telecharger\")) {\n      Nav.dialogue({\n        titre: \"Télécharger tes données ?\",\n        texte: \"Tu recevras par SMS un lien vers un fichier lisible avec toutes tes données e-sport.\",\n        boutons: [\n          { libelle: \"Confirmer\", primaire: true, action: () => { Etat.set(\"telechargement\", aujourdhui); Nav.toast(\"Demande enregistrée\"); } },\n          { libelle: \"Annuler\" }\n        ]\n      });\n    }\n    if (e.target.closest(\"#historique\")) {\n      Etat.set(\"historiqueNonRepris\", !Etat.get(\"historiqueNonRepris\"));\n      Nav.toast(Etat.get(\"historiqueNonRepris\") ? \"Historique retiré de ton profil\" : \"Historique repris\");\n    }\n    if (e.target.closest(\"#supprimer\")) {\n      Nav.dialogue({\n        titre: \"Supprimer ton compte e-sport ?\",\n        texte: \"Ton profil sera effacé sous 30 jours ; tes résultats resteront visibles sous un pseudonyme anonyme. Tu peux annuler d'ici là.\",\n        boutons: [\n          { libelle: \"Supprimer mon compte\", primaire: true, action: () => { Etat.set(\"suppression\", aujourdhui); Nav.toast(\"Suppression demandée\"); } },\n          { libelle: \"Annuler\" }\n        ]\n      });\n    }\n    if (e.target.closest(\"#annuler-suppression\")) { Etat.set(\"suppression\", null); Nav.toast(\"Demande de suppression annulée\"); }\n  });\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","00a-maxit-accueil.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 00a — Accueil Max it, reproduit d'après reference/01-accueil-maxit.png.\n     Hors backlog : point d'entrée du parcours. Le bouton central ouvre 00b. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Accueil Max it\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    /* ---- En-tête : avatar, salutation, numéro, icônes ---- */\n    .entete {\n      height: var(--top-bar-height);\n      display: flex;\n      align-items: center;\n      gap: var(--space-2);\n      padding: 0 var(--space-2) 0 var(--page-gutter);\n    }\n    .avatar {\n      width: var(--avatar-size);\n      height: var(--avatar-size);\n      border-radius: var(--radius-round);\n      overflow: hidden;\n      flex-shrink: 0;\n    }\n    .avatar svg { width: 100%; height: 100%; }\n    .salutation { flex: 1; min-width: 0; line-height: var(--line-height-tight); white-space: nowrap; }\n    .salutation small { display: block; font-size: var(--font-size-sm); }\n    .salutation strong {\n      display: inline-flex;\n      align-items: center;\n      gap: var(--space-1);\n      font-size: var(--font-size-md);\n    }\n    .salutation strong svg { width: 14px; height: 14px; }\n\n    /* ---- Carrousel de bannières ---- */\n    .bannieres { margin-top: var(--space-2); }\n    .banniere {\n      width: 252px;\n      height: 334px;\n      border-radius: var(--radius-lg);\n      overflow: hidden;\n      position: relative;\n    }\n    .banniere > svg { position: absolute; inset: 0; width: 100%; height: 100%; }\n    .banniere .badge { position: absolute; top: var(--space-3); left: var(--space-3); }\n    .banniere .logo-partenaire {\n      position: absolute;\n      top: var(--space-3);\n      right: var(--space-3);\n      width: 40px;\n      height: 40px;\n      border-radius: var(--radius-sm);\n      background: var(--illu-car-red);\n      color: var(--color-on-primary);\n      font-size: 10px;\n      font-weight: var(--font-weight-bold);\n      font-style: italic;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    .banniere .accroche {\n      position: absolute;\n      left: var(--space-3);\n      right: var(--space-3);\n      top: 130px;\n      color: var(--color-on-primary);\n      font-size: var(--font-size-xl);\n      font-weight: 900;\n      line-height: 1.05;\n      text-transform: uppercase;\n      letter-spacing: -.01em;\n      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);\n    }\n\n    /* Carte compte (deuxième carte du carrousel) */\n    .carte-compte {\n      width: 252px;\n      height: 334px;\n      border-radius: var(--radius-lg);\n      background: var(--color-surface);\n      border: 1px solid var(--color-border);\n      position: relative;\n      overflow: hidden;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      padding: var(--space-4);\n    }\n    .carte-compte .arcs { position: absolute; top: 34px; left: 0; width: 80px; height: 48px; }\n    .carte-compte .qr {\n      width: 92px;\n      height: 92px;\n      margin: 18px 0 0 var(--space-2);\n      align-self: flex-start;\n      background: var(--color-surface);\n      border-radius: var(--radius-sm);\n      box-shadow: var(--shadow-card);\n      padding: var(--space-2);\n      position: relative;\n    }\n    .carte-compte .qr svg { width: 100%; height: 100%; }\n    .carte-compte .nom-compte {\n      margin-top: var(--space-8);\n      display: flex;\n      align-items: center;\n      gap: var(--space-1);\n      font-weight: var(--font-weight-bold);\n    }\n    .carte-compte .nom-compte svg { width: 18px; height: 18px; }\n    .carte-compte .solde {\n      font-size: var(--font-size-xxl);\n      font-weight: var(--font-weight-bold);\n      letter-spacing: .1em;\n      margin: var(--space-3) 0;\n    }\n\n    /* ---- Raccourcis ---- */\n    .raccourcis {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: var(--space-2);\n      padding: 0 var(--page-gutter);\n      margin-top: var(--space-4);\n    }\n    .raccourci {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: var(--space-2);\n      font-size: var(--font-size-sm);\n      text-align: center;\n      line-height: var(--line-height-tight);\n    }\n    .raccourci .tuile {\n      width: 100%;\n      aspect-ratio: 1;\n      border-radius: var(--radius-md);\n      background: var(--color-surface-warm);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    .raccourci .tuile svg { width: 64px; height: 64px; }\n\n    /* ---- Tendances ---- */\n    .tendances .titre-section svg { width: 20px; height: 20px; }\n    .carte-tendance {\n      width: 300px;\n      display: flex;\n      align-items: center;\n      gap: var(--space-3);\n      background: var(--color-surface);\n      border-radius: var(--radius-md);\n      box-shadow: var(--shadow-card);\n      padding: var(--space-2) var(--space-3) var(--space-2) var(--space-2);\n      margin: var(--space-1) 0 var(--space-6);\n    }\n    .carte-tendance .vignette {\n      width: 96px;\n      height: 80px;\n      border-radius: var(--radius-sm);\n      overflow: hidden;\n      flex-shrink: 0;\n    }\n    .carte-tendance .vignette svg { width: 100%; height: 100%; }\n    .carte-tendance .textes { flex: 1; }\n    .carte-tendance strong { display: block; font-size: var(--font-size-lg); line-height: var(--line-height-tight); }\n    .carte-tendance small { font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"maxit\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"9:30\">\u003c/div>\n\n    \u003c!-- En-tête Max it -->\n    \u003cheader class=\"entete\">\n      \u003cbutton class=\"avatar\" data-hors=\"Mon compte\" aria-label=\"Mon compte\">\n        \u003csvg viewBox=\"0 0 36 36\" aria-hidden=\"true\">\n          \u003crect class=\"f-sand\" width=\"36\" height=\"36\"/>\n          \u003cpat "5\"/>\n            \u003ccircle class=\"s-pink\" cx=\"248\" cy=\"30\" r=\"4\"/>\n            \u003ccircle class=\"s-blue\" cx=\"148\" cy=\"184\" r=\"4\"/>\n            \u003ccircle class=\"s-blue\" cx=\"196\" cy=\"128\" r=\"3\"/>\n          \u003c/g>\n        \u003c/svg>\n        \u003cp class=\"accroche\">LES MEILLEURS JEUX\u003cem>AU MEILLEUR PRIX\u003c/em>\u003csmall>Les meilleurs jeux, à petit prix.\u003c/small>\u003c/p>\n      \u003c/a>\n\n      \u003ch2 class=\"titre-section\">Continuer à jouer\u003c/h2>\n      \u003ca href=\"#\" class=\"visuel derniere\" data-hors=\"Ce jeu\">\n        \u003csvg viewBox=\"0 0 368 200\" aria-hidden=\"true\">\n          \u003cdefs>\n            \u003cradialGradient id=\"halo\" cx=\"50%\" cy=\"45%\" r=\"65%\">\n              \u003cstop offset=\"0\" style=\"stop-color: var(--illu-gold-light)\"/>\n              \u003cstop offset=\".55\" style=\"stop-color: var(--illu-gold)\"/>\n              \u003cstop offset=\"1\" style=\"stop-color: var(--color-gaming-flame-dark)\"/>\n            \u003c/radialGradient>\n          \u003c/defs>\n          \u003crect width=\"368\" height=\"200\" fill=\"url(#halo)\"/>\n          \u003cg class=\"f-gold-light\" opacity=\".7\">\n            \u003cpath d=\"M40 30l40 10-36 6zM300 26l38 4-34 10zM30 150l44-6-40 16zM310 160l40 4-38 8z\"/>\n          \u003c/g>\n          \u003c!-- Silhouette de joueur casqué -->\n          \u003cpath class=\"f-gray-dark\" d=\"M150 200c0-40 14-70 34-78-14-8-20-22-18-38 2-20 16-32 34-32s32 12 34 32c2 16-4 30-18 38 20 8 34 38 34 78z\"/>\n          \u003cpath class=\"f-black\" d=\"M168 80c4-18 18-26 32-26s28 8 32 26c-10-4-20-6-32-6s-22 2-32 6z\"/>\n          \u003crect class=\"f-black\" x=\"176\" y=\"84\" width=\"48\" height=\"14\" rx=\"5\" opacity=\".8\"/>\n          \u003crect class=\"f-black\" y=\"170\" width=\"368\" height=\"30\" opacity=\".35\"/>\n        \u003c/svg>\n        \u003cspan class=\"badge badge-blanc\">Abonné\u003c/span>\n      \u003c/a>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:demo@@\n\u003c/body>\n\u003c/html>\n","02-pseudo.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 02 — Choix du pseudonyme au premier accès.\n     US : S01-01 (entrée dans la plateforme), S01-02 (pseudo unique, refus avec proposition),\n     S01-05 (historique repris de l'ancienne plateforme, possibilité de ne pas le reprendre). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Choix du pseudo\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .pseudo { padding: var(--space-2) var(--page-gutter) var(--space-6); }\n\n    /* Pictogramme d'accueil : manette orange sur pastille */\n    .picto {\n      width: 72px;\n      height: 72px;\n      border-radius: var(--radius-lg);\n      background: var(--color-primary-soft);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      margin-bottom: var(--space-5);\n    }\n    .picto svg { width: 40px; height: 40px; }\n\n    .pseudo h1 {\n      font-size: var(--font-size-xxl);\n      line-height: var(--line-height-tight);\n      margin-bottom: var(--space-2);\n    }\n    .pseudo .intro { color: var(--color-text-secondary); margin-bottom: var(--space-6); }\n\n    .etiquette { display: block; font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); margin-bottom: var(--space-2); }\n    .aide { font-size: var(--font-size-xs); color: var(--color-text-muted); margin: var(--space-2) var(--space-4) 0; }\n\n    /* Message de refus sous le champ */\n    .refus { display: none; margin-top: var(--space-3); }\n    .refus.visible { display: block; }\n    .refus .message {\n      display: flex;\n      gap: var(--space-2);\n      align-items: flex-start;\n      color: var(--color-alert);\n      font-size: var(--font-size-sm);\n      font-weight: var(--font-weight-medium);\n      margin-bottom: var(--space-3);\n    }\n    .refus .message svg { width: 18px; height: 18px; }\n    .refus p.libelle-suggestions { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); }\n\n    /* Historique repris (ancien joueur) */\n    .historique { margin: var(--space-6) 0 0; }\n    .historique .chiffres { display: flex; gap: var(--space-6); margin: var(--space-3) 0; }\n    .historique .chiffres b { display: block; font-size: var(--font-size-xl); color: var(--color-text); }\n    .historique.barre .chiffres { opacity: .4; text-decoration: line-through; }\n\n    .case {\n      display: flex;\n      align-items: center;\n      gap: var(--space-3);\n      min-height: var(--touch-target);\n      font-size: var(--font-size-sm);\n      color: var(--color-text);\n      cursor: pointer;\n    }\n    .case input { width: 20px; height: 20px; accent-color: var(--color-primary); flex-shrink: 0; }\n\n    .pied { padding: var(--space-3) var(--page-gutter) var(--space-6); flex-shrink: 0; }\n    .pied .mention { font-size: var(--font-size-xs); color: var(--color-text-muted); text-align: center; margin-top: var(--space-3); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n\n    \u003cheader class=\"entete-esport\">\n      \u003cbutton class=\"bouton-icone\" data-action=\"retour\" data-repli=\"00c\" aria-label=\"Retour au Game corner\">\n        \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M10.6 5.3 12 6.7 7.7 11H20v2H7.7l4.3 4.3-1.4 1.4L3.9 12z\"/>\u003c/svg>\n      \u003c/button>\n    \u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"pseudo\">\n        \u003cdiv class=\"picto\" id=\"picto\">\u003c/div>\n        \u003ch1>Choisis ton pseudo\u003c/h1>\n        \u003cp class=\"intro\">C'est ton nom dans les tournois. Il est visible par tous les joueurs, dans tous les pays.\u003c/p>\n\n        \u003clabel class=\"etiquette\" for=\"saisie\">Pseudo\u003c/label>\n        \u003cdiv class=\"champ\" id=\"champ\">\n          \u003cinput id=\"saisie\" type=\"text\" maxlength=\"16\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Ex. : Atlas_Gamer\">\n        \u003c/div>\n        \u003cp class=\"aide\">3 à 16 caractères : lettres, chiffres, « _ » et « . ». Modifiable une fois tous les 30 jours.\u003c/p>\n\n        \u003c!-- Refus « pseudo déjà pris » avec proposition de rechange (S01-02) -->\n        \u003cdiv class=\"refus\" id=\"refus\" role=\"alert\">\n          \u003cp class=\"message\" id=\"message-refus\">\u003c/p>\n          \u003cp class=\"libelle-suggestions\" id=\"libelle-suggestions\">Disponibles :\u003c/p>\n          \u003cdiv class=\"puces puces-retour\" id=\"suggestions\">\u003c/div>\n        \u003c/div>\n\n        \u003c!-- Ancien joueur : historique repris (S01-05) -->\n        \u003csection class=\"encart historique\" id=\"historique\" aria-labelledby=\"titre-historique\">\n          \u003cdiv>\n            \u003cstrong id=\"titre-historique\">Bon retour, \u003cspan id=\"prenom\">\u003c/span> !\u003c/strong>\n            \u003cp>Ton historique de l'ancienne plateforme a été repris.\u003c/p>\n            \u003cp class=\"chiffres\">\n              \u003cspan>\u003cb id=\"nb-tournois\">\u003c/b>tournois joués\u003c/span>\n              \u003cspan>\u003cb id=\"nb-victoires\">\u003c/b>victoires\u003c/span>\n            \u003c/p>\n            \u003clabel class=\"case\">\n              \u003cinput type=\"checkbox\" id=\"ne-pas-reprendre\">\n              Ne pas reprendre mon historique\n            \u003c/label>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n    \u003c/main>\n\n    \u003cdiv class=\"pied\">\n      \u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"valider\">Valider mon pseudo\u003c/button>\n      \u003cp class=\"mention\">Seuls ton pseudo et tes résultats sont visibles des autres joueurs.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const saisie = document.getElementById(\"saisie\");\n  const champ = document.getElementById(\"champ\");\n  const refus = document.getElementById(\"refus\");\n  const historique = DONNEES.joueur.historiqueRepris;\n\n  document.getElementById(\"picto\").innerHTML = Esport.icone(\"manette\", \"f-primary\");\n  document.getElementById(\"prenom\").textContent = DONNEES.joueur.prenom;\n  document.getElementById(\"nb-tournois\").textContent = historique.tournois;\n  document.getElementById(\"nb-victoires\").textContent = historique.victoires;\n\n  // L'ancien pseudo est proposé d'office : il est déjà pris sur la nouvelle plateforme (S01-05)\n  saisie.value = DONNEES.joueur.pseudo;\n\n  /* Le pseudo est-il déjà pris ? (comparaison sans tenir compte des majuscules) */\n  function estPris(pseudo) {\n    return DONNEES.pseudosPris.some((p) => p.toLowerCase() === pseudo.toLowerCase());\n  }\n\n  /* Trois propositions de rechange libres, construites à partir du pseudo saisi */\n  function suggestions(base) {\n    const racine = base.replace(/[^A-Za-z0-9_.]/g, \"\").slice(0, 12) || \"Joueur\";\n    return [racine + \"_212\", racine + \".MA\", racine + \"7\"].filter((p) => !estPris(p));\n  }\n\n  function afficherRefus(message, propositions) {\n    champ.classList.add(\"erreur\");\n    document.getElementById(\"message-refus\").innerHTML = Esport.icone(\"alerte\", \"f-alert\") + \"\u003cspan>\" + message + \"\u003c/span>\";\n    document.getElementById(\"libelle-suggestions\").style.display = propositions.length ? \"\" : \"none\";\n    document.getElementById(\"suggestions\").innerHTML = propositions\n      .map((p) => '\u003cbutton class=\"puce\" data-suggestion=\"' + p + '\">' + p + \"\u003c/button>\").join(\"\");\n    refus.classList.add(\"visible\");\n  }\n\n  function masquerRefus() {\n    champ.classList.remove(\"erreur\");\n    refus.classList.remove(\"visible\");\n  }\n\n  // Toucher une proposition la place dans le champ\n  document.getElementById(\"suggestions\").addEventListener(\"click\", (e) => {\n    const bouton = e.target.closest(\"[data-suggestion]\");\n    if (!bouton) return;\n    saisie.value = bouton.dataset.suggestion;\n    masquerRefus();\n    saisie.focus();\n  });\n\n  saisie.addEventListener(\"input\", masquerRefus);\n\n  // Cocher « Ne pas reprendre » barre les chiffres repris\n  document.getElementById(\"ne-pas-reprendre\").addEventListener(\"change\", (e) => {\n    document.getElementById(\"historique\").classList.toggle(\"barre\", e.target.checked);\n  });\n\n  document.getElementById(\"valider\").addEventListener(\"click\", () => {\n    const pseudo = saisie.value.trim();\n    if (!/^[A-Za-z0-9_.]{3,16}$/.test(pseudo)) {\n      afficherRefus(\"Ton pseudo doit faire de 3 à 16 caractères : lettres, chiffres, « _ » ou « . ».\", []);\n      return;\n    }\n    if (estPris(pseudo)) {\n      afficherRefus(\"« \" + pseudo + \" » est déjà pris. Choisis-en un autre.\", suggestions(pseudo));\n      return;\n    }\n    // Pseudo accepté : premier accès terminé, on entre dans la plateforme\n    Etat.set(\"pseudo\", pseudo);\n    Etat.set(\"historiqueNonRepris\", document.getElementById(\"ne-pas-reprendre\").checked);\n    Etat.set(\"premierAcces\", false);\n    Nav.aller(\"03\", null, { bienvenue: \"1\" });\n  });\n\n  saisie.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Enter\") document.getElementById(\"valider\").click();\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","03-accueil.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 03 — Accueil e-sport.\n     US : S05-01 (prochaine échéance de mes tournois), S05-02 (tournois réservés visibles avec leur condition),\n     S11-01 (ce que débloque l'abonnement, sans jamais s'imposer), S10-02 (contenus réservés verrouillés),\n     S08-02 (rubrique vidéo masquée si la fonction est désactivée dans le pays). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Accueil e-sport\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    /* En-tête façon Max it : avatar, salutation, notifications */\n    .entete-accueil { padding-right: var(--space-2); }\n    .entete-accueil .avatar { margin-right: var(--space-2); }\n    .salutation { flex: 1; min-width: 0; line-height: var(--line-height-tight); }\n    .salutation small { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .salutation b { font-size: var(--font-size-lg); }\n\n    /* Lignes d'échéances secondaires */\n    .autres-echeances { margin: var(--space-3) var(--page-gutter) 0; display: flex; flex-direction: column; gap: var(--space-2); }\n    .echeance-ligne {\n      display: flex;\n      align-items: center;\n      gap: var(--space-3);\n      padding: var(--space-3);\n      border-radius: var(--radius-md);\n      background: var(--color-surface-warm);\n      font-size: var(--font-size-sm);\n    }\n    .echeance-ligne.alerte { background: var(--color-primary-soft); }\n    .echeance-ligne .ligne-corps b { font-size: var(--font-size-md); }\n    .echeance-ligne > svg { width: 20px; height: 20px; }\n\n    /* Tuiles des jeux */\n    .tuile-jeu { width: 104px; display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); text-align: center; line-height: var(--line-height-tight); }\n    .tuile-jeu .visuel-jeu { width: 104px; height: 104px; }\n    .tuile-jeu .visuel-jeu svg { width: 44px; height: 44px; }\n\n    /* Encart abonnement (joueur gratuit) : discret, dans le fil, jamais en surimpression */\n    .encart-offre { margin: var(--space-6) var(--page-gutter) 0; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface-warm); }\n    .encart-offre h2 { font-size: var(--font-size-lg); margin-bottom: var(--space-3); }\n    .encart-offre ul { list-style: none; display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); font-size: var(--font-size-sm); }\n    .encart-offre li { display: flex; gap: var(--space-2); align-items: center; }\n    .encart-offre li svg { width: 18px; height: 18px; }\n    .encart-offre .pied-offre { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }\n    .encart-offre .prix-des { font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .encart-offre .prix-des b { display: block; font-size: var(--font-size-lg); color: var(--color-text); }\n\n    /* Abonné : rappel compact de l'abonnement */\n    .rappel-abonnement { margin-top: var(--space-6); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n\n    \u003cheader class=\"entete-esport entete-accueil\">\n      \u003ca href=\"00c-maxit-gaming.html\" class=\"bouton-icone\" aria-label=\"Retour au Game corner\">\n        \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M10.6 5.3 12 6.7 7.7 11H20v2H7.7l4.3 4.3-1.4 1.4L3.9 12z\"/>\u003c/svg>\n      \u003c/a>\n      \u003cspan class=\"avatar avatar-moi\" id=\"initiale\">\u003c/span>\n      \u003cspan class=\"salutation\">\u003csmall>E-sport · \u003cspan id=\"nom-pays\">\u003c/span>\u003c/small>\u003cb>Salut \u003cspan id=\"pseudo\">\u003c/span>\u003c/b>\u003c/span>\n      \u003cbutton class=\"bouton-icone\" data-ecran=\"25\" aria-label=\"Notifications\">\n        \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M12 2a6 6 0 0 1 6 6v5l2 3v1H4v-1l2-3V8a6 6 0 0 1 6-6zm0 2a4 4 0 0 0-4 4v5.6L6.9 15h10.2L16 13.6V8a4 4 0 0 0-4-4zm-2 15h4a2 2 0 0 1-4 0z\"/>\u003c/svg>\n        \u003cspan class=\"pastille\" hidden>\u003c/span>\n      \u003c/button>\n    \u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003c!-- Prochaine échéance (S05-01) -->\n      \u003csection aria-label=\"Ta prochaine échéance\" id=\"echeances\">\u003c/section>\n\n      \u003ch2 class=\"titre-section\">À la une\n        \u003ca href=\"#\" class=\"voir-tout\" data-ecran=\"04\">Calendrier\u003c/a>\n      \u003c/h2>\n      \u003cdiv class=\"carrousel\" id=\"une\">\u003c/div>\n\n      \u003ch2 class=\"titre-section\">Jeux\u003c/h2>\n      \u003cdiv class=\"carrousel\" id=\"jeux\">\u003c/div>\n\n      \u003c!-- Ce que débloque l'abonnement (S11-01) : joueur gratuit seulement -->\n      \u003cdiv id=\"abonnement\">\u003c/div>\n\n      \u003ch2 class=\"titre-section\">Derniers contenus\n        \u003ca href=\"#\" class=\"voir-tout\" data-ecran=\"20\">Voir tout\u003c/a>\n      \u003c/h2>\n      \u003cdiv id=\"contenus\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"03\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- Prochaine échéance : mon prochain match, puis les autres tournois où je suis inscrit ---- */\n  function rendreEcheances() {\n    const moi = Esport.pseudo();\n    let html = \"\";\n    let lignes = \"\";\n\n    DONNEES.tournois.forEach((t) => {\n      const ins = Esport.inscription(t.id);\n      const eq = t.mode === \"equipe\" ? Esport.equipe(t.id) : null;\n      if (!ins) {\n        // Équipe en constitution : pas encore inscrite (S04-03)\n        if (eq && t.etat === \"ouvert\") {\n          lignes += '\u003ca href=\"#\" class=\"echeance-ligne\" data-ecran=\"10\" data-id=\"' + t.id + '\">' +\n            Esport.icone(\"groupe\", \"f-text\") +\n            '\u003cspan class=\"ligne-corps\">\u003cb>' + eq.nom + \" · \" + eq.membres.length + \"/\" + Esport.tailleEquipe(t) + \"\u003c/b>\" +\n            \"À compléter avant le \" + Esport.jourCourt(t.cloture) + \" pour \" + t.nom + \"\u003c/span>\" +\n            Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n        }\n        return;\n      }\n      // Tournoi en cours : grande carte « prochain match » (état suivi par Esport.prochainMatch)\n      if (t.id === DONNEES.monMatch.tournoi) {\n        const p = Esport.prochainMatch();\n        if (p) { html += Esport.carteProchainMatch(p); return; }\n      }\n      if (t.etat === \"termine\") return;\n\n      // Autres échéances : règlement à réaccepter, début du tournoi, rang en liste d'attente\n      if (Esport.reglementAAccepter(t)) {\n        lignes += '\u003ca href=\"#\" class=\"echeance-ligne alerte\" data-ecran=\"06\" data-id=\"' + t.id + '\">' +\n          Esport.icone(\"alerte\", \"f-primary\") +\n          '\u003cspan class=\"ligne-corps\">\u003cb>' + t.nom + \"\u003c/b>Règlement modifié : nouvelle acceptation requise\u003c/span>\" +\n          Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n      } else if (ins.etat === \"inscrit\") {\n        lignes += '\u003ca href=\"#\" class=\"echeance-ligne\" data-ecran=\"06\" data-id=\"' + t.id + '\">' +\n          Esport.icone(\"calendrier\", \"f-text\") +\n          '\u003cspan class=\"ligne-corps\">\u003cb>' + t.nom + \"\u003c/b>Début \" + Esport.jourLong(t.debut) + \" à \" + Esport.heure(t.debut) + \"\u003c/span>\" +\n          Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n      } else if (ins.etat === \"attente\") {\n        lignes += '\u003ca href=\"#\" class=\"echeance-ligne\" data-ecran=\"06\" data-id=\"' + t.id + '\">' +\n          Esport.icone(\"groupe\", \"f-text\") +\n          '\u003cspan class=\"ligne-corps\">\u003cb>' + t.nom + \"\u003c/b>Liste d'attente : tu es \" + ins.rang + \"e\u003c/span>\" +\n          Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n      }\n    });\n\n    // Aucun tournoi : invitation à parcourir le calendrier\n    if (!html && !lignes) {\n      html = '\u003cdiv class=\"carte-match\">\u003cspan class=\"flamme\">\u003c/span>' +\n        '\u003cp class=\"surtitre\">Ta prochaine échéance\u003c/p>' +\n        \"\u003ch2>Aucun tournoi en vue pour l'instant\u003c/h2>\" +\n        '\u003cdiv class=\"actions\">\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"04\">Trouver un tournoi\u003c/a>\u003c/div>\u003c/div>';\n    }\n    document.getElementById(\"echeances\").innerHTML =\n      html + (lignes ? '\u003cdiv class=\"autres-echeances\">' + lignes + \"\u003c/div>\" : \"\");\n  }\n\n  /* ---- Tournois à la une : à venir, réservés aux abonnés et MEA en premier (S05-02, S03-07) ---- */\n  function rendreUne() {\n    const ordre = (t) => (t.portee === \"MEA\" ? 0 : 1) + (t.acces === \"abonnes\" ? 0 : 1);\n    const tournois = Esport.tournoisDuPays()\n      .filter((t) => t.etat === \"ouvert\")\n      .sort((a, b) => ordre(a) - ordre(b) || a.debut.localeCompare(b.debut))\n      .slice(0, 5);\n    document.getElementById(\"une\").innerHTML = tournois.map(Esport.carteUne).join(\"\");\n  }\n\n  /* ---- Carrousel des 4 jeux ---- */\n  function rendreJeux() {\n    document.getElementById(\"jeux\").innerHTML = DONNEES.jeux.map((j) =>\n      '\u003ca href=\"#\" class=\"tuile-jeu\" data-ecran=\"13\" data-id=\"' + j.id + '\">' + Esport.visuelJeu(j.id) + j.nom + \"\u003c/a>\"\n    ).join(\"\");\n  }\n\n  /* ---- Abonnement : encart pour le joueur gratuit, rappel pour l'abonné ---- */\n  function rendreAbonnement() {\n    const zone = document.getElementById(\"abonnement\");\n    if (Esport.abonne()) {\n      // Abonné (actif ou résilié) : rappel compact, jamais d'invitation à s'abonner (S11-03)\n      const a = Esport.etatAbonnement();\n      zone.innerHTML = '\u003ca href=\"#\" class=\"encart rappel-abonnement\" data-ecran=\"24\">' +\n        Esport.icone(\"coche\", \"f-success-dark\") +\n        \"\u003cdiv>\u003cstrong>\" + Esport.nomOffre(a.offre).replace(/^a/, \"A\") + (a.statut === \"resilie\" ? \" résilié\" : \" actif\") + \"\u003c/strong>\u003cp>\" +\n        (a.statut === \"resilie\" ? \"Accès conservé jusqu'au \" : \"Jusqu'au \") + Esport.jourCourt(a.echeance) + \" · tous les tournois et contenus sont ouverts\u003c/p>\u003c/div>\u003c/a>\";\n      return;\n    }\n    const offres = DONNEES.offres[DONNEES.joueur.pays];\n    const moinsCher = offres[0];\n    const essai = offres.find((o) => o.essai);\n    const coche = Esport.icone(\"coche\", \"f-primary\");\n    zone.innerHTML =\n      '\u003csection class=\"encart-offre\" aria-labelledby=\"titre-offre\">' +\n      '\u003ch2 id=\"titre-offre\">Ce que débloque l\\'abonnement\u003c/h2>\u003cul>' +\n      \"\u003cli>\" + coche + \"Les tournois réservés aux abonnés, dont les tournois MEA\u003c/li>\" +\n      \"\u003cli>\" + coche + \"Toutes les vidéos et analyses exclusives\u003c/li>\" +\n      \"\u003cli>\" + coche + \"Les dotations des tournois abonnés\u003c/li>\" +\n      \"\u003c/ul>\" +\n      '\u003cdiv class=\"pied-offre\">\u003cspan class=\"prix-des\">À partir de\u003cb>' + Esport.prix(moinsCher.prix) + \" / \" + moinsCher.libelle.toLowerCase() + \"\u003c/b>\" +\n      (essai ? essai.essai + \" sur l'offre au \" + essai.libelle.toLowerCase() : \"\") + \"\u003c/span>\" +\n      '\u003ca href=\"#\" class=\"bouton bouton-secondaire\" data-ecran=\"21\" data-origine>Voir les offres\u003c/a>\u003c/div>' +\n      \"\u003c/section>\";\n  }\n\n  /* ---- Derniers contenus : verrou pour le joueur gratuit, vidéos masquées si désactivées (S08-02) ---- */\n  function rendreContenus() {\n    document.getElementById(\"contenus\").innerHTML =\n      Esport.contenusVisibles().slice(0, 4).map(Esport.ligneContenu).join(\"\");\n  }\n\n  function rendre() {\n    const pseudo = Esport.pseudo();\n    document.getElementById(\"pseudo\").textContent = pseudo;\n    document.getElementById(\"initiale\").textContent = pseudo[0];\n    document.getElementById(\"nom-pays\").textContent = Esport.pays().nom;\n    rendreEcheances();\n    rendreUne();\n    rendreJeux();\n    rendreAbonnement();\n    rendreContenus();\n  }\n  Esport.monter(rendre);\n\n  // Arrivée depuis le choix du pseudo (02)\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    if (Nav.param(\"bienvenue\")) Nav.toast(\"Bienvenue \" + Esport.pseudo() + \" !\");\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","04-calendrier.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 04 — Calendrier des tournois, recherche et filtres.\n     US : S05-01 (tournois du pays, du plus proche au plus lointain, recherche, filtres, inscriptions closes visibles),\n     S05-02 (le joueur gratuit voit aussi les tournois réservés, avec leur condition d'accès),\n     S03-04 (badge « Réservé aux abonnés »), S03-07 (tournois MEA ouverts dans le pays du joueur). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Calendrier des tournois\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .barre-recherche { display: flex; gap: var(--space-2); padding: 0 var(--page-gutter) var(--space-3); }\n    .barre-recherche .champ { flex: 1; }\n    .bouton-filtres {\n      width: 48px;\n      height: 48px;\n      border-radius: var(--radius-round);\n      border: 1px solid var(--color-border);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      position: relative;\n      flex-shrink: 0;\n    }\n    .bouton-filtres svg { width: 22px; height: 22px; }\n    .bouton-filtres.actif { border-color: var(--color-primary); background: var(--color-primary-soft); }\n    .bouton-filtres .pastille { top: -2px; right: -2px; background: var(--color-primary); }\n\n    .resume { font-size: var(--font-size-sm); color: var(--color-text-secondary); padding: var(--space-4) var(--page-gutter) 0; }\n    .titre-groupe { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); color: var(--color-text-secondary);
