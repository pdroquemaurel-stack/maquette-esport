<!DOCTYPE html>
<!-- Écran f06 — Achat d'un Pass data de la Fan Zone (f06-achat.html?offre=fan-2go).
     Récapitulatif (data et add-on Fan Zone), choix du moyen de paiement (Orange Money ou crédit), « Confirmer et payer »,
     paiement simulé, puis confirmation : codes EA FC Mobile reçus (dans la limite de 2 par utilisateur) et chances
     ajoutées au Grand Tirage (5 au plus grâce aux achats). Offre inconnue : Pass Fan 2 Go. Retour → f05. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmer l'achat</title>
  <link rel="stylesheet" href="css/tokens.css?v=f8ec85a1">
  <link rel="stylesheet" href="css/style.css?v=f8ec85a1">
</head>
<body data-zone="fanzone">
<div class="cadre">
  <div class="telephone sombre fanzone">
    <div class="barre-etat" data-heure="18:30"></div>
    <div id="entete"></div>
    <main class="contenu" id="page"></main>
  </div>
</div>

<script src="js/nav.js?v=f8ec85a1"></script>
<script src="js/data-fanzone.js?v=f8ec85a1"></script>
<script src="js/fanzone.js?v=f8ec85a1"></script>
<script src="js/demo.js?v=f8ec85a1"></script>
<script>
  const OFFRE = Fz.offre(Nav.param("offre")) || Fz.offre("fan-2go");
  document.getElementById("entete").innerHTML = Fz.entete("Confirmer l'achat", "f05-bundle.html");

  const MOYENS = [
    { id: "om", nom: "Orange Money", detail: "Payé depuis ton compte Orange Money", logo: "OM" },
    { id: "credit", nom: "Crédit", detail: "Débité de ton crédit de communication", logo: null }
  ];
  let moyen = "om";
  let phase = "choix";        // choix, paiement, confirme
  let codesRecus = 0;         // codes EA FC Mobile reçus avec ce pass (plafond par utilisateur)
  let chancesRecues = 0;      // chances ajoutées au Grand Tirage (plafond des achats)

  function confirmation() {
    let html = '<div class="fz-succes" role="status"><div class="fz-rond-succes">' + Fz.icone("coche", "f-fz-neon") + "</div><h2>Achat confirmé</h2>" +
      "<p>Tes " + OFFRE.data + " sont ajoutés à ton forfait Orange.</p>";
    if (OFFRE.codes) {
      html += codesRecus === OFFRE.codes
        ? "<p>" + (codesRecus > 1 ? "Tes " + codesRecus + " codes sont disponibles" : "Ton code est disponible") + " dans Mes codes.</p>"
        : codesRecus > 0
          ? "<p>Ton code est disponible dans Mes codes : tu as atteint " + FANZONE.codesMax + " codes, le maximum par utilisateur.</p>"
          : "<p>Tu as déjà " + FANZONE.codesMax + " codes EA FC Mobile : ce pass n'en ajoute pas.</p>";
    }
    html += chancesRecues > 0
      ? '<p class="fz-gain">' + Fz.icone("manette", "f-fz-neon") + "+" + Fz.nbChances(chancesRecues) + " au Grand Tirage : tu as " + Fz.nbChances(Fz.chances().total) + ".</p>" +
        (chancesRecues < OFFRE.chances ? "<p>Tu as atteint " + FANZONE.tirage.plafondAchats + " chances grâce aux Pass data.</p>" : "")
      : "<p>Tu as déjà " + FANZONE.tirage.plafondAchats + " chances grâce aux Pass data : celui-ci n'en ajoute pas.</p>";
    html += "</div>" +
      '<div class="fz-actions">' +
      (codesRecus ? '<a href="f07-mes-codes.html" class="bouton bouton-primaire bouton-pleine-largeur">Voir mes codes</a>' : "") +
      '<a href="f13-tirage.html" class="bouton ' + (codesRecus ? "fz-contour" : "bouton-primaire") + ' bouton-pleine-largeur">Mes chances au Grand Tirage</a>' +
      '<a href="f01-accueil.html" class="bouton fz-contour bouton-pleine-largeur">Retour à la Fan Zone</a></div>';
    return html;
  }

  function recapitulatif() {
    const codesRestants = Math.max(0, FANZONE.codesMax - Fz.codes().length);
    const chancesRestantes = Math.max(0, FANZONE.tirage.plafondAchats - Fz.chances().achats);
    const codes = Math.min(OFFRE.codes, codesRestants);
    const chances = Math.min(OFFRE.chances, chancesRestantes);
    return '<div class="fz-carte"><h2>' + OFFRE.nom + "</h2>" +
      '<div class="fz-ligne-recap"><span>Data</span><span>' + OFFRE.data + "</span></div>" +
      (OFFRE.codes ? '<div class="fz-ligne-recap"><span>Codes EA FC Mobile</span><span>' +
        (codes ? codes + " code" + (codes > 1 ? "s" : "") : "Maximum atteint") + "</span></div>" : "") +
      '<div class="fz-ligne-recap"><span>Grand Tirage console</span><span>' + (chances ? "+" + Fz.nbChances(chances) : "Maximum atteint") + "</span></div>" +
      '<div class="fz-ligne-recap total"><span>Total TTC</span><span>' + Fz.prix(OFFRE) + "</span></div></div>" +
      '<h2 class="fz-question">Moyen de paiement</h2>' +
      '<div role="radiogroup" aria-label="Moyen de paiement">' + MOYENS.map((m) =>
        '<button class="fz-moyen' + (m.id === moyen ? " actif" : "") + '" role="radio" aria-checked="' + (m.id === moyen) + '" data-moyen="' + m.id + '">' +
        '<span class="fz-logo-moyen">' + (m.logo || Fz.icone("bundle")) + "</span>" +
        "<span><b>" + m.nom + "</b><small>" + m.detail + "</small></span>" +
        '<span class="fz-radio"></span></button>').join("") + "</div>" +
      '<div class="fz-actions"><button class="bouton bouton-primaire bouton-pleine-largeur" data-payer>Confirmer et payer ' + Fz.prix(OFFRE) + "</button></div>" +
      '<p class="fz-mention">En confirmant, tu acceptes les conditions de l\'offre.' +
      (OFFRE.codes ? " Codes valables uniquement sur EA FC Mobile, jusqu'au " + FANZONE.validiteCodes + ", " + FANZONE.codesMax + " codes max par utilisateur." : "") +
      " " + FANZONE.tirage.plafondAchats + " chances max au Grand Tirage grâce aux achats.</p>";
  }

  function rendre() {
    let html = '<div class="fz-page">';
    if (phase === "paiement") {
      html += '<div class="fz-spinner"></div><p class="fz-centre">Paiement en cours avec ' + MOYENS.find((m) => m.id === moyen).nom + "…</p>";
    } else if (phase === "confirme") {
      html += confirmation();
    } else {
      html += recapitulatif();
    }
    document.getElementById("page").innerHTML = html + "</div>";
  }

  document.getElementById("page").addEventListener("click", (evenement) => {
    const choix = evenement.target.closest("[data-moyen]");
    if (choix) {
      moyen = choix.dataset.moyen;
      rendre();
    } else if (evenement.target.closest("[data-payer]")) {
      phase = "paiement";
      rendre();
      setTimeout(() => {
        // Paiement accepté : la data est ajoutée ; l'add-on donne ses codes et ses chances, dans la limite des plafonds
        phase = "confirme";
        for (let i = 0; i < OFFRE.codes; i++) if (Fz.ajouterCode("Pass data " + OFFRE.data)) codesRecus++;
        chancesRecues = Fz.ajouterChancesAchat(OFFRE.chances);
        rendre();
      }, 1500);
    }
  });

  Fz.monter(rendre);
</script>
</body>
</html>
