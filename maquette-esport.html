erit; text-decoration: none; }\nsvg { display: block; flex-shrink: 0; }\n\n/* Classes de remplissage pour les SVG (les attributs fill n'acceptent pas var()) */\n.f-primary { fill: var(--color-primary); }\n.f-primary-soft { fill: var(--color-primary-soft); }\n.f-white { fill: var(--color-on-primary); }\n.f-text { fill: var(--color-text); }\n.f-muted { fill: var(--color-text-muted); }\n.f-alert { fill: var(--color-alert); }\n.f-success { fill: var(--color-success); }\n.f-success-dark { fill: var(--color-success-dark); }\n.f-warning { fill: var(--color-warning); }\n.f-blue { fill: var(--color-game-blue); }\n.f-green { fill: var(--color-game-green); }\n.f-purple { fill: var(--color-game-purple); }\n.f-flame-dark { fill: var(--color-gaming-flame-dark); }\n.f-sky { fill: var(--illu-sky); }\n.f-sand { fill: var(--illu-sand); }\n.f-terracotta { fill: var(--illu-terracotta); }\n.f-palm { fill: var(--illu-palm); }\n.f-car { fill: var(--illu-car-red); }\n.f-skin { fill: var(--illu-skin); }\n.f-hair { fill: var(--illu-hair); }\n.f-gray-light { fill: var(--illu-gray-light); }\n.f-gray { fill: var(--illu-gray); }\n.f-gray-dark { fill: var(--illu-gray-dark); }\n.f-black { fill: var(--illu-black); }\n.f-gold { fill: var(--illu-gold); }\n.f-gold-light { fill: var(--illu-gold-light); }\n.f-bill { fill: var(--illu-bill-green); }\n.f-pink { fill: var(--illu-neon-pink); }\n.f-purple-deep { fill: var(--illu-purple-deep); }\n.f-purple-dark { fill: var(--illu-purple-dark); }\n.s-text { stroke: var(--color-text); }\n.s-white { stroke: var(--color-on-primary); }\n.s-primary { stroke: var(--color-primary); }\n.s-blue { stroke: var(--color-game-blue); }\n.s-pink { stroke: var(--illu-neon-pink); }\n.s-yellow { stroke: var(--color-warning); }\n.s-purple { stroke: var(--color-game-purple); }\n\n/* ============ Cadre de téléphone ============ */\n/* Sur ordinateur : téléphone centré. Sur mobile : plein écran. */\n.cadre {\n  min-height: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: var(--space-6);\n}\n\n.telephone {\n  position: relative;\n  width: var(--screen-width);\n  height: var(--screen-height);\n  background: var(--color-bg);\n  border-radius: 48px;\n  border: 10px solid var(--illu-black);\n  box-shadow: var(--shadow-raised);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n}\n\n@media (max-width: 480px) {\n  .cadre { padding: 0; }\n  .telephone {\n    width: 100%;\n    height: 100vh;\n    height: 100dvh;\n    border: 0;\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n/* Thème sombre (univers Gaming) */\n.telephone.sombre { background: var(--color-bg-dark); color: var(--color-text-on-dark); }\n\n/* ============ Barre d'état du téléphone ============ */\n.barre-etat {\n  height: var(--status-bar-height);\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 var(--space-6);\n  font-size: var(--font-size-sm);\n  font-weight: var(--font-weight-bold);\n  position: relative;\n  z-index: 30;\n}\n.barre-etat .icones-systeme { display: flex; gap: var(--space-1); align-items: center; }\n.barre-etat svg { width: 16px; height: 16px; }\n.sombre .barre-etat svg .f-text { fill: var(--color-text-on-dark); }\n\n/* ============ Zone de contenu défilante ============ */\n.contenu {\n  flex: 1;\n  overflow-y: auto;\n  overflow-x: hidden;\n  scrollbar-width: none;\n}\n.contenu::-webkit-scrollbar { display: none; }\n\n/* ============ Boutons icône (zone tactile 44 px) ============ */\n.bouton-icone {\n  width: var(--touch-target);\n  height: var(--touch-target);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  border-radius: var(--radius-round);\n}\n.bouton-icone svg { width: var(--icon-size); height: var(--icon-size); }\n\n.pastille {\n  position: absolute;\n  top: 6px;\n  right: 6px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: var(--radius-pill);\n  background: var(--color-alert);\n  color: var(--color-on-primary);\n  font-size: 10px;\n  font-weight: var(--font-weight-bold);\n  line-height: 16px;\n  text-align: center;\n}\n\n/* ============ Titres de section ============ */\n.titre-section {\n  font-size: var(--font-size-xl);\n  font-weight: var(--font-weight-bold);\n  line-height: var(--line-height-tight);\n  display: flex;\n  align-items: center;\n  gap: var(--space-2);\n  padding: 0 var(--page-gutter);\n  margin: var(--space-6) 0 var(--space-3);\n}\n\n/* ============ Carrousel horizontal ============ */\n.carrousel {\n  display: flex;\n  gap: var(--space-3);\n  overflow-x: auto;\n  padding: 0 var(--page-gutter);\n  scroll-snap-type: x mandatory;\n  scrollbar-width: none;\n}\n.carrousel::-webkit-scrollbar { display: none; }\n.carrousel > * { scroll-snap-align: start; flex-shrink: 0; }\n\n/* ============ Badges ============ */\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-1);\n  height: 28px;\n  padding: 0 var(--space-3);\n  border-radius: var(--radius-pill);\n  font-size: var(--font-size-sm);\n  font-weight: var(--font-weight-bold);\n}\n.badge svg { width: 14px; height: 14px; }\n.badge-succes { background: var(--color-success-dark); color: var(--color-on-primary); }\n.badge-blanc { background: var(--color-surface); color: var(--color-text); }\n\n/* ============ Boutons ============ */\n.bouton {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  min-height: var(--touch-target);\n  padding: 0 var(--space-5);\n  border-radius: var(--radius-pill);\n  font-weight: var(--font-weight-bold);\n  font-size: var(--font-size-md);\n}\n.bouton-primaire { background: var(--color-primary); color: var(--color-on-primary); }\n.bouton-primaire:active { background: var(--color-primary-pressed); }\n.bouton-secondaire { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border-strong); }\n.bouton-pleine-largeur { width: 100%; }\n\n.bouton-rond-orange {\n  width: var(--touch-target);\n  height: var(--touch-target);\n  border-radius: var(--radius-round);\n  background: var(--color-primary);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n.bouton-rond-orange svg { width: 20px; height: 20px; }\n\n/* ============ Barre de navigation du bas (Max it) ============ */\n.nav-bas {\n  height: var(--bottom-nav-height);\n  flex-shrink: 0;\n  display: flex;\n  align-items: stretch;\n  justify-content: space-around;\n  background: var(--color-surface);\n  box-shadow: var(--shadow-nav);\n  padding: 0 var(--space-2);\n  position: relative;\n  z-index: 10;\n}\n.nav-bas .onglet {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 2px;\n  font-size: var(--font-size-xs);\n  color: var(--color-text-secondary);\n  font-weight: var(--font-weight-medium);\n  min-width: var(--touch-target);\n}\n.nav-bas .onglet .icone-onglet {\n  width: 48px;\n  height: 30px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: var(--radius-pill);\n}\n.nav-bas .onglet svg { width: 22px; height: 22px; }\n.nav-bas .onglet.actif { color: var(--color-primary); font-weight: var(--font-weight-bold); }\n.nav-bas .onglet.actif .icone-onglet { background: var(--color-primary-soft); }\n\n/* Bouton central orange en saillie */\n.nav-bas .onglet-central { justify-content: flex-start; }\n.nav-bas .bouton-central {\n  width: var(--bottom-nav-fab-size);\n  height: var(--bottom-nav-fab-size);\n  margin-top: -14px;\n  border-radius: var(--radius-round);\n  background: var(--color-primary);\n  box-shadow: var(--shadow-fab);\n  border: 4px solid var(--color-surface);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.nav-bas .bouton-central svg { width: 26px; height: 26px; }\n\n/* ============ Feuille modale ============ */\n.voile {\n  position: absolute;\n  inset: 0;\n  background: var(--color-overlay);\n  z-index: 50;\n  display: none;\n}\n.voile.ouvert { display: block; }\n\n.feuille {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  max-height: 85%;\n  background: var(--color-surface);\n  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;\n  padding: var(--space-3) var(--page-gutter) var(--space-6);\n  overflow-y: auto;\n  color: var(--color-text);\n}\n.poignee {\n  width: 40px;\n  height: 5px;\n  border-radius: var(--radius-pill);\n  background: var(--color-border-strong);\n  margin: 0 auto var(--space-4);\n}\n\n/* Boîte de dialogue centrée (messages bloquants) */\n.dialogue {\n  position: absolute;\n  left: var(--space-6);\n  right: var(--space-6);\n  top: 50%;\n  transform: translateY(-50%);\n  background: var(--color-surface);\n  color: var(--color-text);\n  border-radius: var(--radius-lg);\n  padding: var(--space-6);\n  text-align: center;\n  box-shadow: var(--shadow-raised);\n}\n.dialogue h2 { font-size: var(--font-size-lg); margin: var(--space-3) 0 var(--space-2); }\n.dialogue p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--space-5); }\n.dialogue .icone-dialogue {\n  width: 56px;\n  height: 56px;\n  margin: 0 auto;\n  border-radius: var(--radius-round);\n  background: var(--color-primary-soft);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.dialogue .icone-dialogue svg { width: 28px; height: 28px; }\n.dialogue .bouton + .bouton { margin-top: var(--space-2); }\n\n/* ============ Message éphémère ============ */\n.toast {\n  position: absolute;\n  left: var(--space-6);\n  right: var(--space-6);\n  bottom: calc(var(--bottom-nav-height) + var(--space-4));\n  background: var(--illu-black);\n  color: var(--color-text-on-dark);\n  font-size: var(--font-size-sm);\n  padding: var(--space-3) var(--space-4);\n  border-radius: var(--radius-sm);\n  text-align: center;\n  z-index: 60;\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity .2s, transform .2s;\n  pointer-events: none;\n}\n.toast.visible { opacity: 1; transform: none; }\n\n/* ============ Menu de démonstration ============ */\n.demo-bouton {\n  width: 28px;\n  height: 28px;\n  border-radius: var(--radius-round);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  opacity: .55;\n  /* Zone tactile élargie sans grossir l'icône */\n  position: relative;\n}\n.demo-bouton::after { content: \"\"; position: absolute; inset: -8px; }\n.demo-bouton:hover { opacity: 1; }\n.demo-bouton svg { width: 16px; height: 16px; }\n.sombre .demo-bouton .f-text { fill: var(--color-text-on-dark); }\n\n.demo-titre {\n  font-size: var(--font-size-lg);\n  font-weight: var(--font-weight-bold);\n  margin-bottom: var(--space-1);\n}\n.demo-aide { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-4); }\n.demo-groupe {\n  font-size: var(--font-size-xs);\n  font-weight: var(--font-weight-bold);\n  color: var(--color-text-muted);\n  text-transform: uppercase;\n  letter-spacing: .04em;\n  margin: var(--space-5) 0 var(--space-2);\n}\n\n/* Interrupteur segmenté gratuit / abonné */\n.segment {\n  display: flex;\n  background: var(--color-bg-muted);\n  border-radius: var(--radius-pill);\n  padding: var(--space-1);\n}\n.segment button {\n  flex: 1;\n  min-height: 40px;\n  border-radius: var(--radius-pill);\n  font-weight: var(--font-weight-bold);\n  font-size: var(--font-size-sm);\n  color: var(--color-text-secondary);\n}\n.segment button.actif { background: var(--color-primary); color: var(--color-on-primary); }\n\n/* Lignes du menu de démo */\n.demo-ligne {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-3);\n  width: 100%;\n  min-height: var(--touch-target);\n  padding: var(--space-2) 0;\n  border-bottom: 1px solid var(--color-border);\n  text-align: left;\n  font-size: var(--font-size-md);\n}\n.demo-ligne small { display: block; color: var(--color-text-muted); font-size: var(--font-size-xs); }\n.demo-ligne:disabled { color: var(--color-text-muted); cursor: default; }\n.demo-ligne .lot {\n  font-size: var(--font-size-xs);\n  color: var(--color-text-muted);\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius-pill);\n  padding: 2px var(--space-2);\n  white-space: nowrap;\n}\n.demo-ligne .fleche { width: 18px; height: 18px; }\n\n/* Interrupteur on/off */\n.inter {\n  width: 44px;\n  height: 26px;\n  border-radius: var(--radius-pill);\n  background: var(--color-border-strong);\n  position: relative;\n  flex-shrink: 0;\n  transition: background .15s;\n}\n.inter::after {\n  content: \"\";\n  position: absolute;\n  top: 3px;\n  left: 3px;\n  width: 20px;\n  height: 20px;\n  border-radius: var(--radius-round);\n  background: var(--color-surface);\n  box-shadow: var(--shadow-sm);\n  transition: transform .15s;\n}\n.inter.on { background: var(--color-primary); }\n.inter.on::after { transform: translateX(18px); }\n\n.demo-reinit {\n  margin-top: var(--space-5);\n  color: var(--color-primary);\n  font-weight: var(--font-weight-bold);\n  min-height: var(--touch-target);\n  width: 100%;\n}\n\n/* ============ Utilitaires ============ */\n.cache-visuel {\n  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;\n}\n\n/* =====================================================================\n   Plateforme e-sport (lot 2) — composants communs\n   ===================================================================== */\n\n/* ============ En-tête e-sport : retour, titre, notifications ============ */\n.entete-esport {\n  height: var(--top-bar-height);\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: var(--space-1);\n  padding: 0 var(--space-2);\n  background: var(--color-bg);\n}\n.entete-esport .entete-espace { width: var(--space-2); }\n.entete-titre {\n  flex: 1;\n  font-size: var(--font-size-xl);\n  font-weight: var(--font-weight-bold);\n  line-height: var(--line-height-tight);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n/* Libellé sous le bouton central de la barre du bas e-sport */\n.nav-bas .libelle-central { margin-top: 2px; }\n.nav-bas .libelle-central.actif { color: var(--color-primary); font-weight: var(--font-weight-bold); }\n\n/* ============ Visuels des jeux (dégradé + pictogramme, sans photo) ============ */\n.visuel-jeu {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  overflow: hidden;\n  border-radius: var(--radius-md);\n  width: 56px;\n  height: 56px;\n  flex-shrink: 0;\n}\n.visuel-jeu svg { width: 45%; height: 45%; position: relative; }\n/* Formes anguleuses, en écho au haut de l'univers Gaming */\n.visuel-forme {\n  position: absolute;\n  right: -20%;\n  top: -30%;\n  width: 70%;\n  height: 160%;\n  transform: rotate(24deg);\n  background: var(--color-glass-dark);\n}\n.jeu-freefire { background: linear-gradient(135deg, var(--color-gaming-flame-dark), var(--color-primary)); }\n.jeu-pubg { background: linear-gradient(135deg, var(--illu-black), var(--illu-gold)); }\n.jeu-efootball { background: linear-gradient(135deg, var(--color-game-green-bg), var(--color-game-green)); }\n.jeu-codm { background: linear-gradient(135deg, var(--color-game-blue-bg), var(--color-game-blue)); }\n\n.visuel-petit { width: 44px; height: 44px; border-radius: var(--radius-sm); }\n.visuel-grand { width: 100%; height: 100%; border-radius: 0; }\n.visuel-grand svg { width: 96px; height: 96px; opacity: .9; }\n.visuel-bandeau { width: 100%; height: 120px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }\n.visuel-bandeau svg { width: 56px; height: 56px; }\n\n/* ============ Puces d'état (badges des tournois) ============ */\n.puce-etat {\n  display: inline-flex;\n  align-items: center;\n  gap: 3px;\n  height: 22px;\n  padding: 0 var(--space-2);\n  border-radius: var(--radius-pill);\n  font-size: var(--font-size-xs);\n  font-weight: var(--font-weight-bold);\n  white-space: nowrap;\n}\n.puce-etat svg { width: 12px; height: 12px; }\n.puce-inscrit { background: var(--color-success-dark); color: var(--color-on-primary); }\n.puce-attente { background: var(--color-warning); color: var(--color-text); }\n.puce-reserve { background: var(--illu-black); color: var(--color-on-primary); }\n.puce-abonnes { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border-strong); }\n.puce-mea { background: var(--color-surface-warm); color: var(--color-text); }\n.puce-clos { background: var(--color-bg-muted); color: var(--color-text-secondary); }\n.puce-direct { background: var(--color-surface); color: var(--color-alert); border: 1px solid var(--color-alert); }\n.puce-direct i {\n  width: 6px;\n  height: 6px;\n  border-radius: var(--radius-round);\n  background: var(--color-alert);\n  animation: clignote 1.2s infinite;\n}\n@keyframes clignote { 50% { opacity: .2; } }\n\n/* ============ Carte de tournoi (liste) ============ */\n.carte-tournoi {\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n  padding: var(--space-3);\n  margin: 0 var(--page-gutter) var(--space-3);\n  background: var(--color-surface);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-card);\n}\n.carte-date {\n  width: 52px;\n  height: 56px;\n  flex-shrink: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  border-radius: var(--radius-sm);\n  background: var(--color-surface-warm);\n  font-size: var(--font-size-xs);\n  color: var(--color-text-secondary);\n  line-height: 1.1;\n}\n.carte-date b { font-size: var(--font-size-xl); color: var(--color-text); }\n.carte-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }\n.carte-titre { font-size: var(--font-size-md); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); }\n.carte-sous-titre { font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n.carte-badges { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); }\n.carte-badges:empty { display: none; }\n.carte-chevron { width: 20px; height: 20px; }\n\n/* ============ Carte large (carrousel « à la une ») ============ */\n.carte-une {\n  position: relative;\n  width: 280px;\n  display: flex;\n  flex-direction: column;\n  background: var(--color-surface);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-card);\n  margin-bottom: var(--space-2);\n}\n.carte-une-badges {\n  position: absolute;\n  top: var(--space-3);\n  left: var(--space-3);\n  right: var(--space-3);\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-1);\n}\n.carte-une-texte { display: flex; flex-direction: column; gap: 2px; padding: var(--space-3) var(--space-4) var(--space-4); }\n\n/* ============ Lien « Voir tout » à droite d'un titre de section ============ */\n.titre-section .voir-tout {\n  margin-left: auto;\n  font-size: var(--font-size-sm);\n  color: var(--color-primary);\n  font-weight: var(--font-weight-bold);\n  min-height: var(--touch-target);\n  display: inline-flex;\n  align-items: center;\n}\n\n/* ============ Puces de filtre (sélection) ============ */\n.puces {\n  display: flex;\n  gap: var(--space-2);\n  overflow-x: auto;\n  padding: 0 var(--page-gutter);\n  scrollbar-width: none;\n}\n.puces::-webkit-scrollbar { display: none; }\n.puces.puces-retour { flex-wrap: wrap; padding: 0; overflow: visible; }\n.puce {\n  flex-shrink: 0;\n  min-height: 36px;\n  padding: 0 var(--space-4);\n  border-radius: var(--radius-pill);\n  border: 1px solid var(--color-border-strong);\n  background: var(--color-surface);\n  font-size: var(--font-size-sm);\n  font-weight: var(--font-weight-medium);\n  white-space: nowrap;\n}\n.puce.actif {\n  background: var(--color-primary-soft);\n  border-color: var(--color-primary);\n  color: var(--color-primary);\n  font-weight: var(--font-weight-bold);\n}\n\n/* ============ Champ de saisie et recherche ============ */\n.champ {\n  display: flex;\n  align-items: center;\n  gap: var(--space-2);\n  height: 48px;\n  padding: 0 var(--space-4);\n  border-radius: var(--radius-pill);\n  border: 1px solid var(--color-border);\n  background: var(--color-surface);\n}\n.champ:focus-within { border-color: var(--color-primary); }\n.champ svg { width: 20px; height: 20px; }\n.champ input {\n  flex: 1;\n  min-width: 0;\n  border: 0;\n  outline: 0;\n  font: inherit;\n  background: none;\n  color: var(--color-text);\n}\n.champ input::placeholder { color: var(--color-text-muted); }\n.champ.erreur { border-color: var(--color-alert); }\n\n/* ============ Onglets (segment sur fond gris) ============ */\n.onglets {\n  display: flex;\n  margin: 0 var(--page-gutter);\n  background: var(--color-bg-muted);\n  border-radius: var(--radius-pill);\n  padding: var(--space-1);\n}\n.onglets button {\n  flex: 1;\n  min-height: 40px;\n  border-radius: var(--radius-pill);\n  font-size: var(--font-size-sm);\n  font-weight: var(--font-weight-bold);\n  color: var(--color-text-secondary);\n}\n.onglets button.actif { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); }\n\n/* ============ Encart d'information (bandeau) ============ */\n.encart {\n  display: flex;\n  gap: var(--space-3);\n  align-items: flex-start;\n  margin: 0 var(--page-gutter);\n  padding: var(--space-3) var(--space-4);\n  border-radius: var(--radius-md);\n  background: var(--color-surface-warm);\n  font-size: var(--font-size-sm);\n}\n.encart > svg { width: 20px; height: 20px; margin-top: 1px; }\n.encart strong { display: block; font-size: var(--font-size-md); }\n.encart p { color: var(--color-text-secondary); }\n.encart-alerte { background: var(--color-primary-soft); }\n.encart .lien-encart { color: var(--color-primary); font-weight: var(--font-weight-bold); display: inline-block; margin-top: var(--space-1); }\n\n/* ============ Lignes de liste (joueurs, contenus) ============ */\n.ligne {\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n  min-height: 56px;\n  padding: var(--space-2) var(--page-gutter);\n  border-bottom: 1px solid var(--color-border);\n}\n.ligne:last-child { border-bottom: 0; }\n.ligne-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n.ligne-titre { font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); }\n.ligne-sous-titre { font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n.ligne > svg { width: 20px; height: 20px; }\n\n/* Ligne de contenu (article ou vidéo) */\n.contenu-ligne .vignette { position: relative; }\n.contenu-ligne .vignette .lecture {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.contenu-ligne .vignette .lecture svg { width: 20px; height: 20px; }\n.contenu-ligne .ligne-titre { font-size: var(--font-size-sm); }\n.contenu-ligne .meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; margin-top: var(--space-1); font-size: var(--font-size-xs); color: var(--color-text-muted); }\n\n/* Avatar rond avec initiale (aucune photo : pas de donnée personnelle) */\n.avatar {\n  width: var(--avatar-size);\n  height: var(--avatar-size);\n  flex-shrink: 0;\n  border-radius: var(--radius-round);\n  background: var(--color-surface-warm);\n  color: var(--color-primary);\n  font-weight: var(--font-weight-bold);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-transform: uppercase;\n}\n.avatar-moi { background: var(--color-primary); color: var(--color-on-primary); }\n\n/* ============ Barre d'action fixée en bas (page d'un tournoi) ============ */\n.barre-action {\n  flex-shrink: 0;\n  padding: var(--space-3) var(--page-gutter) var(--space-4);\n  background: var(--color-surface);\n  box-shadow: var(--shadow-nav);\n  position: relative;\n  z-index: 10;\n}\n.barre-action .aide-action {\n  font-size: var(--font-size-xs);\n  color: var(--color-text-secondary);\n  text-align: center;\n  margin-top: var(--space-2);\n}\n.bouton:disabled { background: var(--color-bg-muted); color: var(--color-text-muted); border-color: var(--color-bg-muted); cursor: default; }\n.bouton-lien { color: var(--color-primary); font-weight: var(--font-weight-bold); min-height: var(--touch-target); }\n\n/* État vide (recherche sans résultat) */\n.vide {\n  text-align: center;\n  padding: var(--space-10) var(--space-6);\n  color: var(--color-text-secondary);\n}\n.vide strong { display: block; color: var(--color-text); font-size: var(--font-size-lg); margin-bottom: var(--space-1); }\n.vide .bouton { margin-top: var(--space-4); }\n\n/* ============ Carte sombre « prochain match » (03, 05), en écho à l'univers Gaming ============ */\n.carte-match {\n  position: relative;\n  overflow: hidden;\n  margin: var(--space-2) var(--page-gutter) 0;\n  padding: var(--space-5) var(--space-4) var(--space-4);\n  border-radius: var(--radius-lg);\n  background: var(--color-bg-dark);\n  color: var(--color-text-on-dark);\n}\n.carte-match .flamme {\n  position: absolute;\n  right: -40px;\n  top: -30px;\n  width: 150px;\n  height: 220px;\n  transform: rotate(28deg);\n  background: linear-gradient(180deg, var(--color-gaming-flame-dark), var(--color-primary));\n  opacity: .75;\n}\n.carte-match > * { position: relative; }\n.carte-match .surtitre { font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: .05em; color: var(--color-primary); }\n.carte-match h2 { font-size: var(--font-size-lg); line-height: var(--line-height-tight); margin: var(--space-1) 0 var(--space-4); }\n.duel { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }\n.duel .joueur { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); text-align: center; overflow lo Night revient le 16 octobre à 21 h. Trente-deux joueurs s'affrontent en solo sur Erangel, en trois manches.\",\n        \"Le classement additionne les points de placement et d'élimination. Le vainqueur remporte 800 MAD, versés sur son numéro Max it.\",\n        \"Les inscriptions sont complètes, mais la liste d'attente reste ouverte : la première place libérée revient au premier inscrit.\"] },\n    { id: \"c04\", type: \"article\", jeu: \"efootball\", titre: \"Défendre en 4-2-3-1 : le guide complet\", resume: \"Placement, pressing et transitions expliqués par un pro.\", acces: \"abonnes\", date: \"2026-10-03\", lecture: 6,\n      corps: [\"Le 4-2-3-1 reste le système le plus joué en compétition. Sa force : deux milieux défensifs qui protègent l'axe.\",\n        \"Premier réflexe : ne sortez jamais vos deux sentinelles en même temps. L'une presse, l'autre couvre l'espace devant la défense.\",\n        \"Sur les transitions, repliez votre ailier du côté du ballon. Vous fermez la passe en profondeur et forcez l'adversaire à jouer large.\",\n        \"Enfin, réglez le pressing sur « après perte de balle » : vous récupérez haut sans vous exposer aux contres.\"] },\n    { id: \"c05\", type: \"video\", jeu: \"codm\", titre: \"Réglages manette pour CODM\", duree: 390, acces: \"abonnes\", bandeAnnonce: 30, date: \"2026-10-02\",\n      description: \"Sensibilité, zone morte, boutons : les réglages qui font la différence en classé.\",\n      sousTitres: [[0, \"Voici mes réglages manette pour Call of Duty: Mobile.\"], [6, \"Sensibilité de visée : 6 en horizontal, 5 en vertical.\"], [12, \"Réduisez la zone morte à 10 %.\"]] },\n    { id: \"c06\", type: \"article\", jeu: \"freefire\", titre: \"Coupe Atlas : comment inscrire son escouade\", resume: \"Créer son équipe, inviter ses amis, valider l'inscription.\", acces: \"tous\", date: \"2026-10-01\", lecture: 4,\n      corps: [\"La Coupe Atlas Free Fire se joue en escouades de quatre. Pour participer, l'un d'entre vous crée l'éq  date: \"2026-10-08\", lecture: 3,\n      corps: [\"Reda_KAC survole la poule B avec trois victoires. Dans la poule A, Zizou10 est déjà qualifié.\",\n        \"Mouad_FC et Ayoub.R comptent six points chacun : la confrontation directe a donné l'avantage à Mouad_FC.\",\n        \"Dernière journée lundi soir. Les deux premiers de chaque poule rejoignent la phase finale à élimination directe.\"] }\n  ],\n\n  /* Motifs proposés pour signaler un contenu (S09-02 : 3 signalements = retrait en attente de revue) */\n  motifsSignalement: [\"Contenu choquant ou haineux\", \"Fausse information\", \"Triche ou piratage\", \"Publicité ou spam\", \"Autre raison\"],\n\n  /* Identifiants de jeu déjà rattachés à d'autres profils (S01-02) */\n  gamertagsPris: { freefire: [\"ShadowMA#0001\", \"AtlasKing#7777\"], pubg: [\"KingAbidjan\"], efootball: [\"Zizou10\"], codm: [\"SniperCasa\"] },\n\n  /* Solde Orange Money affiché dans la brique de paiement simulée (22) */\n  soldeOrangeMoney: 230.5,\n\n  /* ---- Fonctionnalités activées par pays (S08-02) ---- */\n  fonctions: {\n    MA: { video: true, sms: true },\n    SN: { video: true, sms: false },\n    CI: { video: false, sms: true }\n  }\n};\n","nav":"/* Routeur de la maquette : liste des écrans, état de démonstration mémorisé,\n   navigation entre les pages, retour à l'écran d'origine, messages éphémères.\n   Chaque écran est une page HTML ; ce script est chargé par toutes les pages. */\n\n/* ---- Registre des écrans (voir ecrans.md) ----\n   pret : la page existe. Un écran non prêt n'est jamais lié : on affiche un message. */\nconst ECRANS = {\n  \"00a\": { fichier: \"00a-maxit-accueil.html\", titre: \"Accueil Max it\", pret: true },\n  \"00b\": { fichier: \"00b-maxit-univers.html\", titre: \"Tous les univers\", pret: true },\n  \"00c\": { fichier: \"00c-maxit-gaming.html\", titre: \"Game corner\", pret: true },\n  \"02\": { fichier: \"02-pseudo.html\", titre: \"Choix du pseudo\", pret: true },\n  \"03\": { fichier: \"03-accueil.html\", titre: \"Accueil e-sport\", pret: true },\n  \"04\": { fichier: \"04-calendrier.html\", titre: \"Calendrier\", pret: true },\n  \"05\": { fichier: \"05-mes-tournois.html\", titre: \"Mes matchs\", pret: true },\n  \"06\": { fichier: \"06-tournoi.html\", titre: \"Tournoi\", pret: true },\n  \"07\": { fichier: \"07-reglement.html\", titre: \"Règlement\", pret: true },\n  \"08\": { fichier: \"08-inscription-resultat.html\", titre: \"Inscription\", pret: true },\n  \"09\": { fichier: \"09-equipe-choix.html\", titre: \"Créer ou rejoindre\", pret: true },\n  \"10\": { fichier: \"10-equipe.html\", titre: \"Mon équipe\", pret: true },\n  \"11\": { fichier: \"11-match.html\", titre: \"Salle de match\", pret: true },\n  \"12\": { fichier: \"12-arbre.html\", titre: \"Arbre du tournoi\", pret: true },\n  \"13\": { fichier: \"13-jeu.html\", titre: \"Page d'un jeu\", pret: true },\n  \"14\": { fichier: \"14-resultat.html\", titre: \"Déclarer le résultat\", pret: true },\n  \"15\": { fichier: \"15-litige.html\", titre: \"Litige\", pret: true },\n  \"17\": { fichier: \"17-profil-public.html\", titre: \"Profil public\", pret: true },\n  \"18\": { fichier: \"18-video.html\", titre: \"Vidéo\", pret: true },\n  \"19\": { fichier: \"19-article.html\", titre: \"Article\", pret: true },\n  \"20\": { fichier: \"20-contenus.html\", titre: \"Contenus\", pret: true },\n  \"21\": { fichier: \"21-offre.html\", titre: \"Offre d'abonnement\", pret: true },\n  \"22\": { fichier: \"22-paiement-maxit.html\", titre: \"Paiement Max it\", pret: true },\n  \"23\": { fichier: \"23-profil.html\", titre: \"Mon profil\", pret: true },\n  \"24\": { fichier: \"24-abonnement.html\", titre: \"Mon abonnement\", pret: true },\n  \"25\": { fichier: \"25-notifications.html\", titre: \"Notifications\", pret: true },\n  \"26\": { fichier: \"26-contestation.html\", titre: \"Contestation\", pret: true },\n  \"27\": { fichier: \"27-preferences-notif.html\", titre: \"Préférences\", pret: true },\n  \"28\": { fichier: \"28-mes-donnees.html\", titre: \"Mes données\", pret: true }\n};\n\n/* ---- Fichier unique (maquette-esport.html) ----\n   Chaque écran y est affiché dans un cadre ; le routeur du fichier parent gère la navigation,\n   l'historique et le stockage. Hors fichier unique, ROUTEUR vaut null. */\nconst ROUTEUR = (function () {\n  try { return window.parent !== window && window.parent.MaquetteRouteur ? window.parent.MaquetteRouteur : null; }\n  catch (e) { return null; }\n})();\n\n/* Écran courant et paramètres d'URL, dans les deux modes */\nfunction pageCourante() {\n  return ROUTEUR ? window.__PAGE : window.location.pathname.split(\"/\").pop();\n}\nfunction rechercheCourante() {\n  return ROUTEUR ? window.__RECHERCHE || \"\" : window.location.search;\n}\n/* Ouvre une page : « 06-tournoi.html?id=t01 » */\nfunction ouvrirPage(url) {\n  if (ROUTEUR) ROUTEUR.aller(url);\n  else window.location.href = url;\n}\n\n/* Stockage : localStorage, sinon mémoire (fichier ouvert directement sur un téléphone).\n   Dans le fichier unique, la mémoire est celle du parent : elle survit d'un écran à l'autre. */\nconst Stockage = (function () {\n  const memoire = ROUTEUR ? ROUTEUR.memoire : {};\n  return {\n    lire(cle) {\n      try { return localStorage.getItem(cle); } catch (e) { return memoire[cle] || null; }\n    },\n    ecrire(cle, valeur) {\n      try { localStorage.setItem(cle, valeur); } catch (e) { memoire[cle] = valeur; }\n    }\n  };\n})();\n\n/* ---- État de démonstration, mémorisé entre les pages ---- */\nconst Etat = (function () {\n  const CLE = \"maquette-esport-etat\";\n  const DEFAUT = {\n    abonne: false,          // joueur gratuit / abonné\n    suspendu: false,        // compte Max it suspendu (S01-01)\n    sessionExpiree: false,  // session Max it expirée (S01-01)\n    premierAcces: false,    // premier accès : choix du pseudo (02)\n    pseudo: null,           // pseudo choisi au premier accès (02) ; sinon celui de data.js\n    inscriptions: null,     // inscriptions modifiées pendant la démo ; sinon celles de data.js\n    equipes: null,          // équipes modifiées pendant la démo ; sinon celles de data.js\n    reglementsAcceptes: null, // version du règlement acceptée par tournoi (S03-03)\n    historiqueNonRepris: false, // case « Ne pas reprendre mon historique » (02)\n    horloge: null,          // horloge accélérée des écrans 11, 14, 15 : { reel, simule }\n    monMatch: null,         // déroulé de mon match : présence, déclarations, litige (lot 4)\n    matchs: null,           // résultats ajoutés à l'arbre pendant la démo, par « tournoi-tour-match »\n    contestations: null,    // contestations envoyées (26)\n    abonnement: null,       // { offre, echeance, statut } : actif, resilie, expire (lot 5)\n    positions: null,        // position de lecture de chaque vidéo, en secondes (18)\n    economieDonnees: false, // mode « économie de données » du lecteur (18)\n    sousTitres: false,      // sous-titres activés (18)\n    signalements: null,     // contenus signalés par le joueur (19)\n    gamertags: null,        // identifiants de jeu modifiés (23)\n    pseudoModifieLe: null,  // date du dernier changement de pseudo (23)\n    pseudoOffensant: null,  // ancien pseudo remplacé car jugé offensant (23)\n    toastSuivant: null,     // message à afficher sur la page suivante (retour après paiement)\n    notifsAjoutees: null,   // notifications créées pendant la démo (lot 6)\n    notifsLues: null,       // notifications lues, par identifiant\n    prefsNotif: null,       // familles de notifications désactivées (27)\n    refusSms: false,        // refus des SMS (27, S12-02)\n    promo: false,           // consentement aux messages promotionnels (27)\n    telechargement: null,   // demande de téléchargement des données (28)\n    suppression: null,      // date de la demande de suppression du compte (28)\n    compteSupprime: false,  // démo : suppression effective, résultats sous un pseudonyme anonyme\n    scenario: null,         // état alternatif forcé pour l'écran visé\n    origine: null           // écran à retrouver après le paiement (S11-03)\n  };\n\n  function lire() {\n    try {\n      const brut = Stockage.lire(CLE);\n      return Object.assign({}, DEFAUT, brut ? JSON.parse(brut) : {});\n    } catch (e) {\n      return Object.assign({}, DEFAUT);\n    }\n  }\n\n  function ecrire(etat) {\n    Stockage.ecrire(CLE, JSON.stringify(etat));\n  }\n\n  return {\n    get(cle) { return lire()[cle]; },\n    set(cle, valeur) {\n      const etat = lire();\n      etat[cle] = valeur;\n      ecrire(etat);\n      document.dispatchEvent(new CustomEvent(\"etat-change\", { detail: { cle, valeur } }));\n    },\n    reinitialiser() {\n      ecrire(Object.assign({}, DEFAUT));\n      document.dispatchEvent(new CustomEvent(\"etat-change\", { detail: {} }));\n    }\n  };\n})();\n\n/* ---- Navigation ---- */\nconst Nav = {\n  /* Aller à un écran par son numéro.\n     scenario : état alternatif à afficher ; params : paramètres d'URL, ex. { id: \"t01\" } */\n  aller(id, scenario, params) {\n    const ecran = ECRANS[id];\n    if (!ecran || !ecran.pret) {\n      Nav.toast((ecran ? ecran.titre : \"Cet écran\") + \" : arrive au prochain lot\");\n      return;\n    }\n    if (scenario !== undefined && scenario !== null) Etat.set(\"scenario\", scenario);\n    const requete = params ? \"?\" + new URLSearchParams(params).toString() : \"\";\n    ouvrirPage(ecran.fichier + requete);\n  },\n\n  /* Lit un paramètre de l'URL de la page courante */\n  param(nom) {\n    return new URLSearchParams(rechercheCourante()).get(nom);\n  },\n\n  /* Bouton « E-sport » de l'univers Gaming : entrée dans la plateforme (S01-01) */\n  entrerEsport() {\n    if (Etat.get(\"suspendu\")) {\n      Nav.dialogue({\n        icone: ICONES_NAV.cadenas,\n        titre: \"Accès aux tournois impossible\",\n        texte: \"Ton compte Max it est suspendu. Contacte le service client Max it pour le réactiver.\",\n        boutons: [{ libelle: \"J'ai compris\", primaire: true }]\n      });\n      return;\n    }\n    if (Etat.get(\"premierAcces\")) {\n      Nav.aller(\"02\");\n      return;\n    }\n    Nav.aller(\"03\");\n  },\n\n  /* Mémorise l'écran courant avant de partir vers l'offre (S11-03).\n     L'offre (21) et le paiement (22) ne sont jamais des écrans d'origine. */\n  memoriserOrigine() {\n    const page = pageCourante();\n    if (page === ECRANS[\"21\"].fichier || page === ECRANS[\"22\"].fichier) return;\n    Etat.set(\"origine\", page + rechercheCourante());\n  },\n\n  /* Retour exact sur l'écran d'origine, avec un message affiché à l'arrivée */\n  retourOrigine(message) {\n    const origine = Etat.get(\"origine\");\n    Etat.set(\"origine\", null);\n    if (message) Etat.set(\"toastSuivant\", message);\n    ouvrirPage(origine || ECRANS[\"03\"].fichier);\n  },\n\n  /* Message éphémère en bas de l'écran */\n  toast(message) {\n    const telephone = document.querySelector(\".telephone\");\n    if (!telephone) return;\n    let toast = telephone.querySelector(\".toast\");\n    if (!toast) {\n      toast = document.createElement(\"div\");\n      toast.className = \"toast\";\n      toast.setAttribute(\"role\", \"status\");\n      telephone.appendChild(toast);\n    }\n    toast.textContent = message;\n    toast.classList.add(\"visible\");\n    clearTimeout(toast._minuteur);\n    toast._minuteur = setTimeout(() => toast.classList.remove(\"visible\"), 2400);\n  },\n\n  /* Boîte de dialogue bloquante. boutons : [{ libelle, primaire, action }] */\n  dialogue({ icone, titre, texte, boutons }) {\n    const telephone = document.querySelector(\".telephone\");\n    const voile = document.createElement(\"div\");\n    voile.className = \"voile ouvert\";\n    voile.innerHTML =\n      '\u003cdiv class=\"dialogue\" role=\"alertdialog\" aria-modal=\"true\">' +\n      (icone ? '\u003cdiv class=\"icone-dialogue\">' + icone + \"\u003c/div>\" : \"\") +\n      \"\u003ch2>\" + titre + \"\u003c/h2>\u003cp>\" + texte + \"\u003c/p>\u003c/div>\";\n    const boite = voile.querySelector(\".dialogue\");\n    boutons.forEach((b) => {\n      const bouton = document.createElement(\"button\");\n      bouton.className = \"bouton bouton-pleine-largeur \" + (b.primaire ? \"bouton-primaire\" : \"bouton-secondaire\");\n      bouton.textContent = b.libelle;\n      bouton.addEventListener(\"click\", () => {\n        voile.remove();\n        if (b.action) b.action();\n      });\n      boite.appendChild(bouton);\n    });\n    telephone.appendChild(voile);\n  }\n};\n\n/* Petites icônes utilisées par le routeur */\nconst ICONES_NAV = {\n  cadenas: '\u003csvg viewBox=\"0 0 24 24\">\u003cpath class=\"f-primary\" d=\"M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z\"/>\u003c/svg>',\n  horloge: '\u003csvg viewBox=\"0 0 24 24\">\u003cpath class=\"f-primary\" d=\"M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 3v5.4l3.6 2.1-1 1.7L11 13.6V7h2z\"/>\u003c/svg>'\n};\n\n/* ---- Barre d'état du téléphone (heure et icônes système) ---- */\nfunction remplirBarreEtat() {\n  document.querySelectorAll(\".barre-etat\").forEach((barre) => {\n    const heure = barre.dataset.heure || \"9:30\";\n    barre.innerHTML =\n      \"\u003cspan>\" + heure + \"\u003c/span>\" +\n      '\u003cspan class=\"icones-systeme\">' +\n      // Réseau\n      '\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M1 12h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-3h2v12h-2z\"/>\u003c/svg>' +\n      // Wi-Fi\n      '\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M8 13.5l2-2.3a2.8 2.8 0 0 0-4 0zm-3.3-3.8a4.8 4.8 0 0 1 6.6 0l1.3-1.5a6.8 6.8 0 0 0-9.2 0zM2 6.6a8.8 8.8 0 0 1 12 0l1.3-1.5a10.8 10.8 0 0 0-14.6 0z\"/>\u003c/svg>' +\n      // Batterie\n      '\u003csvg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\u003cpath class=\"f-text\" d=\"M5 1h6v1h1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h1z\"/>\u003c/svg>' +\n      \"\u003c/span>\";\n  });\n}\n\n/* ---- Liens déclaratifs ----\n   data-ecran=\"06\"            : aller à l'écran 06 (data-id / data-pseudo / data-decision : paramètres ;\n                                data-origine : mémoriser l'écran courant pour y revenir)\n   data-action=\"esport\"       : entrée dans la plateforme\n   data-action=\"retour\"       : page précédente (data-repli=\"03\" : écran si pas d'historique)\n   data-hors=\"Envoyer de l'argent\" : élément hors périmètre de la maquette */\n/* Fichier unique : les liens classiques vers une page (href=\"00b-….html\") passent par le routeur */\ndocument.addEventListener(\"click\", (evenement) => {\n  if (!ROUTEUR) return;\n  const lien = evenement.target.closest(\"a[href]\");\n  const cible = lien && lien.getAttribute(\"href\");\n  if (cible && /^[\\w-]+\\.html/.test(cible)) {\n    evenement.preventDefault();\n    ROUTEUR.aller(cible);\n  }\n});\n\ndocument.addEventListener(\"click\", (evenement) => {\n  const cible = evenement.target.closest(\"[data-ecran], [data-action], [data-hors]\");\n  if (!cible) return;\n  evenement.preventDefault();\n\n  if (cible.dataset.ecran) {\n    // data-id=\"t01\" ou data-pseudo=\"…\" deviennent des paramètres d'URL\n    const params = {};\n    if (cible.dataset.id) params.id = cible.dataset.id;\n    if (cible.dataset.pseudo) params.pseudo = cible.dataset.pseudo;\n    if (cible.dataset.decision) params.decision = cible.dataset.decision;\n    if (cible.dataset.origine !== undefined) Nav.memoriserOrigine();\n    Nav.aller(cible.dataset.ecran, cible.dataset.scenario, Object.keys(params).length ? params : null);\n  } else if (cible.dataset.action === \"esport\") {\n    Nav.entrerEsport();\n  } else if (cible.dataset.action === \"retour\") {\n    // Page précédente si elle existe, sinon l'écran de repli (jamais d'impasse)\n    if (ROUTEUR) ROUTEUR.retour(ECRANS[cible.dataset.repli || \"03\"].fichier);\n    else if (history.length > 1) history.back();\n    else Nav.aller(cible.dataset.repli || \"03\");\n  } else if (cible.dataset.hors !== undefined) {\n    Nav.toast((cible.dataset.hors || \"Cette fonction\") + \" : hors périmètre de la maquette\");\n  }\n});\n\n/* ---- Session expirée (S01-01) : à la première action dans la plateforme,\n   le joueur est renvoyé vers l'identification Max it puis revient sur l'écran. ---- */\nfunction verifierSession() {\n  if (document.body.dataset.zone !== \"esport\" || !Etat.get(\"sessionExpiree\")) return;\n  Nav.dialogue({\n    icone: ICONES_NAV.horloge,\n    titre: \"Session Max it expirée\",\n    texte: \"Pour continuer, reconnecte-toi à Max it. Tu reviendras ensuite sur cet écran.\",\n    boutons: [{\n      libelle: \"Se reconnecter avec Max it\",\n      primaire: true,\n      action: () => {\n        Etat.set(\"sessionExpiree\", false);\n        Nav.toast(\"Reconnecté à Max it\");\n      }\n    }]\n  });\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  remplirBarreEtat();\n  verifierSession();\n  // Message laissé par la page précédente (ex. « Abonnement activé » au retour du paiement)\n  const message = Etat.get(\"toastSuivant\");\n  if (message) {\n    Etat.set(\"toastSuivant\", null);\n    setTimeout(() => Nav.toast(message), 300);\n  }\n});\n","esport":"/* Composants communs aux écrans de la plateforme e-sport :\n   en-tête, barre du bas, cartes de tournoi, badges, visuels des jeux,\n   état d'inscription du joueur, formats de date.\n   Chargé après data.js et nav.js, avant demo.js. */\n\nconst Esport = (function () {\n\n  /* ---------- Icônes de l'interface (trait monochrome, comme Max it) ---------- */\n  const ICONES = {\n    retour: '\u003cpath d=\"M10.6 5.3 12 6.7 7.7 11H20v2H7.7l4.3 4.3-1.4 1.4L3.9 12z\"/>',\n    cloche: '\u003cpath d=\"M12 2a6 6 0 0 1 6 6v5l2 3v1H4v-1l2-3V8a6 6 0 0 1 6-6zm0 2a4 4 0 0 0-4 4v5.6L6.9 15h10.2L16 13.6V8a4 4 0 0 0-4-4zm-2 15h4a2 2 0 0 1-4 0z\"/>',\n    recherche: '\u003cpath d=\"M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z\"/>',\n    filtres: '\u003cpath d=\"M3 5h12.2a3 3 0 0 1 5.6 1H21v1h-.2a3 3 0 0 1-5.6 0H3zm15 1a1 1 0 1 0 0 .01zM3 17h3.2a3 3 0 0 1 5.6 0H21v2h-9.2a3 3 0 0 1-5.6 0H3zm6 1a1 1 0 1 0 0 .01zM3 11h18v2H3z\"/>',\n    accueil: '\u003cpath d=\"M12 3l9 7.5V21h-6v-6H9v6H3V10.5zm0 2.6-7 5.8V19h2v-6h10v6h2v-7.6z\"/>',\n    accueilPlein: '\u003cpath d=\"M12 3l9 7.5V21h-6v-6H9v6H3V10.5z\"/>',\n    trophee: '\u003cpath d=\"M7 3h10v2h4v3a4 4 0 0 1-4.3 4A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 7.3 12 4 4 0 0 1 3 8V5h4zm2 2v5a3 3 0 0 0 6 0V5zM5 7v1a2 2 0 0 0 2 2V7zm12 0v3a2 2 0 0 0 2-2V7z\"/>',\n    manette: '\u003cpath d=\"M7.5 6h9a5.5 5.5 0 0 1 5.4 6.6l-.8 4a2.9 2.9 0 0 1-5 1.3L14.4 16H9.6l-1.7 1.9a2.9 2.9 0 0 1-5-1.3l-.8-4A5.5 5.5 0 0 1 7.5 6zM7 9v1.5H5.5v2H7V14h2v-1.5h1.5v-2H9V9zm8.5 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm2 2.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z\"/>',\n    lecture: '\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6zm6 2.5 5.5 3.5-5.5 3.5z\"/>',\n    profil: '\u003cpath d=\"M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm0 8.5c4.4 0 8 2.2 8 5.5v2H4v-2c0-3.3 3.6-5.5 8-5.5zm0 2c-3.2 0-5.7 1.4-6 3.5h12c-.3-2.1-2.8-3.5-6-3.5z\"/>',\n    cadenas: '\u003cpath d=\"M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z\"/>',\n    chevron: '\u003cpath d=\"M9.3 5.3 15.9 12l-6.6 6.7-1.4-1.4 5.2-5.3-5.2-5.3z\"/>',\n    calendrier: '\u003cpath d=\"M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 9v10h14V9z\"/>',\n    groupe: '\u003cpath d=\"M9 4a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm7.5 1.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM9 12.5c3.6 0 6.5 1.8 6.5 4.5V19H2.5v-2c0-2.7 2.9-4.5 6.5-4.5zm7.5.5c2.8 0 5 1.4 5 3.5V19h-4v-2c0-1.5-.6-2.8-1.7-3.8z\"/>',\n    globe: '\u003cpath d=\"M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1.9 2.2A8 8 0 0 0 4.1 11h3.4c.2-2.5.9-4.9 2.6-6.8zm3.8 0c1.7 1.9 2.4 4.3 2.6 6.8h3.4a8 8 0 0 0-6-6.8zM9.5 11h5c-.2-2.3-1-4.4-2.5-6-1.5 1.6-2.3 3.7-2.5 6zm-5.4 2a8 8 0 0 0 6 6.8c-1.7-1.9-2.4-4.3-2.6-6.8zm5.4 0c.2 2.3 1 4.4 2.5 6 1.5-1.6 2.3-3.7 2.5-6zm6.9 0c-.2 2.5-.9 4.9-2.6 6.8a8 8 0 0 0 6-6.8z\"/>',\n    coche: '\u003cpath d=\"M9.5 16.2 4.8 11.5l-1.4 1.4 6.1 6.1L21 7.5l-1.4-1.4z\"/>',\n    alerte: '\u003cpath d=\"M12 2 1 21h22zm0 4 7.5 13h-15zm-1 4v5h2v-5zm0 6v2h2v-2z\"/>',\n    boutique: '\u003cpath d=\"M3 3h18l-1 6a3 3 0 0 1-5 1.5A3 3 0 0 1 12 12a3 3 0 0 1-3-1.5A3 3 0 0 1 4 9zm2 9.6a5 5 0 0 0 0 .1V21h14v-8.3a5 5 0 0 1-2 .3 5 5 0 0 1-2-.5 5 5 0 0 1-6 0 5 5 0 0 1-4 .1zM9 15h6v4H9z\"/>',\n    article: '\u003cpath d=\"M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5zm2 2h10v2H7zm0 4h10v2H7zm0 4h6v2H7z\"/>'\n  };\n\n  /* Renvoie un SVG prêt à insérer. classe : classe de remplissage (f-text, f-primary…) */\n  function icone(nom, classe) {\n    return '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" class=\"' + (classe || \"f-text\") + '\">' + ICONES[nom] + \"\u003c/svg>\";\n  }\n\n  /* ---------- Visuels des jeux (pas d'image : dégradé et pictogramme SVG) ---------- */\n  const PICTOS_JEUX = {\n    // Flamme\n    freefire: '\u003cpath class=\"f-white\" d=\"M12 2c1 3.5 5 5.6 5 10.5a5 5 0 0 1-10 0c0-2 .9-3.6 2.2-4.8-.1 1.6.5 2.8 1.6 3.3C10.2 7.6 11 4.5 12 2z\"/>',\n    // Casque\n    pubg: '\u003cpath class=\"f-white\" d=\"M12 3a8 8 0 0 1 8 8v3h-3l-1 4H8l-1-4H4v-3a8 8 0 0 1 8-8zm-5 8v1h10v-1z\"/>',\n    // Ballon\n    efootball: '\u003cpath class=\"f-white\" d=\"M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 4.5-3.3 2.4 1.3 3.9h4l1.3-3.9zM6.2 7.3A8 8 0 0 0 4 12l2.6.8 1.2-3.6zm11.6 0-1.6 1.9 1.2 3.6L20 12a8 8 0 0 0-2.2-4.7zM9.3 14.8l-1.6 2.3A8 8 0 0 0 12 20v-2.8l-2-1.4zm5.4 0-.7 1L12 17.2V20a8 8 0 0 0 4.3-2.9z\"/>',\n    // Viseur\n    codm: '\u003cpath class=\"f-white\" d=\"M11 2h2v3.1A7 7 0 0 1 18.9 11H22v2h-3.1A7 7 0 0 1 13 18.9V22h-2v-3.1A7 7 0 0 1 5.1 13H2v-2h3.1A7 7 0 0 1 11 5.1zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z\"/>'\n  };\n\n  /* Bloc visuel d'un jeu (fond dégradé + pictogramme). taille : \"petit\" ou \"grand\" */\n  function visuelJeu(idJeu, taille) {\n    return '\u003cspan class=\"visuel-jeu jeu-' + idJeu + (taille ? \" visuel-\" + taille : \"\") + '\" aria-hidden=\"true\">' +\n      '\u003cspan class=\"visuel-forme\">\u003c/span>' +\n      '\u003csvg viewBox=\"0 0 24 24\">' + PICTOS_JEUX[idJeu] + \"\u003c/svg>\u003c/span>\";\n  }\n\n  /* ---------- Accès aux données ---------- */\n  function jeu(id) { return DONNEES.jeux.find((j) => j.id === id); }\n  function tournoi(id) { return DONNEES.tournois.find((t) => t.id === id); }\n  function maintenant() { return new Date(DONNEES.maintenant); }\n  function abonne() { return !!Etat.get(\"abonne\"); }\n  function pseudo() {\n    // Compte supprimé (démo, 30 jours après la demande) : résultats sous un pseudonyme anonyme (S01-04)\n    if (Etat.get(\"compteSupprime\")) return DONNEES.pseudoAnonyme;\n    return Etat.get(\"pseudo\") || DONNEES.joueur.pseudo;\n  }\n  function pays() { return DONNEES.pays[DONNEES.joueur.pays]; }\n  function fonction(nom) { return DONNEES.fonctions[DONNEES.joueur.pays][nom]; }\n\n  /* Tournois visibles par le joueur : ceux ouverts dans son pays (S03-07) */\n  function tournoisDuPays() {\n    return DONNEES.tournois.filter((t) => t.pays.includes(DONNEES.joueur.pays));\n  }\n\n  /* ---------- Inscriptions du joueur (mémorisées pendant la démo) ---------- */\n  function inscriptions() {\n    return Etat.get(\"inscriptions\") || DONNEES.joueur.inscriptions;\n  }\n  function inscription(idTournoi) {\n    return inscriptions()[idTournoi] || null;\n  }\n  /* valeur : { etat: \"inscrit\" } / { etat: \"attente\", rang } ou null pour retirer */\n  function changerInscription(idTournoi, valeur) {\n    const copie = Object.assign({}, inscriptions());\n    if (valeur) copie[idTournoi] = valeur;\n    else delete copie[idTournoi];\n    Etat.set(\"inscriptions\", copie);\n  }\n\n  /* ---------- Équipe du joueur dans un tournoi (S04-03, S04-04) ----------\n     Les modifications de la démo sont mémorisées ; null = pas d'équipe (même si data.js en a une). */\n  function equipe(idTournoi) {\n    const memo = Etat.get(\"equipes\") || {};\n    if (Object.prototype.hasOwnProperty.call(memo, idTournoi)) return memo[idTournoi];\n    return DONNEES.mesEquipes[idTournoi] || null;\n  }\n  function changerEquipe(idTournoi, valeur) {\n    const copie = Object.assign({}, Etat.get(\"equipes\") || {});\n    copie[idTournoi] = valeur;\n    Etat.set(\"equipes\", copie);\n  }\n  /* Taille exigée par la fiche du jeu */\n  function tailleEquipe(t) { return jeu(t.jeu).equipe; }\n\n  /* ---------- Règlement (S03-03) ---------- */\n  /* Un inscrit doit réaccepter un règlement modifié tant qu'il n'a pas accepté la nouvelle version */\n  function reglementAAccepter(t) {\n    const ins = inscription(t.id);\n    const acceptes = Etat.get(\"reglementsAcceptes\") || {};\n    return !!(ins && ins.etat === \"inscrit\" && t.reglement.modifie && acceptes[t.id] !== t.reglement.version);\n  }\n  function accepterReglement(t) {\n    const acceptes = Object.assign({}, Etat.get(\"reglementsAcceptes\") || {});\n    acceptes[t.id] = t.reglement.version;\n    Etat.set(\"reglementsAcceptes\", acceptes);\n  }\n\n  /* État alternatif demandé par le menu de démo : lu une seule fois, puis effacé */\n  function lireScenario() {\n    const scenario = Etat.get(\"scenario\");\n    if (scenario) Etat.set(\"scenario\", null);\n    return scenario;\n  }\n\n  /* Inscriptions closes : date de clôture passée, tournoi commencé ou terminé */\n  function inscriptionsCloses(t) {\n    if (t.etat === \"en-cours\" || t.etat === \"termine\") return true;\n    return maintenant() > new Date(t.cloture + \"T23:59\");\n  }\n\n  /* État du bouton principal d'un tournoi pour le joueur courant (écran 06) :\n     inscrit, inscrit-en-cours, attente, equipe-incomplete, abonner, complet, inscrire, closes, termine */\n  function etatBouton(t) {\n    const ins = inscription(t.id);\n    if (ins && ins.etat === \"inscrit\") {\n      if (t.etat === \"en-cours\") return \"inscrit-en-cours\";\n      if (t.etat === \"termine\") return \"termine\";\n      return \"inscrit\";\n    }\n    if (ins && ins.etat === \"attente\" && !inscriptionsCloses(t)) return \"attente\";\n    if (t.etat === \"termine\") return \"termine\";\n    if (inscriptionsCloses(t)) return \"closes\";\n    // Équipe créée ou rejointe mais pas encore complète : pas encore inscrite (S04-03)\n    if (t.mode === \"equipe\" && equipe(t.id)) return \"equipe-incomplete\";\n    if (t.acces === \"abonnes\" && !abonne()) return \"abonner\";\n    if (t.etat === \"complet\" || t.inscrits >= t.places) return \"complet\";\n    return \"inscrire\";\n  }\n\n  /* ---------- Dates ---------- */\n  const JOURS = [\"dim.\", \"lun.\", \"mar.\", \"mer.\", \"jeu.\", \"ven.\", \"sam.\"];\n  const MOIS = [\"janv.\", \"févr.\", \"mars\", \"avr.\", \"mai\", \"juin\", \"juil.\", \"août\", \"sept.\", \"oct.\", \"nov.\", \"déc.\"];\n\n  function date(iso) { return new Date(iso.length === 10 ? iso + \"T12:00\" : iso); }\n  /* « sam. 18 oct. » */\n  function jourLong(iso) { const d = date(iso); return JOURS[d.getDay()] + \" \" + d.getDate() + \" \" + MOIS[d.getMonth()]; }\n  /* « 18 oct. » */\n  function jourCourt(iso) { const d = date(iso); return d.getDate() + \" \" + MOIS[d.getMonth()]; }\n  /* « 20:00 » */\n  function heure(iso) { return iso.slice(11, 16); }\n  /* Bloc date des cartes : { jour: \"18\", mois: \"oct.\" } */\n  function blocDate(iso) { const d = date(iso); return { jour: d.getDate(), mois: MOIS[d.getMonth()] }; }\n\n  /* Montant dans la monnaie du pays du joueur */\n  function prix(montant) {\n    return montant.toLocaleString(\"fr-FR\").replace(/ | /g, \" \") + \" \" + pays().monnaie;\n  }\n\n  /* ---------- Badges d'un tournoi ---------- */\n  function badges(t) {\n    let html = \"\";\n    const ins = inscription(t.id);\n    if (ins && ins.etat === \"inscrit\") html += '\u003cspan class=\"puce-etat puce-inscrit\">' + icone(\"coche\", \"f-white\") + \"Inscrit\u003c/span>\";\n    if (ins && ins.etat === \"attente\") html += '\u003cspan class=\"puce-etat puce-attente\">Liste d\\'attente · ' + ins.rang + \"e\u003c/span>\";\n    const eq = !ins && t.mode === \"equipe\" ? equipe(t.id) : null;\n    if (eq) html += '\u003cspan class=\"puce-etat puce-attente\">Équipe ' + eq.membres.length + \"/\" + tailleEquipe(t) + \"\u003c/span>\";\n    if (t.acces === \"abonnes\") {\n      // Joueur gratuit : condition d'accès explicite avec un cadenas (S03-04, S05-02)\n      html += abonne()\n        ? '\u003cspan class=\"puce-etat puce-abonnes\">Abonnés\u003c/span>'\n        : '\u003cspan class=\"puce-etat puce-reserve\">' + icone(\"cadenas\", \"f-primary\") + \"Réservé aux abonnés\u003c/span>\";\n    }\n    if (t.portee === \"MEA\") html += '\u003cspan class=\"puce-etat puce-mea\">' + icone(\"globe\", \"f-text\") + \"MEA\u003c/span>\";\n    if (t.etat === \"en-cours\") html += '\u003cspan class=\"puce-etat puce-direct\">\u003ci>\u003c/i>En cours\u003c/span>';\n    else if (t.etat === \"termine\") html += '\u003cspan class=\"puce-etat puce-clos\">Terminé\u003c/span>';\n    else if (inscriptionsCloses(t)) html += '\u003cspan class=\"puce-etat puce-clos\">Inscriptions closes\u003c/span>';\n    else if (t.etat === \"complet\" || t.inscrits >= t.places) html += '\u003cspan class=\"puce-etat puce-clos\">Complet\u003c/span>';\n    return html;\n  }\n\n  /* Libellés lisibles */\n  function libelleFormat(t) { return t.format === \"poules\" ? \"Poules puis élimination\" : \"Élimination directe\"; }\n  function libelleMode(t) {\n    const j = jeu(t.jeu);\n    return t.mode === \"solo\" ? \"Solo\" : \"Équipe de \" + j.equipe;\n  }\n\n  /* ---------- Carte de tournoi (liste du calendrier, accueil, page d'un jeu) ---------- */\n  function carteTournoi(t) {\n    const d = blocDate(t.debut);\n    const j = jeu(t.jeu);\n    return '\u003ca href=\"#\" class=\"carte-tournoi\" data-ecran=\"06\" data-id=\"' + t.id + '\">' +\n      '\u003cspan class=\"carte-date\">\u003cb>' + d.jour + \"\u003c/b>\" + d.mois + \"\u003c/span>\" +\n      '\u003cspan class=\"carte-corps\">' +\n      '\u003cspan class=\"carte-titre\">' + t.nom + \"\u003c/span>\" +\n      '\u003cspan class=\"carte-sous-titre\">' + j.nom + \" · \" + libelleMode(t) + \" · \" + heure(t.debut) + \"\u003c/span>\" +\n      '\u003cspan class=\"carte-badges\">' + badges(t) + \"\u003c/span>\" +\n      \"\u003c/span>\" +\n      icone(\"chevron\", \"f-muted carte-chevron\") +\n      \"\u003c/a>\";\n  }\n\n  /* Carte large pour les carrousels (tournois à la une) */\n  function carteUne(t) {\n    const j = jeu(t.jeu);\n    return '\u003ca href=\"#\" class=\"carte-une\" data-ecran=\"06\" data-id=\"' + t.id + '\">' +\n      visuelJeu(t.jeu, \"bandeau\") +\n      '\u003cspan class=\"carte-une-badges\">' + badges(t) + \"\u003c/span>\" +\n      '\u003cspan class=\"carte-une-texte\">' +\n      '\u003cspan class=\"carte-titre\">' + t.nom + \"\u003c/span>\" +\n      '\u003cspan class=\"carte-sous-titre\">' + j.nom + \" · \" + jourLong(t.debut) + \" · \" + t.dotations[0] + \"\u003c/span>\" +\n      \"\u003c/span>\u003c/a>\";\n  }\n\n  /* ---------- Contenus (articles et vidéos) ---------- */\n\n  /* Durée lisible : 522 → « 8:42 » */\n  function duree(secondes) {\n    const s = Math.max(0, Math.floor(secondes));\n    return Math.floor(s / 60) + \":\" + String(s % 60).padStart(2, \"0\");\n  }\n  function contenu(id) { return DONNEES.contenus.find((c) => c.id === id); }\n  /* Le joueur peut-il lire / ouvrir ce contenu en entier ? */\n  function contenuAccessible(c) { return c.acces === \"tous\" || abonne(); }\n\n  /* Contenus visibles : les vidéos disparaissent si la fonction est désactivée dans le pays (S08-02) */\n  function contenusVisibles() {\n    const videos = fonction(\"video\");\n    return DONNEES.contenus.filter((c) => c.type !== \"video\" || videos);\n  }\n\n  /* Ligne de contenu ; joueur gratuit : cadenas et condition d'accès (S10-02, S11-01) */\n  function ligneContenu(c) {\n    const verrou = c.acces === \"abonnes\" && !abonne();\n    let meta = (c.type === \"video\" ? \"Vidéo · \" + duree(c.duree) : \"Article · \" + c.lecture + \" min\") + \" · \" + jeu(c.jeu).nom;\n    if (verrou) {\n      meta += '\u003cspan class=\"puce-etat puce-reserve\">' + icone(\"cadenas\", \"f-primary\") + \"Réservé aux abonnés\u003c/span>\";\n      if (c.bandeAnnonce) meta += '\u003cspan class=\"puce-etat puce-abonnes\">Bande-annonce libre\u003c/span>';\n    }\n    return '\u003ca href=\"#\" class=\"ligne contenu-ligne\" data-ecran=\"' + (c.type === \"video\" ? \"18\" : \"19\") + '\" data-id=\"' + c.id + '\">' +\n      '\u003cspan class=\"vignette\">' + visuelJeu(c.jeu, \"petit\") +\n      (c.type === \"video\" ? '\u003cspan class=\"lecture\">' + icone(\"lecture\", \"f-white\") + \"\u003c/span>\" : \"\") + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + c.titre + '\u003c/span>\u003cspan class=\"meta\">' + meta + \"\u003c/span>\u003c/span>\" +\n      icone(verrou ? \"cadenas\" : \"chevron\", \"f-muted\") +\n      \"\u003c/a>\";\n  }\n\n  /* ---------- Abonnement (S11-02, S11-04) ----------\n     Mémorisé : { offre, echeance, statut } avec statut actif, resilie ou expire.\n     L'interrupteur de démo « abonné » reste la référence de l'accès (Etat abonne). */\n  const DUREES_OFFRES = { quotidienne: 1, hebdomadaire: 7, mensuelle: 30 };\n  function offre(id) { return DONNEES.offres[DONNEES.joueur.pays].find((o) => o.id === id); }\n  /* « abonnement mensuel » : l'identifiant d'offre (mensuelle…) accordé avec « abonnement » */\n  const ADJECTIFS = { quotidienne: \"quotidien\", hebdomadaire: \"hebdomadaire\", mensuelle: \"mensuel\" };\n  function nomOffre(id) { return \"abonnement \" + (ADJECTIFS[id] || id); }\n\n  /* État de l'abonnement : actif, resilie, expire ou aucun */\n  function etatAbonnement() {\n    const memo = Etat.get(\"abonnement\") || {};\n    const base = Object.assign({}, DONNEES.joueur.abonnement, memo);\n    if (!abonne()) return Object.assign(base, { statut: memo.statut === \"expire\" ? \"expire\" : \"aucun\" });\n    return Object.assign(base, { statut: memo.statut === \"resilie\" ? \"resilie\" : \"actif\" });\n  }\n\n  /* Paiement confirmé : l'abonnement démarre, l'accès s'ouvre aussitôt (S11-03) */\n  function souscrire(idOffre) {\n    const o = offre(idOffre);\n    const jours = DUREES_OFFRES[idOffre] + (o.essai ? parseInt(o.essai, 10) : 0);\n    const echeance = new Date(maintenant().getTime() + jours * 86400000).toISOString().slice(0, 10);\n    Etat.set(\"abonnement\", { offre: idOffre, echeance, statut: \"actif\" });\n    Etat.set(\"abonne\", true);\n    notifier({ famille: \"abonnement\", ecran: \"24\", titre: \"Abonnement activé\",\n      texte: \"Ton \" + nomOffre(idOffre) + \" est actif jusqu'au \" + jourCourt(echeance) + \". Tous les contenus réservés sont ouverts.\" });\n  }\n  /* Mettre fin : l'accès reste ouvert jusqu'à l'échéance (S11-04) */\n  function resilier() {\n    const a = etatAbonnement();\n    Etat.set(\"abonnement\", Object.assign({}, a, { statut: \"resilie\" }));\n    notifier({ famille: \"abonnement\", ecran: \"24\", titre: \"Abonnement résilié\",\n      texte: \"Il ne sera pas reconduit. Ton accès reste ouvert jusqu'au \" + jourCourt(a.echeance) + \".\" });\n  }\n  /* Expiration (fin de période ou échec de reconduction) : retour au niveau gratuit, historique conservé */\n  function expirer() {\n    Etat.set(\"abonnement\", Object.assign({}, etatAbonnement(), { statut: \"expire\", echeance: \"2026-10-08\" }));\n    Etat.set(\"abonne\", false);\n  }\n\n  /* ---------- Notifications (S12-01) ---------- */\n\n  /* Famille désactivée par le joueur ? (« match-en-cours » ne l'est jamais) */\n  function familleActive(id) {\n    const famille = DONNEES.famillesNotif.find((f) => f.id === id);\n    if (famille && famille.verrouillee) return true;\n    return !(Etat.get(\"prefsNotif\") || {})[id];\n  }\n  /* Toutes les notifications (départ + démo), de la plus récente à la plus ancienne */\n  function notifications() {\n    const lues = Etat.get(\"notifsLues\") || {};\n    return DONNEES.notifications.concat(Etat.get(\"notifsAjoutees\") || [])\n      .map((n) => Object.assign({}, n, { lue: n.lue || !!lues[n.id] }))\n      .sort((a, b) => b.date.localeCompare(a.date));\n  }\n  function notificationsVisibles() { return notifications().filter((n) => familleActive(n.famille)); }\n  function nonLues() { return notificationsVisibles().filter((n) => !n.lue).length; }\n  function marquerLue(id) {\n    const lues = Object.assign({}, Etat.get(\"notifsLues\") || {});\n    lues[id] = true;\n    Etat.set(\"notifsLues\", lues);\n  }\n  function toutMarquerLu() {\n    const lues = Object.assign({}, Etat.get(\"notifsLues\") || {});\n    notifications().forEach((n) => { lues[n.id] = true; });\n    Etat.set(\"notifsLues\", lues);\n  }\n  /* Nouvelle notification née d'une action de la démo (inscription, paiement, résultat…) */\n  function notifier(n) {\n    const liste = (Etat.get(\"notifsAjoutees\") || []).slice();\n    const h = horloge();\n    const date = h.getFullYear() + \"-\" + String(h.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(h.getDate()).padStart(2, \"0\") + \"T\" + hhmm(h) + \":\" + String(h.getSeconds()).padStart(2, \"0\");\n    liste.push(Object.assign({ id: \"d\" + Date.now() + liste.length, date, lue: false }, n));\n    Etat.set(\"notifsAjoutees\", liste);\n  }\n\n  /* Compteur de non-lues sur toutes les cloches de l'écran (data-ecran=\"25\") */\n  function majCloches() {\n    const n = nonLues();\n    document.querySelectorAll('[data-ecran=\"25\"]').forEach((cloche) => {\n      let pastille = cloche.querySelector(\".pastille\");\n      if (!pastille) {\n        pastille = document.createElement(\"span\");\n        pastille.className = \"pastille\";\n        cloche.appendChild(pastille);\n      }\n      pastille.textContent = n > 9 ? \"9+\" : n;\n      pastille.hidden = n === 0;\n      cloche.setAttribute(\"aria-label\", \"Notifications\" + (n ? \", \" + n + \" non lues\" : \"\"));\n    });\n  }\n\n  /* ---------- Identifiants de jeu du joueur (modifiables dans 23) ---------- */\n  function gamertags() { return Object.assign({}, DONNEES.joueur.gamertags, Etat.get(\"gamertags\") || {}); }\n\n  /* ---------- Horloge accélérée (écrans 11, 14, 15) ----------\n     Dans la salle de match, le temps défile 30 fois plus vite : 1 s = 30 s.\n     Ailleurs, tant que l'horloge n'est pas lancée, l'heure reste celle de data.js. */\n  const VITESSE = 30;\n  function horloge() {\n    const h = Etat.get(\"horloge\");\n    if (!h) return maintenant();\n    return new Date(new Date(h.simule).getTime() + (Date.now() - h.reel) * VITESSE);\n  }\n  function regleHorloge(isoSimule) { Etat.set(\"horloge\", { reel: Date.now(), simule: isoSimule }); }\n  function demarrerHorloge() { if (!Etat.get(\"horloge\")) regleHorloge(DONNEES.maintenant); }\n  /* Date située « minutes » après une heure ISO */\n  function plus(iso, minutes) { return new Date(new Date(iso).getTime() + minutes * 60000); }\n  /* « 21:30 » */\n  function hhmm(d) { return String(d.getHours()).padStart(2, \"0\") + \":\" + String(d.getMinutes()).padStart(2, \"0\"); }\n  /* Compte à rebours « 12:05 » (minutes:secondes simulées) jusqu'à une date */\n  function rebours(cible) {\n    const s = Math.max(0, Math.floor((cible - horloge()) / 1000));\n    return Math.floor(s / 60) + \":\" + String(s % 60).padStart(2, \"0\");\n  }\n\n  /* ---------- Mon match (lot 4) ----------\n     monMatch mémorise : presenceMoi (heure), issue (demarre, forfait-adverse, mon-forfait, double-absence),\n     declMoi / declAdv ({ moi, adv } : mon score, celui de l'adversaire), statut (attente-adv, clos,\n     litige, retenu-adverse, definitif), litige ({ ouverture, pieces, envoye, decision }). */\n  function monMatch() { return Object.assign({}, Etat.get(\"monMatch\") || {}); }\n  function majMonMatch(changements) { Etat.set(\"monMatch\", Object.assign(monMatch(), changements)); }\n  function cleMonMatch() { const c = DONNEES.monMatch; return c.tournoi + \"-\" + c.tour + \"-\" + c.match; }\n\n  /* États de démo (14, 15) : match démarré à 21:23, sans résultat, horloge réglée sur « heure » */\n  function preparerMatchDemo(supplement, heure) {\n    const resultats = Object.assign({}, resultatsMatchs());\n    delete resultats[cleMonMatch()];\n    Etat.set(\"matchs\", resultats);\n    Etat.set(\"monMatch\", Object.assign({\n      presenceMoi: \"21:21\", adversaireVu: true, rappelVu: true,\n      issue: \"demarre\", demarrage: \"21:23\", demarrageIso: \"2026-10-09T21:23\"\n    }, supplement));\n    regleHorloge(heure);\n  }\n\n  /* Fin prévue du match et limite de déclaration (30 min après la fin prévue, S07-01) */\n  function finPrevue() { return plus(monMatch().demarrageIso, DONNEES.monMatch.duree); }\n  function limiteDeclaration() { return new Date(finPrevue().getTime() + DONNEES.monMatch.delaiDeclaration * 60000); }\n\n  /* Résultats ajoutés à l'arbre : { a, b, vainqueur, mention } par « tournoi-tour-match » */\n  function resultatsMatchs() { return Etat.get(\"matchs\") || {}; }\n  function enregistrerResultat(cle, resultat) {\n    const copie = Object.assign({}, resultatsMatchs());\n    copie[cle] = resultat;\n    Etat.set(\"matchs\", copie);\n  }\n  /* Résultat de mon match : mes scores (moi, adv) convertis dans l'ordre de l'arbre */\n  function enregistrerMonResultat(scoreMoi, scoreAdv, mention, vainqueurForce) {\n    const c = DONNEES.monMatch;\n    const moiEnA = DONNEES.arbres[c.tournoi].matchs[c.tour][c.match][0] === DONNEES.joueur.pseudo;\n    const gagnant = vainqueurForce !== undefined ? vainqueurForce\n      : scoreMoi === scoreAdv ? null : scoreMoi > scoreAdv ? DONNEES.joueur.pseudo : c.adversaire;\n    enregistrerResultat(cleMonMatch(), {\n      a: moiEnA ? scoreMoi : scoreAdv, b: moiEnA ? scoreAdv : scoreMoi, vainqueur: gagnant, mention: mention || null\n    });\n  }\n\n  /* ---------- Arbre à élimination ----------\n     Match : [joueur A, joueur B, score A, score B, vainqueur (égalité, forfait), état, mention]. */\n  /* Match sans vainqueur où les deux joueurs sont éliminés :\n     double absence (S06-03) ou aucune déclaration dans le délai (S07-02, décision du 2026-10-07) */\n  const DOUBLES_ELIMINATIONS = [\"Double absence\", \"Aucune déclaration\"];\n  function doubleElimination(m) { return DOUBLES_ELIMINATIONS.includes(m[6]); }\n\n  function vainqueur(m) {\n    if (doubleElimination(m)) return null;\n    if (m[4] && (m[2] === null || m[3] === null || m[2] === m[3])) return m[4];\n    if (!m[0] || !m[1] || m[2] === null || m[3] === null || m[2] === m[3]) return null;\n    return m[2] > m[3] ? m[0] : m[1];\n  }\n\n  /* Les vainqueurs d'un tour remplissent le tour suivant, sans action humaine (S06-01).\n     Après une double élimination, l'adversaire prévu au tour suivant est qualifié d'office (S06-03). */\n  function propager(a) {\n    for (let r = 1; r \u003c a.matchs.length; r++) {\n      a.matchs[r].forEach((m, i) => {\n        const gauche = a.matchs[r - 1][i * 2];\n        const droite = a.matchs[r - 1][i * 2 + 1];\n        m[0] = vainqueur(gauche);\n        m[1] = vainqueur(droite);\n        if (m[2] === null && m[3] === null) {\n          if (doubleElimination(gauche) && m[1]) { m[4] = m[1]; m[6] = \"Qualifié d'office\"; }\n          else if (doubleElimination(droite) && m[0]) { m[4] = m[0]; m[6] = \"Qualifié d'office\"; }\n        }\n      });\n    }\n    return a;\n  }\n\n  /* Arbre d'un tournoi avec les résultats ajoutés pendant la démo */\n  function arbre(idTournoi) {\n    if (!DONNEES.arbres[idTournoi]) return null;\n    const copie = JSON.parse(JSON.stringify(DONNEES.arbres[idTournoi]));\n    copie.matchs.forEach((tour) => tour.forEach((m) => { while (m.length \u003c 7) m.push(null); }));\n    const resultats = resultatsMatchs();\n    Object.keys(resultats).forEach((cle) => {\n      const [id, r, i] = cle.split(\"-\");\n      if (id !== idTournoi) return;\n      const m = copie.matchs[Number(r)][Number(i)];\n      const v = resultats[cle];\n      m[2] = v.a; m[3] = v.b; m[4] = v.vainqueur; m[5] = null; m[6] = v.mention;\n    });\n    return propager(copie);\n  }\n\n  /* Le tournoi a-t-il été recalculé après un arbitrage ? (S05-04) */\n  function recalculeApresArbitrage(idTournoi) {\n    return Object.keys(resultatsMatchs()).some((cle) => cle.startsWith(idTournoi + \"-\") && resultatsMatchs()[cle].mention === \"Arbitrage\");\n  }\n\n  /* Où en est mon prochain match ? etape : a-venir, en-cours, litige, qualifie, elimine */\n  function prochainMatch() {\n    const c = DONNEES.monMatch;\n    const t = tournoi(c.tournoi);\n    const ins = inscription(t.id);\n    if (!ins || ins.etat !== \"inscrit\" || t.etat !== \"en-cours\") return null;\n    const a = arbre(t.id);\n    const moi = DONNEES.joueur.pseudo;\n    const resultat = resultatsMatchs()[cleMonMatch()];\n    const mm = monMatch();\n    const base = { t, tour: a.tours[c.tour], adversaire: c.adversaire, heure: hhmm(new Date(c.debut)) };\n    if (!resultat) {\n      const etape = mm.statut === \"litige\" ? \"litige\" : mm.issue === \"demarre\" ? \"en-cours\" : \"a-venir\";\n      return Object.assign(base, { etape });\n    }\n    if (resultat.vainqueur !== moi) return Object.assign(base, { etape: \"elimine\" });\n    // Qualifié : match du tour suivant, adversaire connu ou non\n    for (let r = c.tour + 1; r \u003c a.matchs.length; r++) {\n      const m = a.matchs[r].find((x) => x[0] === moi || x[1] === moi);\n      if (m && !vainqueur(m)) return Object.assign(base, { etape: \"qualifie\", tour: a.tours[r], adversaire: m[0] === moi ? m[1] : m[0] });\n    }\n    return Object.assign(base, { etape: \"qualifie\", tour: a.tours[c.tour + 1], adversaire: null });\n  }\n\n  /* Carte sombre « prochain match » (accueil 03 et Mes matchs 05) */\n  function carteProchainMatch(p) {\n    const moi = pseudo();\n    const duel = (adversaire) =>\n      '\u003cdiv class=\"duel\">\u003cspan class=\"joueur\">\u003cspan class=\"avatar avatar-moi\">' + moi[0] + \"\u003c/span>\" + moi + \"\u003c/span>\" +\n      '\u003cspan class=\"vs\">VS\u003c/span>' +\n      (adversaire\n        ? '\u003ca href=\"#\" class=\"joueur\" data-ecran=\"17\" data-pseudo=\"' + adversaire + '\">\u003cspan class=\"avatar\">' + adversaire[0] + \"\u003c/span>\" + adversaire + \"\u003c/a>\"\n        : '\u003cspan class=\"joueur\">\u003cspan class=\"avatar\">?\u003c/span>Bientôt connu\u003c/span>') + \"\u003c/div>\";\n    const arbreLien = '\u003ca href=\"#\" class=\"bouton bouton-verre\" data-ecran=\"12\" data-id=\"' + p.t.id + '\">Voir l\\'arbre\u003c/a>';\n    const carte = (surtitre, titre, corps, actions) =>\n      '\u003cdiv class=\"carte-match\">\u003cspan class=\"flamme\">\u003c/span>\u003cp class=\"surtitre\">' + surtitre + \"\u003c/p>\u003ch2>\" + titre + \"\u003c/h2>\" +\n      corps + '\u003cdiv class=\"actions\">' + actions + \"\u003c/div>\u003c/div>\";\n\n    switch (p.etape) {\n      case \"a-venir\": {\n        const minutes = Math.round((new Date(DONNEES.monMatch.debut) - horloge()) / 60000);\n        return carte(\"Ton prochain match\", p.tour + \" · \" + p.t.nom, duel(p.adversaire) +\n          '\u003cp class=\"quand\">Aujourd\\'hui à ' + p.heure + (minutes > 0 ? \" · \u003cb>dans \" + minutes + \" min\u003c/b>\" : \" · \u003cb>maintenant\u003c/b>\") + \"\u003c/p>\",\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"11\">Salle de match\u003c/a>' + arbreLien);\n      }\n      case \"en-cours\":\n        return carte(\"Match en cours\", p.tour + \" · \" + p.t.nom, duel(p.adversaire) +\n          '\u003cp class=\"quand\">Déclare le score dès la fin du match\u003c/p>',\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"14\">Déclarer le résultat\u003c/a>' + arbreLien);\n      case \"litige\":\n        return carte(\"Litige en cours\", p.tour + \" · \" + p.t.nom, duel(p.adversaire) +\n          '\u003cp class=\"quand\">Vos déclarations divergent : le responsable local tranche\u003c/p>',\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"15\">Voir le litige\u003c/a>' + arbreLien);\n      case \"qualifie\":\n        return carte(\"Qualifié !\", p.tour + \" · \" + p.t.nom, duel(p.adversaire) +\n          '\u003cp class=\"quand\">Horaire communiqué à la convocation\u003c/p>', arbreLien);\n      default:\n        return carte(\"Fin du tournoi pour toi\", \"Éliminé en \" + p.tour.toLowerCase() + \" · \" + p.t.nom, \"\",\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"04\">Trouver un tournoi\u003c/a>' +\n          '\u003ca href=\"#\" class=\"bouton bouton-verre\" data-ecran=\"12\" data-id=\"' + p.t.id + '\">Classement\u003c/a>');\n    }\n  }\n\n  /* ---------- En-tête et barre du bas, remplis automatiquement ----------\n     \u003cheader class=\"entete-esport\" data-titre=\"Tournois\" data-repli=\"03\">\u003c/header>\n       data-repli : affiche un bouton retour (écran si pas d'historique)\n     \u003cnav class=\"nav-bas\" data-onglet=\"04\">\u003c/nav> */\n  function remplirEntete() {\n    document.querySelectorAll(\"header.entete-esport[data-titre]\").forEach((entete) => {\n      const repli = entete.dataset.repli;\n      entete.innerHTML =\n        (repli\n          ? '\u003cbutton class=\"bouton-icone\" data-action=\"retour\" data-repli=\"' + repli + '\" aria-label=\"Retour\">' + icone(\"retour\") + \"\u003c/button>\"\n          : '\u003cspan class=\"entete-espace\">\u003c/span>') +\n        '\u003ch1 class=\"entete-titre\">' + entete.dataset.titre + \"\u003c/h1>\" +\n        '\u003cbutton class=\"bouton-icone\" data-ecran=\"25\" aria-label=\"Notifications\">' + icone(\"cloche\") + \"\u003c/button>\";\n    });\n  }\n\n  const ONGLETS = [\n    { ecran: \"03\", libelle: \"Accueil\", icone: \"accueil\" },\n    { ecran: \"04\", libelle: \"Tournois\", icone: \"trophee\" },\n    { ecran: \"05\", libelle: \"Mes matchs\", icone: \"manette\", central: true },\n    { ecran: \"20\", libelle: \"Contenus\", icone: \"lecture\" },\n    { ecran: \"23\", libelle: \"Profil\", icone: \"profil\" }\n  ];\n\n  function remplirNavBas() {\n    document.querySelectorAll(\"nav.nav-bas[data-onglet]\").forEach((nav) => {\n      const actif = nav.dataset.onglet;\n      nav.setAttribute(\"aria-label\", \"Navigation e-sport\");\n      nav.innerHTML = ONGLETS.map((o) => {\n        if (o.central) {\n          return '\u003ca href=\"#\" class=\"onglet onglet-central\" data-ecran=\"' + o.ecran + '\" aria-label=\"' + o.libelle + '\">' +\n            '\u003cspan class=\"bouton-central\">' + icone(o.icone, \"f-white\") + \"\u003c/span>\" +\n            '\u003cspan class=\"libelle-central' + (actif === o.ecran ? \" actif\" : \"\") + '\">' + o.libelle + \"\u003c/span>\u003c/a>\";\n        }\n        const estActif = actif === o.ecran;\n        return '\u003ca href=\"#\" class=\"onglet' + (estActif ? \" actif\" : \"\") + '\" data-ecran=\"' + o.ecran + '\"' +\n          (estActif ? ' aria-current=\"page\"' : \"\") + \">\" +\n          '\u003cspan class=\"icone-onglet\">' + icone(o.icone, estActif ? \"f-primary\" : \"f-text\") + \"\u003c/span>\" +\n          o.libelle + \"\u003c/a>\";\n      }).join(\"\");\n    });\n  }\n\n  /* Exécute fn au chargement puis à chaque changement d'état (gratuit / abonné…) */\n  function monter(fn) {\n    document.addEventListener(\"DOMContentLoaded\", fn);\n    document.addEventListener(\"etat-change\", fn);\n  }\n\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    remplirEntete();\n    remplirNavBas();\n    // Après les rendus des pages (qui créent parfois leur cloche)\n    setTimeout(majCloches, 0);\n  });\n  document.addEventListener(\"etat-change\",
