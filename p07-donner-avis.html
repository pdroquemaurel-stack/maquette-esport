<!DOCTYPE html>
<!-- Écran p07 — Donner ou modifier son avis (p07-donner-avis.html?jeu=bloc-mania&depuis=… ; « retour=avis » : venu de p06).
     Pas d'écran Figma : composants repris de reference/figma-play/06-avis.png (étoiles, bouton doux).
     US : S10-01 (1 à 5 étoiles, commentaire facultatif de 500 caractères au plus, un seul avis par jeu,
     modifiable ou supprimable ; impossible pour un jeu jamais lancé). Avis publié tout de suite,
     sous le pseudo généré tant que le profil joueur (V2) n'existe pas. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donner mon avis</title>
  <link rel="stylesheet" href="css/tokens.css?v=eee3b623">
  <link rel="stylesheet" href="css/style.css?v=eee3b623">
</head>
<body data-zone="play">
<div class="cadre">
  <div class="telephone play">
    <div class="barre-etat" data-heure="9:30"></div>
    <header class="entete-simple-play">
      <a class="retour-play" id="retour" data-t-aria="commun.retour"></a>
      <h1 id="titre"></h1>
    </header>
    <main class="contenu" id="page"></main>
    <div class="barre-action barre-play" id="barre"></div>
  </div>
</div>

<script src="js/data-play.js?v=eee3b623"></script>
<script src="js/textes-play.js?v=eee3b623"></script>
<script src="js/nav.js?v=eee3b623"></script>
<script src="js/play.js?v=eee3b623"></script>
<script src="js/demo.js?v=eee3b623"></script>
<script>
  const jeu = Play.jeuDeLaPage();
  const MAX = 500;
  let note = 0;

  /* Page où revenir : la liste des avis si l'on en vient, sinon la fiche */
  function pageRetour() {
    const params = { jeu: jeu.id, depuis: Play.depuis() };
    if (Nav.param("retour") === "avis") return Play.url("p06-avis.html", params);
    return Play.v2() ? "pv3-fiche-badges.html?jeu=" + jeu.id : Play.url("p03-jeu.html", params);
  }

  function rendre() {
    if (!jeu) return;
    if (!Play.disponible(jeu)) return ouvrirPage("p01-accueil.html?indispo=1");
    Play.appliquerLangue();
    const t = Play.t;
    const mien = Play.monAvis(jeu.id);
    const retour = document.getElementById("retour");
    retour.innerHTML = Play.icone("retour");
    retour.href = pageRetour();
    document.getElementById("titre").textContent = t(mien ? "donner.titreModifier" : "donner.titre");

    const tete = '<div class="jeu-avis"><span class="vignette-cible">' + Play.visuel(jeu, 60, 60, "tuile") + "</span>" +
      "<div><strong>" + jeu.nom + "</strong><small>" + Play.nomGenre(jeu.genre) + "</small></div></div>";

    // Jeu jamais lancé : pas de note possible (S10-01), et une sortie vers la fiche
    if (!Play.aLance(jeu.id)) {
      document.getElementById("page").innerHTML = tete +
        '<div class="message-play">' + Play.icone("manette", "f-primary") + "<div><strong>" + t("donner.jouerDabord") + "</strong>" +
        "<p>" + t("donner.jouerDabordTexte", { nom: jeu.nom }) + "</p></div></div>";
      document.getElementById("barre").innerHTML = '<a class="bouton-jouer" href="' + pageRetour() + '">' + t("donner.revenirJeu") + "</a>";
      return;
    }

    note = mien ? mien.note : note;
    document.getElementById("page").innerHTML = tete +
      '<section class="formulaire-avis">' +
      '<h2 class="titre-play"><span>' + t("donner.taNote") + "</span></h2>" +
      '<div class="choix-etoiles" role="radiogroup" aria-label="' + t("donner.groupeNote") + '">' +
      [1, 2, 3, 4, 5].map((n) => '<button role="radio" data-note="' + n + '" aria-label="' + t("donner.etoiles", { n: n }) + '">' +
        Play.icone("etoile", "f-play-chip") + "</button>").join("") + "</div>" +
      '<p class="libelle-note" id="libelle-note"></p>' +
      '<h2 class="titre-play"><span>' + t("donner.commentaire") + " <small>" + t("donner.facultatif") + "</small></span></h2>" +
      '<textarea class="champ-avis" id="texte" maxlength="' + MAX + '" rows="6" placeholder="' + t("donner.placeholder", { nom: jeu.nom.replace(/"/g, "") }) + '">' + (mien ? mien.texte : "") + "</textarea>" +
      '<p class="compteur" id="compteur"></p>' +
      '<p class="aide-avis">' + t("donner.publieSous", { pseudo: "<b>" + Play.monNom() + "</b>" }) +
      (mien ? t("donner.remplace", { date: Play.dateCourte(mien.date) }) : "") + "</p>" +
      (mien ? '<button class="lien-avis lien-supprimer" id="supprimer">' + t("donner.supprimerMon") + "</button>" : "") +
      "</section>";
    document.getElementById("barre").innerHTML = '<button class="bouton-jouer" id="publier">' + t("donner.publier") + "</button>";

    document.querySelectorAll("[data-note]").forEach((b) => b.addEventListener("click", () => { note = Number(b.dataset.note); majNote(); }));
    document.getElementById("texte").addEventListener("input", majCompteur);
    document.getElementById("publier").addEventListener("click", publier);
    if (mien) document.getElementById("supprimer").addEventListener("click", supprimer);
    majNote();
    majCompteur();
  }

  /* Étoiles pleines jusqu'à la note choisie ; « Publier » inactif tant qu'il n'y a pas de note */
  function majNote() {
    const t = Play.t;
    document.querySelectorAll("[data-note]").forEach((b) => {
      const pleine = Number(b.dataset.note) <= note;
      b.setAttribute("aria-checked", Number(b.dataset.note) === note);
      b.querySelector("svg").setAttribute("class", pleine ? "f-play-star" : "f-play-chip");
    });
    document.getElementById("libelle-note").textContent = note ? t("donner.notes")[note] : t("donner.toucher");
    document.getElementById("publier").disabled = !note;
  }

  function majCompteur() {
    document.getElementById("compteur").textContent = document.getElementById("texte").value.length + " / " + MAX;
  }

  function publier() {
    if (!note) return;
    Play.enregistrerAvis(jeu.id, note, document.getElementById("texte").value.trim().slice(0, MAX));
    Etat.set("toastSuivant", Play.t("donner.publie"));
    ouvrirPage(pageRetour());
  }

  function supprimer() {
    const t = Play.t;
    Nav.dialogue({
      titre: t("avis.supprimerTitre"),
      texte: t("avis.supprimerTexte", { nom: jeu.nom }),
      boutons: [
        { libelle: t("avis.supprimer"), primaire: true, action: () => {
          Play.supprimerAvis(jeu.id);
          Etat.set("toastSuivant", t("avis.supprime"));
          ouvrirPage(pageRetour());
        } },
        { libelle: t("commun.annuler") }
      ]
    });
  }

  // Rendu au chargement, et au changement de langue ; une saisie en cours n'est pas effacée par le reste du menu de démo
  document.addEventListener("DOMContentLoaded", rendre);
  document.addEventListener("etat-change", (e) => { if (e.detail && e.detail.cle === "playLangue") rendre(); });
</script>
</body>
</html>
