text-transform: uppercase; letter-spacing: .04em; padding: var(--space-5) var(--page-gutter) var(--space-3); }\n\n    /* Feuille de filtres */\n    .feuille h2 { font-size: var(--font-size-xl); margin-bottom: var(--space-2); }\n    .feuille h3 { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); margin: var(--space-5) 0 var(--space-2); }\n    .feuille .actions-filtres { display: flex; gap: var(--space-3); margin-top: var(--space-6); }\n    .feuille .actions-filtres .bouton { flex: 1; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Tournois\">\u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"barre-recherche\">\n        \u003clabel class=\"champ\">\n          \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath class=\"f-muted\" d=\"M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z\"/>\u003c/svg>\n          \u003cspan class=\"cache-visuel\">Rechercher un tournoi ou un jeu\u003c/span>\n          \u003cinput type=\"search\" id=\"recherche\" placeholder=\"Tournoi ou jeu\" autocomplete=\"off\">\n        \u003c/label>\n        \u003cbutton class=\"bouton-filtres\" id=\"ouvrir-filtres\" aria-label=\"Filtres\">\u003c/button>\n      \u003c/div>\n\n      \u003c!-- Filtre rapide par jeu (le même que dans la feuille de filtres) -->\n      \u003cdiv class=\"puces\" id=\"puces-jeux\" role=\"group\" aria-label=\"Filtrer par jeu\">\u003c/div>\n\n      \u003cp class=\"resume\" id=\"resume\" aria-live=\"polite\">\u003c/p>\n      \u003cdiv id=\"liste\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n\n    \u003cnav class=\"nav-bas\" data-onglet=\"04\">\u003c/nav>\n\n    \u003c!-- Feuille de filtres -->\n    \u003cdiv class=\"voile\" id=\"voile-filtres\">\n      \u003cdiv class=\"feuille\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"titre-filtres\">\n        \u003cdiv class=\"poignee\">\u003c/div>\n        \u003ch2 id=\"titre-filtres\">Filtres\u003c/h2>\n        \u003cdiv id=\"groupes-filtres\">\u003c/div>\n        \u003cdiv class=\"actions-filtres\">\n          \u003cbutton class=\"bouton bouton-secondaire\" id=\"effacer-filtres\">Effacer\u003c/button>\n          \u003cbutton class=\"bouton bouton-primaire\" id=\"appliquer-filtres\">\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- Définition des filtres (S05-01) : jeu, format, date, accès, mode de jeu ---- */\n  const FILTRES = [\n    { cle: \"jeu\", titre: \"Jeu\", choix: [[\"tous\", \"Tous\"]].concat(DONNEES.jeux.map((j) => [j.id, j.nom])) },\n    { cle: \"format\", titre: \"Format\", choix: [[\"tous\", \"Tous\"], [\"elimination\", \"Élimination directe\"], [\"poules\", \"Poules\"]] },\n    { cle: \"date\", titre: \"Date\", choix: [[\"tous\", \"Toutes\"], [\"semaine\", \"Cette semaine\"], [\"mois\", \"Ce mois-ci\"], [\"plus-tard\", \"Plus tard\"]] },\n    { cle: \"acces\", titre: \"Accès\", choix: [[\"tous\", \"Tous\"], [\"ouvert\", \"Ouvert à tous\"], [\"abonnes\", \"Réservé aux abonnés\"]] },\n    { cle: \"mode\", titre: \"Mode de jeu\", choix: [[\"tous\", \"Tous\"], [\"solo\", \"Solo\"], [\"equipe\", \"Équipe\"]] }\n  ];\n  const AUCUN_FILTRE = { jeu: \"tous\", format: \"tous\", date: \"tous\", acces: \"tous\", mode: \"tous\" };\n\n  let filtres = Object.assign({}, AUCUN_FILTRE);   // filtres appliqués\n  let brouillon = null;                            // filtres en cours de choix dans la feuille\n\n  /* Texte sans accents ni majuscules, pour la recherche */\n  function normaliser(texte) {\n    return texte.normalize(\"NFD\").replace(/[̀-ͯ]/g, \"\").toLowerCase();\n  }\n\n  /* Le tournoi passe-t-il les filtres et la recherche ? */\n  function correspond(t, f, recherche) {\n    const jeu = Esport.jeu(t.jeu);\n    if (recherche && !normaliser(t.nom + \" \" + jeu.nom).includes(normaliser(recherche))) return false;\n    if (f.jeu !== \"tous\" && t.jeu !== f.jeu) return false;\n    if (f.format !== \"tous\" && t.format !== f.format) return false;\n    if (f.acces === \"ouvert\" && t.acces !== \"tous\") return false;\n    if (f.acces === \"abonnes\" && t.acces !== \"abonnes\") return false;\n    if (f.mode !== \"tous\" && t.mode !== f.mode) return false;\n    if (f.date !== \"tous\") {\n      const maintenant = Esport.maintenant();\n      const debut = new Date(t.debut);\n      const jours = (debut - maintenant) / 86400000;\n      const memeMois = debut.getMonth() === maintenant.getMonth() && debut.getFullYear() === maintenant.getFullYear();\n      if (f.date === \"semaine\" && !(jours >= -1 && jours \u003c= 7)) return false;\n      if (f.date === \"mois\" && !memeMois) return false;\n      if (f.date === \"plus-tard\" && memeMois) return false;\n    }\n    return true;\n  }\n\n  function nombreFiltresActifs(f) {\n    return Object.keys(AUCUN_FILTRE).filter((cle) => f[cle] !== \"tous\").length;\n  }\n\n  /* ---- Liste des tournois du pays, du plus proche au plus lointain ---- */\n  function rendreListe() {\n    const recherche = document.getElementById(\"recherche\").value.trim();\n    const tournois = Esport.tournoisDuPays()\n      .filter((t) => correspond(t, filtres, recherche))\n      .sort((a, b) => a.debut.localeCompare(b.debut));\n\n    const groupes = [\n      { titre: \"En cours\", tournois: tournois.filter((t) => t.etat === \"en-cours\") },\n      { titre: \"À venir\", tournois: tournois.filter((t) => t.etat === \"ouvert\" || t.etat === \"complet\") },\n      { titre: \"Terminés\", tournois: tournois.filter((t) => t.etat === \"termine\").reverse() }\n    ];\n\n    const pays = Esport.pays().nom;\n    document.getElementById(\"resume\").textContent = tournois.length\n      ? tournois.length + (tournois.length > 1 ? \" tournois\" : \" tournoi\") + \" au \" + pays\n      : \"\";\n\n    if (!tournois.length) {\n      document.getElementById(\"liste\").innerHTML =\n        '\u003cdiv class=\"vide\">\u003cstrong>Aucun tournoi trouvé\u003c/strong>Essaie un autre mot ou retire des filtres.' +\n        '\u003cbr>\u003cbutton class=\"bouton bouton-secondaire\" id=\"tout-effacer\">Tout effacer\u003c/button>\u003c/div>';\n      document.getElementById(\"tout-effacer\").addEventListener(\"click\", () => {\n        document.getElementById(\"recherche\").value = \"\";\n        filtres = Object.assign({}, AUCUN_FILTRE);\n        rendre();\n      });\n      return;\n    }\n\n    document.getElementById(\"liste\").innerHTML = groupes\n      .filter((g) => g.tournois.length)\n      .map((g) => '\u003ch2 class=\"titre-groupe\">' + g.titre + \"\u003c/h2>\" + g.tournois.map(Esport.carteTournoi).join(\"\"))\n      .join(\"\");\n  }\n\n  /* ---- Puces rapides par jeu ---- */\n  function rendrePuces() {\n    document.getElementById(\"puces-jeux\").innerHTML = FILTRES[0].choix.map(([valeur, libelle]) =>\n      '\u003cbutton class=\"puce' + (filtres.jeu === valeur ? \" actif\" : \"\") + '\" data-jeu=\"' + valeur + '\" aria-pressed=\"' + (filtres.jeu === valeur) + '\">' + libelle + \"\u003c/button>\"\n    ).join(\"\");\n  }\n\n  /* ---- Bouton filtres avec le nombre de filtres actifs ---- */\n  function rendreBoutonFiltres() {\n    const n = nombreFiltresActifs(filtres);\n    const bouton = document.getElementById(\"ouvrir-filtres\");\n    bouton.classList.toggle(\"actif\", n > 0);\n    bouton.innerHTML = Esport.icone(\"filtres\", n ? \"f-primary\" : \"f-text\") + (n ? '\u003cspan class=\"pastille\">' + n + \"\u003c/span>\" : \"\");\n    bouton.setAttribute(\"aria-label\", \"Filtres\" + (n ? \", \" + n + \" actifs\" : \"\"));\n  }\n\n  function rendre() {\n    rendrePuces();\n    rendreBoutonFiltres();\n    rendreListe();\n  }\n\n  /* ---- Feuille de filtres ---- */\n  function rendreFeuille() {\n    document.getElementById(\"groupes-filtres\").innerHTML = FILTRES.map((g) =>\n      \"\u003ch3>\" + g.titre + '\u003c/h3>\u003cdiv class=\"puces puces-retour\" role=\"group\" aria-label=\"' + g.titre + '\">' +\n      g.choix.map(([valeur, libelle]) =>\n        '\u003cbutton class=\"puce' + (brouillon[g.cle] === valeur ? \" actif\" : \"\") + '\" data-cle=\"' + g.cle + '\" data-valeur=\"' + valeur + '\" aria-pressed=\"' + (brouillon[g.cle] === valeur) + '\">' + libelle + \"\u003c/button>\"\n      ).join(\"\") + \"\u003c/div>\"\n    ).join(\"\");\n    // Le bouton annonce le nombre de résultats avant d'appliquer\n    const recherche = document.getElementById(\"recherche\").value.trim();\n    const n = Esport.tournoisDuPays().filter((t) => correspond(t, brouillon, recherche)).length;\n    document.getElementById(\"appliquer-filtres\").textContent = \"Afficher \" + n + (n > 1 ? \" tournois\" : \" tournoi\");\n  }\n\n  const voile = document.getElementById(\"voile-filtres\");\n  document.getElementById(\"ouvrir-filtres\").addEventListener(\"click\", () => {\n    brouillon = Object.assign({}, filtres);\n    rendreFeuille();\n    voile.classList.add(\"ouvert\");\n  });\n  voile.addEventListener(\"click\", (e) => {\n    if (e.target === voile) voile.classList.remove(\"ouvert\");\n    const puce = e.target.closest(\"[data-cle]\");\n    if (puce) {\n      brouillon[puce.dataset.cle] = puce.dataset.valeur;\n      rendreFeuille();\n    }\n  });\n  document.getElementById(\"effacer-filtres\").addEventListener(\"click\", () => {\n    brouillon = Object.assign({}, AUCUN_FILTRE);\n    rendreFeuille();\n  });\n  document.getElementById(\"appliquer-filtres\").addEventListener(\"click\", () => {\n    filtres = brouillon;\n    voile.classList.remove(\"ouvert\");\n    rendre();\n  });\n\n  document.getElementById(\"puces-jeux\").addEventListener(\"click\", (e) => {\n    const puce = e.target.closest(\"[data-jeu]\");\n    if (!puce) return;\n    filtres.jeu = puce.dataset.jeu;\n    rendre();\n  });\n  document.getElementById(\"recherche\").addEventListener(\"input\", rendreListe);\n\n  // Le badge « Réservé aux abonnés » change avec l'interrupteur de démo\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","05-mes-tournois.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 05 — Mes matchs et tournois (onglet central « Mes matchs »).\n     US : S05-01 (espace dédié : tournois où je suis inscrit avec leur prochaine échéance),\n     S04-01 / S04-02 (rang en liste d'attente), S04-03 (équipes à compléter), historique des tournois terminés. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mes matchs\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .liste { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .liste .ligne { padding-left: var(--space-3); padding-right: var(--space-3); }\n    .echeance { color: var(--color-text-secondary); }\n    .echeance.alerte { color: var(--color-primary); font-weight: var(--font-weight-bold); }\n    .lien-equipe { display: inline-flex; align-items: center; min-height: 32px; color: var(--color-primary); font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); }\n    .resultat { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); white-space: nowrap; }\n    .compte { margin-left: var(--space-1); color: var(--color-text-muted); font-size: var(--font-size-md); font-weight: var(--font-weight-medium); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Mes matchs\">\u003c/header>\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cnav class=\"nav-bas\" data-onglet=\"05\">\u003c/nav>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const moi = DONNEES.joueur.pseudo;\n\n  /* Prochaine échéance d'un tournoi où je suis inscrit */\n  function echeance(t) {\n    if (Esport.reglementAAccepter(t)) return { texte: \"Règlement modifié : à réaccepter\", alerte: true };\n    if (t.etat === \"en-cours\") {\n      const p = t.id === DONNEES.monMatch.tournoi ? Esport.prochainMatch() : null;\n      if (!p) return { texte: \"Tournoi en cours\" };\n      const textes = { \"a-venir\": p.tour + \" à \" + p.heure, \"en-cours\": \"Match en cours : résultat à déclarer\",\n        litige: \"Litige en cours\", qualifie: \"Qualifié en \" + p.tour.toLowerCase(), elimine: \"Éliminé en \" + p.tour.toLowerCase() };\n      return { texte: textes[p.etape], alerte: p.etape !== \"elimine\" };\n    }\n    return { texte: \"Début \" + Esport.jourLong(t.debut) + \" à \" + Esport.heure(t.debut) };\n  }\n\n  function ligneTournoi(t, droite, sousTitre, classeSousTitre) {\n    return '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"06\" data-id=\"' + t.id + '\">' + Esport.visuelJeu(t.jeu, \"petit\") +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + t.nom + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-sous-titre ' + (classeSousTitre || \"\") + '\">' + sousTitre + \"\u003c/span>\u003c/span>\" +\n      (droite || Esport.icone(\"chevron\", \"f-muted\")) + \"\u003c/a>\";\n  }\n\n  function titre(texte, n) {\n    return '\u003ch2 class=\"titre-section\">' + texte + (n !== undefined ? '\u003cspan class=\"compte\">' + n + \"\u003c/span>\" : \"\") + \"\u003c/h2>\";\n  }\n\n  function rendre() {\n    const tournois = Esport.tournoisDuPays().concat(DONNEES.tournois.filter((t) => !t.pays.includes(DONNEES.joueur.pays)));\n    const inscrits = tournois.filter((t) => { const i = Esport.inscription(t.id); return i && i.etat === \"inscrit\" && t.etat !== \"termine\"; })\n      .sort((a, b) => a.debut.localeCompare(b.debut));\n    const attente = tournois.filter((t) => { const i = Esport.inscription(t.id); return i && i.etat === \"attente\"; });\n    const equipes = tournois.filter((t) => t.mode === \"equipe\" && Esport.equipe(t.id) && t.etat !== \"termine\");\n    const historique = DONNEES.joueur.historique.map((h) => Object.assign({ t: Esport.tournoi(h.tournoi) }, h));\n    const repris = Etat.get(\"historiqueNonRepris\") ? null : DONNEES.joueur.historiqueRepris;\n    const p = Esport.prochainMatch();\n    let html = \"\";\n\n    // Prochain match\n    if (p) html += Esport.carteProchainMatch(p);\n\n    // Tournois où je suis inscrit, avec leur prochaine échéance\n    html += titre(\"Mes tournois\", inscrits.length);\n    if (inscrits.length) {\n      html += '\u003cdiv class=\"liste\">' + inscrits.map((t) => {\n        const e = echeance(t);\n        return ligneTournoi(t, null, e.texte, \"echeance\" + (e.alerte ? \" alerte\" : \"\"));\n      }).join(\"\") + \"\u003c/div>\";\n    } else {\n      html += '\u003cdiv class=\"vide\">\u003cstrong>Aucun tournoi pour l\\'instant\u003c/strong>Trouve un tournoi dans le calendrier.\u003cbr>' +\n        '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"04\">Voir les tournois\u003c/a>\u003c/div>';\n    }\n\n    // Liste d'attente\n    if (attente.length) {\n      html += titre(\"Liste d'attente\", attente.length) + '\u003cdiv class=\"liste\">' +\n        attente.map((t) => ligneTournoi(t, '\u003cspan class=\"puce-etat puce-attente\">' + Esport.inscription(t.id).rang + \"e\u003c/span>\",\n          \"Une place se libère au premier désistement\")).join(\"\") + \"\u003c/div>\";\n    }\n\n    // Mes équipes, dont celles à compléter\n    if (equipes.length) {\n      html += titre(\"Mes équipes\", equipes.length) + '\u003cdiv class=\"liste\">' + equipes.map((t) => {\n        const eq = Esport.equipe(t.id);\n        const taille = Esport.tailleEquipe(t);\n        const complete = eq.membres.length >= taille;\n        return '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"10\" data-id=\"' + t.id + '\">\u003cspan class=\"avatar\">' + eq.nom[0] + \"\u003c/span>\" +\n          '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + eq.nom + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">' + t.nom +\n          (eq.capitaine === moi ? \" · capitaine\" : \"\") + \"\u003c/span>\u003c/span>\" +\n          '\u003cspan class=\"puce-etat ' + (complete ? \"puce-inscrit\" : \"puce-attente\") + '\">' +\n          (complete ? \"Inscrite\" : \"À compléter \" + eq.membres.length + \"/\" + taille) + \"\u003c/span>\u003c/a>\";\n      }).join(\"\") + \"\u003c/div>\";\n    }\n\n    // Historique des tournois terminés\n    html += titre(\"Historique\") + '\u003cdiv class=\"liste\">' +\n      historique.map((h) => ligneTournoi(h.t, '\u003cspan class=\"resultat\">' + h.resultat + \"\u003c/span>\", \"Terminé le \" + Esport.jourCourt(h.t.debut))).join(\"\") +\n      (repris ? '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"17\" data-pseudo=\"' + Esport.pseudo() + '\">' + Esport.icone(\"calendrier\", \"f-muted\") +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + repris.tournois + \" tournois sur l'ancienne plateforme\u003c/span>\" +\n        '\u003cspan class=\"ligne-sous-titre\">Historique repris · ' + repris.victoires + \" victoires\u003c/span>\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\" : \"\") +\n      \"\u003c/div>\";\n\n    html += '\u003cdiv class=\"fin-contenu\">\u003c/div>';\n    document.getElementById(\"page\").innerHTML = html;\n  }\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","06-tournoi.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 06 — Page d'un tournoi (06-tournoi.html?id=t01).\n     US : S05-03 (jeu, format, dates, dotations, règlement, partenaires, participants ; consultable par tous),\n     S03-03 (règlement modifié : nouvelle acceptation requise), S03-04 (condition d'accès),\n     S03-06 (dotations versées sur le numéro Max it), S03-07 (pays d'un tournoi MEA),\n     S04-01 / S04-02 (inscription, liste d'attente, désinscription avant le début).\n     Bouton principal : S'inscrire · S'abonner pour s'inscrire · Rejoindre la liste d'attente ·\n     Inscrit / Se désinscrire · Inscriptions closes (calculé par Esport.etatBouton). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Tournoi\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    /* Visuel du jeu en haut, boutons ronds posés dessus (comme le Game corner) */\n    .hero { position: relative; height: 180px; flex-shrink: 0; }\n    .hero .boutons-hero {\n      position: absolute;\n      top: var(--space-2);\n      left: var(--space-3);\n      right: var(--space-3);\n      display: flex;\n      justify-content: space-between;\n    }\n    .bouton-verre-rond { background: var(--color-glass-dark); }\n\n    .tete { padding: var(--space-4) var(--page-gutter) 0; }\n    .tete .carte-badges { margin: 0 0 var(--space-2); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .lien-jeu { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--touch-target); color: var(--color-primary); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); }\n    .lien-jeu svg { width: 16px; height: 16px; }\n\n    .bandeau-reglement { margin-top: var(--space-2); }\n\n    /* Grille d'informations */\n    .infos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); padding: var(--space-4) var(--page-gutter) 0; }\n    .info { background: var(--color-surface-warm); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--font-size-sm); }\n    .info small { display: block; color: var(--color-text-secondary); font-size: var(--font-size-xs); }\n    .info b { display: block; font-size: var(--font-size-md); line-height: var(--line-height-tight); margin-top: 2px; }\n    .info.large { grid-column: 1 / -1; }\n    .jauge { height: 6px; border-radius: var(--radius-pill); background: var(--color-border); margin-top: var(--space-2); overflow: hidden; }\n    .jauge span { display: block; height: 100%; background: var(--color-primary); border-radius: var(--radius-pill); }\n\n    /* Dotations */\n    .dotations { list-style: none; margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .dotations li { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); font-weight: var(--font-weight-bold); }\n    .dotations li:last-child { border-bottom: 0; }\n    .medaille { width: 28px; height: 28px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-xs); color: var(--color-text); background: var(--illu-gray-light); flex-shrink: 0; }\n    .medaille.or { background: var(--illu-gold-light); }\n    .medaille.bronze { background: var(--illu-sand); }\n    .note { font-size: var(--font-size-xs); color: var(--color-text-secondary); padding: var(--space-2) var(--page-gutter) 0; }\n\n    .bloc-liens { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .bloc-liens .ligne { padding-left: var(--space-4); padding-right: var(--space-3); }\n    .icone-ligne { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--color-primary-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n    .icone-ligne svg { width: 22px; height: 22px; }\n\n    /* Barre d'action : statut du joueur au-dessus du bouton */\n    .statut { display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-weight: var(--font-weight-bold); margin-bottom: var(--space-2); }\n    .statut svg { width: 20px; height: 20px; }\n    .actions-duo { display: flex; gap: var(--space-2); }\n    .actions-duo .bouton { flex: 1; padding: 0 var(--space-3); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n\n    \u003c!-- Bouton principal selon l'état d'inscription -->\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(\"t01\");\n  const jeu = Esport.jeu(t.jeu);\n  document.title = t.nom;\n\n  /* Le tournoi a-t-il un arbre, des poules ou un classement à suivre ? (écran 12) */\n  const suivable = !!(DONNEES.arbres[t.id] || DONNEES.poules[t.id]);\n\n  /* ---- Participants : pseudos publics seulement (S05-03) ---- */\n  function participants() {\n    const moi = Esport.inscription(t.id);\n    const liste = [];\n\n    if (DONNEES.arbres[t.id]) {\n      // Joueurs du premier tour de l'arbre\n      DONNEES.arbres[t.id].matchs[0].forEach((m) => { liste.push({ nom: m[0] }); liste.push({ nom: m[1] }); });\n    } else if (DONNEES.poules[t.id]) {\n      DONNEES.poules[t.id].forEach((p) => p.joueurs.forEach((j) => liste.push({ nom: j.pseudo })));\n    } else if (t.mode === \"equipe\") {\n      // Équipes : nom et capitaine\n      const equipes = [\"Atlas Squad\", \"Casa Legends\", \"Team Sahara\", \"Rabat Wolves\", \"Marrakech Fire\", \"Tanger Storm\"];\n      equipes.forEach((e, i) => liste.push({ nom: e, capitaine: DONNEES.pseudosClassement[i * 3] }));\n    } else {\n      DONNEES.pseudosClassement.slice(0, 6).forEach((p) => liste.push({ nom: p }));\n    }\n    // Le joueur inscrit apparaît en tête, avec son pseudo courant (il a pu en changer en 02)\n    const autres = liste.filter((p) => p.nom !== DONNEES.joueur.pseudo && p.nom !== Esport.pseudo());\n    return (moi && moi.etat === \"inscrit\" ? [{ nom: Esport.pseudo(), moi: true }] : []).concat(autres);\n  }\n\n  function rendrePage() {\n    const ins = Esport.inscription(t.id);\n    const restantes = Math.max(t.places - t.inscrits, 0);\n    const pourcentage = Math.min(100, Math.round(t.inscrits / t.places * 100));\n    let html = \"\";\n\n    // Visuel du jeu, retour et notifications\n    html += '\u003cdiv class=\"hero\">' + Esport.visuelJeu(t.jeu, \"grand\") +\n      '\u003cdiv class=\"boutons-hero\">' +\n      '\u003cbutton class=\"bouton-icone bouton-verre-rond\" data-action=\"retour\" data-repli=\"04\" aria-label=\"Retour\">' + Esport.icone(\"retour\", \"f-white\") + \"\u003c/button>\" +\n      '\u003cbutton class=\"bouton-icone bouton-verre-rond\" data-ecran=\"25\" aria-label=\"Notifications\">' + Esport.icone(\"cloche\", \"f-white\") + \"\u003c/button>\" +\n      \"\u003c/div>\u003c/div>\";\n\n    // Titre, badges, lien vers le jeu\n    html += '\u003cdiv class=\"tete\">\u003cdiv class=\"carte-badges\">' + Esport.badges(t) + \"\u003c/div>\" +\n      \"\u003ch1>\" + t.nom + \"\u003c/h1>\" +\n      '\u003ca href=\"#\" class=\"lien-jeu\" data-ecran=\"13\" data-id=\"' + jeu.id + '\">' + jeu.nom + Esport.icone(\"chevron\", \"f-primary\") + \"\u003c/a>\u003c/div>\";\n\n    // Règlement modifié après inscription : nouvelle acceptation requise (S03-03)\n    if (Esport.reglementAAccepter(t) && t.etat === \"ouvert\") {\n      html += '\u003cdiv class=\"encart encart-alerte bandeau-reglement\" role=\"alert\">' + Esport.icone(\"alerte\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Règlement modifié\u003c/strong>\u003cp>La version \" + t.reglement.version +\n        \" remplace celle que tu as acceptée. Accepte-la pour garder ta place.\u003c/p>\" +\n        '\u003ca href=\"#\" class=\"lien-encart\" data-ecran=\"07\" data-id=\"' + t.id + '\">Lire et accepter\u003c/a>\u003c/div>\u003c/div>';\n    }\n\n    // Informations principales\n    html += '\u003cdiv class=\"infos\">' +\n      '\u003cdiv class=\"info\">\u003csmall>Début\u003c/small>\u003cb>' + Esport.jourLong(t.debut) + \"\u003c/b>\" + Esport.heure(t.debut) + \"\u003c/div>\" +\n      '\u003cdiv class=\"info\">\u003csmall>Inscriptions\u003c/small>\u003cb>' + Esport.jourCourt(t.ouverture) + \" → \" + Esport.jourCourt(t.cloture) + \"\u003c/b>\" +\n      (Esport.inscriptionsCloses(t) ? \"Closes\" : \"Ouvertes\") + \"\u003c/div>\" +\n      '\u003cdiv class=\"info\">\u003csmall>Format\u003c/small>\u003cb>' + Esport.libelleFormat(t) + \"\u003c/b>\u003c/div>\" +\n      '\u003cdiv class=\"info\">\u003csmall>Mode\u003c/small>\u003cb>' + Esport.libelleMode(t) + \"\u003c/b>\u003c/div>\" +\n      '\u003cdiv class=\"info\">\u003csmall>Accès\u003c/small>\u003cb>' + (t.acces === \"abonnes\" ? \"Réservé aux abonnés\" : \"Ouvert à tous\") + \"\u003c/b>\u003c/div>\" +\n      '\u003cdiv class=\"info\">\u003csmall>' + (t.mode === \"equipe\" ? \"Équipes\" : \"Joueurs\") + \"\u003c/small>\u003cb>\" + t.inscrits + \" / \" + t.places + \"\u003c/b>\" +\n      '\u003cdiv class=\"jauge\" aria-hidden=\"true\">\u003cspan style=\"width:' + pourcentage + '%\">\u003c/span>\u003c/div>\u003c/div>';\n    if (t.portee === \"MEA\") {\n      html += '\u003cdiv class=\"info large\">\u003csmall>Tournoi MEA · pays participants\u003c/small>\u003cb>' +\n        t.pays.map((p) => DONNEES.pays[p].nom).join(\", \") + \"\u003c/b>Arbre et classement communs à tous les pays\u003c/div>\";\n    }\n    html += \"\u003c/div>\";\n    if (t.etat === \"ouvert\" && restantes > 0) {\n      html += '\u003cp class=\"note\">' + restantes + \" places restantes · l'arbre sera généré à la clôture des inscriptions.\u003c/p>\";\n    }\n\n    // Dotations (S03-06)\n    html += '\u003ch2 class=\"titre-section\">Dotations\u003c/h2>\u003cul class=\"dotations\">' +\n      t.dotations.map((d, i) =>\n        '\u003cli>\u003cspan class=\"medaille ' + [\"or\", \"\", \"bronze\"][i] + '\">' + (i + 1) + (i ? \"e\" : \"er\") + \"\u003c/span>\" + d + \"\u003c/li>\"\n      ).join(\"\") + \"\u003c/ul>\" +\n      '\u003cp class=\"note\">Les dotations en argent et en data sont versées sur ton numéro Max it.\u003c/p>';\n\n    // Suivre le tournoi, règlement, partenaires\n    html += '\u003ch2 class=\"titre-section\">Le tournoi\u003c/h2>\u003cdiv class=\"bloc-liens\">';\n    if (suivable) {\n      const libelle = DONNEES.poules[t.id] ? \"Poules et classement\" : \"Arbre et classement\";\n      html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"12\" data-id=\"' + t.id + '\">\u003cspan class=\"icone-ligne\">' + Esport.icone(\"trophee\", \"f-primary\") + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + libelle + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">' +\n        (t.etat === \"termine\" ? \"Classement final\" : \"Mis à jour en direct\") + \"\u003c/span>\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n    }\n    const monEquipe = t.mode === \"equipe\" ? Esport.equipe(t.id) : null;\n    if (monEquipe) {\n      html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"10\" data-id=\"' + t.id + '\">\u003cspan class=\"icone-ligne\">' + Esport.icone(\"groupe\", \"f-primary\") + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Mon équipe · ' + monEquipe.nom + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">' +\n        monEquipe.membres.length + \" / \" + Esport.tailleEquipe(t) + \" joueurs\" + (monEquipe.capitaine === DONNEES.joueur.pseudo ? \" · tu es capitaine\" : \"\") +\n        \"\u003c/span>\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n    }\n    html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"07\" data-id=\"' + t.id + '\">\u003cspan class=\"icone-ligne\">' + Esport.icone(\"article\", \"f-primary\") + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Règlement\u003c/span>\u003cspan class=\"ligne-sous-titre\">Version ' + t.reglement.version +\n      (t.reglement.modifie ? \" · modifié le 8 oct.\" : \"\") + \"\u003c/span>\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\" +\n      '\u003cdiv class=\"ligne\">\u003cspan class=\"icone-ligne\">' + Esport.icone(\"boutique\", \"f-primary\") + \"\u003c/span>\" +\n      '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">Partenaires\u003c/span>\u003cspan class=\"ligne-sous-titre\">Max it · Orange Money\u003c/span>\u003c/span>\u003c/div>' +\n      \"\u003c/div>\";\n\n    // Participants\n    const liste = participants();\n    html += '\u003ch2 class=\"titre-section\">' + (t.mode === \"equipe\" ? \"Équipes inscrites\" : \"Participants\") +\n      ' \u003cspan class=\"ligne-sous-titre\">' + t.inscrits + \"\u003c/span>\u003c/h2>\u003cdiv>\";\n    liste.slice(0, 6).forEach((p) => {\n      const pseudoProfil = p.capitaine || p.nom;\n      html += '\u003ca href=\"#\" class=\"ligne\" data-ecran=\"17\" data-pseudo=\"' + pseudoProfil + '\">' +\n        '\u003cspan class=\"avatar' + (p.moi ? \" avatar-moi\" : \"\") + '\">' + p.nom[0] + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + p.nom + (p.moi ? \" (toi)\" : \"\") + \"\u003c/span>\" +\n        (p.capitaine ? '\u003cspan class=\"ligne-sous-titre\">Capitaine : ' + p.capitaine + \"\u003c/span>\" : \"\") +\n        \"\u003c/span>\" + Esport.icone(\"chevron\", \"f-muted\") + \"\u003c/a>\";\n    });\n    const affiches = Math.min(liste.length, 6);\n    if (t.inscrits > affiches) html += '\u003cp class=\"note\">… et ' + (t.inscrits - affiches) + \" autres\u003c/p>\";\n    html += '\u003c/div>\u003cdiv class=\"fin-contenu\">\u003c/div>';\n\n    document.getElementById(\"page\").innerHTML = html;\n  }\n\n  /* ---- Barre d'action : un état parmi ceux calculés par Esport.etatBouton ---- */\n  function rendreAction() {\n    const etat = Esport.etatBouton(t);\n    const ins = Esport.inscription(t.id);\n    const zone = document.getElementById(\"action\");\n    const coche = Esport.icone(\"coche\", \"f-success-dark\");\n    let html = \"\";\n\n    switch (etat) {\n      case \"inscrire\":\n        html = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"07\" data-id=\"' + t.id + '\">S\\'inscrire\u003c/a>' +\n          '\u003cp class=\"aide-action\">Inscriptions jusqu\\'au ' + Esport.jourCourt(t.cloture) + \" · après lecture du règlement\u003c/p>\";\n        break;\n      case \"abonner\":\n        // Joueur gratuit sur un tournoi réservé : la page d'offre s'ouvre, retour ici ensuite (S05-02)\n        html = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"21\" data-origine>' +\n          Esport.icone(\"cadenas\", \"f-white\") + \"S'abonner pour s'inscrire\u003c/a>\" +\n          '\u003cp class=\"aide-action\">Tournoi réservé aux abonnés. Tu reviendras ici après l\\'abonnement.\u003c/p>';\n        break;\n      case \"complet\":\n        html = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"07\" data-id=\"' + t.id + '\">Rejoindre la liste d\\'attente\u003c/a>' +\n          '\u003cp class=\"aide-action\">Tournoi complet · la première place libérée revient au premier de la liste\u003c/p>';\n        break;\n      case \"attente\":\n        html = '\u003cp class=\"statut\">' + Esport.icone(\"groupe\", \"f-text\") + \"Liste d'attente · tu es \" + ins.rang + \"e\u003c/p>\" +\n          '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"quitter\">Quitter la liste d\\'attente\u003c/button>';\n        break;\n      case \"equipe-incomplete\": {\n        // Équipe pas encore complète : elle sera inscrite automatiquement une fois complète (S04-03)\n        const eq = Esport.equipe(t.id);\n        html = '\u003cp class=\"statut\">' + Esport.icone(\"groupe\", \"f-text\") + \"Équipe \" + eq.nom + \" · \" + eq.membres.length + \"/\" + Esport.tailleEquipe(t) + \"\u003c/p>\" +\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"10\" data-id=\"' + t.id + '\">Compléter mon équipe\u003c/a>' +\n          '\u003cp class=\"aide-action\">Inscription automatique dès que l\\'équipe est complète, avant le ' + Esport.jourCourt(t.cloture) + \"\u003c/p>\";\n        break;\n      }\n      case \"inscrit\":\n        if (Esport.reglementAAccepter(t)) {\n          html = '\u003cp class=\"statut\">' + coche + \"Inscrit · règlement à réaccepter\u003c/p>\" +\n            '\u003cdiv class=\"actions-duo\">\u003cbutton class=\"bouton bouton-secondaire\" id=\"quitter\">Se désinscrire\u003c/button>' +\n            '\u003ca href=\"#\" class=\"bouton bouton-primaire\" data-ecran=\"07\" data-id=\"' + t.id + '\">Accepter le règlement\u003c/a>\u003c/div>';\n        } else {\n          html = '\u003cp class=\"statut\">' + coche + \"Inscrit\u003c/p>\" +\n            '\u003cbutton class=\"bouton bouton-secondaire bouton-pleine-largeur\" id=\"quitter\">Se désinscrire\u003c/button>' +\n            '\u003cp class=\"aide-action\">Désinscription possible jusqu\\'au début du tournoi\u003c/p>';\n        }\n        break;\n      case \"inscrit-en-cours\":\n        html = '\u003cp class=\"statut\">' + coche + \"Inscrit · tournoi en cours\u003c/p>\" +\n          '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir mon prochain match\u003c/a>';\n        break;\n      case \"closes\":\n        html = '\u003cbutton class=\"bouton bouton-pleine-largeur\" disabled>Inscriptions closes\u003c/button>' +\n          (suivable ? '\u003ca href=\"#\" class=\"bouton bouton-lien bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Suivre le tournoi\u003c/a>' : \"\");\n        break;\n      case \"termine\":\n        html = '\u003cbutton class=\"bouton bouton-pleine-largeur\" disabled>Tournoi terminé\u003c/button>' +\n          (suivable ? '\u003ca href=\"#\" class=\"bouton bouton-lien bouton-pleine-largeur\" data-ecran=\"12\" data-id=\"' + t.id + '\">Voir le classement final\u003c/a>' : \"\");\n        break;\n    }\n    zone.innerHTML = html;\n\n    // Désinscription ou sortie de la liste d'attente, avec confirmation (S04-02)\n    const quitter = document.getElementById(\"quitter\");\n    if (quitter) {\n      quitter.addEventListener(\"click\", () => {\n        const attente = ins.etat === \"attente\";\n        Nav.dialogue({\n          titre: attente ? \"Quitter la liste d'attente ?\" : \"Te désinscrire ?\",\n          texte: attente\n            ? \"Tu perdras ton rang. Tu pourras t'y remettre tant que les inscriptions sont ouvertes.\"\n            : t.mode === \"equipe\"\n              ? \"Tu quittes aussi ton équipe. Ta place sera proposée au premier joueur de la liste d'attente.\"\n              : \"Ta place sera proposée au premier joueur de la liste d'attente.\",\n          boutons: [\n            { libelle: attente ? \"Quitter la liste\" : \"Me désinscrire\", primaire: true, action: () => {\n              Esport.changerInscription(t.id, null);\n              if (t.mode === \"equipe\") Esport.changerEquipe(t.id, null);\n              Nav.toast(attente ? \"Tu as quitté la liste d'attente\" : \"Tu es désinscrit de \" + t.nom);\n            } },\n            { libelle: \"Annuler\" }\n          ]\n        });\n      });\n    }\n  }\n\n  function rendre() {\n    rendrePage();\n    rendreAction();\n  }\n  Esport.monter(rendre);\n\n  // Retour depuis le règlement (07) ou l'équipe (10)\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    const message = { accepte: \"Nouveau règlement accepté : ta place est conservée\",\n      desinscrit: \"Tu es désinscrit de \" + t.nom, \"equipe-quittee\": \"Tu as quitté ton équipe\" }[Nav.param(\"message\")];\n    if (message) Nav.toast(message);\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","07-reglement.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 07 — Règlement d'un tournoi et son acceptation (07-reglement.html?id=t09).\n     US : S03-03 (acceptation explicite obligatoire avant l'inscription, version acceptée enregistrée ;\n     règlement modifié après inscription : accepter, ou refuser et être désinscrit).\n     Après acceptation : 08 (tournoi solo) ou 09 (tournoi en équipe). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Règlement\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { padding: 0 var(--page-gutter) var(--space-4); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }\n    .changements { margin-bottom: var(--space-4); }\n    .changements ul { margin: var(--space-2) 0 0 var(--space-4); color: var(--color-text); }\n    .changements li + li { margin-top: var(--space-1); }\n\n    /* Articles dépliables */\n    .articles { margin: 0 var(--page-gutter); background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }\n    .article { border-bottom: 1px solid var(--color-border); }\n    .article:last-child { border-bottom: 0; }\n    .article summary {\n      display: flex;\n      align-items: center;\n      gap: var(--space-2);\n      min-height: 52px;\n      padding: var(--space-2) var(--space-4);\n      font-weight: var(--font-weight-bold);\n      cursor: pointer;\n      list-style: none;\n    }\n    .article summary::-webkit-details-marker { display: none; }\n    .article summary .titre-article { flex: 1; }\n    .article summary svg { width: 18px; height: 18px; transition: transform .15s; }\n    .article[open] summary svg { transform: rotate(90deg); }\n    .article .texte { padding: 0 var(--space-4) var(--space-4); font-size: var(--font-size-sm); color: var(--color-text-secondary); }\n    .article .texte p + p { margin-top: var(--space-2); }\n    .puce-modifie { background: var(--color-primary-soft); color: var(--color-primary); }\n\n    .case {\n      display: flex;\n      align-items: center;\n      gap: var(--space-3);\n      min-height: var(--touch-target);\n      font-weight: var(--font-weight-bold);\n      margin-bottom: var(--space-2);\n      cursor: pointer;\n    }\n    .case input { width: 22px; height: 22px; accent-color: var(--color-primary); flex-shrink: 0; }\n    .actions-duo { display: flex; gap: var(--space-2); }\n    .actions-duo .bouton { flex: 1; padding: 0 var(--space-3); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Règlement\" data-repli=\"06\">\u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"tete\">\n        \u003ch1 id=\"nom-tournoi\">\u003c/h1>\n        \u003cp id=\"version\">\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"changements\">\u003c/div>\n      \u003cdiv class=\"articles\" id=\"articles\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(\"t09\");\n  const jeu = Esport.jeu(t.jeu);\n  const v2 = t.reglement.version >= 2;\n\n  /* Articles du règlement, construits à partir de la fiche du tournoi.\n     modifie : article changé dans la dernière version. */\n  function articles() {\n    return [\n      { titre: \"1. Inscription\", texte: [\n        \"Inscriptions du \" + Esport.jourCourt(t.ouverture) + \" au \" + Esport.jourCourt(t.cloture) + \". \" +\n        (t.acces === \"abonnes\" ? \"Tournoi réservé aux joueurs abonnés.\" : \"Tournoi ouvert à tous les joueurs.\") +\n        (t.portee === \"MEA\" ? \" Ouvert aux joueurs de : \" + t.pays.map((p) => DONNEES.pays[p].nom).join(\", \") + \".\" : \"\"),\n        \"Un même compte Max it et un même identifiant de jeu ne peuvent être inscrits qu'une fois dans ce tournoi.\"\n      ] },\n      { titre: \"2. Format\", texte: [\n        Esport.libelleFormat(t) + \", \" + Esport.libelleMode(t).toLowerCase() + \", sur \" + jeu.nom + \". \" + t.places + \" places au maximum ; au-delà, liste d'attente.\",\n        t.mode === \"equipe\" ? \"L'équipe est inscrite automatiquement dès qu'elle compte \" + jeu.equipe + \" joueurs. Une équipe incomplète à la clôture n'est pas inscrite.\" : \"L'arbre est publié à la clôture des inscriptions.\"\n      ] },\n      { titre: \"3. Présence\", modifie: v2, texte: [\n        \"Confirme ta présence dans la salle de match à partir de \" + (v2 ? 10 : 5) + \" minutes avant l'heure du match. Sans confirmation à l'heure, tu es déclaré forfait.\",\n        \"Trois forfaits en 30 jours entraînent 7 jours sans inscription possible.\"\n      ] },\n      { titre: \"4. Résultats et litiges\", texte: [\n        \"Chaque joueur déclare le score dans les 30 minutes qui suivent le match.\",\n        \"En cas de désaccord, chacun peut envoyer jusqu'à 3 captures d'écran. Le responsable local tranche.\"\n      ] },\n      { titre: \"5. Comportement\", texte: [\n        \"Triche, insultes ou usage d'un compte prêté entraînent l'exclusion du tournoi, voire de la plateforme. Toute exclusion peut être contestée.\"\n      ] },\n      { titre: \"6. Dotations\", modifie: v2, texte: [\n        t.dotations.map((d, i) => (i + 1) + (i ? \"e\" : \"er\") + \" : \" + d).join(\" · \") + \".\",\n        \"Les dotations sont versées sur le numéro Max it du gagnant. Une seule dotation par personne et par tournoi.\"\n      ] }\n    ];\n  }\n\n  function rendreArticles(modeModif) {\n    const chevron = Esport.icone(\"chevron\", \"f-muted\");\n    document.getElementById(\"articles\").innerHTML = articles().map((a, i) =>\n      '\u003cdetails class=\"article\"' + (i === 0 || (modeModif && a.modifie) ? \" open\" : \"\") + \">\" +\n      '\u003csummary>\u003cspan class=\"titre-article\">' + a.titre + \"\u003c/span>\" +\n      (modeModif && a.modifie ? '\u003cspan class=\"puce-etat puce-modifie\">Modifié\u003c/span>' : \"\") + chevron + \"\u003c/summary>\" +\n      '\u003cdiv class=\"texte\">' + a.texte.map((p) => \"\u003cp>\" + p + \"\u003c/p>\").join(\"\") + \"\u003c/div>\u003c/details>\"\n    ).join(\"\");\n  }\n\n  function rendre() {\n    const modeModif = Esport.reglementAAccepter(t);\n    const etat = Esport.etatBouton(t);\n    document.getElementById(\"nom-tournoi\").textContent = t.nom;\n    document.getElementById(\"version\").textContent = \"Version \" + t.reglement.version +\n      (t.reglement.date ? \" · mise à jour le \" + Esport.jourCourt(t.reglement.date) : \"\") + \" · rédigé par le responsable local\";\n    rendreArticles(modeModif);\n\n    // Règlement modifié après l'inscription : ce qui a changé\n    document.getElementById(\"changements\").innerHTML = modeModif\n      ? '\u003cdiv class=\"encart encart-alerte changements\">' + Esport.icone(\"alerte\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Ce qui change dans la version \" + t.reglement.version + \"\u003c/strong>\u003cul>\" +\n        t.reglement.changements.map((c) => \"\u003cli>\" + c + \"\u003c/li>\").join(\"\") + \"\u003c/ul>\u003c/div>\u003c/div>\"\n      : \"\";\n\n    const zone = document.getElementById(\"action\");\n    if (modeModif) {\n      zone.innerHTML = '\u003cdiv class=\"actions-duo\">' +\n        '\u003cbutton class=\"bouton bouton-secondaire\" id=\"refuser\">Refuser et me désinscrire\u003c/button>' +\n        '\u003cbutton class=\"bouton bouton-primaire\" id=\"accepter\">Accepter\u003c/button>\u003c/div>' +\n        '\u003cp class=\"aide-action\">Sans acceptation, tu ne pourras pas jouer ce tournoi.\u003c/p>';\n    } else if (etat === \"inscrire\" || etat === \"complet\") {\n      const libelle = t.mode === \"equipe\" ? \"Accepter et choisir mon équipe\"\n        : etat === \"complet\" ? \"Accepter et rejoindre la liste d'attente\" : \"Accepter et m'inscrire\";\n      zone.innerHTML = '\u003clabel class=\"case\">\u003cinput type=\"checkbox\" id=\"j-accepte\"> J\\'accepte le règlement\u003c/label>' +\n        '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"inscrire\" disabled>' + libelle + \"\u003c/button>\";\n    } else if (etat === \"abonner\") {\n      zone.innerHTML = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"21\" data-origine>' +\n        Esport.icone(\"cadenas\", \"f-white\") + \"S'abonner pour s'inscrire\u003c/a>\";\n    } else {\n      // Simple lecture : déjà inscrit, inscriptions closes, tournoi terminé…\n      zone.innerHTML = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"06\" data-id=\"' + t.id + '\">Retour au tournoi\u003c/a>' +\n        (etat === \"inscrit\" ? '\u003cp class=\"aide-action\">Tu as accepté la version ' + t.reglement.version + \" de ce règlement.\u003c/p>\" : \"\");\n    }\n    brancherActions();\n  }\n\n  function brancherActions() {\n    const caseAccepte = document.getElementById(\"j-accepte\");\n    const inscrire = document.getElementById(\"inscrire\");\n    // La case est obligatoire : sans elle, le bouton reste inactif (S03-03)\n    if (caseAccepte) caseAccepte.addEventListener(\"change\", () => { inscrire.disabled = !caseAccepte.checked; });\n    if (inscrire) {\n      inscrire.addEventListener(\"click\", () => {\n        if (!caseAccepte.checked) return;\n        Esport.accepterReglement(t);\n        Nav.aller(t.mode === \"equipe\" ? \"09\" : \"08\", null, { id: t.id });\n      });\n    }\n\n    const accepter = document.getElementById(\"accepter\");\n    if (accepter) {\n      accepter.addEventListener(\"click\", () => {\n        Esport.accepterReglement(t);\n        Nav.aller(\"06\", null, { id: t.id, message: \"accepte\" });\n      });\n    }\n\n    const refuser = document.getElementById(\"refuser\");\n    if (refuser) {\n      refuser.addEventListener(\"click\", () => {\n        Nav.dialogue({\n          titre: \"Refuser le nouveau règlement ?\",\n          texte: \"Tu seras désinscrit de \" + t.nom + (t.mode === \"equipe\" ? \" et tu quitteras ton équipe\" : \"\") + \". Ta place ira au premier de la liste d'attente.\",\n          boutons: [\n            { libelle: \"Refuser et me désinscrire\", primaire: true, action: () => {\n              Esport.changerInscription(t.id, null);\n              if (t.mode === \"equipe\") Esport.changerEquipe(t.id, null);\n              Nav.aller(\"06\", null, { id: t.id, message: \"desinscrit\" });\n            } },\n            { libelle: \"Annuler\" }\n          ]\n        });\n      });\n    }\n  }\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","08-inscription-resultat.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 08 — Résultat de l'inscription (08-inscription-resultat.html?id=t09).\n     US : S04-01 / S04-02 (réponse immédiate : place acquise ou liste d'attente avec rang),\n     S04-05 (refus : compte ou identifiant de jeu déjà inscrit, contestable), critère de pays (S03-07),\n     S06-03 (suspension de 7 jours après 3 forfaits), S03-04 (abonnement expiré : inscription annulée).\n     Pas de refus pour l'âge (S01-03 en suspens).\n     Le résultat dépend du tournoi ; les refus, la suspension et l'abonnement expiré\n     s'obtiennent depuis le menu de démo. -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Résultat de l'inscription\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .resultat { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-6) var(--page-gutter) var(--space-5); }\n    .pictogramme { width: 88px; height: 88px; border-radius: var(--radius-round); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-5); background: var(--color-primary-soft); }\n    .pictogramme svg { width: 44px; height: 44px; }\n    .pictogramme.succes { background: var(--color-success-dark); }\n    .pictogramme.refus { background: var(--color-bg-muted); }\n    .resultat h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); margin-bottom: var(--space-2); }\n    .resultat p { color: var(--color-text-secondary); }\n    .rang { display: block; font-size: 56px; font-weight: var(--font-weight-bold); color: var(--color-primary); line-height: 1; margin: var(--space-2) 0; }\n    .rang small { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: var(--font-weight-medium); margin-top: var(--space-1); }\n\n    /* Motif du refus */\n    .motif { margin-bottom: var(--space-4); }\n    .motif ul { margin: var(--space-2) 0 0 var(--space-4); }\n    .rappel { font-size: var(--font-size-xs); color: var(--color-text-muted); padding: 0 var(--page-gutter); margin-top: var(--space-2); }\n    .barre-action .bouton + .bouton { margin-top: var(--space-2); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Inscription\" data-repli=\"06\">\u003c/header>\n\n    \u003cmain class=\"contenu\" id=\"page\">\u003c/main>\n    \u003cdiv class=\"barre-action\" id=\"action\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  /* ---- Quel résultat afficher ? ---- */\n  const scenario = Esport.lireScenario();\n\n  // Tournoi par défaut de chaque état de démo (le menu de démo n'en transmet pas)\n  const TOURNOI_DEMO = { \"refus-pays\": \"t07\", \"abonnement-expire\": \"t02\", \"liste-attente\": \"t11\" };\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(TOURNOI_DEMO[scenario] || \"t09\");\n\n  function choisirResultat() {\n    const SCENARIOS = {\n      \"refus-doublon\": \"refus-identifiant\", \"refus-compte\": \"refus-compte\", \"refus-pays\": \"refus-pays\",\n      \"suspension\": \"suspension\", \"abonnement-expire\": \"abonnement-expire\", \"liste-attente\": \"attente\"\n    };\n    if (SCENARIOS[scenario]) return SCENARIOS[scenario];\n    const etat = Esport.etatBouton(t);\n    if (etat === \"inscrire\" || etat === \"inscrit\") return \"acquise\";\n    if (etat === \"complet\" || etat === \"attente\") return \"attente\";\n    return \"closes\";\n  }\n  const resultat = choisirResultat();\n\n  /* ---- Enregistrement de l'inscription (une seule fois, à l'arrivée sur l'écran) ---- */\n  const ins = Esport.inscription(t.id);\n  if (resultat === \"acquise\" && !(ins && ins.etat === \"inscrit\")) {\n    Esport.changerInscription(t.id, { etat: \"inscrit\" });\n    Esport.notifier({ famille: \"inscription\", ecran: \"06\", params: { id: t.id }, titre: \"Inscription acceptée\",\n      texte: t.nom + \" : ta place est acquise. Début le \" + Esport.jourCourt(t.debut) + \" à \" + Esport.heure(t.debut) + \".\" });\n  }\n  if (resultat === \"attente\" && !(ins && ins.etat === \"attente\")) {\n    // Inscrit après les joueurs déjà en attente : rang selon l'horodatage\n    Esport.changerInscription(t.id, { etat: \"attente\", rang: 4 });\n    Esport.notifier({ famille: \"inscription\", ecran: \"06\", params: { id: t.id }, titre: \"Liste d'attente : tu es 4e\",\n      texte: t.nom + \" est complet. Tu seras prévenu si une place se libère.\" });\n  }\n  if (resultat === \"abonnement-expire\") {\n    Esport.changerInscription(t.id, null);\n    Esport.expirer();\n  }\n\n  /* ---- Contenu de chaque état ---- */\n  const coche = Esport.icone(\"coche\", \"f-white\");\n  const alerte = Esport.icone(\"alerte\", \"f-text\");\n  const quand = Esport.jourLong(t.debut) + \" à \" + Esport.heure(t.debut);\n  const gamertag = DONNEES.joueur.gamertags[t.jeu];\n  const derniereForfait = new Date(DONNEES.forfaits[DONNEES.forfaits.length - 1] + \"T21:10\");\n  const finSuspension = new Date(derniereForfait.getTime() + 7 * 86400000).toISOString().slice(0, 10);\n\n  const VOIR_TOURNOI = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"06\" data-id=\"' + t.id + '\">Voir le tournoi\u003c/a>';\n  const ACCUEIL = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"03\">Retour à l\\'accueil\u003c/a>';\n  const CONTESTER = '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"26\" data-id=\"' + t.id + '\" data-decision=\"' + resultat + '\">Contester\u003c/a>';\n  const AUTRES = '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"04\">Voir d\\'autres tournois\u003c/a>';\n\n  function motif(titre, lignes) {\n    return '\u003cdiv class=\"encart motif\">' + alerte + \"\u003cdiv>\u003cstrong>\" + titre + \"\u003c/strong>\" +\n      lignes.map((l) => \"\u003cp>\" + l + \"\u003c/p>\").join(\"\") + \"\u003c/div>\u003c/div>\";\n  }\n\n  function contenu() {\n    switch (resultat) {\n      case \"acquise\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme succes\">' + coche + \"\u003c/div>\",\n          titre: \"Ta place est acquise !\",\n          texte: \"Tu es inscrit à \" + t.nom + \". Rendez-vous le \" + quand + \". Tu seras convoqué dès que ton adversaire sera connu.\",\n          actions: VOIR_TOURNOI + ACCUEIL\n        };\n      case \"attente\": {\n        const rang = Esport.inscription(t.id).rang;\n        return {\n          picto: '\u003cdiv class=\"pictogramme\">' + Esport.icone(\"groupe\", \"f-primary\") + \"\u003c/div>\",\n          titre: \"Tu es sur liste d'attente\",\n          texte: '\u003cspan class=\"rang\">' + rang + \"e\u003csmall>sur la liste d'attente\u003c/small>\u003c/span>\" +\n            \"Le tournoi est complet. La première place libérée revient au premier de la liste : tu seras prévenu par notification.\",\n          actions: VOIR_TOURNOI + ACCUEIL\n        };\n      }\n      case \"refus-pays\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme refus\">' + alerte + \"\u003c/div>\",\n          titre: \"Inscription refusée\",\n          texte: \"Ton inscription à \" + t.nom + \" n'a pas été enregistrée.\",\n          motif: motif(\"Motif : pays non éligible\", [\n            \"Ce tournoi est ouvert aux joueurs de : \" + t.pays.map((p) => DONNEES.pays[p].nom).join(\", \") + \".\",\n            \"Ton compte Max it est rattaché au \" + Esport.pays().nom + \".\"\n          ]),\n          actions: AUTRES + CONTESTER\n        };\n      case \"refus-compte\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme refus\">' + alerte + \"\u003c/div>\",\n          titre: \"Inscription refusée\",\n          texte: \"Ton inscription à \" + t.nom + \" n'a pas été enregistrée.\",\n          motif: motif(\"Motif : compte déjà inscrit\", [\n            \"Ton compte Max it est déjà inscrit à ce tournoi sous un autre pseudo.\",\n            \"Un même compte ne peut être inscrit qu'une fois par tournoi.\"\n          ]),\n          actions: AUTRES + CONTESTER\n        };\n      case \"refus-identifiant\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme refus\">' + alerte + \"\u003c/div>\",\n          titre: \"Inscription refusée\",\n          texte: \"Ton inscription à \" + t.nom + \" n'a pas été enregistrée.\",\n          motif: motif(\"Motif : identifiant de jeu déjà inscrit\", [\n            \"L'identifiant \" + Esport.jeu(t.jeu).nom + \" « \" + (gamertag || \"—\") + \" » est déjà inscrit à ce tournoi par un autre compte.\",\n            \"Un même identifiant de jeu ne peut être inscrit qu'une fois par tournoi.\"\n          ]),\n          actions: AUTRES + CONTESTER\n        };\n      case \"suspension\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme\">' + Esport.icone(\"cadenas\", \"f-primary\") + \"\u003c/div>\",\n          titre: \"Inscriptions suspendues\",\n          texte: \"Tu pourras de nouveau t'inscrire à un tournoi le \" + Esport.jourLong(finSuspension) + \".\",\n          motif: motif(\"Motif : 3 forfaits en 30 jours\", [\n            \"Tu as été déclaré forfait le \" + DONNEES.forfaits.map(Esport.jourCourt).join(\", le \") + \".\",\n            \"Après 3 forfaits en 30 jours, les inscriptions sont bloquées pendant 7 jours.\"\n          ]),\n          actions: ACCUEIL + CONTESTER\n        };\n      case \"abonnement-expire\":\n        return {\n          picto: '\u003cdiv class=\"pictogramme\">' + Esport.icone(\"cadenas\", \"f-primary\") + \"\u003c/div>\",\n          titre: \"Inscription annulée\",\n          texte: \"Ton abonnement a expiré le 8 oct., avant le début de \" + t.nom + \". Ton inscription à ce tournoi réservé aux abonnés est donc annulée.\",\n          motif: motif(\"Tu peux encore jouer ce tournoi\", [\n            \"Réabonne-toi avant le \" + quand + \", puis inscris-toi de nouveau.\"\n          ]),\n          actions: '\u003ca href=\"#\" class=\"bouton bouton-primaire bouton-pleine-largeur\" data-ecran=\"21\" data-origine>Se réabonner\u003c/a>' +\n            '\u003ca href=\"#\" class=\"bouton bouton-secondaire bouton-pleine-largeur\" data-ecran=\"06\" data-id=\"' + t.id + '\">Voir le tournoi\u003c/a>'\n        };\n      default:\n        return {\n          picto: '\u003cdiv class=\"pictogramme refus\">' + alerte + \"\u003c/div>\",\n          titre: \"Inscription impossible\",\n          texte: \"Les inscriptions à \" + t.nom + \" ne sont pas ouvertes pour toi en ce moment.\",\n          actions: VOIR_TOURNOI + ACCUEIL\n        };\n    }\n  }\n\n  function rendre() {\n    const c = contenu();\n    document.getElementById(\"page\").innerHTML =\n      '\u003cdiv class=\"resultat\">' + c.picto + \"\u003ch1>\" + c.titre + \"\u003c/h1>\u003cp>\" + c.texte + \"\u003c/p>\u003c/div>\" +\n      (c.motif || \"\") +\n      Esport.carteTournoi(t) +\n      (resultat.startsWith(\"refus\") || resultat === \"suspension\" ? '\u003cp class=\"rappel\">Cette décision est enregistrée avec son motif. Tu peux la contester auprès du responsable local.\u003c/p>' : \"\");\n    document.getElementById(\"action\").innerHTML = c.actions;\n  }\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","09-equipe-choix.html":"\u003c!DOCTYPE html>\n\u003c!-- Écran 09 — Créer ou rejoindre une équipe (09-equipe-choix.html?id=t01).\n     US : S04-03 (créer une équipe : nom unique dans le tournoi, ouverte ou fermée, créateur capitaine),\n     S04-04 (liste des équipes ouvertes : nom, capitaine, places restantes ; demande validée par le capitaine ;\n     une seule équipe par tournoi ; une équipe complète disparaît de la liste). -->\n\u003chtml lang=\"fr\">\n\u003chead>\n@@PARAMS@@\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Créer ou rejoindre une équipe\u003c/title>\n  @@CSS:tokens@@\n  @@CSS:style@@\n  \u003cstyle>\n    .tete { padding: 0 var(--page-gutter) var(--space-4); }\n    .tete h1 { font-size: var(--font-size-xxl); line-height: var(--line-height-tight); }\n    .tete p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }\n    .panneau { padding-top: var(--space-4); }\n    .panneau > .encart { margin-bottom: var(--space-4); }\n\n    /* Équipes ouvertes */\n    .equipe-ligne .avatar { border-radius: var(--radius-sm); }\n    .equipe-ligne .puce { flex-shrink: 0; }\n    .equipe-ligne .puce:disabled { color: var(--color-text-muted); border-color: var(--color-border); cursor: default; }\n    .places { color: var(--color-primary); font-weight: var(--font-weight-bold); }\n\n    /* Création */\n    .formulaire { padding: 0 var(--page-gutter); }\n    .etiquette { display: block; font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); margin: var(--space-5) 0 var(--space-2); }\n    .etiquette:first-child { margin-top: 0; }\n    .erreur-champ { color: var(--color-alert); font-size: var(--font-size-sm); margin-top: var(--space-2); display: none; }\n    .erreur-champ.visible { display: block; }\n    .choix-visibilite { display: flex; flex-direction: column; gap: var(--space-2); }\n    .option {\n      display: flex;\n      gap: var(--space-3);\n      align-items: flex-start;\n      padding: var(--space-3) var(--space-4);\n      border: 1px solid var(--color-border-strong);\n      border-radius: var(--radius-md);\n      cursor: pointer;\n    }\n    .option input { width: 20px; height: 20px; accent-color: var(--color-primary); margin-top: 2px; flex-shrink: 0; }\n    .option strong { display: block; }\n    .option small { color: var(--color-text-secondary); font-size: var(--font-size-sm); }\n    .option:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-soft); }\n    .formulaire .bouton { margin-top: var(--space-6); }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-zone=\"esport\">\n\u003cdiv class=\"cadre\">\n  \u003cdiv class=\"telephone\">\n    \u003cdiv class=\"barre-etat\" data-heure=\"21:10\">\u003c/div>\n    \u003cheader class=\"entete-esport\" data-titre=\"Équipe\" data-repli=\"06\">\u003c/header>\n\n    \u003cmain class=\"contenu\">\n      \u003cdiv class=\"tete\">\n        \u003ch1>Ton équipe\u003c/h1>\n        \u003cp id=\"sous-titre\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"onglets\" role=\"tablist\" id=\"onglets\">\n        \u003cbutton role=\"tab\" data-onglet=\"rejoindre\">Rejoindre\u003c/button>\n        \u003cbutton role=\"tab\" data-onglet=\"creer\">Créer\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"panneau\" id=\"panneau\">\u003c/div>\n      \u003cdiv class=\"fin-contenu\">\u003c/div>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\n@@JS:data@@\n@@JS:nav@@\n@@JS:esport@@\n@@JS:demo@@\n\u003cscript>\n  const t = Esport.tournoi(Nav.param(\"id\")) || Esport.tournoi(\"t01\");\n  const taille = Esport.tailleEquipe(t);\n  const moi = DONNEES.joueur.pseudo;   // identifiant du joueur dans les données\n  let onglet = \"rejoindre\";\n  let demandeEnCours = null;            // nom de l'équipe à qui une demande est envoyée\n\n  document.getElementById(\"sous-titre\").textContent =\n    t.nom + \" · équipes de \" + taille + \" joueurs. L'équipe est inscrite automatiquement dès qu'elle est complète.\";\n\n  /* Équipes ouvertes encore incomplètes (une équipe complète n'apparaît plus, S04-04) */\n  function equipesOuvertes() {\n    return (DONNEES.equipesOuvertes[t.id] || []).filter((e) => e.membres.length \u003c taille);\n  }\n\n  /* ---- Onglet « Rejoindre » ---- */\n  function rendreRejoindre() {\n    const equipes = equipesOuvertes();\n    let html = \"\";\n    if (demandeEnCours) {\n      html += '\u003cdiv class=\"encart\">' + Esport.icone(\"groupe\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Demande envoyée à \" + demandeEnCours + \"\u003c/strong>\u003cp>Le capitaine doit l'accepter. Tu seras prévenu par notification.\u003c/p>\u003c/div>\u003c/div>\";\n    }\n    if (!equipes.length) {\n      html += '\u003cdiv class=\"vide\">\u003cstrong>Aucune équipe ouverte\u003c/strong>Crée la tienne et invite tes amis.\u003c/div>';\n    }\n    html += equipes.map((e) => {\n      const restantes = taille - e.membres.length;\n      const envoyee = demandeEnCours === e.nom;\n      return '\u003cdiv class=\"ligne equipe-ligne\">\u003cspan class=\"avatar\">' + e.nom[0] + \"\u003c/span>\" +\n        '\u003cspan class=\"ligne-corps\">\u003cspan class=\"ligne-titre\">' + e.nom + '\u003c/span>\u003cspan class=\"ligne-sous-titre\">Capitaine : ' +\n        '\u003ca href=\"#\" data-ecran=\"17\" data-pseudo=\"' + e.capitaine + '\">' + e.capitaine + '\u003c/a> · \u003cspan class=\"places\">' +\n        restantes + (restantes > 1 ? \" places\" : \" place\") + \"\u003c/span>\u003c/span>\u003c/span>\" +\n        '\u003cbutton class=\"puce\" data-demande=\"' + e.nom + '\"' + (demandeEnCours ? \" disabled\" : \"\") + \">\" +\n        (envoyee ? \"Demande envoyée\" : \"Demander à rejoindre\") + \"\u003c/button>\u003c/div>\";\n    }).join(\"\");\n    html += '\u003cp class=\"note\" style=\"padding: var(--space-4) var(--page-gutter) 0; font-size: var(--font-size-xs); color: var(--color-text-secondary)\">' +\n      \"Les équipes fermées ne sont pas listées : on les rejoint sur invitation du capitaine ou par le lien de l'équipe.\u003c/p>\";\n    return html;\n  }\n\n  /* ---- Onglet « Créer » ---- */\n  function rendreCreer() {\n    return '\u003cdiv class=\"formulaire\">' +\n      '\u003clabel class=\"etiquette\" for=\"nom-equipe\">Nom de l\\'équipe\u003c/label>' +\n      '\u003cdiv class=\"champ\" id=\"champ-nom\">\u003cinput id=\"nom-equipe\" maxlength=\"20\" autocomplete=\"off\" placeholder=\"Ex. : Kenitra Kings\">\u003c/div>' +\n      '\u003cp class=\"erreur-champ\" id=\"erreur-nom\" role=\"alert\">\u003c/p>' +\n      '\u003cspan class=\"etiquette\">Qui peut rejoindre ?\u003c/span>' +\n      '\u003cdiv class=\"choix-visibilite\">' +\n      '\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"visibilite\" value=\"ouverte\" checked>\u003cspan>\u003cstrong>Équipe ouverte\u003c/strong>' +\n      \"\u003csmall>Visible dans la liste des équipes. Tu acceptes ou refuses chaque demande.\u003c/small>\u003c/span>\u003c/label>\" +\n      '\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"visibilite\" value=\"fermee\">\u003cspan>\u003cstrong>Équipe fermée\u003c/strong>' +\n      \"\u003csmall>Invisible dans la liste. Tu invites les joueurs par leur pseudo ou par un lien.\u003c/small>\u003c/span>\u003c/label>\" +\n      \"\u003c/div>\" +\n      '\u003cbutton class=\"bouton bouton-primaire bouton-pleine-largeur\" id=\"creer\">Créer l\\'équipe\u003c/button>' +\n      '\u003cp class=\"note\" style=\"font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: var(--space-3)\">Tu seras le capitaine. Tu pourras transmettre ce rôle à un autre membre.\u003c/p>' +\n      \"\u003c/div>\";\n  }\n\n  function rendre() {\n    // Un joueur n'appartient qu'à une seule équipe par tournoi (S04-04)\n    const dejaEquipe = Esport.equipe(t.id);\n    if (dejaEquipe && !demandeEnCours) {\n      document.getElementById(\"onglets\").style.display = \"none\";\n      document.getElementById(\"panneau\").innerHTML = '\u003cdiv class=\"encart\">' + Esport.icone(\"groupe\", \"f-primary\") +\n        \"\u003cdiv>\u003cstrong>Tu es déjà dans l'équipe \" + dejaEquipe.nom + \"\u003c/strong>\u003cp>On ne peut appartenir qu'à une seule équipe par tournoi.\u003c/p>\" +\n        '\u003ca href=\"#\" class=\"lien-encart\" data-ecran=\"10\" data-id=\"' + t.id + '\">Voir mon équipe\u003c/a>\u003c/div>\u003c/div>';\n      return;\n    }\n    document.querySelectorAll(\"#onglets button\").forEach((b) => {\n      b.classList.toggle(\"actif\", b.dataset.onglet === onglet);\n      b.setAttribute(\"aria-selected\", b.dataset.onglet === onglet);\n    });\n    document.getElementById(\"panneau\").innerHTML = onglet === \"rejoindre\" ? rendreRejoindre() : rendreCreer();\n  }\n\n  document.getElementById(\"onglets\").addEventListener(\"click\", (e) => {\n    const bouton = e.target.closest(\"[data-onglet]\");\n    if (!bouton) return;\n    onglet = bouton.dataset.onglet;\n    rendre();\n  });\n\n  /* ---- Demande pour rejoindre : le capitaine accepte quelques secondes plus tard (simulé) ---- */\n  document.getElementById(\"panneau\").addEventListener(\"click\", (e) => {\n    const bouton = e.target.closest(\"[data-demande]\");\n    if (bouton && !bouton.disabled) {\n      const equipe = equipesOuvertes().find((x) => x.nom === bouton.dataset.demande);\n      demandeEnCours = equipe.nom;\n      rendre();\n      Nav.toast(\"Demande envoyée à \" + equipe.capitaine);\n      setTimeout(() => accepterDemande(equipe), 3500);\n      return;\n    }\n    if (e.target.closest(\"#creer\")) creerEquipe();\n  });\n\n  function accepterDemande(equipe) {\n    const membres = equipe.membres.concat([moi]);\n    const complete = membres.length >= taille;\n    Esport.changerEquipe(t.id, {\n      nom: equipe.nom, ouverte: true, capitaine: equipe.capitaine, membres,\n      demandes: [], invitations: [], lien: \"maxit.ma/e/\" + equipe.nom.replace(/\\W/g, \"\").slice(0, 4).toUpperCase() + \"2210\"\n    });\n    // Effectif atteint : l'équipe est inscrite automatiquement (S04-03)\n    if (complete) {\n      Esport.changerInscription(t.id, { etat: \"inscrit\" });\n      Esport.notifier({ famille: \"equipe\", ecran: \"10\", params: { id: t.id }, titre: \"Équipe inscrite\",\n        texte: equipe.nom + \" est complète : elle est inscrite à \" + t.nom + \".\" });\n    }\n    Nav.dialogue({\n      icone: Esport.icone(\"coche\", \"f-primary\"),\n      titre: equipe.capitaine + \" a accepté ta demande\",\n      texte: \"Tu fais partie de l'équipe \" + equipe.nom + \".\" +\n        (complete ? \" L'équipe est complète : elle est inscrite au tournoi.\" : \" Il manque encore \" + (taille - membres.length) + \" joueur(s).\"),\n      boutons: [{ libelle: \"Voir mon équipe\", primaire: true, action: () => Nav.aller(\"10\", null, { id: t.id }) }]\n    });\n  }\n\n  /* ---- Création : nom unique dans le tournoi ---- */\n  function creerEquipe() {\n    const nom = document.getElementById(\"nom-equipe\").value.trim();\n    const erreur = document.getElementById(\"erreur-nom\");\n    const champ = document.getElementById(\"champ-nom\");\n    const pris = DONNEES.nomsEquipesPris.concat((DONNEES.equipesOuvertes[t.id] || []).map((x) => x.nom))\n      .some((n) => n.toLowerCase() === nom.toLowerCase());\n    let message = \"\";\n    if (nom.length \u003c 3) message = \"Le nom doit faire au moins 3 caractères.\";\n    else if (pris) message = \"« \" + nom + \" » est déjà pris dans ce tournoi. Choisis un autre nom.\";\n    erreur.textContent = message;\n    erreur.classList.toggle(\"visible\", !!message);\n    champ.classList.toggle(\"erreur\", !!message);\n    if (message) return;\n\n    const ouverte = document.querySelector('input[name=\"visibilite\"]:checked').value === \"ouverte\";\n    Esport.changerEquipe(t.id, {\n      nom, ouverte, capitaine: moi, membres: [moi],\n      // Une équipe ouverte reçoit vite des demandes (simulé)\n      demandes: ouverte ? DONNEES.demandesSimulees.slice() : [],\n      invitations: [],\n      lien: \"maxit.ma/e/\" + nom.replace(/\\W/g, \"\").slice(0, 4).toUpperCase() + \"4471\"\n    });\n    Nav.aller(\"10\", null, { id: t.id, message: \"creee\" });\n  }\n\n  Esport.monter(rendre);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"accueil":"00a-maxit-accueil.html"}</script>
<script>
/* Routeur du fichier unique : affiche chaque écran dans le cadre #ecran. */
(function routeur() {
  const D = JSON.parse(document.getElementById("donnees").textContent);
  const cadre = document.getElementById("ecran");
  const OUVRE = "<" + "script>", FERME = "<" + "/script>";

  /* Page complète d'un écran, avec ses styles, ses scripts et ses paramètres */
  function construire(fichier, recherche) {
    const params = OUVRE + "window.__PAGE = " + JSON.stringify(fichier) + "; window.__RECHERCHE = " + JSON.stringify(recherche) + ";" + FERME;
    return D.PAGES[fichier]
      .replace("@@PARAMS@@", () => params)
      .replace(/@@CSS:(\w+)@@/g, (m, nom) => "<style>" + D.CSS[nom] + "</style>")
      .replace(/@@JS:(\w+)@@/g, (m, nom) => OUVRE + D.JS[nom] + FERME);
  }

  function afficher(url) {
    const morceaux = url.split("?");
    const page = D.PAGES[morceaux[0]] ? morceaux[0] : D.accueil;
    const recherche = morceaux[1] && page === morceaux[0] ? "?" + morceaux[1] : "";
    Routeur.courant = page + recherche;
    try { history.replaceState(null, "", "#" + Routeur.courant); } catch (e) { /* adresse non modifiable */ }
    cadre.srcdoc = construire(page, recherche);
  }

  const Routeur = {
    courant: null,
    pile: [],          // écrans précédents, pour le bouton retour
    memoire: {},       // stockage de secours si localStorage est indisponible
    aller(url) {
      if (Routeur.courant) Routeur.pile.push(Routeur.courant);
      afficher(url);
    },
    retour(repli) {
      afficher(Routeur.pile.length ? Routeur.pile.pop() : repli);
    }
  };
  window.MaquetteRouteur = Routeur;

  // Écran de départ : celui de l'adresse (#06-tournoi.html?id=t01), sinon l'accueil Max it
  afficher(decodeURIComponent(location.hash.slice(1)) || D.accueil);
})();
</script>
