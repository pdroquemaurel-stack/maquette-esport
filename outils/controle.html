<!DOCTYPE html>
<!-- Page de contrôle automatique (hors maquette), à lancer à la fin de chaque lot.
     Elle charge chaque écran dans un cadre de 390 × 844, dans le mode choisi, et signale :
     - les débordements horizontaux, les textes coupés, le contenu sous la barre du bas ;
     - les liens cassés (écran inconnu, page absente du registre) et les écrans sans sortie (impasses).
     Mode : controle.html#gratuit ou controle.html#abonne ; « controle.html?unique#abonne » contrôle le fichier unique.
     Le navigateur doit autoriser l'accès entre fichiers locaux, par exemple :
     msedge --allow-file-access-from-files outils/controle.html#abonne
     Attention : la page remplace l'état de démonstration mémorisé (localStorage). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Contrôle de la maquette</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
    pre { white-space: pre-wrap; }
    iframe { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  </style>
</head>
<body>
<h1>Contrôle de la maquette</h1>
<pre id="sortie">Contrôle en cours…</pre>
<iframe id="f"></iframe>
<script src="banc.js"></script>
<script>
  /* Écrans contrôlés, avec les variantes utiles (tournois dans différents états) */
  const PAGES = [
    "00a-maxit-accueil.html", "00b-maxit-univers.html", "00c-maxit-gaming.html", "02-pseudo.html",
    "03-accueil.html", "04-calendrier.html", "05-mes-tournois.html",
    "06-tournoi.html?id=t01", "06-tournoi.html?id=t02", "06-tournoi.html?id=t04", "06-tournoi.html?id=t05",
    "06-tournoi.html?id=t09", "06-tournoi.html?id=t11", "06-tournoi.html?id=t12",
    "07-reglement.html?id=t01", "07-reglement.html?id=t02", "07-reglement.html?id=t12",
    "08-inscription-resultat.html?id=t09", "09-equipe-choix.html?id=t12", "10-equipe.html?id=t01",
    "11-match.html", "14-resultat.html", "15-litige.html",
    "25-notifications.html", "27-preferences-notif.html", "28-mes-donnees.html",
    "26-contestation.html?decision=exclusion&id=t01", "26-contestation.html?decision=refus-identifiant&id=t09",
    "18-video.html?id=c01", "18-video.html?id=c02", "18-video.html?id=c09", "19-article.html?id=c03", "19-article.html?id=c04",
    "20-contenus.html", "21-offre.html", "22-paiement-maxit.html?offre=mensuelle", "23-profil.html", "24-abonnement.html",
    "12-arbre.html?id=t05", "12-arbre.html?id=t03", "12-arbre.html?id=t10",
    "13-jeu.html?id=freefire", "13-jeu.html?id=codm", "17-profil-public.html?pseudo=Rachid_GOAT",
    // Lot 7 : profil avec badges, classement MaxPoints, preuve à la déclaration, litige, équipe fermée
    "17-profil-public.html?pseudo=Youss_KZ", "17-profil-public.html?pseudo=Taha_Sniper",
    "29-classement-mensuel.html", "29-classement-mensuel.html?onglet=gratuits",
    "29-classement-mensuel.html?mois=2026-09&onglet=gratuits", "29-classement-mensuel.html?mois=2026-08&onglet=gratuits",
    ["29-classement-mensuel.html", { scenario: "points-credites" }],
    ["14-resultat.html", () => ({ monMatch: { presenceMoi: "21:21", issue: "demarre", demarrage: "21:23", demarrageIso: "2026-10-09T21:23" },
      horloge: { reel: Date.now(), simule: "2026-10-09T21:40" } })],
    ["15-litige.html", { scenario: "litige-ouvert" }],
    ["10-equipe.html?id=t12", { scenario: "equipe-fermee" }],
    // Play (lot P1) : accueil, genres, fiches (mini app, hub avec et sans lien direct), transition, partie
    "p01-accueil.html", ["p01-accueil.html", { playNouveau: true }], ["p01-accueil.html", { playPays: "SN" }],
    ["p01-accueil.html?indispo=1", { playIndispo: true }],
    "p02-genre.html?genre=sport", "p02-genre.html?genre=tous", ["p02-genre.html?genre=strategie", { playPays: "SN" }],
    "p03-jeu.html?jeu=rallye-dunes&depuis=p01-accueil.html", "p03-jeu.html?jeu=bloc-mania&depuis=p02-genre.html%3Fgenre%3Dpuzzle",
    ["p03-jeu.html?jeu=ludo-famille", { playPays: "SN" }], "p03-jeu.html?jeu=mot-juste&via=lien",
    "p04-transition.html?jeu=ludo-famille&depuis=p01-accueil.html",
    "p05-partie.html?jeu=rallye-dunes", "p05-partie.html?jeu=bloc-mania", "p05-partie.html?jeu=ludo-famille&mode=hub"
  ];
  const abonne = location.hash === "#abonne";
  const sortie = document.getElementById("sortie");
  // Zones qui défilent horizontalement : un débordement y est normal
  // (.fond-fiche : l'accueil de Play rogné derrière la feuille de la fiche jeu, p03)
  const DEFILANTS = ".carrousel, .puces, .arbre, .offres-jeu, .visuel-jeu, .collection-courte, .fond-fiche";

  function decrire(e) {
    const classes = typeof e.className === "string" && e.className.trim() ? "." + e.className.trim().split(/\s+/).join(".") : "";
    return e.tagName.toLowerCase() + classes + " « " + (e.textContent || "").trim().slice(0, 40) + " »";
  }

  /* Défauts visuels d'un écran */
  function defautsVisuels(doc) {
    const defauts = [];
    const telephone = doc.querySelector(".telephone");
    if (!telephone) return ["pas de cadre .telephone"];
    const cadre = telephone.getBoundingClientRect();
    const vue = doc.defaultView;

    if (doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1) defauts.push("la page défile horizontalement");

    telephone.querySelectorAll("*").forEach((e) => {
      if (e.closest(".voile") || e.closest(".cache-visuel") || e.classList.contains("cache-visuel")) return;
      const r = e.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const style = vue.getComputedStyle(e);
      if (r.right > cadre.right + 1 && !e.closest(DEFILANTS) && style.position !== "absolute") {
        defauts.push("déborde à droite de " + Math.round(r.right - cadre.right) + " px : " + decrire(e));
      }
      if (e.children.length === 0 && e.scrollWidth > e.clientWidth + 1 && (style.overflow === "hidden" || style.textOverflow === "ellipsis")) {
        defauts.push("texte coupé : " + decrire(e));
      }
    });

    // Le contenu défilant doit s'arrêter au-dessus de la barre du bas (navigation ou action)
    const contenu = doc.querySelector(".contenu");
    const barre = doc.querySelector(".nav-bas, .barre-action, .pied");
    if (contenu && barre && contenu.getBoundingClientRect().bottom > barre.getBoundingClientRect().top + 1) {
      defauts.push("le contenu passe sous la barre du bas");
    }
    return defauts;
  }

  /* Liens cassés et impasses, d'après le registre des écrans (js/nav.js) */
  function defautsLiens(doc, vue) {
    const defauts = [];
    // ECRANS est déclaré avec const : il se lit par une évaluation dans la page contrôlée
    const ECRANS = vue.eval("ECRANS");
    const fichiers = Object.values(ECRANS).map((e) => e.fichier).concat(["index.html"]);
    let sorties = 0;
    doc.querySelectorAll("[data-ecran]").forEach((e) => {
      const ecran = ECRANS[e.dataset.ecran];
      if (!ecran) defauts.push("lien vers un écran inconnu : " + e.dataset.ecran);
      else if (ecran.pret) sorties++;
    });
    doc.querySelectorAll("a[href]").forEach((a) => {
      const cible = a.getAttribute("href").split("?")[0];
      if (!cible || cible === "#") return;
      if (cible.endsWith(".html") && !fichiers.includes(cible)) defauts.push("lien cassé : " + cible);
      else sorties++;
    });
    // data-sortie : bouton qui quitte l'écran par script (ex. retour à l'écran d'origine après paiement)
    if (doc.querySelector('[data-action="retour"], [data-action="esport"], [data-sortie]')) sorties++;
    if (!sorties) defauts.push("impasse : aucune sortie");
    return defauts;
  }

  /* Résumé du mode, pour vérifier que l'interrupteur gratuit / abonné agit */
  function resumeMode(doc, page) {
    if (page.startsWith("03")) return doc.querySelector(".encart-offre") ? "encart abonnement affiché" : "encart abonnement masqué";
    const action = doc.getElementById("action");
    if (action) return "bouton : " + action.textContent.replace(/\s+/g, " ").trim().slice(0, 50);
    return "";
  }

  async function lancer() {
    let texte = "Mode " + (abonne ? "joueur abonné" : "joueur gratuit") + (Banc.unique ? " · fichier unique" : "") + "\n\n";
    let total = 0;
    for (const entree of PAGES) {
      // Une entrée est une page, ou [page, état de démo en plus (objet ou fonction)]
      const page = Array.isArray(entree) ? entree[0] : entree;
      const supplement = Array.isArray(entree) ? (typeof entree[1] === "function" ? entree[1]() : entree[1]) : {};
      // Chaque écran part du même état de démonstration
      localStorage.setItem("maquette-esport-etat", JSON.stringify(Object.assign({ abonne }, supplement)));
      await Banc.charger(page);
      await new Promise((fini) => setTimeout(fini, 700));
      let defauts, mode = "";
      try {
        const doc = Banc.doc();
        defauts = defautsVisuels(doc).concat(defautsLiens(doc, Banc.win()));
        mode = resumeMode(doc, page);
      } catch (erreur) {
        defauts = ["contrôle impossible (" + erreur.message + ") : autoriser l'accès entre fichiers locaux"];
      }
      defauts = [...new Set(defauts)];
      total += defauts.length;
      const variante = Array.isArray(entree) && supplement.scenario ? " (" + supplement.scenario + ")" : Array.isArray(entree) ? " (état préparé)" : "";
      texte += (defauts.length ? "✗ " : "✓ ") + page + variante + (mode ? "  [" + mode + "]" : "") + "\n" +
        defauts.slice(0, 8).map((d) => "    " + d + "\n").join("");
    }
    localStorage.removeItem("maquette-esport-etat");
    texte += "\n" + (total ? total + " défaut(s)" : "Aucun défaut") + "\nFIN";
    sortie.textContent = texte;
  }
  lancer();
</script>
</body>
</html>
