<!DOCTYPE html>
<!-- Écran f06 — Achat du Pass Fan EA FC : récapitulatif, choix du moyen de paiement (Orange Money ou crédit),
     « Confirmer et payer », paiement simulé, puis « Achat confirmé, ton code est disponible dans Mes codes ».
     Si le joueur a déjà 2 codes : confirmation sans code (data seulement). Retour → f05. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmer l'achat</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-zone="fanzone">
<div class="cadre">
  <div class="telephone sombre fanzone">
    <div class="barre-etat" data-heure="18:30"></div>
    <div id="entete"></div>
    <main class="contenu" id="page"></main>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/data-fanzone.js"></script>
<script src="js/fanzone.js"></script>
<script src="js/demo.js"></script>
<script>
  document.getElementById("entete").innerHTML = Fz.entete("Confirmer l'achat", "f05-bundle.html");

  const MOYENS = [
    { id: "om", nom: "Orange Money", detail: "Payé depuis ton compte Orange Money", logo: "OM" },
    { id: "credit", nom: "Crédit", detail: "Débité de ton crédit de communication", logo: null }
  ];
  let moyen = "om";
  let phase = "choix";        // choix, paiement, confirme
  let avecCode = true;        // le pass donne un code (sauf plafond atteint)

  /* Date de fin des 7 jours de data */
  function finPass() {
    const fin = new Date(Date.now() + 7 * 86400000);
    return fin.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  }

  function rendre() {
    const pass = FANZONE.pass;
    let html = '<div class="fz-page">';
    if (phase === "paiement") {
      html += '<div class="fz-spinner"></div><p class="fz-centre">Paiement en cours avec ' + MOYENS.find((m) => m.id === moyen).nom + "…</p>";
    } else if (phase === "confirme") {
      html += '<div class="fz-succes" role="status"><div class="fz-rond-succes">' + Fz.icone("coche", "f-fz-neon") + "</div>" +
        "<h2>Achat confirmé</h2>" +
        (avecCode ? "<p>Ton code est disponible dans Mes codes.</p>" : "<p>Tu as déjà " + FANZONE.codesMax + " codes : ton pass est activé avec la data seulement.</p>") +
        "<p>Tes " + pass.data + " sont actifs jusqu'au " + finPass() + ".</p></div>" +
        '<div class="fz-actions">' +
        (avecCode ? '<a href="f07-mes-codes.html" class="bouton bouton-primaire bouton-pleine-largeur">Voir mes codes</a>' : "") +
        '<a href="f01-accueil.html" class="bouton fz-contour bouton-pleine-largeur">Retour à la Fan Zone</a></div>';
    } else {
      const plafond = Fz.codes().length >= FANZONE.codesMax;
      html += '<div class="fz-carte"><h2>' + pass.nom + "</h2>" +
        '<div class="fz-ligne-recap"><span>Data</span><span>' + pass.data + " · " + pass.duree + "</span></div>" +
        '<div class="fz-ligne-recap"><span>Code EA FC Mobile</span><span>' + (plafond ? "Maximum atteint" : "1 code") + "</span></div>" +
        '<div class="fz-ligne-recap total"><span>Total TTC</span><span>' + Fz.prixPass() + "</span></div></div>" +
        '<h2 class="fz-question">Moyen de paiement</h2>' +
        '<div role="radiogroup" aria-label="Moyen de paiement">' + MOYENS.map((m) =>
          '<button class="fz-moyen' + (m.id === moyen ? " actif" : "") + '" role="radio" aria-checked="' + (m.id === moyen) + '" data-moyen="' + m.id + '">' +
          '<span class="fz-logo-moyen">' + (m.logo || Fz.icone("bundle")) + "</span>" +
          "<span><b>" + m.nom + "</b><small>" + m.detail + "</small></span>" +
          '<span class="fz-radio"></span></button>').join("") + "</div>" +
        '<div class="fz-actions"><button class="bouton bouton-primaire bouton-pleine-largeur" data-payer>Confirmer et payer ' + Fz.prixPass() + "</button></div>" +
        '<p class="fz-mention">En confirmant, tu acceptes les conditions de l\'offre. Code valable uniquement sur EA FC Mobile, jusqu\'au ' +
        FANZONE.validiteCodes + ", " + FANZONE.codesMax + " codes max par utilisateur.</p>";
    }
    html += "</div>";
    document.getElementById("page").innerHTML = html;
  }

  document.getElementById("page").addEventListener("click", (evenement) => {
    const choix = evenement.target.closest("[data-moyen]");
    if (choix) {
      moyen = choix.dataset.moyen;
      rendre();
    } else if (evenement.target.closest("[data-payer]")) {
      phase = "paiement";
      rendre();
      setTimeout(() => {
        // Paiement accepté : le pass est activé, le code rejoint « Mes codes »
        phase = "confirme";
        avecCode = !!Fz.ajouterCode("Pass Fan EA FC");
        rendre();
      }, 1500);
    }
  });

  Fz.monter(rendre);
</script>
</body>
</html>
