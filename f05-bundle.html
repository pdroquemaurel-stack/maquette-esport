<!DOCTYPE html>
<!-- Écran f05 — Pass data : 3 forfaits de data Orange (1 Go, 2 Go, 5 Go), sans durée propre à la Fan Zone,
     prix fictifs en monnaie locale (selon le pays soutenu : MAD, TND, EGP, FCFA, CDF).
     Chaque forfait a un add-on Fan Zone : 1 Go → +1 chance au Grand Tirage ; 2 Go → +1 code EA FC Mobile et +1 chance ;
     5 Go → +2 codes et +3 chances. Plafonds : 2 codes par utilisateur, 5 chances grâce aux achats.
     Forfait → f06?offre=… (choix Orange Money ou crédit, puis confirmation). Retour → f01. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass data</title>
  <link rel="stylesheet" href="css/tokens.css?v=f8ec85a1">
  <link rel="stylesheet" href="css/style.css?v=f8ec85a1">
</head>
<body data-zone="fanzone">
<div class="cadre">
  <div class="telephone sombre fanzone">
    <div class="barre-etat" data-heure="18:30"></div>
    <div id="entete"></div>
    <main class="contenu" id="page"></main>
  </div>
</div>

<script src="js/nav.js?v=f8ec85a1"></script>
<script src="js/data-fanzone.js?v=f8ec85a1"></script>
<script src="js/fanzone.js?v=f8ec85a1"></script>
<script src="js/demo.js?v=f8ec85a1"></script>
<script>
  document.getElementById("entete").innerHTML = Fz.entete("Pass data", "f01-accueil.html");

  function rendre() {
    const plafondCodes = Fz.codes().length >= FANZONE.codesMax;
    const plafondChances = Fz.chances().achats >= FANZONE.tirage.plafondAchats;
    const soutenu = Fz.paysSoutenu();
    let html = '<div class="fz-page"><p class="fz-intro">Suis la finale sans compter ta data. Chaque Pass data te donne ' +
      "des chances au Grand Tirage console, et des codes EA FC Mobile à partir de 2 Go.</p>";

    html += FANZONE.forfaits.map((f) =>
      '<section class="fz-offre' + (f.conseille ? " conseillee" : "") + '" aria-label="' + f.nom + '">' +
      (f.conseille ? '<span class="fz-offre-badge">Le plus choisi</span>' : "") +
      '<p class="fz-offre-nom">' + f.nom + "</p>" +
      '<p class="fz-offre-data">' + f.data + "</p>" +
      '<p class="fz-intro">' + f.accroche + "</p>" +
      Fz.addOn(f).map((l) => '<p class="fz-offre-plus">' + Fz.icone(l.icone, "f-fz-neon") + l.texte + "</p>").join("") +
      '<p class="fz-prix">' + Fz.prix(f) + " <small>TTC" + (soutenu ? " · offre " + soutenu.nom : "") + "</small></p>" +
      '<div class="fz-actions"><a href="f06-achat.html?offre=' + f.id + '" class="bouton ' + (f.conseille ? "bouton-primaire" : "fz-contour") +
      ' bouton-pleine-largeur">Acheter</a></div></section>').join("");

    if (plafondCodes) {
      html += '<div class="fz-encart orange">' + Fz.icone("cadeau", "f-primary") +
        "<span>Tu as déjà " + FANZONE.codesMax + " codes EA FC Mobile : les prochains pass n'en donnent plus.</span></div>";
    }
    if (plafondChances) {
      html += '<div class="fz-encart orange">' + Fz.icone("manette", "f-primary") +
        "<span>Tu as atteint " + FANZONE.tirage.plafondAchats + " chances grâce aux Pass data : les prochains achats n'en ajoutent plus. " +
        "Les questions du jour, elles, comptent toujours.</span></div>";
    }

    html += '<div class="fz-carte"><h2>Bon à savoir</h2><ul class="fz-liste-mentions">' +
      "<li>La data s'ajoute à ton forfait Orange, comme une recharge classique.</li>" +
      "<li>Codes valables uniquement sur EA FC Mobile, jusqu'au " + FANZONE.validiteCodes + ", " + FANZONE.codesMax + " codes maximum par utilisateur.</li>" +
      "<li>Les Pass data achetés dans la Fan Zone donnent des chances au Grand Tirage, " + FANZONE.tirage.plafondAchats + " chances au plus.</li></ul></div>" +
      '<div class="fz-actions"><a href="f13-tirage.html" class="fz-lien">Mes chances au Grand Tirage' + Fz.icone("chevron", "f-primary") + "</a>" +
      '<a href="f07-mes-codes.html" class="fz-lien">Mes codes' + Fz.icone("chevron", "f-primary") + "</a></div></div>";
    document.getElementById("page").innerHTML = html;
  }

  Fz.monter(rendre);
</script>
</body>
</html>
