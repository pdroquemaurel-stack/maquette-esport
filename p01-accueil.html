<!DOCTYPE html>
<!-- Écran p01 — Accueil de Max it Gaming Play, d'après reference/figma-play/01-accueil.png et 02-accueil-suite.png
     (mise en page) et la direction « kid & family friendly » (couleurs, formes, ton).
     US : S06-01 (ouverture depuis l'univers gaming, retour vers Max it), S06-02 (sections et ordre),
     S06-03 (rangées par genre et « Voir tout »), S06-04 (tuiles), S03-01 (jeu à la une),
     S03-04 (« Recommandé pour vous », sélection du pays), S03-03 (nouveautés), S03-05 (ordre des genres),
     S09-01 (mes favoris), S09-02 (récemment joués),
     S08-03 (jeux indisponibles masqués ; « ?indispo=1 » : arrivée par le lien d'un jeu indisponible).
     Ordre : jeu à la une, récemment joués, Recommandé pour vous, mes favoris, nouveautés, rangées par genre.
     Fonctions V2 (interrupteur du menu de démo) : bouton du profil joueur (S11-02 : le profil s'ouvre depuis
     l'accueil), accès à l'assistant IA (S09-04), « Recommandé pour vous » personnalisé (S09-03). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-zone="play">
<div class="cadre">
  <div class="telephone play">
    <div class="barre-etat" data-heure="9:30"></div>
    <main class="contenu" id="page"></main>
  </div>
</div>

<script src="js/data-play.js"></script>
<script src="js/textes-play.js"></script>
<script src="js/nav.js"></script>
<script src="js/play.js"></script>
<script src="js/demo.js"></script>
<script>
  /* Illustration de l'en-tête : objets de jeu sympathiques qui flottent doucement
     (manette, ballon, pièce de puzzle, dé, étoiles, nuages), sans personnage ni marque */
  const ILLUSTRATION =
    '<svg class="illustration-play" viewBox="0 0 260 150" aria-hidden="true">' +
    // Nuages
    '<ellipse class="i-blanc" cx="40" cy="44" rx="26" ry="11"/><ellipse class="i-blanc" cx="56" cy="38" rx="16" ry="12"/>' +
    '<ellipse class="i-blanc" cx="214" cy="30" rx="24" ry="10"/><ellipse class="i-blanc" cx="228" cy="24" rx="13" ry="10"/>' +
    // Ballon de foot
    '<g class="flotte flotte-2"><circle class="i-jaune" cx="42" cy="104" r="22"/>' +
    '<path class="i-blanc" d="M42 93l9.5 7-3.6 11h-11.8l-3.6-11z"/></g>' +
    // Manette
    '<g class="flotte"><path class="i-orange" d="M96 68h68c17 0 25 11 28 28l3 15c2 15-12 21-22 11l-13-13h-60l-13 13c-10 10-24 4-22-11l3-15c3-17 11-28 28-28z"/>' +
    '<path class="i-blanc" d="M101 84h8v9h9v8h-9v9h-8v-9h-9v-8h9z"/>' +
    '<circle class="i-jaune" cx="160" cy="86" r="6"/><circle class="i-vert" cx="173" cy="97" r="6"/>' +
    '<circle class="i-bleu" cx="147" cy="97" r="6"/><circle class="i-rose" cx="160" cy="108" r="6"/></g>' +
    // Pièce de puzzle
    '<g class="flotte flotte-3"><rect class="i-vert" x="206" y="78" width="30" height="30" rx="7"/>' +
    '<circle class="i-vert" cx="221" cy="76" r="7"/><circle class="i-vert" cx="238" cy="93" r="7"/></g>' +
    // Dé
    '<g class="flotte flotte-2"><rect class="i-blanc" x="196" y="114" width="28" height="28" rx="8"/>' +
    '<circle class="i-turquoise" cx="204" cy="122" r="3"/><circle class="i-turquoise" cx="210" cy="128" r="3"/><circle class="i-turquoise" cx="216" cy="134" r="3"/></g>' +
    // Étoiles et ballon
    '<path class="i-jaune flotte flotte-3" d="M84 22l4 8 9 1-6.5 6 1.6 9-8.1-4.4-8.1 4.4 1.6-9-6.5-6 9-1z"/>' +
    '<path class="i-violet flotte" d="M184 52l2.4 4.8 5.3.8-3.8 3.7.9 5.3-4.8-2.5-4.8 2.5.9-5.3-3.8-3.7 5.3-.8z"/>' +
    '<g class="flotte flotte-3"><ellipse class="i-rose" cx="126" cy="26" rx="11" ry="13"/><path class="i-rose" d="M123 38h6l-3 4z"/></g>' +
    "</svg>";

  function rendre() {
    const t = Play.t;
    const ici = "p01-accueil.html";
    let html = "";

    // En-tête : retour vers Max it (univers gaming), illustration, bienvenue (S06-01)
    html += '<header class="entete-play"><div class="entete-haut">' +
      '<a href="00c-maxit-gaming.html" class="retour-play" aria-label="' + t("commun.retourMaxit") + '">' + Play.icone("retour") + "</a>" +
      // V2 : mon profil, avec mon avatar (S11-02)
      (Play.v2() ? '<a href="pv1-profil.html" class="bouton-profil" aria-label="' + t("accueil.monProfil") + '">' +
        '<span class="avatar-emoji" aria-hidden="true">' + Play.monAvatar() + "</span>" + Play.etiquetteV2() + "</a>" : "") +
      "</div>" +
      ILLUSTRATION +
      "<h1>" + t("accueil.titre") + "</h1>" +
      "<p>" + t("accueil.sousTitre") + "</p>" +
      "</header>";

    // Arrivée par le lien partagé d'un jeu indisponible (S08-03)
    if (Nav.param("indispo")) {
      html += '<div class="message-play" role="status" id="message-indispo">' + Play.icone("info", "f-primary") +
        "<div><strong>" + t("accueil.indispoTitre") + "</strong><p>" + t("accueil.indispoTexte") + "</p></div>" +
        '<button class="bouton-icone" id="fermer-message" aria-label="' + t("commun.fermer") + '">' + Play.icone("fermer") + "</button></div>";
    }

    // 1. Jeu à la une (S03-01) : une seule carte, au style des cartes « Discover » de Figma
    const une = Play.aLaUne();
    if (une) {
      html += '<section class="section-play"><h2 class="titre-play"><span>' + t("accueil.une") + "</span></h2>" +
        '<a href="' + Play.lienFiche(une.id, ici) + '" class="carte-une-play">' + Play.visuel(une, 358, 300, "carte") +
        '<span class="carte-une-texte"><div><h3>' + une.nom + '</h3><p lang="fr">' + une.accroche + "</p></div>" +
        '<span class="pilule-une">' + t("accueil.decouvrir") + "</span></span></a></section>";
    }

    // V2 : l'assistant IA de Max it recommande des jeux dans une conversation (S09-04)
    if (Play.v2()) {
      html += '<a href="pv2-assistant.html" class="carte-assistant section-play">' +
        '<span class="pastille-genre" style="--gc: var(--play-v2)">' + Play.icone("etincelles", "f-play-white") + "</span>" +
        "<div><strong>" + t("accueil.assistantTitre") + " " + Play.etiquetteV2() + "</strong><p>" + t("accueil.assistantTexte") + "</p></div>" +
        Play.icone("chevron", "f-play-text") + "</a>";
    }

    // 2. Récemment joués : dès la première partie (S09-02)
    html += Play.rangee(t("accueil.recents"), Play.recents(), ici);
    // 3. Recommandé pour vous : toujours visible, sélection du pays (S03-04) ; personnalisé en V2 (S09-03)
    html += Play.rangee(t("accueil.reco") + (Play.recommandesPerso() ? " " + Play.etiquetteV2() +
      '<small class="sous-titre-rangee">' + t("accueil.recoPerso") + "</small>" : ""), Play.recommandes(), ici);
    // 4. Mes favoris : dès le premier favori (S09-01)
    html += Play.rangee(t("accueil.favoris"), Play.favoris(), ici);
    // 5. Nouveautés : toujours visible (S03-03)
    html += Play.rangee(t("accueil.nouveautes"), Play.nouveautes(), ici);

    // 6. Rangées par genre, dans l'ordre du pays, avec « Voir tout » (S06-03, S03-05)
    Play.genresVisibles().forEach((g) => {
      html += Play.rangee(Play.nomGenre(g.id), Play.jeuxDuGenre(g.id).slice(0, 8), ici,
        { genre: g.id, voirTout: Play.url("p02-genre.html", { genre: g.id }) });
    });

    html += '<div class="fin-contenu"></div>';
    document.getElementById("page").innerHTML = html;

    const fermer = document.getElementById("fermer-message");
    if (fermer) fermer.addEventListener("click", () => document.getElementById("message-indispo").remove());
  }
  Play.monter(rendre);
</script>
</body>
</html>
