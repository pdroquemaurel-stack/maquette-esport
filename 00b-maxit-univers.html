<!DOCTYPE html>
<!-- Écran 00b — Tous les univers Max it, reproduit d'après reference/02-univers.png.
     Hors backlog : « Gaming » ouvre 00c, le bouton fermer revient à 00a. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Univers Max it</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .telephone { background: var(--color-bg-muted); }

    /* Champ de recherche au-dessus de la feuille */
    .recherche {
      margin: var(--space-2) var(--page-gutter) var(--space-5);
      height: 48px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }
    .recherche svg { width: 20px; height: 20px; }
    .recherche span { flex: 1; text-align: left; }

    /* Feuille « Tous les univers » (fixe dans l'écran, contenu défilant) */
    .feuille-univers {
      flex: 1;
      background: var(--color-surface);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: var(--space-3) var(--page-gutter) 0;
      overflow-y: auto;
      scrollbar-width: none;
      position: relative;
    }
    .feuille-univers::-webkit-scrollbar { display: none; }
    .feuille-univers h1 {
      font-size: var(--font-size-xxl);
      line-height: var(--line-height-tight);
      margin-bottom: var(--space-4);
    }

    .grille-univers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      padding-bottom: 96px; /* place pour le bouton fermer */
    }
    .univers {
      height: 196px;
      border-radius: var(--radius-md);
      background: var(--color-surface-warm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-5) var(--space-2) var(--space-5);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-md);
    }
    .univers svg { width: 116px; height: 100px; }
    .univers:active { background: var(--color-primary-soft); }

    /* Bouton fermer flottant */
    .fermer {
      position: absolute;
      left: 50%;
      bottom: var(--space-6);
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: var(--radius-round);
      background: var(--color-surface);
      box-shadow: var(--shadow-raised);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .fermer svg { width: 26px; height: 26px; }
  </style>
</head>
