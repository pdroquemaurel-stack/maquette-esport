<!DOCTYPE html>
<!-- Écran 00c — Univers Gaming « Game corner », reproduit d'après reference/03-gaming.png.
     « Jouer » ouvre Play, la mini app des mini-jeux (p01).
     « E-sport » ouvre la plateforme : 02 au premier accès, sinon 03.
     État de démonstration : compte Max it suspendu → message bloquant (S01-01). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game corner</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Formes anguleuses orange en haut de l'écran */
    .flammes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 240px;
      pointer-events: none;
    }
    .sombre .barre-etat, .sombre .contenu { position: relative; z-index: 1; }

    .entete-gaming {
      display: flex;
      justify-content: space-between;
      padding: var(--space-8) var(--space-2) 0;
    }
    .bouton-verre {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-round);
      background: var(--color-glass-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bouton-verre svg { width: 24px; height: 24px; }

    .titre-gaming {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      padding: var(--space-6) var(--page-gutter) 0;
    }
    .icone-app {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--color-border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icone-app svg { width: 36px; height: 36px; }
    .titre-gaming h1 { font-size: var(--font-size-display); font-weight: var(--font-weight-bold); }

    /* Tuiles Jouer / Boutique / E-sport */
    .tuiles-gaming {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-1);
      padding: var(--space-10) var(--space-3) 0;
    }
    .tuile-gaming {
      height: 118px;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-on-dark);
    }
    .tuile-gaming svg { width: 46px; height: 46px; }
    .tuile-jouer { background: linear-gradient(200deg, var(--color-bg-dark), var(--color-game-blue-bg)); }
    .tuile-boutique { background: linear-gradient(200deg, var(--color-bg-dark), var(--color-game-green-bg)); }
    .tuile-esport { background: linear-gradient(200deg, var(--color-bg-dark), var(--color-game-purple-bg)); }
    .tuile-esport:active { outline: 2px solid var(--color-game-purple); }

    .sombre .titre-section { padding: 0 var(--space-3); margin-top: var(--space-8); color: var(--color-text-on-dark); }

    .visuel {
      display: block;
      margin: 0 var(--space-3);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
    }
    .visuel > svg { width: 100%; height: auto; }
    .visuel .badge { position: absolute; top: var(--space-4); right: var(--space-4); }
    .visuel .accroche {
      position: absolute;
      left: 8%;
      top: 32%;
      font-weight: 900;
      font-size: var(--font-size-lg);
      line-height: 1.1;
      letter-spacing: .02em;
      color: var(--color-text-on-dark);
    }
    .visuel .accroche em { font-style: normal; color: var(--color-warning); display: block; }
    .visuel .accroche small {
      display: block;
      font-size: 8px;
      font-weight: var(--font-weight-regular);
      color: var(--illu-gold-light);
      margin-top: var(--space-1);
    }
    .derniere { margin-bottom: var(--space-8); }
  </style>
</head>
<body data-zone="maxit">
<div class="cadre">
  <div class="telephone sombre">
    <!-- Formes anguleuses du décor -->
    <svg class="flammes" viewBox="0 0 390 240" preserveAspectRatio="none" aria-hidden="true">
      <path class="f-flame-dark" d="M0 0h70L22 110 46 190 0 240z"/>
      <path class="f-primary" d="M0 0h40L8 90 26 160 0 200z" opacity=".85"/>
      <path class="f-flame-dark" d="M390 0h-70l48 110-24 80 46 50z"/>
      <path class="f-primary" d="M390 0h-40l32 90-18 70 26 40z" opacity=".85"/>
    </svg>

    <div class="barre-etat" data-heure="12:49"></div>

    <main class="contenu">
      <div class="entete-gaming">
        <a href="00b-maxit-univers.html" class="bouton-verre" aria-label="Retour aux univers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="f-white" d="M10.6 5.3 12 6.7 7.7 11H20v2H7.7l4.3 4.3-1.4 1.4L3.9 12z"/></svg>
        </a>
        <button class="bouton-verre" data-hors="La recherche" aria-label="Rechercher">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="f-white" d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        </button>
      </div>

      <div class="titre-gaming">
        <span class="icone-app">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <path class="f-primary" d="M10 8h16c5 0 8 4 9 10l1 7c0 5-4 7-7 5l-5-5H12l-5 5c-3 2-7 0-7-5l1-7c1-6 4-10 9-10z"/>
            <path class="f-white" d="M9 14h2v3h3v2h-3v3H9v-3H6v-2h3z"/>
            <circle class="f-white" cx="25" cy="15" r="1.6"/><circle class="f-white" cx="28" cy="18" r="1.6"/>
            <circle class="f-white" cx="22" cy="18" r="1.6"/><circle class="f-white" cx="25" cy="21" r="1.6"/>
          </svg>
        </span>
        <h1>Game corner</h1>
      </div>

      <nav class="tuiles-gaming" aria-label="Espaces gaming">
        <a href="p01-accueil.html" class="tuile-gaming tuile-jouer">
          <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke-width="3.5" stroke-linejoin="round">
            <path class="s-blue" d="M14 12h20c6 0 9 4 10 11l1 9c1 6-5 9-9 5l-5-5H17l-5 5c-4 4-10 1-9-5l1-9c1-7 4-11 10-11z"/>
            <path class="s-blue" d="M15 19v8M11 23h8" stroke-linecap="round"/>
            <circle class="f-blue" cx="32" cy="20" r="2"/><circle class="f-blue" cx="36" cy="24" r="2"/>
            <circle class="f-blue" cx="28" cy="24" r="2"/><circle class="f-blue" cx="32" cy="28" r="2"/>
          </svg>
          Jouer
        </a>
        <a href="#" class="tuile-gaming tuile-boutique" data-hors="La boutique de jeux">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path class="f-white" d="M6 10a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v6a5 5 0 0 1-9 3 5 5 0 0 1-9 0 5 5 0 0 1-9 0 5 5 0 0 1-9-3z"/>
            <path class="f-green" d="M9 22h4v14h22V22h4v18H9z"/>
            <rect class="f-white" x="18" y="29" width="12" height="3" rx="1.5"/>
          </svg>
          Boutique
        </a>
        <a href="#" class="tuile-gaming tuile-esport" data-action="esport">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect class="f-purple" x="4" y="6" width="40" height="28" rx="4"/>
            <rect class="f-purple" x="16" y="38" width="16" height="4" rx="2"/>
            <rect class="f-purple" x="22" y="32" width="4" height="8"/>
            <path class="f-purple-dark" d="M15 12h18c3 0 5 2 5 5v4c0 3-3 4-5 2l-2-2H17l-2 2c-2 2-5 1-5-2v-4c0-3 2-5 5-5z"/>
            <rect class="f-white" x="17" y="27" width="5" height="2" rx="1"/>
            <rect class="f-white" x="26" y="27" width="5" height="2" rx="1"/>
          </svg>
          E-sport
        </a>
      </nav>

      <h2 class="titre-section">Découvrir</h2>
      <a href="#" class="visuel" data-hors="Cette promotion">
        <svg viewBox="0 0 368 206" aria-hidden="true">
          <rect class="f-purple-dark" width="368" height="206"/>
          <rect class="f-purple-deep" x="140" width="228" height="206" opacity=".7"/>
          <g fill="none" stroke-width="2.5" stroke-linejoin="round">
            <path class="s-pink" d="M8 6l30 28-24 4z"/>
            <path class="s-blue" d="M50 8l18 34-26-8z"/>
            <path class="s-blue" d="M10 46l26 14H12z"/>
            <path class="s-yellow" d="M150 12l10 12 4-10 8 16"/>
            <path class="s-yellow" d="M330 22l6 10-6 2 8 12"/>
            <path class="s-yellow" d="M18 168l16-4-8 8 16-2"/>
            <path class="s-pink" d="M180 190l18-22-2 26z"/>
            <path class="s-blue" d="M208 196l8-26 4 26"/>
            <!-- Console stylisée -->
            <rect class="s-blue" x="250" y="56" width="90" height="56" rx="6"/>
            <rect class="s-yellow" x="266" y="44" width="58" height="22" rx="3"/>
            <path class="s-blue" d="M262 112c-14 6-24 22-26 34m94-34c14 6 24 22 26 34"/>
            <rect class="s-yellow" x="244" y="134" width="44" height="26" rx="10" transform="rotate(-10 266 147)"/>
            <rect class="s-yellow" x="302" y="134" width="44" height="26" rx="10" transform="rotate(10 324 147)"/>
            <circle class="s-pink" cx="120" cy="28" r="5"/>
            <circle class="s-pink" cx="248" cy="30" r="4"/>
            <circle class="s-blue" cx="148" cy="184" r="4"/>
            <circle class="s-blue" cx="196" cy="128" r="3"/>
          </g>
        </svg>
        <p class="accroche">LES MEILLEURS JEUX<em>AU MEILLEUR PRIX</em><small>Les meilleurs jeux, à petit prix.</small></p>
      </a>

      <h2 class="titre-section">Continuer à jouer</h2>
      <a href="#" class="visuel derniere" data-hors="Ce jeu">
        <svg viewBox="0 0 368 200" aria-hidden="true">
          <defs>
            <radialGradient id="halo" cx="50%" cy="45%" r="65%">
              <stop offset="0" style="stop-color: var(--illu-gold-light)"/>
              <stop offset=".55" style="stop-color: var(--illu-gold)"/>
              <stop offset="1" style="stop-color: var(--color-gaming-flame-dark)"/>
            </radialGradient>
          </defs>
          <rect width="368" height="200" fill="url(#halo)"/>
          <g class="f-gold-light" opacity=".7">
            <path d="M40 30l40 10-36 6zM300 26l38 4-34 10zM30 150l44-6-40 16zM310 160l40 4-38 8z"/>
          </g>
          <!-- Silhouette de joueur casqué -->
          <path class="f-gray-dark" d="M150 200c0-40 14-70 34-78-14-8-20-22-18-38 2-20 16-32 34-32s32 12 34 32c2 16-4 30-18 38 20 8 34 38 34 78z"/>
          <path class="f-black" d="M168 80c4-18 18-26 32-26s28 8 32 26c-10-4-20-6-32-6s-22 2-32 6z"/>
          <rect class="f-black" x="176" y="84" width="48" height="14" rx="5" opacity=".8"/>
          <rect class="f-black" y="170" width="368" height="30" opacity=".35"/>
        </svg>
        <span class="badge badge-blanc">Abonné</span>
      </a>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
